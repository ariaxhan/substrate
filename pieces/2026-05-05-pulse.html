<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>noon · 2026-05-05</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f4efe6;cursor:crosshair}
#p{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.n{position:absolute;font:normal clamp(88px,16vw,220px)/1 Georgia,serif;letter-spacing:.04em;user-select:none;pointer-events:none;white-space:nowrap}
#na{color:#c8880a}
#nb{color:#2e5c8a}
#hint{
  position:absolute;bottom:13%;left:50%;transform:translateX(-50%);
  font:9px/1 'Courier New',monospace;letter-spacing:.55em;
  color:rgba(80,62,32,.3);opacity:0;transition:opacity .9s;
  white-space:nowrap;pointer-events:none
}
</style>
</head>
<body>
<section data-date='2026-05-05' data-type='pulse'>
<div id="p">
  <span class="n" id="na">noon</span>
  <span class="n" id="nb">noon</span>
  <div id="hint">meridian</div>
</div>
</section>
<script>
const na=document.getElementById('na'),
      nb=document.getElementById('nb'),
      hint=document.getElementById('hint');
let cur=.5,tgt=.5,flip=false,t=0,live=false,idle;

addEventListener('mousemove',e=>{
  tgt=e.clientY/innerHeight;
  live=true;clearTimeout(idle);
  idle=setTimeout(()=>{live=false},1800);
  hint.style.opacity=Math.abs(tgt-.5)<.08&&Math.abs(e.clientX/innerWidth-.5)<.22?'1':'0';
});

addEventListener('click',()=>{flip=!flip});

(function draw(){
  t+=.007;
  if(!live) tgt=.5+Math.sin(t)*.11;
  cur+=(tgt-cur)*.065;
  const sp=(flip?1-cur:cur)*100;
  const p=Math.max(1,Math.min(99,sp));
  na.style.clipPath=`inset(0 0 ${100-p}% 0)`;
  nb.style.clipPath=`inset(${p}% 0 0 0)`;
  requestAnimationFrame(draw);
}());
</script>
</body>
</html>
