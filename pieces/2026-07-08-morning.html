<section data-date='2026-07-08' data-type='morning'>
<style>
.tp-morn{position:relative;width:100%;height:100vh;overflow:hidden;background:#0a0e27;font-family:Georgia,'Times New Roman',serif;cursor:none}
.tp-morn .dawn{position:absolute;inset:0;background:linear-gradient(180deg,#1a1f4d 0%,#5b3a6e 35%,#c9536b 60%,#e8935a 78%,#f6c667 100%)}
.tp-morn .veil{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,42%),transparent 0,transparent 40px,rgba(10,14,39,.985) 260px);transition:background .05s linear}
.tp-morn .sun{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff6d8;box-shadow:0 0 24px 10px rgba(255,230,160,.6);left:var(--mx,50%);top:var(--my,42%);transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
.tp-morn .line{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(255,255,255,.15);pointer-events:none}
.tp-morn .hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-size:12px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;transition:opacity .6s}
.tp-morn .w{position:absolute;color:#ffe9c2;font-size:20px;font-style:italic;letter-spacing:.02em;text-shadow:0 0 10px rgba(255,200,120,.5);pointer-events:none;opacity:0;white-space:nowrap;transform:translate(-50%,-50%)}
.tp-morn .w.go{animation:rise 3.2s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-40%) scale(.94)}12%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1.04)}}
</style>
<div class="tp-morn" id="tpm">
  <div class="dawn"></div>
  <div class="veil"></div>
  <div class="sun"></div>
  <div class="line"></div>
  <div class="hint" id="tpmHint">nothing is written yet &mdash; touch the light</div>
  <div id="tpmWords"></div>
</div>
<script>
(function(){
  var root=document.getElementById('tpm');
  var hint=document.getElementById('tpmHint');
  var layer=document.getElementById('tpmWords');
  var words=["not yet","almost","the air holds still","first breath","unwritten","possible","before the word for it exists","quiet, still deciding","today has no shape yet","begin"];
  var i=0;
  function setPos(x,y){
    var r=root.getBoundingClientRect();
    var px=((x-r.left)/r.width*100).toFixed(2)+'%';
    var py=((y-r.top)/r.height*100).toFixed(2)+'%';
    root.style.setProperty('--mx',px);
    root.style.setProperty('--my',py);
  }
  root.addEventListener('mousemove',function(e){
    setPos(e.clientX,e.clientY);
    if(hint) hint.style.opacity='0';
  });
  root.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    if(t) setPos(t.clientX,t.clientY);
    if(hint) hint.style.opacity='0';
  },{passive:true});
  function drop(x,y){
    var r=root.getBoundingClientRect();
    var el=document.createElement('div');
    el.className='w';
    el.textContent=words[i%words.length];
    i++;
    el.style.left=((x-r.left)/r.width*100)+'%';
    el.style.top=((y-r.top)/r.height*100)+'%';
    layer.appendChild(el);
    requestAnimationFrame(function(){el.classList.add('go')});
    setTimeout(function(){el.remove()},3300);
  }
  root.addEventListener('click',function(e){drop(e.clientX,e.clientY)});
  root.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    if(t) drop(t.clientX,t.clientY);
  },{passive:true});
})();
</script>
</section>
