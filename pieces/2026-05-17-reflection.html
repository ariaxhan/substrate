<section data-date='2026-05-17' data-type='reflection' style="display:block;position:fixed;top:0;left:0;width:100%;height:100%;background:#08060e;overflow:hidden;cursor:crosshair">
<style>
*{margin:0;padding:0}
.p{position:fixed;pointer-events:none;white-space:nowrap;font:300 italic 1em Georgia,serif;
   color:rgba(212,222,255,1);transition:opacity .55s ease;will-change:opacity}
#c{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
#h{position:fixed;bottom:22px;width:100%;text-align:center;font:.6em 'Courier New',mono;
   letter-spacing:.38em;text-transform:uppercase;color:rgba(170,188,235,.2);
   pointer-events:none;transition:opacity 2s}
</style>
<canvas id=c></canvas>
<p id=h>move to find &nbsp;·&nbsp; press to keep</p>
<script>
const sc=document.currentScript.parentElement,
  cv=document.getElementById('c'),
  cx=cv.getContext('2d');

const resize=()=>{cv.width=innerWidth;cv.height=innerHeight};
resize();addEventListener('resize',resize);

const phrases=[
  "the day is complete","you were enough","what held you",
  "let the weight down","it was real","rest now",
  "tomorrow does not exist yet","you were here",
  "the work was enough","stillness is allowed",
  "the last light has gone","you made it through"
];

let mx=innerWidth/2, my=innerHeight/2;
const planted=[], els=[];

phrases.forEach(txt=>{
  const d=document.createElement('div');
  d.className='p';
  d.textContent=txt;
  d.style.left=`${12+Math.random()*76}%`;
  d.style.top=`${8+Math.random()*82}%`;
  d.style.opacity='.04';
  d.style.fontSize=`${.82+Math.random()*.42}em`;
  sc.appendChild(d);
  els.push(d);
});

const sweep=()=>{
  els.forEach(el=>{
    const r=el.getBoundingClientRect(),
      cx2=r.left+r.width/2, cy=r.top+r.height/2,
      d=Math.hypot(cx2-mx, cy-my);
    el.style.opacity=Math.max(.04,Math.min(.84,1-d/155)).toFixed(3);
  });
};

addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;sweep()});

addEventListener('click',e=>{
  planted.push({x:e.clientX,y:e.clientY,r:0,max:.55+Math.random()*.9,born:performance.now()});
  document.getElementById('h').style.opacity='0';
});

const ambient=Array.from({length:95},()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight*.88,
  r:.12+Math.random()*.85,
  o:0,
  pk:.1+Math.random()*.32,
  delay:Math.random()*38000,
  ph:Math.random()*6.28
}));

!function loop(now){
  cx.clearRect(0,0,innerWidth,innerHeight);

  ambient.forEach(s=>{
    const age=now-s.delay;
    if(age<0)return;
    const fade=Math.min(1,age/3000);
    const twink=.82+.18*Math.sin(now*.0009+s.ph);
    cx.beginPath();
    cx.arc(s.x,s.y,s.r,0,6.28);
    cx.fillStyle=`rgba(205,215,255,${(s.pk*fade*twink).toFixed(3)})`;
    cx.fill();
  });

  planted.forEach(s=>{
    const age=(now-s.born)/350;
    if(s.r<s.max)s.r=Math.min(s.max,age*s.max);
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);
    cx.fillStyle='rgba(228,234,255,.92)';cx.fill();
    cx.beginPath();cx.arc(s.x,s.y,s.r*3.2,0,6.28);
    cx.fillStyle='rgba(200,215,255,.055)';cx.fill();
  });

  requestAnimationFrame(loop);
}(performance.now());
</script>
</section>
