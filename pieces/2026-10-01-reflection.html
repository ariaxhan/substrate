<script>
(()=>{const w=document.currentScript.previousElementSibling,c=w.firstChild,x=c.getContext('2d'),W=['rest','enough','held','soon','done','breathe','still'];
let S=[],T=[],m=null,t=0;
const R=()=>{c.width=w.clientWidth;c.height=w.clientHeight};R();addEventListener('resize',R);

w.onclick=e=>{const r=c.getBoundingClientRect(),a=e.clientX-r.left,b=e.clientY-r.top;add(a,b,1);T.push({x:a,y:b-14,s:W[S.length%W.length],l:1})};
w.onmousemove=e=>{const r=c.getBoundingClientRect();m={x:e.clientX-r.left,y:e.clientY-r.top}};

(function f(){t+=.02;x.clearRect(0,0,c.width,c.height);
S.forEach(s=>{const d=m?Math.hypot(s.x-m.x,s.y-m.y):999,g=d<110?1-d/110:0,o=s.a*(.55+.35*Math.sin(t+s.p))+g;

for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){const a=S[i],b=S[j],k=Math.min(a.g,b.g);
if(k>0&&Math.hypot(a.x-b.x,a.y-b.y)<220){x.strokeStyle=`rgba(255,233,176,${k*.5})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
x.font='italic 18px Georgia';x.textAlign='center';
T=T.filter(q=>{q.l-=.004;q.y-=.05;x.fillStyle=`rgba(232,224,255,${q.l})`;x.fillText(q.s,q.x,q.y);return q.l>0});
