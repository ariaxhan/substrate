<!doctype html><html><head><meta charset=utf-8><title>Conjunction — 2026-04-18</title>
<style>*{margin:0}body{background:#050508;overflow:hidden;width:100vw;height:100vh}</style>
</head><body>
<section data-date='2026-04-18' data-type='spark'>
<canvas id=c></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;

const P=[
  ['I','you','we'],
  ['silence','echo','resonance'],
  ['salt','wound','scar'],
  ['before','after','now'],
  ['signal','noise','music']
];

let n=0,t=0,mx=.5,lastN=0;

onmousemove=e=>mx=e.clientX/innerWidth;
onresize=()=>{cv.width=innerWidth;cv.height=innerHeight};

function frame(){
  t+=.004+mx*.014;

  const W=cv.width,H=cv.height,cx=W/2,cy=H/2;
  const unit=Math.min(W,H);
  const ra=unit*.27,rb=unit*.16;

  // A: outer ellipse, slower. B: inner, golden ratio angular speed
  const ax=cx+ra*Math.cos(t),        ay=cy+ra*.6*Math.sin(t*.8);
  const bx=cx+rb*Math.cos(-t*1.618), by=cy+rb*.6*Math.sin(-t*1.618*.8);

  const dist=Math.hypot(ax-bx,ay-by);
  const thr=unit*.21;
  const prox=Math.max(0,1-dist/thr); // 0 = far, 1 = closest
  const fsz=~~(unit*.046);

  // advance pair after dwelling at full conjunction
  if(prox>.92&&t-lastN>12){lastN=t;setTimeout(()=>n=(n+1)%P.length,1200)}

  // faint persistence
  g.fillStyle='rgba(5,5,8,.11)';
  g.fillRect(0,0,W,H);

  // orbit ghost rings
  g.strokeStyle='rgba(255,255,255,.025)';
  g.lineWidth=.8;
  g.beginPath();g.ellipse(cx,cy,ra,ra*.6,0,0,6.28);g.stroke();
  g.beginPath();g.ellipse(cx,cy,rb,rb*.6,0,0,6.28);g.stroke();

  if(prox>0){
    // thread
    g.save();
    g.strokeStyle=`rgba(255,235,160,${prox*.35})`;
    g.lineWidth=1+prox*1.5;
    g.setLineDash([2,5]);
    g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke();
    g.restore();

    // synthesis word assembles letter-by-letter at midpoint
    const syn=P[n][2];
    const nch=Math.max(1,Math.ceil(prox*syn.length));
    const partial=syn.slice(0,nch);
    const midx=(ax+bx)/2,midy=(ay+by)/2;

    g.font=~~(fsz*.88)+'px monospace';
    g.textAlign='center';g.textBaseline='middle';
    // subtle glow
    g.shadowColor='rgba(255,240,180,.6)';
    g.shadowBlur=prox*18;
    g.fillStyle=`rgba(255,250,210,${.5+prox*.5})`;
    g.fillText(partial,midx,midy);
    g.shadowBlur=0;
  }

  // word A — amber
  g.font=fsz+'px monospace';
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=`rgba(230,175,80,${.55+prox*.45})`;
  g.fillText(P[n][0],ax,ay);

  // word B — cyan
  g.fillStyle=`rgba(80,175,230,${.55+prox*.45})`;
  g.fillText(P[n][1],bx,by);

  // hint
  g.font='10px monospace';
  g.fillStyle='rgba(255,255,255,.1)';
  g.textAlign='left';
  g.fillText('move right to quicken time',12,H-13);

  requestAnimationFrame(frame);
}
frame();
</script>
</section>
</body></html>
