<section data-date='2026-10-29' data-type='digest'>
<style>
#k{position:relative;width:100%;height:100vh;background:#f1ebdd;overflow:hidden;cursor:crosshair;font:italic 15px Georgia,serif;color:#2b2a26}
#k canvas{position:absolute;inset:0}
#k p{position:absolute;left:24px;bottom:20px;margin:0;letter-spacing:.04em;pointer-events:none;transition:opacity 2s}
</style>
<div id=k><canvas></canvas><p id=t>a few loose facts. touch the paper.</p></div>
<script>
(function(){
var k=document.getElementById('k'),c=k.firstChild,x=c.getContext('2d'),t=document.getElementById('t'),
W,H,P=[],m={x:-9,y:-9},R=120,words=['signal','pattern','edge','habit','memory','lattice','proof','grain'];
function rs(){W=c.width=k.clientWidth;H=c.height=k.clientHeight}
rs();onresize=rs;
function add(a,b){P.push({x:a,y:b,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,w:words[P.length%8],a:0})}
for(var i=0;i<14;i++)add(Math.random()*W,Math.random()*H);
k.onclick=function(e){var r=k.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top);t.textContent=P.length+' points. '+(P.length>30?'it holds itself up now.':'closer.')};
k.onmousemove=function(e){var r=k.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top};
function f(){
x.clearRect(0,0,W,H);
var n=P.length,i,j,l,d,p,q,s,L=[];
for(i=0;i<n;i++){p=P[i];p.x+=p.vx;p.y+=p.vy;
if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
L[i]=[];}
for(i=0;i<n;i++)for(j=i+1;j<n;j++){p=P[i];q=P[j];d=Math.hypot(p.x-q.x,p.y-q.y);
if(d<R){L[i].push(j);L[j].push(i);
x.strokeStyle='rgba(43,42,38,'+(1-d/R)*.6+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();
var s2=.5*(1-d/R);p.vx-=(p.x-q.x)*.00002*(d-R*.6);p.vy-=(p.y-q.y)*.00002*(d-R*.6);q.vx+=(p.x-q.x)*.00002*(d-R*.6);q.vy+=(p.y-q.y)*.00002*(d-R*.6)}}
for(i=0;i<n;i++)for(l=0;l<L[i].length;l++){j=L[i][l];if(j<=i)continue;
for(s=0;s<L[j].length;s++){var h=L[j][s];if(h<=j||L[i].indexOf(h)<0)continue;
x.fillStyle='hsla('+(20+(i*j*h)%40)+',60%,45%,.12)';x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.lineTo(P[h].x,P[h].y);x.fill()}}
for(i=0;i<n;i++){p=P[i];p.vx*=.999;p.vy*=.999;
d=Math.hypot(p.x-m.x,p.y-m.y);
x.fillStyle='#2b2a26';x.beginPath();x.arc(p.x,p.y,1.5+L[i].length*.7,0,7);x.fill();
if(d<70){p.a=Math.min(1,p.a+.08)}else p.a=Math.max(0,p.a-.03);
if(p.a>0){x.fillStyle='rgba(120,40,20,'+p.a+')';x.fillText(p.w+' '+L[i].length,p.x+10,p.y-8)}}
requestAnimationFrame(f)}
x.font='italic 13px Georgia';
f();
})();
</script>
</section>
