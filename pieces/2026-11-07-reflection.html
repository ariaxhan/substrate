<section data-date='2026-11-07' data-type='reflection'>
<style>
.n{position:relative;height:100vh;background:linear-gradient(#05060f,#0d1230 70%,#2a1b3d);overflow:hidden;cursor:crosshair;font:italic 300 1.1rem Georgia,serif;color:#cfd6ff}
.n b{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px #9fb4ff;transform:translate(-50%,-50%);animation:t 4s infinite alternate}
.n i{position:absolute;transform:translate(-50%,-150%);opacity:0;font-style:normal;letter-spacing:.2em;font-size:.8rem;animation:w 5s forwards;pointer-events:none}
.n p{position:absolute;bottom:6%;width:100%;text-align:center;opacity:.5;margin:0}
@keyframes t{to{opacity:.3}}@keyframes w{20%{opacity:1}to{opacity:0}}
</style>
<div class=n id=n><p>the day is finished. touch the dark.</p></div>
<script>
const n=document.getElementById('n'),W='rest,soft,enough,still,breathe,kept,home,hush,slow,held,begin again'.split(','),P=[];let k=0;
function s(x,y,w){const b=document.createElement('b');b.style.left=x+'px';b.style.top=y+'px';b.style.animationDelay=-Math.random()*4+'s';n.appendChild(b);P.push([x,y]);
if(w){const i=document.createElement('i');i.textContent=W[k++%W.length];i.style.left=x+'px';i.style.top=y+'px';n.appendChild(i)}}
for(let j=0;j<40;j++)s(Math.random()*innerWidth,Math.random()*innerHeight*.8);
n.onclick=e=>{const r=n.getBoundingClientRect();s(e.clientX-r.left,e.clientY-r.top,1)};
n.onmousemove=e=>{if(Math.random()<.08){const r=n.getBoundingClientRect();s(e.clientX-r.left+Math.random()*30,e.clientY-r.top+Math.random()*30)}};
</script>
</section>
