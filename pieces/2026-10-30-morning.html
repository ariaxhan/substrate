<section data-date='2026-10-30' data-type='morning'>
<style>
#d{position:relative;height:100vh;overflow:hidden;background:#05060d;font:italic 300 clamp(18px,3vw,30px)/1.6 Georgia,serif;color:#fff;cursor:crosshair}
#d canvas{position:absolute;inset:0;width:100%;height:100%}
#t{position:absolute;left:0;right:0;bottom:12%;text-align:center;pointer-events:none;mix-blend-mode:difference}
#t span{display:block;opacity:0;transform:translateY(12px);transition:opacity 2.5s,transform 2.5s}
#t span.on{opacity:.9;transform:none}
#h{position:absolute;top:6%;width:100%;text-align:center;font:10px monospace;letter-spacing:.4em;opacity:.35;transition:opacity 1s}
#d:hover #h{opacity:0}
</style>
<div id=d><canvas id=c></canvas><div id=h>THE PAGE IS BLANK. TOUCH IT.</div><div id=t></div></div>
<script>
(function(){
var d=document.getElementById('d'),c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t'),
W,H,my=1,ty=1,mx=.5,n=0,s=[],
L=['nothing is written yet','a single line of light','the day has not decided','you are the first word','begin'];
function R(){W=c.width=d.clientWidth;H=c.height=d.clientHeight;s=[];for(var i=0;i<120;i++)s.push([Math.random()*W,Math.random()*H*.7,Math.random()*1.4])}
R();addEventListener('resize',R);
d.onmousemove=function(e){var r=d.getBoundingClientRect();mx=(e.clientX-r.left)/W;ty=Math.max(0,Math.min(1,(e.clientY-r.top)/H))};
d.onclick=function(){if(n<L.length){var p=document.createElement('span');p.textContent=L[n++];t.appendChild(p);setTimeout(function(){p.className='on'},30)}else{t.innerHTML='';n=0;ty=1}ty=Math.max(0,ty-.18)};
function f(k){
my+=(ty-my)*.03;
var u=1-my,hz=H*.72,g=x.createLinearGradient(0,0,0,hz);
g.addColorStop(0,'rgb('+(5+u*30|0)+','+(6+u*40|0)+','+(13+u*90|0)+')');
g.addColorStop(.6,'rgb('+(20+u*200|0)+','+(15+u*90|0)+','+(40+u*70|0)+')');
g.addColorStop(1,'rgb('+(40+u*215|0)+','+(25+u*170|0)+','+(40+u*60|0)+')');
x.fillStyle=g;x.fillRect(0,0,W,hz);
x.fillStyle='#fff';
for(var i=0;i<s.length;i++){x.globalAlpha=Math.max(0,(my-.3))*s[i][2]*(.6+.4*Math.sin(k/700+i));x.fillRect(s[i][0],s[i][1],1.3,1.3)}
x.globalAlpha=1;
var sx=W*(.3+.4*mx),sy=hz+H*.05-u*H*.42,rg=x.createRadialGradient(sx,sy,0,sx,sy,H*.5);
rg.addColorStop(0,'rgba(255,240,200,'+(.9*u)+')');rg.addColorStop(.15,'rgba(255,170,90,'+(.5*u)+')');rg.addColorStop(1,'rgba(255,120,60,0)');
x.fillStyle=rg;x.fillRect(0,0,W,hz);
x.save();x.beginPath();x.rect(0,0,W,hz);x.clip();
x.fillStyle='rgba(255,246,220,'+Math.min(1,u*2)+')';x.beginPath();x.arc(sx,sy,H*.045,0,7);x.fill();x.restore();
x.fillStyle='#05060d';x.fillRect(0,hz,W,H-hz);
for(var j=0;j<40;j++){var yy=hz+2+j*j*.28;if(yy>H)break;
x.fillStyle='rgba(255,'+(170+j)+',110,'+(.5*u/(1+j*.25))+')';
var w=H*.05+j*9+Math.sin(k/500+j)*6*j/10;x.fillRect(sx-w/2+Math.sin(k/900+j*2)*j,yy,w,1.5)}
requestAnimationFrame(f)}
requestAnimationFrame(f)
})()
</script>
</section>
