<section data-date='2026-06-06' data-type='digest'>
<style>
*{margin:0;padding:0}
body{background:#05050f;overflow:hidden;cursor:crosshair}
#lat-h{position:fixed;bottom:1.1rem;right:1.4rem;font:9px/1 Georgia,serif;
  color:rgba(160,140,80,.18);pointer-events:none;letter-spacing:.22em;text-transform:uppercase}
</style>
<canvas id="lat-c"></canvas>
<div id="lat-h">hover · click</div>
<script>
(function(){
const cv=document.getElementById('lat-c'),cx=cv.getContext('2d');
let sw,sh,N=[],mx=-999,my=-999;
const P=['noise','noise','noise','noise','noise','noise','noise','noise','noise','noise','noise','noise',
  'becomes','becomes','signal','signal','signal','pattern','pattern','pattern',
  'crystallizes','crystallizes','into','knowing','knowing',
  'the','the','space','space','between','between','was','always','there','there'];
const G='·∘◦∙○◌⊙∗⋅∴∵'.split('');

function resize(){
  sw=cv.width=innerWidth;sh=cv.height=innerHeight;build();
}
function build(){
  N=[];
  let ws=[...P].sort(()=>Math.random()-.5);
  let n=ws.length,cols=Math.round(Math.sqrt(n*sw/sh))+1;
  let cw=sw/cols,rh=sh/Math.ceil(n/cols);
  for(let i=0;i<n;i++){
    let r=i/cols|0,c=i%cols;
    N.push({x:(c+.2+Math.random()*.6)*cw,y:(r+.2+Math.random()*.6)*rh,
      w:ws[i],g:G[Math.random()*G.length|0],k:0,lk:false});
  }
}
addEventListener('resize',resize);
addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY});
addEventListener('click',function(e){
  N.forEach(function(n){
    if(Math.hypot(n.x-e.clientX,n.y-e.clientY)<160)
      n.k=Math.min(1,n.k+.7);
  });
});

function frame(){
  cx.fillStyle='rgba(5,5,15,.14)';
  cx.fillRect(0,0,sw,sh);

  N.forEach(function(n){
    if(!n.lk){
      n.k=Math.min(1,n.k+.00007);
      var d=Math.hypot(n.x-mx,n.y-my);
      n.k=d<110?Math.min(1,n.k+.015*(1-d/110)):Math.max(0,n.k-.0006);
    }
    if(n.k>.52) n.lk=true;
  });

  var md=sw*.21;
  for(var i=0;i<N.length-1;i++){
    if(N[i].k<.32) continue;
    for(var j=i+1;j<N.length;j++){
      if(N[j].k<.32) continue;
      var d=Math.hypot(N[i].x-N[j].x,N[i].y-N[j].y);
      if(d<md){
        cx.beginPath();
        cx.strokeStyle='rgba(182,152,82,'+Math.min(N[i].k,N[j].k)*(1-d/md)*.28+')';
        cx.lineWidth=.4;
        cx.moveTo(N[i].x,N[i].y);cx.lineTo(N[j].x,N[j].y);cx.stroke();
      }
    }
  }

  N.forEach(function(n){
    var k=n.k,show=k>.58&&(k>.91||Math.random()>.33);
    cx.textAlign='center';cx.textBaseline='middle';
    cx.shadowBlur=0;
    if(k>.86){
      if(k>.95){cx.shadowBlur=7;cx.shadowColor='rgba(215,185,95,.35)';}
      cx.font='bold 13px Georgia,serif';
      cx.fillStyle='rgba(236,210,124,'+(.78+k*.22)+')';
    } else if(k>.32){
      var t=(k-.32)/.54;
      cx.font='11px monospace';
      cx.fillStyle='rgba('+(82+t*108|0)+',190,'+(148-t*40|0)+','+(.18+k*.72)+')';
    } else {
      cx.font='8px monospace';
      cx.fillStyle='rgba(44,84,106,'+(.05+k*.22)+')';
      show=false;
    }
    cx.fillText(show?n.w:n.g,n.x,n.y);
  });
  cx.shadowBlur=0;
  requestAnimationFrame(frame);
}
resize();frame();
})();
</script>
</section>
