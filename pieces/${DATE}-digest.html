<section data-date='2026-11-13' data-type='digest'>
<style>
#k{background:#f2ede1;margin:0;height:100vh;overflow:hidden;position:relative;font:italic 15px Georgia,serif;color:#2a2a28;cursor:crosshair}
#k canvas{position:absolute;inset:0;width:100%;height:100%}
#k p{position:absolute;left:5vw;bottom:4vh;margin:0;letter-spacing:.08em;transition:opacity 2s}
</style>
<div id=k><canvas id=c></canvas><p id=t>scattered, until touched</p></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,P=[],E=[],L=['a fact','then two','a pattern','a lattice','a mind'],n=0;
function R(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
R();onresize=R;
for(var i=0;i<70;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,s:0});
function add(a,b){P.push({x:a,y:b,vx:0,vy:0,s:1});
for(var i=0;i<P.length;i++){var p=P[i];if(p.s&&Math.hypot(p.x-a,p.y-b)<200&&p.x!=a)E.push([p,P[P.length-1]])}
n++;t.textContent=L[Math.min(n>>2,4)]+' · '+P.filter(function(p){return p.s}).length;}
c.onclick=function(e){add(e.offsetX,e.offsetY)};
c.onmousemove=function(e){P.forEach(function(p){var d=Math.hypot(p.x-e.offsetX,p.y-e.offsetY);if(d<90&&!p.s&&Math.random()<.05){p.s=1;E.push([p,P[(Math.random()*P.length)|0]])}})};
function f(){x.fillStyle='rgba(242,237,225,.25)';x.fillRect(0,0,W,H);
E.forEach(function(e){var a=e[0],b=e[1];x.strokeStyle='rgba(30,60,90,.35)';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,g=(d-60)*.0008;a.vx+=dx/d*g;a.vy+=dy/d*g;b.vx-=dx/d*g;b.vy-=dy/d*g});
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;x.fillStyle=p.s?'#b3411f':'#9a9488';x.beginPath();x.arc(p.x,p.y,p.s?3.5:1.5,0,7);x.fill()});
requestAnimationFrame(f)}
f();
})();
</script>
</section>
