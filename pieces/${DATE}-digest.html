<section data-date='2026-10-31' data-type='digest'>
<style>
.s{position:relative;background:#f1ebdd;height:100vh;overflow:hidden;cursor:crosshair;font:italic 15px Georgia,serif;color:#2a2622}
.s canvas{position:absolute;inset:0;width:100%;height:100%}

</style>
<div class="s"><canvas></canvas><p>move: notice. click: remember.</p></div>
<script>
(()=>{const s=document.currentScript.previousElementSibling,c=s.querySelector('canvas'),t=s.querySelector('p'),x=c.getContext('2d'),G=34;let W,H,P=[],f=0,m=0;
const R=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight};R();addEventListener('resize',R);
const add=(a,b,k)=>P.push({x:a,y:b,a:0,k,g:[Math.round(a/G),Math.round(b/G)]});
s.onmousemove=e=>{const r=c.getBoundingClientRect();if(++m%4==0)add(e.clientX-r.left+Math.random()*30-15,e.clientY-r.top+Math.random()*30-15,0);if(P.length>420)P.shift()};
s.onclick=e=>{const r=c.getBoundingClientRect(),a=e.clientX-r.left,b=e.clientY-r.top;t.style.opacity=0;
P.forEach(p=>{if(Math.hypot(p.x-a,p.y-b)<220){p.k=1;p.g=[Math.round(p.x/G),Math.round(p.y/G)]}});add(a,b,2)};
(function L(){f++;x.fillStyle='rgba(241,235,221,.35)';x.fillRect(0,0,W,H);
P.forEach(p=>{const q=p.k?.06:.004;p.a=Math.min(1,p.a+.004);
if(p.k){p.x+=(p.g[0]*G-p.x)*q;p.y+=(p.g[1]*G-p.y)*q}else{p.x+=Math.sin(f/50+p.y)*.3;p.y+=Math.cos(f/60+p.x)*.3}});
for(let i=0;i<P.length;i++){const p=P[i];for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);
if(d<G*1.5&&(p.k||q.k)){x.strokeStyle=`rgba(120,40,30,${(1-d/G/1.5)*.7})`;x.lineWidth=p.k&&q.k?1.2:.4;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();
if(p.k&&q.k&&d<G*1.1&&(i+j)%5==0){const r=P[(i*7+j)%P.length];if(r.k&&Math.hypot(r.x-p.x,r.y-p.y)<G*1.1){x.fillStyle='rgba(120,40,30,.05)';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.lineTo(r.x,r.y);x.fill()}}}}
x.fillStyle=p.k?'#78281e':'rgba(42,38,34,'+p.a*.6+')';x.beginPath();x.arc(p.x,p.y,p.k==2?4:p.k?2.4:1.4,0,7);x.fill()}
requestAnimationFrame(L)})()})()
</script>
