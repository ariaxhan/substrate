<section data-date='2026-10-01' data-type='digest'>
<style>
.cx{position:relative;background:#f1ebdd;height:100vh;overflow:hidden;cursor:crosshair;font:italic 15px Georgia,serif;color:#2b2a33}
.cx canvas{display:block;width:100%;height:100%}
.cx p{position:absolute;left:24px;bottom:18px;margin:0;letter-spacing:.04em}
</style>
<div class="cx"><canvas></canvas><p>drift. touch. <b id="n">0</b> known.</p></div>
<script>
(()=>{
const w=document.currentScript.previousElementSibling,c=w.querySelector('canvas'),x=c.getContext('2d'),
N=w.querySelector('#n'),G=56,R=Math.random;
let W,H,P=[],K={};
function fit(){W=c.width=w.clientWidth;H=c.height=w.clientHeight}
fit();addEventListener('resize',fit);
for(let i=0;i<160;i++)P.push({x:R()*W,y:R()*H,vx:R()-.5,vy:R()-.5,s:0});
function snap(p){
 let r=Math.round(p.y/G),q=Math.round((p.x-(r%2)*G/2)/G);
 p.k=q+','+r;p.tx=q*G+(r%2)*G/2;p.ty=r*G;
 if(K[p.k]&&K[p.k]!==p)return 0;K[p.k]=p;p.s=1;return 1}
function poke(mx,my,rad){
 P.forEach(p=>{if(!p.s&&Math.hypot(p.x-mx,p.y-my)<rad)snap(p)})}
w.onmousemove=e=>{let b=c.getBoundingClientRect();poke(e.clientX-b.left,e.clientY-b.top,60)};
w.onclick=e=>{let b=c.getBoundingClientRect();
 P.push({x:e.clientX-b.left,y:e.clientY-b.top,vx:0,vy:0,s:0});snap(P[P.length-1])};
(function f(){
 x.fillStyle='rgba(241,235,221,.35)';x.fillRect(0,0,W,H);
 let n=0;
 P.forEach(p=>{
  if(p.s){p.x+=(p.tx-p.x)*.08;p.y+=(p.ty-p.y)*.08;n++}
  else{p.x+=p.vx;p.y+=p.vy;p.vx+=(R()-.5)*.2;p.vy+=(R()-.5)*.2;
   if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
 });
 x.lineWidth=1;
 P.forEach(p=>{if(!p.s)return;
  P.forEach(q=>{if(q.s&&q!==p){let d=Math.hypot(p.x-q.x,p.y-q.y);
   if(d<G*1.05){x.strokeStyle='rgba(168,60,40,'+(1-d/G/1.2)+')';
    x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}})});
 P.forEach(p=>{x.fillStyle=p.s?'#a83c28':'#2b2a33';
  x.beginPath();x.arc(p.x,p.y,p.s?4:1.6,0,7);x.fill()});
 N.textContent=n;
 requestAnimationFrame(f)})();
})();
</script>
</section>
