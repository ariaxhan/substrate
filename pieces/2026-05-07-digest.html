<section data-date='2026-05-07' data-type='digest'>
<style>
*{margin:0;padding:0}
body{background:#f8f5ef;overflow:hidden}
#lc{position:fixed;top:0;left:0;pointer-events:none;z-index:0}
.nd{position:fixed;font:10px/1 'Courier New',monospace;transform:translate(-50%,-50%);pointer-events:none;z-index:1;white-space:nowrap;will-change:color}
#hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font:9px/1 'Courier New',monospace;color:#c0b4a4;letter-spacing:.18em;transition:opacity 1.4s}
</style>
<canvas id=lc></canvas>
<div id=hint>move to read</div>
<script>(()=>{
const cv=document.getElementById('lc'),X=cv.getContext('2d'),hint=document.getElementById('hint');
let W,H;
function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight}
sz();window.addEventListener('resize',sz);

const WW=['signal','pattern','threshold','cluster','layer','fold','edge','node','lattice','encode','emerge','resolve','attractor','frequency','memory','resonance','structure','void','echo','index','trace','root','branch','depth','mass','weight','charge','flux','field','phase','order','noise','grain','drift','link','map'];
const R=88;
let mx=W/2,my=H/2,hintUp=true;

const nodes=[];
for(let i=0;i<40;i++){
  const el=document.createElement('span');
  el.className='nd';
  const x=R*.8+Math.random()*(W-R*1.6),y=R*.8+Math.random()*(H-R*1.6);
  el.style.left=x+'px';el.style.top=y+'px';
  el.textContent=WW[i%WW.length];
  document.body.appendChild(el);
  nodes.push({x,y,el,o:0,cry:false});
}

function frame(){
  requestAnimationFrame(frame);
  X.clearRect(0,0,W,H);

  nodes.forEach(n=>{
    const d=Math.hypot(n.x-mx,n.y-my);
    if(d<R) n.o=Math.min(1,n.o+(1-d/R)*.026);
    if(!n.cry&&n.o>.68){
      n.cry=true;
      n.el.style.fontSize='11px';
      if(hintUp){hintUp=false;hint.style.opacity='0';}
    }
    if(n.cry){
      n.el.style.color=`rgba(88,52,18,${Math.min(1,n.o*1.3)})`;
      n.el.style.fontWeight='bold';
    } else {
      n.el.style.color=`rgba(80,68,56,${n.o*.38+.04})`;
    }
  });

  const cry=nodes.filter(n=>n.cry);
  for(let i=0;i<cry.length;i++){
    for(let j=i+1;j<cry.length;j++){
      const d=Math.hypot(cry[i].x-cry[j].x,cry[i].y-cry[j].y);
      if(d<R*1.4){
        X.strokeStyle=`rgba(160,96,36,${.22*(1-d/(R*1.4))})`;
        X.lineWidth=.55;
        X.beginPath();X.moveTo(cry[i].x,cry[i].y);
        X.lineTo(cry[j].x,cry[j].y);X.stroke();
      }
    }
  }
}

window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
window.addEventListener('click',e=>{
  const el=document.createElement('span');
  el.className='nd';
  el.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;font-size:11px;font-weight:bold;color:rgba(88,52,18,.9)`;
  el.textContent=WW[nodes.length%WW.length];
  document.body.appendChild(el);
  nodes.push({x:e.clientX,y:e.clientY,el,o:1,cry:true});
  if(hintUp){hintUp=false;hint.style.opacity='0';}
});

frame();
})();
</script>
</section>
