<section data-date='2026-07-01' data-type='reflection'>
<style>
*{box-sizing:border-box}
#w{position:relative;width:100%;height:100vh;background:radial-gradient(ellipse at 50% 20%,#0e0f1c 0%,#07070d 60%,#030304 100%);overflow:hidden;font-family:'Courier New',Courier,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4rem}
#g{display:grid;grid-template-columns:repeat(6,1fr);gap:2.6vmin;width:min(72vmin,560px)}
.c{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.72rem;letter-spacing:.05em;color:rgba(255,255,255,.16);cursor:pointer;user-select:none;transition:color .5s,text-shadow .5s}
.c:hover{color:rgba(255,205,130,.85);text-shadow:0 0 10px rgba(255,190,110,.55)}
.c.on{color:transparent;cursor:default}
.c.on::after{content:'';position:absolute;width:.34em;height:.34em;border-radius:50%;background:#fff2d8;box-shadow:0 0 6px 1px rgba(255,236,190,.8);animation:tw 3.4s ease-in-out infinite}
.c.on:nth-child(3n)::after{animation-delay:-1.1s}
.c.on:nth-child(4n)::after{animation-delay:-2.2s}
@keyframes tw{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
#s{font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.28);transition:opacity 1s}
#m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;background:rgba(3,3,5,.82);opacity:0;pointer-events:none;transition:opacity 2.4s}
#m b{font-size:clamp(1.1rem,3vw,1.7rem);letter-spacing:.38em;color:#fff2d8;font-weight:400}
#m i{font-style:normal;font-size:.72rem;letter-spacing:.14em;color:rgba(255,242,216,.55);text-transform:lowercase}
</style>
<div id="w">
<div id="g"></div>
<div id="s">0 / 24 hours closed</div>
<div id="m"><b>DAY COMPLETE</b><i>rest now, the next one is already on its way</i></div>
</div>
<script>
(function(){
var g=document.getElementById('g'),s=document.getElementById('s'),m=document.getElementById('m'),n=0;
for(var h=0;h<24;h++){
  var c=document.createElement('div');
  c.className='c';
  c.textContent=(h<10?'0':'')+h;
  c.addEventListener('click',function(){
    if(this.classList.contains('on'))return;
    this.classList.add('on');
    n++;
    s.textContent=n+' / 24 hours closed';
    if(n===24){
      s.style.opacity=0;
      setTimeout(function(){m.style.opacity=1},600);
    }
  });
  g.appendChild(c);
}
})();
</script>
</section>
