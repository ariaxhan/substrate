<section data-date='2026-08-18' data-type='reflection'>
<style>
.taper-0818{margin:0;overflow:hidden;background:#05070f;height:100vh;position:relative;cursor:crosshair;font-family:Georgia,'Times New Roman',serif}
.taper-0818 .sky{position:absolute;inset:0}
.taper-0818 .horizon{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(to top,#0a0e1a,transparent)}
.taper-0818 .word{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);color:#3a4460;letter-spacing:.5em;font-size:11px;text-transform:uppercase;opacity:.6;transition:opacity 2s}
.taper-0818 .star{position:absolute;border-radius:50%;background:#fff;pointer-events:none;animation:tp-in .9s ease-out forwards, tp-tw 4s ease-in-out .9s infinite}
.taper-0818 .hint{position:absolute;top:14px;left:18px;color:#5a6690;font-size:11px;letter-spacing:.15em;opacity:.5;font-family:sans-serif}
@keyframes tp-in{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes tp-tw{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<div class="taper-0818">
  <div class="hint">the day is complete &mdash; touch the dark</div>
  <div class="sky" id="tp-sky"></div>
  <div class="horizon"></div>
  <div class="word" id="tp-word">still</div>
</div>
<script>
(function(){
  var root=document.currentScript.previousElementSibling;
  var sky=root.querySelector('#tp-sky');
  var word=root.querySelector('#tp-word');
  var words=['still','rest','hush','after','enough','dark','soft','done','quiet','held'];
  var n=0;
  function place(x,y){
    var s=document.createElement('div');
    var size=(Math.random()*2.2+1).toFixed(2);
    s.className='star';
    s.style.width=size+'px';
    s.style.height=size+'px';
    s.style.left=x+'px';
    s.style.top=y+'px';
    s.style.boxShadow='0 0 '+(size*2)+'px rgba(255,255,255,.8)';
    sky.appendChild(s);
    n++;
    word.textContent=words[n%words.length];
    word.style.opacity=.85;
    setTimeout(function(){word.style.opacity=.35},1600);
    if(n>240){sky.removeChild(sky.firstChild)}
  }
  root.addEventListener('click',function(e){
    var r=root.getBoundingClientRect();
    place(e.clientX-r.left,e.clientY-r.top);
  });
  root.addEventListener('touchstart',function(e){
    var r=root.getBoundingClientRect();
    var t=e.touches[0];
    place(t.clientX-r.left,t.clientY-r.top);
  },{passive:true});
  var w=root.clientWidth,h=root.clientHeight;
  for(var i=0;i<9;i++){
    setTimeout((function(){place(Math.random()*w,Math.random()*h*.7)}),i*260);
  }
})();
</script>
</section>
