<section data-date='2026-07-19' data-type='morning'>
<style>
#pg0719{position:absolute;inset:0;overflow:hidden;background:#f7f1e6;cursor:crosshair;font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif}
#pg0719 .d{position:absolute;transform:translate(-50%,-50%);font-size:13px;color:rgba(120,102,74,.28);transition:opacity .25s ease,color .25s ease,transform .25s ease;white-space:nowrap;pointer-events:none}
#pg0719 .d.lit{font-style:italic;font-size:15px;letter-spacing:.02em;color:rgba(58,42,26,.88)}
#pg0719 .cap{position:absolute;left:0;right:0;bottom:5%;text-align:center;font:11px/1.6 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(90,72,50,.5)}
</style>
<div id="pg0719">
<div class="cap" id="pgc">move for morning light &middot; click to write a word</div>
</div>
<script>
(function(){
var root=document.getElementById('pg0719'),cap=document.getElementById('pgc'),
cols=16,rows=9,dots=[],
W=['unwritten','still','possible','first','open','becoming','quiet','before','everything','dawn','hush','threshold','not yet','beginning'],
wi=0,count=0,total=cols*rows;
for(var yv=0;yv<rows;yv++){
  for(var xv=0;xv<cols;xv++){
    var el=document.createElement('span');
    el.className='d';
    el.textContent='·';
    el.style.left=((xv+.5)/cols*100)+'%';
    el.style.top=((yv+.5)/rows*100)+'%';
    root.appendChild(el);
    dots.push({el:el,x:0,y:0,lit:false});
  }
}
function layout(){
  var r=root.getBoundingClientRect();
  dots.forEach(function(d){
    var p=parseFloat(d.el.style.left)/100*r.width,q=parseFloat(d.el.style.top)/100*r.height;
    d.x=p;d.y=q;
  });
}
layout();
window.addEventListener('resize',layout);
var raf=false,mx=-999,my=-999;
function glow(){
  raf=false;
  var radius=150;
  dots.forEach(function(d){
    if(d.lit)return;
    var dx=d.x-mx,dy=d.y-my,dist=Math.sqrt(dx*dx+dy*dy);
    var p=Math.max(0,1-dist/radius);
    d.el.style.color='rgba('+(120+p*94)+','+(102+p*56)+','+74+','+(0.28+p*0.55)+')';
    d.el.style.transform='translate(-50%,-50%) scale('+(1+p*0.6)+')';
  });
}
root.addEventListener('mousemove',function(e){
  var r=root.getBoundingClientRect();
  mx=e.clientX-r.left;my=e.clientY-r.top;
  if(!raf){raf=true;requestAnimationFrame(glow)}
});
root.addEventListener('click',function(e){
  var r=root.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,near=null,best=70;
  dots.forEach(function(d){
    if(d.lit)return;
    var dx=d.x-cx,dy=d.y-cy,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<best){best=dist;near=d}
  });
  if(!near)return;
  near.lit=true;
  near.el.classList.add('lit');
  near.el.textContent=W[wi%W.length];
  wi++;count++;
  near.el.style.color='';near.el.style.transform='translate(-50%,-50%)';
  cap.textContent=count+' of '+total+' words found on an unwritten page';
});
})();
</script>
</section>
