<section data-date='2026-07-19' data-type='morning'>
<style>
#dw0719{position:relative;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 45%,#1a1a2e 100%);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;cursor:crosshair;-webkit-user-select:none;user-select:none}
#dw0719 .sun{position:absolute;left:50%;bottom:-6vmin;width:14vmin;height:14vmin;margin-left:-7vmin;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff3d0,#ffb35c 55%,#ff7a3d 100%);box-shadow:0 0 4vmin rgba(255,150,70,.3);transition:bottom .25s ease-out,box-shadow .25s}
#dw0719 .horizon{position:absolute;left:0;right:0;bottom:28vh;height:1px;background:rgba(255,255,255,.15)}
#dw0719 .line{position:absolute;left:6vw;right:6vw;bottom:32vh;font-size:clamp(1rem,2.4vw,1.7rem);color:#f2e6d8;letter-spacing:.02em;line-height:1.6}
#dw0719 .line span{opacity:0;display:inline-block;transform:translateY(8px);transition:opacity .8s,transform .8s}
#dw0719 .line span.on{opacity:1;transform:translateY(0)}
#dw0719 .cap{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,230,216,.45);font-family:Arial,sans-serif;white-space:nowrap}
</style>
<div id="dw0719">
<div class="sun" id="dw19s"></div>
<div class="horizon"></div>
<div class="line" id="dw19l"><span>not</span> <span>yet</span> <span>named,</span> <span>this</span> <span>hour</span> <span>holds</span> <span>everything</span> <span>still</span> <span>unwritten.</span></div>
<div class="cap" id="dw19c">move to wake the sky. click to write the day.</div>
</div>
<script>
(function(){
var root=document.getElementById('dw0719'),sun=document.getElementById('dw19s'),cap=document.getElementById('dw19c');
var spans=[].slice.call(document.querySelectorAll('#dw19l span'));
var i=0;
function lerp(a,b,t){return a+(b-a)*t}
function mix(c1,c2,t){return [0,1,2].map(function(k){return Math.round(lerp(c1[k],c2[k],t))})}
var night=[[26,26,46],[22,33,62],[26,26,46]];
var dawn=[[45,27,78],[255,122,61],[255,216,155]];
root.addEventListener('mousemove',function(e){
  var t=Math.min(1,Math.max(0,1-e.clientY/innerHeight));
  sun.style.bottom=(-6+t*55)+'vmin';
  sun.style.boxShadow='0 0 '+(4+t*8)+'vmin rgba(255,150,70,'+(0.3+t*0.4)+')';
  var c=[0,1,2].map(function(k){return mix(night[k],dawn[k],t)});
  root.style.background='linear-gradient(180deg, rgb('+c[0]+') 0%, rgb('+c[1]+') 45%, rgb('+c[2]+') 100%)';
});
root.addEventListener('click',function(){
  if(i<spans.length){spans[i].classList.add('on');i++}
  cap.textContent=i<spans.length?(i+' of '+spans.length+' words found'):'the day begins now.';
});
})();
</script>
</section>
