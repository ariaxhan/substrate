<section data-date='2026-08-11' data-type='reflection'>
<style>
.rf11{margin:0;overflow:hidden;height:100vh;background:radial-gradient(ellipse at 50% 100%,#0a1020 0%,#050810 55%,#010204 100%);cursor:crosshair;position:relative;font-family:Georgia,'Iowan Old Style',serif}
.rf11 .rf-sky{position:absolute;inset:0}
.rf11 svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rf11 .rf-star{position:absolute;border-radius:50%;background:#fff;transform:translate(-50%,-50%);animation:rf-in .9s ease-out forwards,rf-tw 4s ease-in-out infinite;pointer-events:none}
@keyframes rf-in{from{opacity:0;transform:translate(-50%,-50%) scale(0)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes rf-tw{0%,100%{opacity:.55}50%{opacity:1}}
.rf11 .rf-word{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);color:#9fb0c9;font-size:13px;letter-spacing:.35em;text-transform:uppercase;opacity:0;transition:opacity 2s ease}
.rf11 .rf-word.on{opacity:.55}
.rf11 .rf-count{position:absolute;top:22px;left:26px;color:#5a6a8a;font-size:11px;letter-spacing:.2em;opacity:.6}
.rf11 .rf-hint{position:absolute;top:22px;right:26px;color:#3d4a68;font-size:11px;letter-spacing:.1em;font-style:italic;opacity:.5;transition:opacity 1.5s}
</style>
<div class="rf11" id="rf11">
  <div class="rf-sky" id="rfSky"></div>
  <svg id="rfLines"><g id="rfG" stroke="#4a5c86" stroke-width="1" opacity="0.35" fill="none"></g></svg>
  <div class="rf-count" id="rfCount">0 stars</div>
  <div class="rf-hint" id="rfHint">click the dark</div>
  <div class="rf-word" id="rfWord">rest, before the next beginning</div>
</div>
<script>
(function(){
  var root=document.getElementById('rf11'),sky=document.getElementById('rfSky'),g=document.getElementById('rfG');
  var cnt=document.getElementById('rfCount'),hint=document.getElementById('rfHint'),word=document.getElementById('rfWord');
  var pts=[],n=0;
  function place(x,y){
    var s=document.createElement('div');
    var r=1+Math.random()*2.2;
    s.className='rf-star';
    s.style.width=r+'px';s.style.height=r+'px';
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.animationDelay=(Math.random()*2)+'s, '+(Math.random()*2)+'s';
    s.style.boxShadow='0 0 '+(r*3)+'px rgba(255,255,255,.6)';
    sky.appendChild(s);
    if(pts.length){
      var p=pts[pts.length-1];
      var line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',p[0]);line.setAttribute('y1',p[1]);
      line.setAttribute('x2',x);line.setAttribute('y2',y);
      line.style.opacity=0;
      g.appendChild(line);
      requestAnimationFrame(function(){line.style.transition='opacity 1.8s ease';line.style.opacity='0.35';});
    }
    pts.push([x,y]);
    n++;
    cnt.textContent=n+(n===1?' star':' stars');
    if(n===1){hint.style.opacity=0;}
    if(n>=7){word.classList.add('on');}
    if(pts.length>60){pts.shift();}
  }
  function seed(){
    for(var i=0;i<40;i++){
      var s=document.createElement('div');
      var r=Math.random()*1.3+.3;
      s.className='rf-star';
      s.style.width=r+'px';s.style.height=r+'px';
      s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*70)+'%';
      s.style.animationDelay=(Math.random()*3)+'s, '+(Math.random()*4)+'s';
      s.style.opacity=String(.25+Math.random()*.35);
      sky.appendChild(s);
    }
  }
  seed();
  root.addEventListener('click',function(e){
    var b=root.getBoundingClientRect();
    place(e.clientX-b.left,e.clientY-b.top);
  });
})();
</script>
</section>
