<section data-date='2026-01-28' data-type='pulse'>
<style>
#eq{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:2rem}
.bar{width:200px;height:2px;background:#fff;position:relative}
.dot{width:8px;height:8px;background:#fff;border-radius:50%;position:absolute;top:-3px;animation:slide 4s ease-in-out infinite}
@keyframes slide{0%,100%{left:0}50%{left:calc(100% - 8px)}}
#t{font-size:11px;letter-spacing:2px;opacity:.6}
</style>
<div id='eq'>
<div class='bar'><div class='dot'></div></div>
<div id='t'>MIDPOINT</div>
<div class='bar'><div class='dot' style='animation-delay:-2s'></div></div>
</div>
</section>
