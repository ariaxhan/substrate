<section data-date='2026-01-28' data-type='digest'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font:12px monospace;overflow:hidden}
#c{width:100vw;height:100vh;display:block}
</style>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let p=[],t=0,m=0;
function d(){
x.fillStyle='rgba(0,0,0,.05)';x.fillRect(0,0,c.width,c.height);
if(Math.random()>.7&&p.length<120){
p.push({x:Math.random()*c.width,y:c.height,v:Math.random()*2+1,s:Math.random()*3+1,c:`hsl(${120+Math.random()*60},70%,${40+Math.random()*30}%)`});
}
p=p.filter(d=>{
d.y-=d.v;d.x+=Math.sin(t*.01+d.y*.01)*.5;
x.fillStyle=d.c;x.fillRect(d.x,d.y,d.s,d.s);
if(Math.random()>.95){
x.strokeStyle=d.c+'44';x.beginPath();x.moveTo(d.x,d.y);
x.lineTo(d.x+Math.random()*40-20,d.y+Math.random()*40-20);x.stroke();
}
return d.y>0;
});
if(t%180===0&&m<8){
x.fillStyle='#0f0';x.font='9px monospace';
x.fillText(['threads','patterns','collisions','synthesis','knowledge','emergence','coherence','distillation'][m],20,c.height-20-m*12);
m++;
}
t++;requestAnimationFrame(d);
}
d();
</script>
</section>
