<section data-date='2026-10-18' data-type='pulse'>
<style>
.fv{position:relative;background:#efe7d6;margin:0;height:100vh;overflow:hidden;font:italic 15px Georgia,serif;color:#2b2622;cursor:crosshair}
.fv canvas{display:block;width:100%;height:100%}
.fv p{position:absolute;left:0;right:0;bottom:6vh;margin:0;text-align:center;letter-spacing:.3em;opacity:.55;transition:opacity 2s}
</style>
<div class="fv"><canvas id="fc"></canvas><p id="fp">halfway</p></div>
<script>
(()=>{
const c=document.getElementById('fc'),x=c.getContext('2d'),p=document.getElementById('fp');
let W,H,a=0,v=0,t=0,m=0,f=1,n=0;
const R=()=>{W=c.width=innerWidth;H=c.height=innerHeight};R();onresize=R;
const W8=["halfway","still halfway","the pivot holds","noon is a hinge","neither","both","you are the weight"];
onmousemove=e=>{m=(e.clientX/W-.5)*2};
onclick=()=>{f=-f;v+=.2*f;p.textContent=W8[++n%W8.length]};
function D(){
 t+=.016;
 // spring toward mouse tilt, breathing pulse around zero
 const tg=m*.35*f+Math.sin(t*1.3)*.015;
 v+=(tg-a)*.04;v*=.93;a+=v;
 const bal=1-Math.min(1,Math.abs(a)/.35);
 x.fillStyle='rgba(239,231,214,.22)';x.fillRect(0,0,W,H);
 const cx=W/2,cy=H*.58,L=Math.min(W*.4,H*.7);
 x.save();x.translate(cx,cy);x.rotate(a);
 x.strokeStyle='#2b2622';x.lineWidth=2;
 x.beginPath();x.moveTo(-L,0);x.lineTo(L,0);x.stroke();
 for(let s=-1;s<=1;s+=2){
  const day=(s*f<0);
  const ex=s*L,r=26+(day?1:-1)*a*s*40;
  x.save();x.translate(ex,0);x.rotate(-a);
  x.beginPath();x.moveTo(0,0);x.lineTo(0,50);x.stroke();
  x.beginPath();x.arc(0,50+r,r,0,7);
  if(day){x.fillStyle='#d9822b';x.fill()}
  else{x.fillStyle='#2b2f4a';x.fill();x.beginPath();x.arc(8,50+r-4,r*.8,0,7);x.fillStyle='#efe7d6';x.fill()}
  // ripple rings when balanced
  for(let k=1;k<4;k++){x.beginPath();x.arc(0,50+r,r+k*14+Math.sin(t*2+k)*4,0,7);
   x.strokeStyle='rgba(43,38,34,'+(.25*bal/k)+')';x.stroke()}
  x.restore()}
 x.restore();
 x.fillStyle='#2b2622';x.beginPath();
 x.moveTo(cx,cy);x.lineTo(cx-22,cy+70);x.lineTo(cx+22,cy+70);x.fill();
 x.beginPath();x.arc(cx,cy,5,0,7);x.fillStyle='#efe7d6';x.fill();
 p.style.opacity=.15+bal*.6;
 requestAnimationFrame(D)}
D();
})();
</script>
</section>
