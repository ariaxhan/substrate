<section data-date='2026-02-02' data-type='winddown'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(180deg,#1a1520 0%,#2d1b2e 40%,#3d2438 70%,#2a1825 100%);
  height:100vh;
  overflow:hidden;
  font-family:Georgia,serif;
  position:relative;
  cursor:none
}
.layer{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  pointer-events:none
}
#glow{
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,150,0.4) 0%,rgba(255,180,120,0.2) 30%,transparent 70%);
  opacity:0;
  transition:opacity 0.6s ease-out;
  filter:blur(40px);
  mix-blend-mode:screen;
  transform:translate(-50%,-50%)
}
.ember{
  position:absolute;
  font-size:16px;
  opacity:0;
  transition:opacity 2s ease-in-out;
  color:#8b6f7a;
  letter-spacing:0.15em;
  text-transform:lowercase
}
.e1{top:15%;left:20%;font-size:14px}
.e2{top:25%;right:18%;font-size:18px}
.e3{top:45%;left:15%;font-size:13px}
.e4{top:60%;right:25%;font-size:16px}
.e5{top:75%;left:30%;font-size:15px}
.e6{top:35%;left:50%;font-size:12px;transform:translateX(-50%)}
.e7{top:85%;right:20%;font-size:14px}
.breath{
  position:absolute;
  bottom:8%;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:#4a3a44;
  letter-spacing:0.3em;
  opacity:0.5;
  animation:pulse 8s ease-in-out infinite
}
@keyframes pulse{
  0%,100%{opacity:0.3}
  50%{opacity:0.6}
}
</style>

<div class="layer">
  <div id="glow"></div>
</div>

<div class="layer">
  <div class="ember e1">release</div>
  <div class="ember e2">settling</div>
  <div class="ember e3">dusk</div>
  <div class="ember e4">fading</div>
  <div class="ember e5">warmth</div>
  <div class="ember e6">exhale</div>
  <div class="ember e7">dissolve</div>
</div>

<div class="breath">breathe   slow</div>

<script>
const g=document.getElementById('glow');
const embers=document.querySelectorAll('.ember');
let lastMove=0;
let currentOpacity=0;
let moveTimer;
let stillTimer;

// Gradual word appearance
embers.forEach((e,i)=>{
  setTimeout(()=>{e.style.opacity=1},1200*i+800);
});

function updateGlow(x,y){
  g.style.left=x+'px';
  g.style.top=y+'px';

  // Calculate velocity-based opacity
  const now=Date.now();
  const delta=now-lastMove;
  lastMove=now;

  // Faster movement = brighter glow
  if(delta<16){
    currentOpacity=Math.min(1,currentOpacity+0.08);
  }else{
    currentOpacity=Math.max(0,currentOpacity-0.02);
  }

  g.style.opacity=currentOpacity;

  // Clear existing timers
  clearTimeout(moveTimer);
  clearTimeout(stillTimer);

  // Fade after movement stops
  moveTimer=setTimeout(()=>{
    fadeOut();
  },100);
}

function fadeOut(){
  const fade=()=>{
    if(currentOpacity>0){
      currentOpacity=Math.max(0,currentOpacity-0.015);
      g.style.opacity=currentOpacity;
      stillTimer=setTimeout(fade,30);
    }
  };
  fade();
}

document.addEventListener('mousemove',(e)=>{
  updateGlow(e.clientX,e.clientY);
});

// Initial fade in
setTimeout(()=>{
  document.body.style.transition='background 3s ease';
},500);
</script>
</section>
