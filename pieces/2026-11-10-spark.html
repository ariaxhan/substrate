<section data-date='2026-11-10' data-type='spark'>
<style>
.cv{position:relative;background:#0b0a10;color:#e8e0d0;font:13px/1.4 Georgia,serif;height:360px;overflow:hidden;cursor:crosshair}
.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.cv p{position:absolute;left:14px;bottom:10px;margin:0;font-style:italic;opacity:.7;letter-spacing:.08em;pointer-events:none}
</style>
<div class="cv"><canvas id="c"></canvas><p id="t">move. let two things meet.</p></div>
<script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t');
let W,H;const R=()=>{W=c.width=c.clientWidth;H=c.height=c.clientHeight};R();
const words=[['salt','sea'],['ash','ember'],['you','I'],['stone','water'],['then','now']];
let m={x:W/2,y:H/2},A=[],B=[],P=[],n=0,w=words[0];
const mk=(o,col)=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,col});
for(let i=0;i<60;i++){A.push(mk(0,'#ff6a3d'));B.push(mk(0,'#3dc8ff'))}
c.onmousemove=e=>{const r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top};
c.onclick=e=>{n=(n+1)%words.length;w=words[n];t.textContent=w[0]+' + '+w[1]+' = ?'};
const step=(S,sx)=>{for(const p of S){
 const d=Math.hypot(m.x-p.x,m.y-p.y)+1;
 const tx=sx?W*.2:W*.8;
 p.vx+=(m.x-p.x)/d*.15*(sx?1:.6)+(tx-p.x)*.0004+(Math.random()-.5)*.3;
 p.vy+=(m.y-p.y)/d*.15*(sx?.6:1)+(H/2-p.y)*.0004+(Math.random()-.5)*.3;
 p.vx*=.96;p.vy*=.96;p.x+=p.vx;p.y+=p.vy}};
const f=()=>{
 x.fillStyle='rgba(11,10,16,.18)';x.fillRect(0,0,W,H);
 step(A,1);step(B,0);
 for(const a of A)for(const b of B){
  const dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
  if(d<64){P.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:1});
   x.strokeStyle='rgba(255,230,150,.5)';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
 for(const S of [A,B])for(const p of S){x.fillStyle=p.col;x.fillRect(p.x,p.y,2,2)}
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.l-=.03;
  if(p.l<=0){P.splice(i,1);continue}
  x.fillStyle='rgba(255,'+(180+p.l*70|0)+',120,'+p.l+')';x.fillRect(p.x,p.y,3*p.l+1,3*p.l+1)}
 if(P.length>400)P.splice(0,P.length-400);
 x.fillStyle='#ff6a3d';x.font='20px Georgia';x.textAlign='right';x.fillText(w[0],W/2-8-Math.min(P.length,60)/2,34);
 x.fillStyle='#3dc8ff';x.textAlign='left';x.fillText(w[1],W/2+8+Math.min(P.length,60)/2,34);
 requestAnimationFrame(f)};
f();
})();
</script>
</section>
