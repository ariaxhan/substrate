<section data-date='2026-09-26' data-type='digest'>
<style>
.lat{margin:0;overflow:hidden;background:#07090c;height:640px;position:relative;font-family:'Georgia',serif;cursor:crosshair}
.lat h1{position:absolute;top:14px;left:18px;margin:0;font:italic 13px/1.4 Georgia,serif;color:#5a6472;letter-spacing:.04em;z-index:5;pointer-events:none}
.lat h1 span{color:#e8c98a}
.lat canvas{position:absolute;inset:0;width:100%;height:100%}
.lat p.hint{position:absolute;bottom:12px;left:18px;margin:0;font:11px/1.4 monospace;color:#3d4552;z-index:5;pointer-events:none;transition:opacity 1.5s}
</style>
<div class="lat">
  <h1>a fact means nothing <span>until it touches another</span></h1>
  <canvas id="lc"></canvas>
  <p class="hint" id="lh">tap to place a knowing — it will find what it belongs to</p>
</div>
<script>
(function(){
  var root = document.currentScript.previousElementSibling.parentElement || document.querySelector('.lat');
  var c = root.querySelector('#lc'), hint = root.querySelector('#lh');
  var W = root.clientWidth, H = root.clientHeight;
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  c.width = W*dpr; c.height = H*dpr;
  var x = c.getContext('2d'); x.scale(dpr,dpr);
  var pts = [], t = 0, born = 0;
  var words = ['name','date','cause','cost','witness','pattern','origin','shape','weight','trace','claim','root','edge','signal','echo'];

  function seed(px,py){
    pts.push({x:px,y:py,r:0,age:0,w:words[(pts.length*7+3)%words.length],links:[]});
  }
  // gentle ambient seeding so the field never feels dead
  var ambient = setInterval(function(){
    if (pts.length < 5 && Math.random() < .6){
      seed(Math.random()*W, Math.random()*H);
    }
  }, 2200);

  root.addEventListener('click', function(e){
    var b = c.getBoundingClientRect();
    seed(e.clientX-b.left, e.clientY-b.top);
    hint.style.opacity = 0;
  });

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function tick(){
    t++;
    x.fillStyle = 'rgba(7,9,12,0.14)';
    x.fillRect(0,0,W,H);

    for (var i=0;i<pts.length;i++){
      var p = pts[i];
      p.age++;
      p.r = Math.min(3.2, p.r + 0.05);
      // find bonds
      for (var j=i+1;j<pts.length;j++){
        var q = pts[j];
        var d = dist(p,q);
        var key = j;
        var already = p.links.indexOf(key) > -1;
        if (d < 150 && !already && p.age>10 && q.age>10){
          p.links.push(key);
        }
      }
    }

    // draw bonds — crystallizing structure
    x.lineWidth = 0.6;
    for (var i=0;i<pts.length;i++){
      var p = pts[i];
      for (var k=0;k<p.links.length;k++){
        var q = pts[p.links[k]];
        var d = dist(p,q);
        var op = Math.max(0, 1 - d/150) * 0.5;
        var grad = x.createLinearGradient(p.x,p.y,q.x,q.y);
        grad.addColorStop(0, 'rgba(232,201,138,'+op+')');
        grad.addColorStop(1, 'rgba(120,150,190,'+op+')');
        x.strokeStyle = grad;
        x.beginPath();
        x.moveTo(p.x,p.y);
        x.lineTo(q.x,q.y);
        x.stroke();
      }
    }

    // draw nodes + labels that fade as they age into structure
    for (var i=0;i<pts.length;i++){
      var p = pts[i];
      var pulse = 1 + 0.15*Math.sin(t*0.05 + i);
      x.beginPath();
      x.fillStyle = p.links.length ? '#e8c98a' : '#6c7686';
      x.globalAlpha = 0.85;
      x.arc(p.x, p.y, p.r*pulse, 0, 7);
      x.fill();
      x.globalAlpha = 1;
      if (p.age < 140){
        x.font = '11px monospace';
        x.fillStyle = 'rgba(150,160,175,'+Math.max(0,(140-p.age)/140*0.8)+')';
        x.fillText(p.w, p.x+7, p.y-7);
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</section>
