<section data-date='2026-10-30' data-type='reflection'>
<style>
.t{position:relative;height:100vh;background:radial-gradient(ellipse at 50% 120%,#1b2147,#07081a 70%);overflow:hidden;cursor:crosshair;font:italic 300 22px Georgia,serif;color:#cfd6ff}
.t p{position:absolute;left:0;right:0;top:44%;text-align:center;margin:0;letter-spacing:.3em;opacity:.5;pointer-events:none;transition:opacity 3s}
.t i{position:absolute;font-style:normal;transform:translate(-50%,-50%);white-space:nowrap;animation:b 6s ease-in-out infinite alternate}
.t i::before{content:"";display:block;width:3px;height:3px;margin:auto;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px #9aa8ff}
.t i b{display:block;font:300 13px Georgia;opacity:0;margin-top:6px;transition:opacity 2s}
.t i:hover b{opacity:.9}
@keyframes b{from{opacity:.35}to{opacity:1}}
</style>
<div class="t" id="t"><p>the day is done</p></div>
<script>
(function(){
var t=document.getElementById('t'),w=["rest","breathe","enough","soft","dark is kind","held","tomorrow waits","still","unfinished, and fine","sleep"],n=0;
t.onclick=function(e){
var r=t.getBoundingClientRect(),s=document.createElement('i');
s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';
s.style.animationDelay=-Math.random()*6+'s';
s.innerHTML='<b>'+w[n++%w.length]+'</b>';
t.appendChild(s);
t.firstChild.style.opacity=0;
}
})()
</script>
</section>
