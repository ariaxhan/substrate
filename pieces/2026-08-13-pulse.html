<section data-date='2026-08-13' data-type='pulse'>
<style>
#taper-halfway{position:relative;width:100%;height:70vh;min-height:420px;background:#0b0c10;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#e8e2d6;cursor:crosshair;user-select:none}
#taper-halfway .sky{position:absolute;inset:0;background:linear-gradient(to bottom,#0b0c10,#1a1410 60%,#0b0c10)}
#taper-halfway .beam{position:absolute;top:50%;left:50%;width:70%;height:2px;background:#c9a24b;transform-origin:center center;transform:translate(-50%,-50%) rotate(0deg);transition:transform .15s ease-out}
#taper-halfway .beam::before,#taper-halfway .beam::after{content:'';position:absolute;top:0;width:1px;height:60px;background:#c9a24b88}
#taper-halfway .beam::before{left:2%}
#taper-halfway .beam::after{right:2%}
#taper-halfway .pan{position:absolute;top:0;width:88px;height:88px;border:1px solid #c9a24b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:radial-gradient(circle at 40% 30%,#20180f,#0b0c10);transition:top .18s ease-out}
#taper-halfway .pivot{position:absolute;top:50%;left:50%;width:8px;height:8px;background:#c9a24b;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 24px 6px #c9a24b55}
#taper-halfway .word{opacity:.75}
#taper-halfway .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6b6255;font-family:Arial,sans-serif}
#taper-halfway .flip{transform:translate(-50%,-50%) scaleX(-1)}
</style>
<div id="taper-halfway">
  <div class="sky"></div>
  <div class="pivot"></div>
  <div class="beam" id="th-beam">
    <div class="pan" id="th-left" style="left:1%"><span class="word">morning</span></div>
    <div class="pan" id="th-right" style="right:1%"><span class="word">evening</span></div>
  </div>
  <div class="hint">move to tip the scale &middot; click the pivot to flip</div>
</div>
<script>
(function(){
  var wrap=document.getElementById('taper-halfway');
  var beam=document.getElementById('th-beam');
  var L=document.getElementById('th-left');
  var R=document.getElementById('th-right');
  var flipped=false;
  var maxDeg=16, maxDrop=46;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  wrap.addEventListener('mousemove', function(e){
    var r=wrap.getBoundingClientRect();
    var t=(e.clientX-r.left)/r.width;
    var bal=clamp((t-0.5)*2,-1,1);
    if(flipped) bal=-bal;
    var deg=bal*maxDeg;
    beam.style.transform='translate(-50%,-50%) rotate('+deg+'deg)';
    L.style.top=(clamp(-bal,-1,1)*maxDrop*-1+18)+'px';
    R.style.top=(clamp(bal,-1,1)*maxDrop*-1+18)+'px';
  });
  wrap.addEventListener('mouseleave', function(){
    beam.style.transform='translate(-50%,-50%) rotate(0deg)';
    L.style.top='18px'; R.style.top='18px';
  });
  wrap.addEventListener('click', function(){
    flipped=!flipped;
    beam.classList.toggle('flip');
    var lw=L.querySelector('.word'), rw=R.querySelector('.word');
    var tmp=lw.textContent; lw.textContent=rw.textContent; rw.textContent=tmp;
  });
})();
</script>
</section>
