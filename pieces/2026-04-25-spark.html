<section data-date='2026-04-25' data-type='spark'>
<style>*{margin:0;padding:0}#c{display:block;cursor:crosshair}</style>
<canvas id=c></canvas>
<script>
const v=document.getElementById('c'),x=v.getContext('2d');
let W=v.width=innerWidth,H=v.height=innerHeight;
addEventListener('resize',()=>{W=v.width=innerWidth;H=v.height=innerHeight});

const P=[
 ['orbit',    'longing',  'revolution'],
 ['entropy',  'memory',   'forgetting'],
 ['resonance','breath',   'singing'   ],
 ['wave',     'grief',    'breaking'  ],
 ['void',     'presence', 'space'     ],
 ['mass',     'sorrow',   'weight'    ],
];

let n=0,mx=W/2,my=H/2,ph=0,pt=0,sy='',sa=0,t=0;
let A={x:0,y:0,vx:0,vy:0,w:''},B={x:0,y:0,vx:0,vy:0,w:''};
const rn=(a,b)=>a+Math.random()*(b-a);

function init(){
 let p=P[n++%P.length];
 A.w=p[0];B.w=p[1];sy=p[2];
 A.x=W*.12;A.y=rn(H*.2,H*.8);A.vx=rn(.2,.5);A.vy=rn(-.2,.2);
 B.x=W*.88;B.y=rn(H*.2,H*.8);B.vx=rn(-.5,-.2);B.vy=rn(-.2,.2);
 ph=0;sa=0;pt=0;
}

addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
v.addEventListener('click',()=>{if(ph===1)ph=2});

function step(p){
 p.vx+=(mx-p.x)*.00005;p.vy+=(my-p.y)*.00005;
 p.vx*=.988;p.vy*=.988;
 p.x+=p.vx;p.y+=p.vy;
 if(p.x<30||p.x>W-30)p.vx*=-.8;
 if(p.y<30||p.y>H-30)p.vy*=-.8;
}

function draw(){
 x.fillStyle='rgba(6,6,10,.11)';x.fillRect(0,0,W,H);
 let d=Math.hypot(A.x-B.x,A.y-B.y);

 if(ph<2){
  step(A);step(B);
  if(ph===0&&d<180)ph=1;
  if(ph===1&&d>=180)ph=0;
  if(ph===1){
   let g=.00014;
   A.vx+=(B.x-A.x)*g;A.vy+=(B.y-A.y)*g;
   B.vx+=(A.x-B.x)*g;B.vy+=(A.y-B.y)*g;
  }
  if(d<32)ph=2;
 }

 let gl=ph===1?Math.max(0,(180-d)/180):0;
 let fs=Math.min(W*.034,46);
 x.textAlign='center';x.textBaseline='middle';

 if(ph<2||pt<28){
  let ao=ph===2?Math.max(0,1-pt/28):1;
  let ax=ph===1?A.x+Math.sin(t*.13)*4:A.x;
  let ay=ph===1?A.y+Math.cos(t*.09)*3:A.y;
  x.save();x.globalAlpha=ao;x.font=`${fs}px monospace`;
  x.shadowColor='#5bf';x.shadowBlur=5+gl*30;
  x.fillStyle=`hsl(210,70%,${54+gl*22}%)`;
  x.fillText(A.w,ax,ay);x.restore();

  let bx=ph===1?B.x+Math.sin(t*.1+2)*4:B.x;
  let by=ph===1?B.y+Math.cos(t*.12+1)*3:B.y;
  x.save();x.globalAlpha=ao;x.font=`${fs}px monospace`;
  x.shadowColor='#fb6';x.shadowBlur=5+gl*30;
  x.fillStyle=`hsl(28,80%,${54+gl*22}%)`;
  x.fillText(B.w,bx,by);x.restore();
 }

 if(ph===2){
  pt++;
  sa=pt<30?pt/30:pt<95?1:Math.max(0,1-(pt-95)/55);
  if(pt>152)init();
  let cx=(A.x+B.x)/2,cy=(A.y+B.y)/2;
  let sc=pt<30?.3+pt*.023:1;
  let sf=Math.min(W*.054,70);
  x.save();x.globalAlpha=sa;x.font=`bold ${sf}px monospace`;
  x.textAlign='center';x.textBaseline='middle';
  x.translate(cx,cy);x.scale(sc,sc);
  x.shadowColor='#fff';x.shadowBlur=18+sa*22;
  x.fillStyle='#fff';x.fillText(sy,0,0);x.restore();
 }

 t++;requestAnimationFrame(draw);
}
init();draw();
</script>
</section>
