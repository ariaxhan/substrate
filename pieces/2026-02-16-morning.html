<section data-date='2026-02-16' data-type='morning'>
<style>
body{margin:0;overflow:hidden;background:#0a0a12;font-family:Georgia,serif}
#m{position:fixed;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;user-select:none}
.h{position:absolute;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,230,200,.1),transparent);transform-origin:center;animation:r 20s linear infinite;opacity:0}
@keyframes r{from{transform:translateY(-50vh) rotate(0deg)}to{transform:translateY(50vh) rotate(360deg)}}
.w{font-size:14vmin;font-weight:300;color:#1a1a2e;letter-spacing:.3em;transition:all 1.2s cubic-bezier(.4,0,.2,1);margin:0;opacity:0;transform:translateY(20px)}
.w.v{color:#ffe6c8;opacity:1;transform:translateY(0)}
.c{position:absolute;bottom:5vh;font-size:12px;color:#4a4a5e;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .8s}
.c.v{opacity:1}
#g{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 50% 120%,rgba(255,230,200,0),rgba(255,230,200,0));transition:background 2s ease-out;pointer-events:none}
#g.d{background:radial-gradient(circle at 50% 120%,rgba(255,230,200,.08),rgba(255,230,200,0))}
</style>
<div id="m">
<canvas id="g"></canvas>
<div class="h" style="animation-delay:0s"></div>
<div class="h" style="animation-delay:4s"></div>
<div class="h" style="animation-delay:8s"></div>
<div class="h" style="animation-delay:12s"></div>
<div class="h" style="animation-delay:16s"></div>
<p class="w">UNWRITTEN</p>
<div class="c">touch to begin</div>
</div>
<script>
let s=0,w=document.querySelector('.w'),c=document.querySelector('.c'),g=document.getElementById('g'),m=document.getElementById('m');
const words=['POTENTIAL','THRESHOLD','EMERGENCE','AWAKENING','INCEPTION','GENESIS','OPENING','NASCENT','UNFOLDING','PRISTINE','FIRST LIGHT'];
function reveal(){
if(s<words.length){
w.classList.remove('v');
setTimeout(()=>{
w.textContent=words[s];
w.classList.add('v');
s++;
if(s===1)c.classList.add('v');
if(s===words.length){
setTimeout(()=>{
g.classList.add('d');
document.querySelectorAll('.h').forEach(h=>h.style.opacity=.3);
},800);
}
},600);
}}
m.onclick=reveal;
setTimeout(()=>c.classList.add('v'),1500);
</script>
</section>
