<section data-date='2026-10-31' data-type='spark'>
<style>
#tc{position:relative;background:#0b0710;height:360px;overflow:hidden;cursor:crosshair;font:12px Georgia,serif;color:#e8d9c4}
#tc canvas{position:absolute;inset:0;width:100%;height:100%}
#tc p{position:absolute;left:14px;bottom:8px;margin:0;opacity:.7;letter-spacing:.08em}
</style>
<div id="tc"><canvas id="c"></canvas><p id="t">two things, approaching</p></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t'),
W,H,P=[],S=[],m={x:0,y:0,on:0},n=0,
words=['I','you','→','←','we','us','both','neither','new'];
function rs(){W=c.width=c.clientWidth;H=c.height=c.clientHeight}
rs();addEventListener('resize',rs);
function mk(side,i){return{x:side?W*.9:W*.1,y:H/2+(i-20)*6,vx:0,vy:0,s:side,h:side?190:25,b:0}}
for(var i=0;i<40;i++)P.push(mk(i%2,i>>1));
c.onmousemove=function(e){var r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top;m.on=1};
c.onmouseleave=function(){m.on=0};
c.onclick=function(e){var r=c.getBoundingClientRect();
 S.push({x:e.clientX-r.left,y:e.clientY-r.top,r:0,w:words[n++%words.length]});
 P.forEach(function(p){p.b=1})};
function f(){
 x.fillStyle='rgba(11,7,16,.18)';x.fillRect(0,0,W,H);
 P.forEach(function(p){
  var tx=m.on?m.x:W/2,ty=m.on?m.y:H/2,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)+1;
  p.vx+=dx/d*.12+(Math.random()-.5)*.3;p.vy+=dy/d*.12+(Math.random()-.5)*.3;
  p.vx*=.97;p.vy*=.97;p.x+=p.vx;p.y+=p.vy;
  if(d<40){p.h+=(p.s?-1:1)*.0;p.b=Math.min(1,p.b+.05)}
 });
 for(var i=0;i<P.length;i++)for(var j=i+1;j<P.length;j++){
  var a=P[i],b=P[j];
  if(a.s==b.s)continue;
  var d=Math.hypot(a.x-b.x,a.y-b.y);
  if(d<46){
   x.strokeStyle='hsla('+((a.h+b.h)/2+(a.s?-60:60))+',90%,65%,'+(1-d/46)+')';
   x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
   if(d<6){S.push({x:a.x,y:a.y,r:0,w:''});a.x=b.x=(a.x+b.x)/2;a.h=b.h=(a.h+b.h)/2+40;t.textContent='synthesis'}
  }
 }
 P.forEach(function(p){
  x.fillStyle='hsl('+p.h+',85%,'+(55+p.b*20)+'%)';
  x.beginPath();x.arc(p.x,p.y,2+p.b*2,0,7);x.fill();
 });
 S=S.filter(function(s){
  s.r+=2.5;var a=1-s.r/120;if(a<=0)return 0;
  x.strokeStyle='rgba(255,240,220,'+a+')';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.stroke();
  if(s.w){x.fillStyle='rgba(255,240,220,'+a+')';x.fillText(s.w,s.x+s.r*.7,s.y-s.r*.7)}
  return 1});
 requestAnimationFrame(f)}
f();
})();
</script>
</section>
