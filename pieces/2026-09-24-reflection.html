<section data-date='2026-09-24' data-type='reflection'>
<style>
#night24{position:relative;isolation:isolate;box-sizing:border-box;height:100vh;height:100dvh;min-height:420px;overflow:hidden;cursor:crosshair;background:radial-gradient(ellipse 95% 38% at 50% 112%,#664437 0%,#27233b 48%,transparent 100%),linear-gradient(#111727,#1b1b30 65%,#35283b);color:#e8d7bd;font:12px/1.8 'Courier New',monospace;letter-spacing:.13em}
#night24 *{box-sizing:border-box}
#night24 .sky{position:absolute;inset:0}
#night24 .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffedcf;box-shadow:0 0 5px 2px #efbb8899,0 0 20px 3px #ed9d6444;transform:translate(-50%,-50%) scale(0);animation:arrive24 1.1s ease-out forwards;pointer-events:none}
#night24 .star:nth-child(3n){width:2px;height:2px;background:#c7d7e8;box-shadow:0 0 7px #aebfdb}
#night24 .poem{position:absolute;left:50%;top:48%;width:min(80vw,540px);transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 1px 9px #161726}
#night24 .poem span{display:block;opacity:0;transform:translateY(8px);transition:opacity 2s,transform 2s;margin:.7em 0}
#night24 .poem span:first-child{opacity:.76;transform:none}
#night24 .poem span.open{opacity:1;transform:none}
#night24 .hint{position:absolute;left:0;bottom:7%;width:100%;margin:0;text-align:center;color:#c6a891;opacity:.68;font-size:10px;pointer-events:none;transition:opacity 1.5s}
#night24:focus-visible{outline:2px solid #e8d7bd;outline-offset:-5px}
@keyframes arrive24{to{transform:translate(-50%,-50%) scale(1)}}
@media(prefers-reduced-motion:reduce){#night24 .star{animation:none;transform:translate(-50%,-50%)}#night24 .poem span{transition:none;transform:none}}
</style>
<div id="night24" tabindex="0" role="button" aria-label="Touch the night to place a star and reveal the poem">
  <div class="sky" aria-hidden="true"></div>
  <div class="poem" aria-live="polite">
    <span>the day has closed its hands.</span>
    <span>nothing more to carry.</span>
    <span>even the dark makes room.</span>
    <span>begin again &nbsp; when light does.</span>
  </div>
  <p class="hint">touch the quiet</p>
</div>
<script>
(()=>{const root=document.getElementById('night24'),sky=root.querySelector('.sky'),lines=[...root.querySelectorAll('.poem span')],hint=root.querySelector('.hint');let count=0;
function place(x,y){const star=document.createElement('i');star.className='star';star.style.left=x+'%';star.style.top=y+'%';sky.append(star);count++;if(count===1)hint.style.opacity=0;if(count%3===0&&count<=9)lines[count/3].classList.add('open')}
root.addEventListener('click',e=>{const r=root.getBoundingClientRect();place((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});
root.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(16+Math.random()*68,12+Math.random()*65)}});
})();
</script>
</section>
