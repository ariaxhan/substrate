<section data-date='2026-08-20' data-type='morning'>
<style>
#taper-morning-2026-08-20 {
  --y: 100vh;
  position: relative;
  height: 70vh;
  min-height: 480px;
  overflow: hidden;
  margin: 0;
  background: linear-gradient(to bottom, #0a0e1a 0%, #0a0e1a 55%, #10141f 100%);
  cursor: crosshair;
  font-family: Georgia, 'Times New Roman', serif;
}
#taper-morning-2026-08-20 .tm-sky {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% var(--y),
    rgba(255,214,140,0.85) 0%,
    rgba(255,150,90,0.5) 12%,
    rgba(120,70,110,0.25) 30%,
    rgba(10,14,26,0) 55%);
  transition: background 0.05s linear;
  pointer-events: none;
}
#taper-morning-2026-08-20 .tm-line {
  position: absolute;
  left: 50%;
  bottom: 20%;
  width: 92%;
  max-width: 640px;
  transform: translateX(-50%);
  text-align: center;
}
#taper-morning-2026-08-20 .tm-word {
  display: inline-block;
  color: #2a2f42;
  font-size: clamp(1.1rem, 3.4vw, 2.1rem);
  letter-spacing: 0.02em;
  margin: 0 0.14em;
  transition: color 0.4s ease, text-shadow 0.4s ease;
}
#taper-morning-2026-08-20 .tm-word.tm-lit {
  color: #ffe9c7;
  text-shadow: 0 0 18px rgba(255,180,90,0.65);
}
#taper-morning-2026-08-20 .tm-horizon {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20%;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(255,200,140,0.35), transparent);
}
#taper-morning-2026-08-20 .tm-hint {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #4a4f66;
  font: 11px/1.4 -apple-system, sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  pointer-events: none;
  opacity: 0.7;
}
</style>
<div id="taper-morning-2026-08-20">
  <div class="tm-sky"></div>
  <div class="tm-horizon"></div>
  <p class="tm-line" id="tm-line-2026-08-20"></p>
  <div class="tm-hint">move toward the light</div>
</div>
<script>
(function () {
  var root = document.getElementById('taper-morning-2026-08-20');
  var line = document.getElementById('tm-line-2026-08-20');
  var words = ['nothing', 'yet', 'has', 'been', 'written', 'today', 'is', 'still', 'only', 'light'];
  words.forEach(function (w) {
    var span = document.createElement('span');
    span.className = 'tm-word';
    span.textContent = w;
    line.appendChild(span);
  });
  var spans = line.querySelectorAll('.tm-word');
  var rising = 100;
  function paint(px) {
    var r = root.getBoundingClientRect();
    var frac = Math.max(0, Math.min(1, (px - r.left) / r.width));
    root.style.setProperty('--y', (100 - frac * 60) + '%');
    var lit = Math.round(frac * spans.length);
    spans.forEach(function (s, i) {
      s.classList.toggle('tm-lit', i < lit);
    });
  }
  root.addEventListener('mousemove', function (e) {
    paint(e.clientX);
  });
  root.addEventListener('touchmove', function (e) {
    if (e.touches[0]) paint(e.touches[0].clientX);
  });
  function drift(ts) {
    if (!root.matches(':hover')) {
      rising -= 0.05;
      if (rising < 0) rising = 100;
      var r = root.getBoundingClientRect();
      paint(r.left + (rising / 100) * r.width);
    }
    requestAnimationFrame(drift);
  }
  requestAnimationFrame(drift);
})();
</script>
</section>
