<section data-date='2026-11-28' data-type='spark'>
<style>
#cv{display:block;width:100%;height:360px;background:#0b0a10;cursor:crosshair}
</style>
<canvas id="cv" width="640" height="360"></canvas>
<script>
(function(){
var c=document.getElementById('cv'),x=c.getContext('2d'),W=640,H=360,
A=['spark','salt','lung','iron','tide','ember','wire'],
B=['flint','sugar','glass','moth','tongue','frost','bloom'],
m={x:160,y:180},n=0,f=[],p=[],a,b;
function mk(){var i=Math.random()*A.length|0,j=Math.random()*B.length|0;
a={w:A[i],x:60,y:60+Math.random()*240,v:1.2};
b={w:B[j],x:W-60,y:60+Math.random()*240,v:-1.2};}
function fuse(){var w=a.w.slice(0,Math.ceil(a.w.length/2))+b.w.slice(b.w.length>>1);
f.push({w:w,x:(a.x+b.x)/2,y:(a.y+b.y)/2,t:1});
for(var i=0;i<40;i++){var r=Math.random()*6.28,s=Math.random()*3;
p.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,dx:Math.cos(r)*s,dy:Math.sin(r)*s,t:1,h:i%2?20:200});}
if(f.length>6)f.shift();mk();}
c.onmousemove=function(e){var r=c.getBoundingClientRect();
m.x=(e.clientX-r.left)*W/r.width;m.y=(e.clientY-r.top)*H/r.height;};
c.onclick=function(){a.x=m.x-60;b.x=m.x+60;a.y=b.y=m.y;};
mk();
function L(){
x.fillStyle='rgba(11,10,16,.2)';x.fillRect(0,0,W,H);
a.x+=a.v;b.x+=b.v;
a.y+=(m.y-a.y)*.03;b.y+=(H-m.y-b.y)*.03;
a.y+=(m.x-W/2)*.004;
if(Math.abs(a.x-b.x)<40&&Math.abs(a.y-b.y)<28||a.x>W||b.x<0)fuse();
x.font='20px Georgia';x.textAlign='center';
x.fillStyle='#ff8a3d';x.fillText(a.w,a.x,a.y);
x.fillStyle='#4de0ff';x.fillText(b.w,b.x,b.y);
f.forEach(function(q){q.t*=.995;x.globalAlpha=q.t;x.fillStyle='#fff';
x.font='italic 26px Georgia';x.fillText(q.w,q.x,q.y-=.15);});
p.forEach(function(q){q.x+=q.dx;q.y+=q.dy;q.t-=.02;x.globalAlpha=Math.max(q.t,0);
x.fillStyle='hsl('+q.h+',100%,60%)';x.fillRect(q.x,q.y,2,2);});
p=p.filter(function(q){return q.t>0});
x.globalAlpha=1;requestAnimationFrame(L);}
L();
})();
</script>
</section>
