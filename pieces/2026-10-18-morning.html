<section data-date='2026-10-18' data-type='morning'>
<style>
#d{position:relative;height:100vh;overflow:hidden;cursor:crosshair;font:italic 22px/1 Georgia,'Times New Roman',serif;color:#2a1f2d;background:linear-gradient(#0d1030 calc(var(--h)*1%),#e8a07a 100%);--h:100;transition:--h 1s}
#s{position:absolute;left:50%;width:30vmin;height:30vmin;margin:-15vmin;border-radius:50%;background:radial-gradient(#fff6d8,#ffd27a 40%,#ff9a5a00 70%);top:calc(100% - var(--r)*1%)}
#d i{position:absolute;font-style:normal;opacity:0;animation:w 6s forwards;white-space:nowrap;color:#fff4dc;text-shadow:0 0 12px #ffb36b}
@keyframes w{10%{opacity:1}to{opacity:.0;transform:translateY(-40px)}}
#t{position:absolute;bottom:6%;width:100%;text-align:center;letter-spacing:.5em;font-size:13px;color:#fff8;mix-blend-mode:screen}
</style>
<div id=d><div id=s></div><div id=t>nothing is written yet</div></div>
<script>
(function(){
var d=document.getElementById('d'),s=document.getElementById('s'),t=document.getElementById('t'),
W=['begin','a door, unlatched','the first breath','not yet','light, tentatively','you','here','before the name','blank','again','open','warm'],n=0;
function m(e){var y=e.clientY/d.clientHeight;d.style.setProperty('--h',Math.max(0,y*100-10));s.style.setProperty('--r',Math.max(5,100-y*70))}
d.onmousemove=function(e){m(e)};
d.onclick=function(e){var r=d.getBoundingClientRect(),i=document.createElement('i');
i.textContent=W[n++%W.length];i.style.left=(e.clientX-r.left-40)+'px';i.style.top=(e.clientY-r.top)+'px';
d.appendChild(i);t.textContent=n+' '+(n<2?'word':'words')+' of the day';setTimeout(function(){i.remove()},6000)};
m({clientY:d.clientHeight||600});
})();
</script>
</section>
