<section data-date='2026-09-03' data-type='digest'>
<style>
#lattice{margin:0;overflow:hidden;background:#0a0c10;height:520px;position:relative;font:14px/1.3 Georgia,serif;cursor:crosshair;border-radius:2px}
#lattice svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lattice svg line{stroke:#4a6b5a;stroke-width:.6;opacity:0}
#lattice .pt{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:#e8e2d0;box-shadow:0 0 8px 2px rgba(232,226,208,.4)}
#lattice .lbl{position:absolute;color:#9fb3a6;letter-spacing:.03em;white-space:nowrap;transform:translate(-50%,-140%);opacity:0;transition:opacity 1.2s ease}
#lattice .lbl.show{opacity:.85}
#lattice .hint{position:absolute;bottom:10px;left:12px;color:#5c6a63;font:11px/1 monospace;letter-spacing:.08em;text-transform:uppercase}
#lattice .n{position:absolute;top:10px;right:14px;color:#5c6a63;font:11px/1 monospace}
</style>
<div id="lattice">
<svg id="ls"></svg>
<div class="hint">click to place a knowing — proximity crystallizes it</div>
<div class="n" id="lc">0 nodes</div>
</div>
<script>
(function(){
var W=["trace","echo","pattern","thread","axiom","residue","kernel","glint","shard","node","seed","drift","form","index","memory","weave","spark","strand","grain","field"];
var box=document.getElementById('lattice'),svg=document.getElementById('ls'),ns='http://www.w3.org/2000/svg',cnt=document.getElementById('lc');
var pts=[],R=150;
box.addEventListener('click',function(e){
  var r=box.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  var w=W[Math.floor(Math.random()*W.length)];
  var p={x:x,y:y,w:w,deg:0};
  var d=document.createElement('div');d.className='pt';d.style.left=x+'px';d.style.top=y+'px';box.appendChild(d);
  var l=document.createElement('div');l.className='lbl';l.style.left=x+'px';l.style.top=y+'px';l.textContent=w;box.appendChild(l);
  pts.forEach(function(q){
    var dx=q.x-x,dy=q.y-y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<R){
      var ln=document.createElementNS(ns,'line');
      ln.setAttribute('x1',x);ln.setAttribute('y1',y);ln.setAttribute('x2',q.x);ln.setAttribute('y2',q.y);
      svg.appendChild(ln);
      requestAnimationFrame(function(){ln.style.transition='opacity 1s';ln.style.opacity=Math.max(.08,1-dist/R)*.7;});
      q.deg++;p.deg++;
      if(q.deg>=3&&!q.crystal){q.crystal=true;q.dom.style.background='#f4b860';q.dom.style.boxShadow='0 0 14px 4px rgba(244,184,96,.55)';q.lbl.classList.add('show');}
    }
  });
  if(p.deg>=3){d.style.background='#f4b860';d.style.boxShadow='0 0 14px 4px rgba(244,184,96,.55)';l.classList.add('show');}
  p.dom=d;p.lbl=l;pts.push(p);
  cnt.textContent=pts.length+' nodes';
});
})();
</script>
</section>
