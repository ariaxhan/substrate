<section data-date='2026-09-03' data-type='digest'>
<style>
.taper-2026-09-03{background:#0b0d12;color:#cfd8e3;font:15px/1.5 Georgia,serif;padding:0;margin:0;overflow:hidden;position:relative;height:520px;cursor:crosshair}
.taper-2026-09-03 .hint{position:absolute;top:16px;left:20px;font:11px/1.4 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5a6577;z-index:3;pointer-events:none}
.taper-2026-09-03 .hint b{color:#8fa3c0}
.taper-2026-09-03 svg{position:absolute;inset:0;width:100%;height:100%}
.taper-2026-09-03 .n{fill:#e8ecf3;font:italic 13px Georgia,serif;text-anchor:middle;dominant-baseline:middle;opacity:0;transition:opacity 1.2s ease}
.taper-2026-09-03 .n.on{opacity:.92}
.taper-2026-09-03 .l{stroke:#3d4a63;stroke-width:1;opacity:0;transition:opacity 1.4s ease}
.taper-2026-09-03 .l.on{opacity:.55}
.taper-2026-09-03 .p{fill:#7d8ea8;opacity:0;transition:opacity .6s ease}
.taper-2026-09-03 .p.on{opacity:.85}
.taper-2026-09-03 .ct{position:absolute;bottom:14px;right:18px;font:11px -apple-system,sans-serif;color:#4a5569;letter-spacing:.08em;z-index:3}
</style>
<div class="taper-2026-09-03" id="tpr-2026-09-03">
  <div class="hint">tap the dark — <b>let it remember</b></div>
  <svg id="tpr-svg-2026-09-03" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="ct" id="tpr-ct-2026-09-03">0 nodes</div>
</div>
<script>
(function(){
  var words=["scrap","echo","trace","hunch","thread","signal","residue","pattern","recall","drift","kernel","ember","shape","weight","fold","axis","seed","grain","lattice","memory","gravity","order","name","form"];
  var root=document.getElementById('tpr-2026-09-03');
  var svg=document.getElementById('tpr-svg-2026-09-03');
  var ctr=document.getElementById('tpr-ct-2026-09-03');
  var NS='http://www.w3.org/2000/svg';
  var nodes=[];
  var W=800,H=520;
  function place(x,y){
    var w=words[nodes.length%words.length];
    var jx=x+(Math.random()*40-20), jy=y+(Math.random()*40-20);
    var node={x:jx,y:jy,w:w};
    nodes.push(node);
    var links=[];
    nodes.slice(0,-1).forEach(function(o){
      var d=Math.hypot(o.x-jx,o.y-jy);
      if(d<220){links.push(o);}
    });
    if(!links.length && nodes.length>1){
      links.push(nodes[nodes.length-2]);
    }
    links.forEach(function(o){
      var line=document.createElementNS(NS,'line');
      line.setAttribute('class','l');
      line.setAttribute('x1',o.x); line.setAttribute('y1',o.y);
      line.setAttribute('x2',jx); line.setAttribute('y2',jy);
      svg.appendChild(line);
      requestAnimationFrame(function(){line.classList.add('on');});
    });
    var dot=document.createElementNS(NS,'circle');
    dot.setAttribute('class','p'); dot.setAttribute('r','2.4');
    dot.setAttribute('cx',jx); dot.setAttribute('cy',jy);
    svg.appendChild(dot);
    var txt=document.createElementNS(NS,'text');
    txt.setAttribute('class','n');
    txt.setAttribute('x',jx); txt.setAttribute('y',jy-12);
    txt.textContent=w;
    svg.appendChild(txt);
    requestAnimationFrame(function(){dot.classList.add('on'); txt.classList.add('on');});
    ctr.textContent=nodes.length+(nodes.length===1?' node':' nodes')+(nodes.length>6?' — a shape emerges':'');
  }
  root.addEventListener('click',function(e){
    var r=root.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*W;
    var y=(e.clientY-r.top)/r.height*H;
    place(x,y);
  });
  // seed one node so the piece isn't inert on load
  setTimeout(function(){place(400,260);},400);
})();
</script>
</section>
