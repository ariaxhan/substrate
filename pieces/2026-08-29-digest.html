<section data-date='2026-08-29' data-type='digest'>
<style>
.tp29{background:#0a0a0c;color:#c9c2b4;font:14px/1.4 Georgia,serif;padding:0;margin:0;height:640px;position:relative;overflow:hidden;cursor:crosshair;border:1px solid #1a1a1c}
.tp29 .hint{position:absolute;top:14px;left:18px;font:11px/1.4 Menlo,monospace;color:#57503f;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;z-index:5}
.tp29 .ct{position:absolute;top:14px;right:18px;font:11px Menlo,monospace;color:#57503f;pointer-events:none;z-index:5}
.tp29 svg{position:absolute;inset:0;width:100%;height:100%}
.tp29 .lbl{position:absolute;font:italic 12px Georgia,serif;color:#8a8168;pointer-events:none;opacity:0;transform:translate(-50%,8px);transition:opacity 1.1s ease,transform 1.1s ease;white-space:nowrap}
.tp29 .lbl.on{opacity:.85;transform:translate(-50%,-14px)}
.tp29 .seed{position:absolute;width:6px;height:6px;border-radius:50%;background:#39352a;box-shadow:0 0 0 1px #221f18;transform:translate(-50%,-50%);transition:background .6s,box-shadow .6s,transform .6s}
.tp29 .seed.on{background:#e8dcb8;box-shadow:0 0 10px 2px rgba(232,220,184,.5);transform:translate(-50%,-50%) scale(1.5)}
.tp29 .foot{position:absolute;bottom:12px;left:18px;right:18px;font:11px Menlo,monospace;color:#3d3829;letter-spacing:.04em;pointer-events:none}
</style>
<div class="tp29">
  <div class="hint">click a point &mdash; knowledge crystallizes</div>
  <div class="ct" id="tp29ct">0 / 0 bonds</div>
  <svg id="tp29svg"></svg>
  <div id="tp29field"></div>
  <div class="foot">accumulation is not addition. it is the moment two facts recognize each other.</div>
</div>
<script>
(function(){
  var words=["signal","residue","pattern","recall","drift","threshold","echo","gradient","kernel","memory","emergence","structure","noise","context","weight","trace","synapse","fold","index","bloom"];
  var root=document.currentScript.previousElementSibling;
  var field=root.querySelector('#tp29field'),svg=root.querySelector('#tp29svg'),ct=root.querySelector('#tp29ct');
  var W=root.clientWidth||900,H=640;
  var N=26,pts=[],on=[],bonds=0;
  for(var i=0;i<N;i++){
    var x=40+Math.random()*(W-80), y=60+Math.random()*(H-120);
    pts.push({x:x,y:y,w:words[i%words.length]});
    var d=document.createElement('div');
    d.className='seed'; d.style.left=x+'px'; d.style.top=y+'px';
    field.appendChild(d);
    var l=document.createElement('div');
    l.className='lbl'; l.style.left=x+'px'; l.style.top=y+'px'; l.textContent=pts[i].w;
    field.appendChild(l);
    pts[i].dot=d; pts[i].lbl=l;
  }
  function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
  function line(a,b){
    var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',a.x);ln.setAttribute('y1',a.y);
    ln.setAttribute('x2',b.x);ln.setAttribute('y2',b.y);
    ln.setAttribute('stroke','#8a8168');ln.setAttribute('stroke-width','0.6');
    ln.setAttribute('stroke-opacity','0');
    svg.appendChild(ln);
    var t=0;
    (function fade(){t+=0.06;ln.setAttribute('stroke-opacity',Math.min(.55,t));if(t<.55)requestAnimationFrame(fade)})();
  }
  field.addEventListener('click',function(e){
    var r=root.getBoundingClientRect();
    var cx=e.clientX-r.left, cy=e.clientY-r.top;
    var best=null,bd=1e9;
    for(var i=0;i<pts.length;i++){
      var dd=dist({x:cx,y:cy},pts[i]);
      if(dd<bd){bd=dd;best=i}
    }
    if(best==null||on.indexOf(best)>-1)return;
    on.push(best);
    pts[best].dot.classList.add('on');
    pts[best].lbl.classList.add('on');
    for(var k=0;k<on.length-1;k++){
      var other=on[k];
      if(dist(pts[best],pts[other])<260){
        line(pts[best],pts[other]);
        bonds++;
      }
    }
    ct.textContent=on.length+' / '+bonds+' bonds';
  });
})();
</script>
</section>
