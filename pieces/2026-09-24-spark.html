<section data-date='2026-09-24' data-type='spark'>
<style>
.spk{position:relative;height:70vh;min-height:420px;background:#0a0a12;overflow:hidden;cursor:crosshair;font-family:Georgia,serif}
.spk canvas{display:block;width:100%;height:100%}
.spk .lbl{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#665;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:Arial,sans-serif;pointer-events:none;opacity:.6}
</style>
<div class="spk">
  <canvas id="spkC"></canvas>
  <div class="lbl">hold still &mdash; let them meet</div>
</div>
<script>
(function(){
  var el = document.currentScript.previousElementSibling.parentElement.querySelector('#spkC') || document.getElementById('spkC');
  var wrap = el.parentElement;
  var ctx = el.getContext('2d');
  function fit(){ el.width = wrap.clientWidth; el.height = wrap.clientHeight; }
  fit(); window.addEventListener('resize', fit);

  var mx = -999, my = -999, still = 0;
  wrap.addEventListener('mousemove', function(e){
    var r = wrap.getBoundingClientRect();
    mx = e.clientX - r.left; my = e.clientY - r.top; still = 0;
  });
  wrap.addEventListener('mouseleave', function(){ mx = -999; my = -999; });

  var W = ["seek","become","fuse","spark","meet","hold"];
  var A = {x: 60, y: 60, vx: 0, vy: 0, hue: 200};
  var B = {x: 300, y: 300, vx: 0, vy: 0, hue: 20};
  var bursts = [];
  var lastFuse = 0;

  function step(t){
    var w = el.width, h = el.height;
    ctx.fillStyle = 'rgba(10,10,18,0.18)';
    ctx.fillRect(0,0,w,h);

    if (mx > -900) {
      var dax = mx - A.x, day = my - A.y, da = Math.hypot(dax,day) || 1;
      A.vx += dax/da*0.35; A.vy += day/da*0.35;
      var dbx = mx - B.x, dby = my - B.y, db = Math.hypot(dbx,dby) || 1;
      B.vx -= dbx/db*0.28; B.vy -= dby/db*0.28;
      still++;
    } else { still = 0; }

    A.vx *= 0.94; A.vy *= 0.94;
    B.vx *= 0.94; B.vy *= 0.94;
    A.x += A.vx; A.y += A.vy;
    B.x += B.vx; B.y += B.vy;
    A.x = Math.max(20, Math.min(w-20, A.x));
    A.y = Math.max(20, Math.min(h-20, A.y));
    B.x = Math.max(20, Math.min(w-20, B.x));
    B.y = Math.max(20, Math.min(h-20, B.y));

    var dist = Math.hypot(A.x-B.x, A.y-B.y);
    var near = Math.max(0, 1 - dist/140);

    ctx.strokeStyle = 'rgba(200,190,255,' + (near*0.5) + ')';
    ctx.lineWidth = 1 + near*2;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();

    [[A,'a'],[B,'b']].forEach(function(pair){
      var p = pair[0];
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8 + near*6, 0, 7);
      ctx.fillStyle = 'hsla(' + p.hue + ',80%,65%,0.9)';
      ctx.fill();
    });

    if (near > 0.85 && t - lastFuse > 600) {
      lastFuse = t;
      bursts.push({x:(A.x+B.x)/2, y:(A.y+B.y)/2, r:0, word:W[0|Math.random()*W.length]});
    }

    ctx.font = '13px Georgia, serif';
    ctx.textAlign = 'center';
    bursts = bursts.filter(function(b){
      b.r += 2.2;
      var op = Math.max(0, 1 - b.r/70);
      if (op <= 0) return false;
      ctx.strokeStyle = 'rgba(255,220,180,' + op*0.7 + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,235,210,' + op + ')';
      ctx.fillText(b.word, b.x, b.y - b.r - 6);
      return true;
    });

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</section>
