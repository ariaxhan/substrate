<section data-date='2026-02-02' data-type='pulse'>
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
body {
  background: linear-gradient(180deg, #0a0e27 0%, #1a1a2e 50%, #2d1b1b 100%);
  overflow: hidden;
  font-family: 'Courier New', monospace;
  cursor: crosshair;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#c {
  position: relative;
  width: 80vmin;
  height: 80vmin;
}
.arm {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 35vmin;
  height: 0.5vmin;
  background: linear-gradient(90deg, #444 0%, #888 100%);
  transform-origin: 0% 50%;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 2vmin rgba(136, 136, 136, 0.3);
}
#l { transform: translate(-100%, -50%) rotate(0deg) }
#r { transform: translate(0%, -50%) rotate(180deg) }
.w {
  position: absolute;
  width: 8vmin;
  height: 12vmin;
  border: 0.3vmin solid #666;
  background: rgba(255, 255, 255, 0.03);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8vmin;
  color: #888;
  letter-spacing: 0.2vmin;
}
#wl {
  top: 50%;
  left: 0;
  transform: translate(-50%, 6vmin);
}
#wr {
  top: 50%;
  right: 0;
  transform: translate(50%, 6vmin);
}
.f {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1.5vmin;
  height: 1.5vmin;
  background: #999;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 3vmin rgba(153, 153, 153, 0.5);
  z-index: 10;
}
#t {
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  color: #555;
  font-size: 1.2vmin;
  letter-spacing: 0.5vmin;
  opacity: 0.7;
  transition: opacity 0.3s;
}
.p {
  position: absolute;
  width: 0.3vmin;
  background: rgba(136, 136, 136, 0.2);
  left: 50%;
  transform: translateX(-50%);
  transition: height 0.2s, opacity 0.2s;
}
#p1 { top: 25%; height: 0; opacity: 0 }
#p2 { bottom: 25%; height: 0; opacity: 0 }
</style>

<div id="c">
  <div id="t">NOON</div>
  <div class="p" id="p1"></div>
  <div class="p" id="p2"></div>
  <div class="arm" id="l"></div>
  <div class="arm" id="r"></div>
  <div class="w" id="wl">AM</div>
  <div class="w" id="wr">PM</div>
  <div class="f"></div>
</div>

<script>
const l = document.getElementById('l'),
      r = document.getElementById('r'),
      wl = document.getElementById('wl'),
      wr = document.getElementById('wr'),
      t = document.getElementById('t'),
      p1 = document.getElementById('p1'),
      p2 = document.getElementById('p2'),
      c = document.getElementById('c');

let eq = true;

document.body.addEventListener('mousemove', e => {
  const x = e.clientX / window.innerWidth,
        y = e.clientY / window.innerHeight,
        cx = 0.5,
        dx = (x - cx) * 40,
        dy = (y - 0.5) * 20,
        tilt = dx * -1;

  l.style.transform = `translate(-100%, -50%) rotate(${tilt}deg)`;
  r.style.transform = `translate(0%, -50%) rotate(${180 + tilt}deg)`;

  const wly = 6 - (tilt * 0.15),
        wry = 6 + (tilt * 0.15);

  wl.style.transform = `translate(-50%, ${wly}vmin)`;
  wr.style.transform = `translate(50%, ${wry}vmin)`;

  const balanced = Math.abs(dx) < 2;

  if (balanced && !eq) {
    eq = true;
    t.style.opacity = '0.7';
    t.textContent = 'NOON';
    p1.style.height = '25%';
    p1.style.opacity = '0.3';
    p2.style.height = '25%';
    p2.style.opacity = '0.3';
  } else if (!balanced && eq) {
    eq = false;
    t.style.opacity = '0.3';
    t.textContent = dx < 0 ? 'ANTE' : 'POST';
    p1.style.height = '0';
    p1.style.opacity = '0';
    p2.style.height = '0';
    p2.style.opacity = '0';
  }

  const wlOp = 0.03 + (Math.max(0, -tilt) / 40) * 0.15,
        wrOp = 0.03 + (Math.max(0, tilt) / 40) * 0.15;

  wl.style.background = `rgba(255, 255, 255, ${wlOp})`;
  wr.style.background = `rgba(255, 255, 255, ${wrOp})`;
});

c.addEventListener('click', () => {
  const reset = new MouseEvent('mousemove', {
    clientX: window.innerWidth / 2,
    clientY: window.innerHeight / 2
  });
  document.body.dispatchEvent(reset);
});
</script>
</section>
