<section data-date='2026-07-01' data-type='digest'>
<style>
#kx0701{position:relative;width:100%;height:520px;overflow:hidden;cursor:crosshair;font-family:Georgia,'Times New Roman',serif;
background:repeating-radial-gradient(circle at 20% 25%,rgba(0,0,0,.035) 0 1px,transparent 1px 14px),linear-gradient(160deg,#f4eee0,#e9dfc9 65%,#ddcfae)}
#kx0701 canvas{position:absolute;inset:0;width:100%;height:100%}
#kx0701 .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:italic 12px Georgia,serif;color:rgba(40,30,18,.55);pointer-events:none;transition:opacity 1.2s}
#kx0701 .ct{position:absolute;top:14px;right:18px;font:10px/1.5 'Courier New',monospace;letter-spacing:.14em;color:rgba(40,30,18,.5);text-transform:uppercase;text-align:right}
</style>
<div id="kx0701">
<canvas></canvas>
<div class="hint">tap the page to leave a trace</div>
<div class="ct"></div>
</div>
<script>
(function(){
var root=document.getElementById('kx0701'),cv=root.querySelector('canvas'),hint=root.querySelector('.hint'),ct=root.querySelector('.ct');
var H=520,W=root.clientWidth||800;
cv.width=W;cv.height=H;
var x=cv.getContext('2d');
var words=['observation','signal','thread','pattern','structure','lattice','order','threshold','emergence','trace','echo','seed','bond','facet','grain','fold','cluster','weight','form','memory'];
var nodes=[],edgeList=[],edgeSet={},triList=[],facets=0,wi=0,R=170;
function key(i,j){return i<j?i+'_'+j:j+'_'+i}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function place(px,py){
var n={x:px,y:py,w:words[wi%words.length]};wi++;
var idx=nodes.length,conns=[];
nodes.forEach(function(o,i){
if(dist(o,n)<R){edgeList.push([i,idx]);edgeSet[key(i,idx)]=1;conns.push(i)}
});
for(var a=0;a<conns.length;a++)for(var b=a+1;b<conns.length;b++)
if(edgeSet[key(conns[a],conns[b])]){triList.push([conns[a],conns[b],idx]);facets++}
nodes.push(n);
ct.textContent=nodes.length+' traces · '+facets+' crystallized';
hint.style.opacity=0;
}
function render(el){
x.clearRect(0,0,W,H);
triList.forEach(function(t,i){
var a=nodes[t[0]],b=nodes[t[1]],c=nodes[t[2]];
x.fillStyle='rgba(150,55,25,'+(.05+Math.sin(el*.6+i)*.02)+')';
x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(c.x,c.y);x.closePath();x.fill();
});
x.strokeStyle='rgba(40,30,20,.32)';x.lineWidth=1;
edgeList.forEach(function(e){
var a=nodes[e[0]],b=nodes[e[1]];
x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
});
nodes.forEach(function(n){
x.beginPath();x.fillStyle='#2a2015';x.arc(n.x,n.y,3,0,7);x.fill();
x.fillStyle='rgba(40,30,20,.68)';x.font='11px Georgia,serif';x.fillText(n.w,n.x+7,n.y-6);
});
}
root.addEventListener('click',function(e){
var r=root.getBoundingClientRect();
place(e.clientX-r.left,e.clientY-r.top);
});
[[.22,.3],[.5,.18],[.62,.42],[.4,.55]].forEach(function(p){place(p[0]*W,p[1]*H)});
var t0=null;
(function loop(ts){
if(t0===null)t0=ts;
render((ts-t0)/1000);
requestAnimationFrame(loop);
})();
})();
</script>
</section>
