<section data-date='2026-09-03' data-type='pulse'>
<style>#tp03 * { margin:0; padding:0; box-sizing:border-box; }#tp03 {position:relative; height:70vh; min-height:420px;background:#0b0c0e; color:#eae6df; overflow:hidden;font-family:Georgia,'Times New Roman',serif;cursor:none;}#tp03 .beam {position:absolute; left:0; right:0; top:50%; height:1px;background:linear-gradient(90deg,transparent,#8a8378,transparent);transform-origin:50% 50%;transition:transform .08s linear;}#tp03 .fulcrum {position:absolute; left:50%; top:50%; width:10px; height:10px;background:#eae6df; border-radius:1px;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 24px 2px rgba(234,230,223,.35);transition:box-shadow .2s ease;}#tp03 .half { position:absolute; top:0; bottom:0; width:50%;display:flex; align-items:center; letter-spacing:.04em;font-size:clamp(14px,2.4vw,22px); line-height:1.6;transition:opacity .25s ease, transform .08s linear;}#tp03 .am { left:0; justify-content:flex-end; text-align:right; padding-right:9%;color:#d7a86e; }#tp03 .pm { right:0; justify-content:flex-start; text-align:left; padding-left:9%;color:#8fa3c9; }#tp03 .hint {position:absolute; bottom:18px; left:50%; transform:translateX(-50%);font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.18em;text-transform:uppercase; color:#5c584f; user-select:none;}#tp03 .reading {position:absolute; top:16px; left:50%; transform:translateX(-50%);font-family:ui-monospace,monospace; font-size:11px; color:#8a8378;letter-spacing:.1em;}
</style>
<div id="tp03">
<div class="reading" id="tp03read">12:00 — even</div>
<div class="beam" id="tp03beam"></div>
<div class="fulcrum" id="tp03pivot"></div>
<div class="half am" id="tp03am">what the morning owed you</div>
<div class="half pm" id="tp03pm">what the evening forgives</div>
<div class="hint">move to tip the day &nbsp;·&nbsp; click to hold it level</div>
</div>
<script>(function(){var el = document.getElementById('tp03');var beam = document.getElementById('tp03beam');var pivot = document.getElementById('tp03pivot');var am = document.getElementById('tp03am');var pm = document.getElementById('tp03pm');var read = document.getElementById('tp03read');var amWords = ["what the morning owed you","the list, unread","coffee going cold","a door left ajar","the self that woke up trying"];var pmWords = ["what the evening forgives","the list, abandoned","coffee, forgotten","the door, closed","the self that's still here"];var locked = false, lockAngle = 0;function tilt(ratio){var angle = (ratio - 0.5) * 24;beam.style.transform = 'rotate(' + angle + 'deg)';var amOp = Math.max(.35, 1 - Math.max(0, ratio - 0.5) * 1.6);var pmOp = Math.max(.35, 1 - Math.max(0, 0.5 - ratio) * 1.6);am.style.opacity = amOp;pm.style.opacity = pmOp;am.style.transform = 'translateY(' + (angle * -1.2) + 'px)';pm.style.transform = 'translateY(' + (angle * 1.2) + 'px)';var idx = Math.min(amWords.length - 1, Math.floor(Math.abs(ratio - 0.5) * 2 * amWords.length));am.textContent = amWords[idx];pm.textContent = pmWords[idx];var hour = Math.round(ratio * 24);var label = Math.abs(ratio - 0.5) < 0.02 ? 'even' : (ratio < 0.5 ? 'tipping toward morning' : 'tipping toward evening');read.textContent = String(hour).padStart(2,'0') + ':00 — ' + label;pivot.style.boxShadow = '0 0 ' + (18 + Math.abs(angle) * 2) + 'px 2px rgba(234,230,223,' + (0.25 + Math.abs(angle)/48) + ')';}el.addEventListener('mousemove', function(e){if (locked) return;var r = el.getBoundingClientRect();tilt(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)));});el.addEventListener('mouseleave', function(){if (!locked) tilt(0.5);});el.addEventListener('click', function(){locked = !locked;el.style.cursor = locked ? 'pointer' : 'none';if (locked){read.textContent = '12:00 — held level, on purpose';tilt(0.5);}});tilt(0.5);})();
</script>
</section>
