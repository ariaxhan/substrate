<section data-date='2026-11-05' data-type='morning'>
<style>
#d{--x:50%;--h:.2;position:relative;height:100vh;overflow:hidden;cursor:pointer;font:italic 300 clamp(28px,6vw,64px)/1.3 Georgia,serif;color:#fff;
background:radial-gradient(circle at var(--x) calc(100% - var(--h)*70%),#fff6d8 0,#ffb27a calc(4% + var(--h)*18%),transparent calc(10% + var(--h)*50%)),linear-gradient(#0b0f2a,#3a2b5c calc(40% + var(--h)*20%),#e8876a 100%);transition:filter 2s}
#d i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;transition:opacity 1s}
#t{position:absolute;left:0;right:0;bottom:12%;text-align:center;mix-blend-mode:difference;letter-spacing:.2em;transition:opacity .8s,letter-spacing 1.2s}
#t:hover{letter-spacing:.35em}
#d small{position:absolute;top:4%;width:100%;text-align:center;font-size:12px;letter-spacing:.4em;opacity:.4;font-style:normal}
</style>
<div id=d><small>MOVE · THEN CLICK</small><p id=t>not yet</p></div>
<script>
(function(){
var d=document.getElementById('d'),t=document.getElementById('t'),w=['not yet','almost','a line of light','the page is empty','and so it is yours','begin'],n=0,s=[],h=.2;
for(var k=0;k<60;k++){var e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*60+'%';e.style.opacity=Math.random();d.appendChild(e);s.push(e)}
function set(v){h=Math.max(0,Math.min(1,v));d.style.setProperty('--h',h);s.forEach(function(e,i){e.style.opacity=Math.max(0,(1-h*1.4))*(i%5/5+.3)})}
d.onmousemove=function(e){d.style.setProperty('--x',e.clientX/innerWidth*100+'%');set(1-e.clientY/innerHeight)};
d.onclick=function(){n=(n+1)%w.length;t.style.opacity=0;setTimeout(function(){t.textContent=w[n];t.style.opacity=1},500);set(h+.12)};
set(.2);
})();
</script>
</section>
