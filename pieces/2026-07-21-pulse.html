<section data-date='2026-07-21' data-type='pulse'>
<style>
[data-date='2026-07-21'][data-type='pulse']{--tilt:0deg;position:relative;height:100vh;margin:0;overflow:hidden;background:linear-gradient(90deg,#e8985c 0%,#5b3a52 42%,#1c1f3d 58%,#0b0e2a 100%);font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
[data-date='2026-07-21'][data-type='pulse'] .stage{position:absolute;inset:0}
[data-date='2026-07-21'][data-type='pulse'] .axis{position:absolute;left:50%;top:50%;width:2px;height:38vh;background:rgba(255,255,255,.18);transform:translate(-50%,-100%)}
[data-date='2026-07-21'][data-type='pulse'] .beam{position:absolute;left:50%;top:50%;width:70vw;max-width:820px;height:1px;transform:translate(-50%,-50%) rotate(var(--tilt));transition:transform .08s linear;background:rgba(255,255,255,.5)}
[data-date='2026-07-21'][data-type='pulse'] .beam.locked{transition:transform 1.4s cubic-bezier(.16,1,.3,1)}
[data-date='2026-07-21'][data-type='pulse'] .w{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(14px,2.4vw,26px);letter-spacing:.12em;color:#f4f0ea;opacity:.85;user-select:none;white-space:nowrap}
[data-date='2026-07-21'][data-type='pulse'] .w.l{right:100%;margin-right:18px;font-style:italic}
[data-date='2026-07-21'][data-type='pulse'] .w.r{left:100%;margin-left:18px}
[data-date='2026-07-21'][data-type='pulse'] .fulcrum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid rgba(244,240,234,.9);filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
[data-date='2026-07-21'][data-type='pulse'] .word{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(20px,4vw,44px);color:#fff;letter-spacing:.3em;opacity:.9;user-select:none;text-align:center}
[data-date='2026-07-21'][data-type='pulse'] .hint{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:rgba(244,240,234,.4);font-style:italic;user-select:none}
[data-date='2026-07-21'][data-type='pulse'] .ripple{position:absolute;left:50%;top:50%;width:6px;height:6px;border:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%) scale(1);opacity:0;pointer-events:none}
[data-date='2026-07-21'][data-type='pulse'] .ripple.go{animation:pulse-ripple 1.4s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pulse-ripple{0%{opacity:.8;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(48)}}
</style>
<div class="stage">
  <div class="axis"></div>
  <div class="word" id="pw">halfway</div>
  <div class="beam" id="beam">
    <span class="w l">before</span>
    <span class="fulcrum"></span>
    <span class="w r">after</span>
  </div>
  <div class="ripple" id="ripple"></div>
  <div class="hint">tilt · click to still</div>
</div>
<script>
(function(){
  var root=document.currentScript.closest("section");
  var beam=root.querySelector('#beam'), ripple=root.querySelector('#ripple'), pw=root.querySelector('#pw');
  var locked=false;
  function onMove(e){
    if(locked) return;
    var r=root.getBoundingClientRect();
    var dx=(e.clientX-r.left-r.width/2)/(r.width/2);
    dx=Math.max(-1,Math.min(1,dx));
    root.style.setProperty('--tilt',(dx*13)+'deg');
    pw.style.opacity=(0.9-Math.abs(dx)*0.5).toFixed(2);
    pw.style.letterSpacing=(0.3+Math.abs(dx)*0.25)+'em';
  }
  root.addEventListener('mousemove',onMove);
  root.addEventListener('touchmove',function(e){
    if(e.touches&&e.touches[0]) onMove(e.touches[0]);
  });
  root.addEventListener('click',function(){
    locked=!locked;
    beam.classList.toggle('locked',locked);
    if(locked){
      root.style.setProperty('--tilt','0deg');
      pw.style.transition='opacity 1.2s, letter-spacing 1.2s';
      pw.style.opacity='1';
      pw.style.letterSpacing='.5em';
      ripple.classList.remove('go');
      void ripple.offsetWidth;
      ripple.classList.add('go');
    } else {
      pw.style.transition='';
    }
  });
})();
</script>
</section>
