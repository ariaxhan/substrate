<section data-date='2026-11-25' data-type='spark'>
<style>
.cx{position:relative;height:100vh;min-height:360px;overflow:hidden;background:#080610;cursor:crosshair;font-family:Georgia,serif}
.cx canvas{position:absolute;inset:0;width:100%;height:100%}
.cx p{position:absolute;left:0;right:0;bottom:6%;margin:0;text-align:center;font-style:italic;font-size:clamp(11px,1.6vw,16px);letter-spacing:.35em;color:#8a85a0;pointer-events:none}
</style>
<div class="cx"><canvas></canvas><p>lower your hand. or click.</p></div>
<script>
(()=>{
const w=document.currentScript.parentNode,c=w.querySelector('canvas'),x=c.getContext('2d'),q=w.querySelector('p');
const P=[['night','day','dusk'],['fire','water','steam'],['I','you','we'],['then','now','again'],['wave','particle','light'],['salt','sweet','tide'],['stone','seed','garden']];
let W,H,i=0,d=.5,mx=.5,my=.3,rush=0,hold=0,S=[];
function R(){W=c.width=c.clientWidth;H=c.height=c.clientHeight}
R();addEventListener('resize',R);
w.onmousemove=e=>{const r=w.getBoundingClientRect();mx=(e.clientX-r.left)/r.width;my=(e.clientY-r.top)/r.height};
w.onclick=()=>{rush=1};
function boom(X,Y){for(let k=0;k<90;k++){const a=Math.random()*6.28,s=1+Math.random()*7;S.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:k%2?'#4df':'#f84'})}}
function f(){
x.globalCompositeOperation='source-over';x.fillStyle='rgba(8,6,16,.2)';x.fillRect(0,0,W,H);
const p=P[i%P.length],fs=Math.min(W/8,72),cx=Math.max(.2,Math.min(.8,mx))*W,cy=H*.45;
x.font='italic '+fs+'px Georgia';x.textBaseline='middle';
x.globalCompositeOperation='lighter';
if(!hold){
 const t=rush?0:Math.max(0,(1-my)*.5-.05);
 d+=(t-d)*(rush?.1:.05);
 const g=d*W*.5,ax=cx-g,bx=cx+g,
  near=1-Math.min(1,g/(W*.3));
 x.textAlign='right';x.fillStyle='#4df';x.fillText(p[0],ax,cy);
 x.textAlign='left';x.fillStyle='#f84';x.fillText(p[1],bx,cy);
 x.lineWidth=1+near*5;x.strokeStyle='rgba(255,255,255,'+(.1+near*.6)+')';
 x.beginPath();x.moveTo(ax+4,cy);
 for(let k=1;k<12;k++)x.lineTo(ax+(bx-ax)*k/12,cy+Math.sin(k+performance.now()/90)*near*fs*.3);
 x.lineTo(bx-4,cy);x.stroke();
 if(g<3){hold=170;boom(cx,cy);q.textContent=p[0]+' + '+p[1]+' = '+p[2]}
}else{
 hold--;
 const m=p[2],n=m.length;x.textAlign='center';
 const cw=x.measureText(m).width/n;
 for(let k=0;k<n;k++){x.fillStyle=k%2?'#f84':'#4df';x.fillText(m[k],cx-cw*n/2+cw*(k+.5)+Math.sin(hold/9+k)*4,cy)}
 x.fillStyle='rgba(255,255,255,.5)';x.fillText(m,cx,cy);
 if(!hold){i++;d=.5;rush=0;q.textContent='lower your hand. or click.'}
}
for(const s of S){s.x+=s.vx;s.y+=s.vy;s.vx*=.95;s.vy*=.95;s.l-=.02;x.globalAlpha=Math.max(0,s.l);x.fillStyle=s.c;x.fillRect(s.x,s.y,2.5,2.5)}
x.globalAlpha=1;S=S.filter(s=>s.l>0);
requestAnimationFrame(f)}
f();
})();
</script>
</section>
