<section data-date='2026-07-13' data-type='morning'>
<style>
#taper-2026-07-13-morning{margin:0;height:70vh;min-height:420px;overflow:hidden;position:relative;background:#0a0e1a;cursor:crosshair;font-family:Georgia,'Times New Roman',serif}
#taper-2026-07-13-morning .sky{position:absolute;inset:0;transition:background 1.4s ease}
#taper-2026-07-13-morning .sun{position:absolute;left:50%;width:26px;height:26px;border-radius:50%;background:#fff8e0;box-shadow:0 0 40px 12px rgba(255,214,140,.55);transform:translate(-50%,50%);transition:bottom 1.6s cubic-bezier(.2,.7,.3,1),box-shadow 1.6s ease,background 1.6s ease;bottom:-30px}
#taper-2026-07-13-morning .horizon{position:absolute;left:0;right:0;bottom:38%;height:1px;background:rgba(255,255,255,.18)}
#taper-2026-07-13-morning .words{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:.4em .6em;padding:0 8vw 8vh;pointer-events:none}
#taper-2026-07-13-morning .w{opacity:0;font-style:italic;letter-spacing:.02em;color:#fef3d8;text-shadow:0 0 18px rgba(255,220,160,.5);transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease;font-size:clamp(1rem,2.4vw,1.7rem)}
#taper-2026-07-13-morning .w.on{opacity:.92;transform:translateY(0)}
#taper-2026-07-13-morning .hint{position:absolute;top:16px;left:20px;right:20px;color:rgba(255,255,255,.35);font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
#taper-2026-07-13-morning .count{position:absolute;bottom:14px;right:20px;color:rgba(255,255,255,.28);font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:.08em;pointer-events:none}
</style>
<div id="taper-2026-07-13-morning">
  <div class="sky"></div>
  <div class="horizon"></div>
  <div class="sun"></div>
  <div class="words" id="tw13words"></div>
  <div class="hint">the day has not chosen its first word yet</div>
  <div class="count" id="tw13count"></div>
</div>
<script>
(function(){
  var root=document.getElementById('taper-2026-07-13-morning');
  if(!root||root.dataset.tw13init)return;root.dataset.tw13init='1';
  var sky=root.querySelector('.sky'),sun=root.querySelector('.sun'),
      wrap=document.getElementById('tw13words'),count=document.getElementById('tw13count');
  var lex=['light','maybe','not yet','soon','open','still','first','quiet','begin','wait','almost','wake','edge','again','unsaid','early','possible','turning','clear','rise'];
  var stages=[
    ['#0a0e1a 0%,#141c33 60%,#1c2748 100%',-30,'#fff8e0','0 0 40px 12px rgba(255,214,140,.55)'],
    ['#141c33 0%,#2a2f5c 45%,#5b4a7a 100%',8,'#ffe9c4','0 0 60px 20px rgba(255,190,140,.6)'],
    ['#3a2f56 0%,#7a4a68 45%,#c97b60 100%',44,'#ffd9a0','0 0 90px 30px rgba(255,170,110,.7)'],
    ['#5b3a5a 0%,#c9666a 45%,#f0a05c 100%',80,'#ffcf8c','0 0 120px 40px rgba(255,150,90,.75)'],
    ['#3d6bb0 0%,#89bce0 55%,#ffe1a8 100%',150,'#fff6d8','0 0 160px 60px rgba(255,220,150,.55)']
  ];
  var n=0,max=stages.length-1;
  function paint(i){
    var s=stages[i];
    sky.style.background='linear-gradient(to bottom,'+s[0]+')';
    sun.style.bottom=s[1]+'px';
    sun.style.background=s[2];
    sun.style.boxShadow=s[3];
  }
  function addWord(){
    var t=lex[Math.floor(Math.random()*lex.length)];
    var el=document.createElement('span');
    el.className='w';
    el.textContent=t;
    wrap.appendChild(el);
    requestAnimationFrame(function(){el.classList.add('on')});
    var kids=wrap.children;
    if(kids.length>7)wrap.removeChild(kids[0]);
  }
  paint(0);
  root.addEventListener('click',function(){
    if(n<max)n++;
    paint(n);
    addWord();
    count.textContent=n>=max?'the day is written':(n+' word'+(n===1?'':'s')+' toward light');
  });
  root.addEventListener('mousemove',function(e){
    var r=root.getBoundingClientRect();
    var x=((e.clientX-r.left)/r.width-.5)*10;
    sun.style.marginLeft=x+'px';
  });
})();
</script>
</section>
