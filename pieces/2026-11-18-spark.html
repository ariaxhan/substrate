<section data-date='2026-11-18' data-type='spark'>
<style>
#c{background:#0b0a10;display:block;width:100%;height:100vh;cursor:crosshair}
#t{position:absolute;left:16px;bottom:12px;font:12px Georgia,serif;color:#8a86a0;letter-spacing:.2em;pointer-events:none}
</style>
<canvas id=c></canvas><div id=t>two words, one meeting — move to collide</div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,m={x:0,y:0,on:0};
function R(){W=c.width=c.clientWidth;H=c.height=c.clientHeight}R();onresize=R;
var A='I you we hand sea salt ash seed light'.split(' '),B='other mine us hold tide ember root dark'.split(' ');
var P=[],S=[];
function mk(i,s){return{w:(s?A:B)[i%9],x:s?-40:W+40,y:H*(.15+.7*Math.random()),vx:(s?1:-1)*(.6+Math.random()*.8),vy:0,s:s,d:0}}
for(var i=0;i<14;i++){var p=mk(i,i%2);p.x=Math.random()*W;P.push(p)}
c.onmousemove=function(e){m.x=e.offsetX;m.y=e.offsetY;m.on=1};
c.onclick=function(e){P.push(mk(P.length,1),mk(P.length+1,0));P[P.length-2].y=P[P.length-1].y=e.offsetY};
function f(){
x.fillStyle='rgba(11,10,16,.2)';x.fillRect(0,0,W,H);
x.font='italic 18px Georgia';
P.forEach(function(p){
if(m.on){var dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy)+1;if(d<200){p.vx+=dx/d*.05;p.vy+=dy/d*.05}}
p.vy*=.98;p.x+=p.vx;p.y+=p.vy;
if(p.x<-80||p.x>W+80){p.x=p.s?-40:W+40;p.vx=(p.s?1:-1)*(.6+Math.random())}
if(p.y<20||p.y>H-20)p.vy*=-1;
x.fillStyle=p.s?'#f2a65a':'#5ac8d8';x.fillText(p.w,p.x,p.y)});
for(var i=0;i<P.length;i++)for(var j=i+1;j<P.length;j++){var a=P[i],b=P[j];
if(a.s!=b.s&&Math.hypot(a.x-b.x,a.y-b.y)<38){
S.push({t:a.w.slice(0,2)+b.w.slice(-2),x:(a.x+b.x)/2,y:(a.y+b.y)/2,l:1});
for(var k=0;k<8;k++)S.push({q:1,x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:Math.random()*4-2,vy:Math.random()*4-2,l:1});
var t=a.vx;a.vx=-b.vx;b.vx=-t;a.x+=a.vx*6;b.x+=b.vx*6}}
S=S.filter(function(s){s.l-=.012;if(s.q){s.x+=s.vx;s.y+=s.vy;x.fillStyle='rgba(240,240,220,'+s.l+')';x.fillRect(s.x,s.y,2,2)}else{x.fillStyle='rgba(255,255,255,'+s.l+')';x.font='bold '+(16+(1-s.l)*20)+'px Georgia';x.fillText(s.t,s.x-14,s.y-(1-s.l)*30)}return s.l>0});
requestAnimationFrame(f)}
f()})();
</script>
