<section data-date='2026-11-17' data-type='digest'>
<style>
#k{position:relative;background:#efe8d8;height:100vh;overflow:hidden;font:italic 14px Georgia,serif;color:#2b2622;cursor:crosshair}
#k canvas{position:absolute;inset:0}
#k p{position:absolute;left:24px;bottom:18px;margin:0;letter-spacing:.08em;opacity:.6;pointer-events:none}
</style>
<div id="k"><canvas></canvas><p id="t">scattered. touch anywhere.</p></div>
<script>
(()=>{
const k=document.getElementById('k'),c=k.querySelector('canvas'),x=c.getContext('2d'),t=document.getElementById('t');
const W=['pattern','edge','held','signal','kin','knot','grain','lattice','known','seam'];
let w,h,P=[],T=[],R=130,m=null;
const rs=()=>{w=c.width=k.clientWidth;h=c.height=k.clientHeight};rs();onresize=rs;
const add=(a,b)=>{
 const n={x:a,y:b,r:0,v:Math.random()*6.28};
 const N=P.filter(p=>Math.hypot(p.x-a,p.y-b)<R);
 P.push(n);
 N.forEach((p,i)=>N.slice(i+1).forEach(q=>{
  if(Math.hypot(p.x-q.x,p.y-q.y)<R)T.push({a:n,b:p,c:q,s:0,w:W[T.length%W.length]})}));
 t.textContent=P.length+' points · '+T.length+(T.length?' structures — '+W[(T.length-1)%W.length]:' structures');
};
for(let i=0;i<14;i++)add(Math.random()*w,Math.random()*h);
k.onclick=e=>add(e.offsetX,e.offsetY);
k.onmousemove=e=>m={x:e.offsetX,y:e.offsetY};
k.onmouseleave=()=>m=null;
(function f(){
 x.clearRect(0,0,w,h);
 T.forEach(q=>{q.s+=(1-q.s)*.03;
  x.fillStyle='rgba(120,70,40,'+.14*q.s+')';
  x.beginPath();x.moveTo(q.a.x,q.a.y);x.lineTo(q.b.x,q.b.y);x.lineTo(q.c.x,q.c.y);x.fill();
  if(m){const cx=(q.a.x+q.b.x+q.c.x)/3,cy=(q.a.y+q.b.y+q.c.y)/3;
   if(Math.hypot(cx-m.x,cy-m.y)<70){x.fillStyle='#2b2622';x.fillText(q.w,cx-14,cy)}}});
 P.forEach((p,i)=>{
  p.r+=(4-p.r)*.08;
  P.slice(i+1).forEach(q=>{const d=Math.hypot(p.x-q.x,p.y-q.y);
   if(d<R){x.strokeStyle='rgba(43,38,34,'+(1-d/R)*.7+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}});
  x.fillStyle='#2b2622';x.beginPath();x.arc(p.x+Math.sin(p.v+=.01)*.6,p.y,p.r,0,6.28);x.fill()});
 if(m)P.forEach(p=>{const d=Math.hypot(p.x-m.x,p.y-m.y);
  if(d<R){x.strokeStyle='rgba(160,60,30,'+(1-d/R)*.6+')';x.beginPath();x.moveTo(m.x,m.y);x.lineTo(p.x,p.y);x.stroke()}});
 requestAnimationFrame(f)})();
})();
</script>
</section>
