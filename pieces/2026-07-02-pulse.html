<!doctype html>
<html>
<head><meta charset='utf-8'><title>meridian</title></head>
<body>
<section data-date='2026-07-02' data-type='pulse'>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060d;font-family:'Courier New',monospace}
#stage{position:fixed;inset:0;cursor:ew-resize}
#night{position:absolute;inset:0;background:linear-gradient(160deg,#05060d,#12142b 55%,#1c1033)}
#day{position:absolute;top:0;bottom:0;left:0;width:50%;background:linear-gradient(200deg,#ffe9b8,#ffab5e 55%,#ff6f3c);box-shadow:4px 0 60px rgba(255,140,60,.45)}
#seam{position:absolute;top:0;bottom:0;width:1px;left:50%;background:rgba(255,255,255,.55);transform:translateX(-50%)}
#word{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(1.3rem,4vw,3rem);color:#fff;letter-spacing:.05em;mix-blend-mode:difference;white-space:nowrap;pointer-events:none;opacity:.3}
#read{position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:.28em;color:rgba(255,255,255,.6);white-space:nowrap}
</style>
<div id="stage">
<div id="night"></div>
<div id="day"></div>
<div id="seam"></div>
<div id="word">equilibrium</div>
<div id="read"></div>
</div>
<script>
const day=document.getElementById('day'),seam=document.getElementById('seam'),word=document.getElementById('word'),read=document.getElementById('read'),stage=document.getElementById('stage');
function fracNow(){const d=new Date();return (d.getHours()+d.getMinutes()/60+d.getSeconds()/3600)/24}
let disp=fracNow(),dragging=false,target=disp;
function fmt(n){return n<10?'0'+n:''+n}
function render(){
  const pct=(disp*100).toFixed(3)+'%';
  day.style.width=pct;seam.style.left=pct;
  const now=fracNow(),offset=(disp-now)*24,close=Math.max(0,1-Math.abs(offset)/3);
  word.style.opacity=(0.15+0.85*close).toFixed(3);
  word.style.textShadow='0 0 '+(close*40).toFixed(0)+'px rgba(255,255,255,'+(close*0.9).toFixed(2)+')';
  word.style.transform='translate(-50%,-50%) scale('+(1+close*0.08).toFixed(3)+')';
  const d=new Date();
  read.textContent=fmt(d.getHours())+':'+fmt(d.getMinutes())+':'+fmt(d.getSeconds())+'  ·  '+(Math.abs(offset)<0.05?'equilibrium':(offset>0?'+':'')+offset.toFixed(2)+'h')
}
function loop(){
  if(dragging){disp=target}else{disp+=(fracNow()-disp)*0.04}
  render();requestAnimationFrame(loop)
}
function setTarget(x){target=Math.min(1,Math.max(0,x/window.innerWidth))}
stage.addEventListener('mousemove',e=>{dragging=true;setTarget(e.clientX)});
stage.addEventListener('mouseleave',()=>{dragging=false});
stage.addEventListener('touchmove',e=>{dragging=true;setTarget(e.touches[0].clientX)},{passive:true});
stage.addEventListener('touchend',()=>{dragging=false});
loop();
</script>
</section>
</body>
</html>
