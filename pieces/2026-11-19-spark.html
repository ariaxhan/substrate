<section data-date='2026-11-19' data-type='spark'>
<style>
#s{position:relative;background:#07060a;height:420px;overflow:hidden;cursor:crosshair;font:italic 13px Georgia,serif;color:#9a8fa8}
#s canvas{display:block;width:100%;height:100%}
#s p{position:absolute;left:0;right:0;bottom:12px;margin:0;text-align:center;letter-spacing:.2em;transition:color .4s}
</style>
<div id="s"><canvas></canvas><p id="t">two things, apart</p></div>
<script>
(function(){
var s=document.getElementById('s'),c=s.firstChild,x=c.getContext('2d'),t=document.getElementById('t'),
W,H,m={x:0,y:0},a={x:0,y:0,vx:0,vy:0},b={x:0,y:0},P=[],k=0,
words=['two things, apart','approaching','contact','heat','a third thing','synthesis'];
function R(){W=c.width=s.clientWidth;H=c.height=s.clientHeight;a.x=W*.2;a.y=H/2;m.x=W*.8;m.y=H/2;b.x=m.x;b.y=m.y}
R();addEventListener('resize',R);
s.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top});
function boom(X,Y,n){for(var i=0;i<n;i++){var q=Math.random()*6.283,v=Math.random()*3+.5;
P.push({x:X,y:Y,vx:Math.cos(q)*v,vy:Math.sin(q)*v,l:1,h:Math.random()<.5?28:195})}}
s.addEventListener('click',function(e){boom(m.x,m.y,60)});
function dot(o,col,r){x.fillStyle=col;x.beginPath();x.arc(o.x,o.y,r,0,7);x.fill()}
function f(){
x.globalCompositeOperation='source-over';x.fillStyle='rgba(7,6,10,.14)';x.fillRect(0,0,W,H);
b.x+=(m.x-b.x)*.12;b.y+=(m.y-b.y)*.12;
var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)+.1;
a.vx+=dx/d*.35;a.vy+=dy/d*.35;a.vx*=.96;a.vy*=.96;a.x+=a.vx;a.y+=a.vy;
x.globalCompositeOperation='lighter';
dot(a,'hsl(28,95%,55%)',14);dot(b,'hsl(195,90%,55%)',14);
if(d<28){boom((a.x+b.x)/2,(a.y+b.y)/2,6);k=Math.min(k+1,5);
a.vx=-a.vx*1.3;a.vy=-a.vy*1.3;
x.fillStyle='hsl(300,80%,70%)';x.beginPath();x.arc((a.x+b.x)/2,(a.y+b.y)/2,26,0,7);x.fill()}
else k=d<140?2:d<260?1:0;
t.textContent=words[k];t.style.color=k>3?'#e9c6ff':'#9a8fa8';
for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.l-=.012;
if(p.l<=0){P.splice(i,1);continue}
x.fillStyle='hsl('+(p.h+(300-p.h)*(1-p.l)*.8)+',90%,'+(35+p.l*30)+'%)';
x.fillRect(p.x,p.y,2.5,2.5)}
requestAnimationFrame(f)}
f();
})();
</script>
</section>
