<section data-date='2026-07-04' data-type='spark'>
<style>
#sy0704{position:relative;width:100%;height:70vh;min-height:440px;background:#07080d;overflow:hidden;cursor:pointer;font-family:Georgia,serif}
#sy0704 .circ{position:absolute;top:50%;left:50%;border-radius:50%;transform:translate(-50%,-50%)}
#sy0704 .a{background:radial-gradient(circle at 40% 35%,rgba(90,170,255,.6),rgba(60,110,230,.32) 70%,transparent 75%)}
#sy0704 .b{background:radial-gradient(circle at 60% 40%,rgba(255,150,70,.6),rgba(230,90,50,.32) 70%,transparent 75%)}
#sy0704 .lbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.85rem;letter-spacing:.08em;color:#eeeeeecc;pointer-events:none;white-space:nowrap}
#sy0704 .fuse{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);font-size:1.5rem;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.55);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .5s,transform .5s}
#sy0704 .ring{position:absolute;top:50%;left:50%;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:.8;pointer-events:none}
#sy0704 .hint{position:absolute;bottom:10px;left:14px;font:.65rem/1.4 -apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#666;pointer-events:none}
@keyframes sy0704r{to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
</style>
<div id="sy0704">
<div class="circ a" id="syA"><div class="lbl">here</div></div>
<div class="circ b" id="syB"><div class="lbl" id="syBl">there</div></div>
<div class="fuse" id="syF"></div>
<div class="hint">move to close the distance &middot; click when they meet</div>
</div>
<script>
(function(){
var st=document.getElementById('sy0704'),A=document.getElementById('syA'),B=document.getElementById('syB'),Bl=document.getElementById('syBl'),F=document.getElementById('syF');
var words=['there','elsewhere','away','apart'],merges=['together','nowhere else','arrived','whole'],wi=0;
Bl.textContent=words[wi];
var R=140,ax=0,ay=0,bx=0,by=0,mx=0,my=0,t=0,has=false;
function resize(){
  var w=st.clientWidth,h=st.clientHeight;
  R=Math.max(90,Math.min(200,Math.min(w,h)*0.32));
  A.style.width=A.style.height=B.style.width=B.style.height=(R*2)+'px';
  mx=ax=w*0.35;my=ay=h*0.5;bx=w*0.65;by=h*0.5;
}
st.addEventListener('mousemove',function(e){var r=st.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;has=true});
st.addEventListener('mouseleave',function(){has=false});
window.addEventListener('resize',resize);
resize();
function tick(){
  t+=0.008;
  if(has){ax+=(mx-ax)*0.08;ay+=(my-ay)*0.08}
  var w=st.clientWidth,h=st.clientHeight;
  bx=w*0.5+Math.cos(t)*w*0.22;by=h*0.5+Math.sin(t*1.3)*h*0.22;
  A.style.left=ax+'px';A.style.top=ay+'px';
  B.style.left=bx+'px';B.style.top=by+'px';
  F.style.left=((ax+bx)/2)+'px';F.style.top=((ay+by)/2)+'px';
  var d=Math.hypot(ax-bx,ay-by);
  st._ov=Math.max(0,Math.min(1,1-d/(R*1.7)));
  requestAnimationFrame(tick);
}
tick();
st.addEventListener('click',function(){
  var ov=st._ov||0;
  if(ov<0.45)return;
  var word=merges[wi];
  F.textContent=word;
  F.style.opacity=1;F.style.transform='translate(-50%,-50%) scale(1)';
  var ring=document.createElement('div');
  ring.className='ring';
  var size=R*2;
  ring.style.width=size+'px';ring.style.height=size+'px';
  ring.style.left=((ax+bx)/2)+'px';ring.style.top=((ay+by)/2)+'px';
  ring.style.animation='sy0704r 1s ease-out forwards';
  st.appendChild(ring);
  setTimeout(function(){ring.remove()},1050);
  setTimeout(function(){F.style.opacity=0;F.style.transform='translate(-50%,-50%) scale(.6)'},1400);
  wi=(wi+1)%words.length;
  Bl.textContent=words[wi];
});
})();
</script>
</section>
