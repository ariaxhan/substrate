<section data-date='2026-10-16' data-type='morning'>
<style>
#d{position:relative;height:100vh;overflow:hidden;cursor:crosshair;font:italic 5vmin/1.3 Georgia,serif;color:#fff;
--x:50%;--h:.15;background:radial-gradient(circle at var(--x) calc(100% - var(--h)*70%),#fff6d8 0,#ffc47a calc(4% + var(--h)*10%),#e87a6a calc(20% + var(--h)*30%),#4a3a6e calc(55% + var(--h)*30%),#0c0a1c 100%)}
#d p{position:absolute;left:0;right:0;bottom:6vh;text-align:center;margin:0;opacity:calc(1 - var(--h)*1.2);letter-spacing:.3em;font-size:2.4vmin;transition:opacity .4s}
#d b{position:absolute;font-weight:400;pointer-events:none;animation:r 6s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes r{0%{opacity:0;filter:blur(8px)}20%{opacity:1;filter:blur(0)}100%{opacity:0;transform:translate(-50%,-300%)}}
#d:before{content:"";position:absolute;left:0;right:0;bottom:0;height:12vh;background:#0c0a1c;clip-path:polygon(0 60%,15% 30%,30% 55%,48% 20%,66% 50%,82% 25%,100% 55%,100% 100%,0 100%)}
</style>
<div id=d><p>not yet written</p></div>
<script>
const d=document.getElementById('d'),W='begin,again,light,open,hello,now,rise,one,warm,yes,unwritten,wake'.split(',');let i=0;
d.onmousemove=e=>{d.style.setProperty('--x',e.clientX/innerWidth*100+'%');d.style.setProperty('--h',(1-e.clientY/innerHeight).toFixed(3))};
d.onclick=e=>{const b=document.createElement('b');b.textContent=W[i++%W.length];b.style.left=e.clientX+'px';b.style.top=e.clientY+'px';d.appendChild(b);setTimeout(()=>b.remove(),6e3)};
</script>
</section>
