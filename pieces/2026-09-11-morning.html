<section data-date='2026-09-11' data-type='morning'>
<style>
.taper-2026-09-11-morning{margin:0;overflow:hidden;height:70vh;min-height:420px;position:relative;background:#0b0e14;font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
.taper-2026-09-11-morning .sky{position:absolute;inset:0;background:linear-gradient(to bottom,#0b0e14 0%,#0b0e14 40%,#1a1f2e 60%,#3a2f3a 78%,#6b3f4a 90%,#a85a4a 100%);transition:background .6s ease}
.taper-2026-09-11-morning .sun{position:absolute;left:50%;bottom:-40px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#ffcf7a 60%,transparent 75%);transform:translateX(-50%);opacity:.15;transition:opacity .4s,bottom .4s}
.taper-2026-09-11-morning .line{position:absolute;left:0;right:0;height:1px;background:rgba(255,220,180,.5);transition:top .15s ease-out}
.taper-2026-09-11-morning .word{position:absolute;color:#e8dcc8;font-style:italic;font-size:14px;letter-spacing:.06em;opacity:0;transform:translateY(6px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none;white-space:nowrap}
.taper-2026-09-11-morning .word.show{opacity:.85;transform:translateY(0)}
.taper-2026-09-11-morning .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#665;font-size:11px;font-family:sans-serif;letter-spacing:.15em;text-transform:uppercase;opacity:.5}
</style>
<div class="taper-2026-09-11-morning" id="t20260911m">
  <div class="sky"></div>
  <div class="sun" id="t-sun"></div>
  <div class="line" id="t-line"></div>
  <div class="hint">move to bring light — click to write</div>
</div>
<script>
(function(){
  var root=document.getElementById('t20260911m');
  var sun=document.getElementById('t-sun');
  var line=document.getElementById('t-line');
  var words=['still','maybe','open','unwritten','first','begin','soft','again','wait','light','before','breath','someday','now','early','possible','quiet','yours'];
  var used=0;
  function place(e){
    var r=root.getBoundingClientRect();
    var y=(e.clientY-r.top)/r.height;
    y=Math.max(0,Math.min(1,y));
    var pct=(1-y)*100;
    sun.style.opacity=(0.15+ (1-y)*0.7).toFixed(2);
    sun.style.bottom=(-40+y*(r.height*0.55))+'px';
    line.style.top=(y*r.height)+'px';
  }
  root.addEventListener('mousemove',place);
  root.addEventListener('click',function(e){
    if(used>=words.length) return;
    var r=root.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    var w=document.createElement('div');
    w.className='word';
    w.textContent=words[used++];
    w.style.left=Math.max(4,Math.min(r.width-100,x-30))+'px';
    w.style.top=Math.max(4,y-20)+'px';
    root.appendChild(w);
    requestAnimationFrame(function(){w.classList.add('show');});
    setTimeout(function(){w.style.opacity='0';},6000);
  });
})();
</script>
</section>
