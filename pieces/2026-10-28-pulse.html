<section data-date='2026-10-28' data-type='pulse'>
<style>
.hw{position:relative;height:100vh;margin:0;overflow:hidden;background:#111}
.hw canvas{display:block;width:100%;height:100%;cursor:crosshair}
</style>
<div class="hw"><canvas id="hw"></canvas></div>
<script>
(()=>{
const c=document.getElementById('hw'),x=c.getContext('2d');
let W,H,a=0,t=0,tx=null,f=1,P=[],n=0,lvl=0;
const rs=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight};
rs();onresize=rs;
c.onmousemove=e=>{const r=c.getBoundingClientRect();tx=(e.clientX-r.left)/W-.5;
 lvl=Math.hypot(e.clientX-r.left-W/2,e.clientY-r.top-H*.62)<40?lvl+1:0};
c.onmouseleave=()=>tx=null;
c.onclick=()=>{f=-f;P.forEach(p=>p.u=-p.u)};
const L=()=>Math.min(W,H*1.3)*.42;
function draw(){
 t+=.01;n++;
 const g=tx==null?Math.sin(t*.7)*.12:tx*.5*f;
 a+=(g-a)*.05;
 const cy=H*.62,l=L();
 const gr=x.createLinearGradient(0,0,W,0);
 gr.addColorStop(0,f>0?'#f3e7cf':'#1b2140');gr.addColorStop(.5,'#8d8a96');
 gr.addColorStop(1,f>0?'#1b2140':'#f3e7cf');
 x.fillStyle=gr;x.fillRect(0,0,W,H);
 if(n%4==0)P.push({u:Math.random()<.5?-1:1,s:Math.random()*.9+.1,v:0,r:2+Math.random()*3});
 const cs=Math.cos(a),sn=Math.sin(a);
 P=P.filter(p=>{
  p.s+=p.v;p.v+=Math.sin(a)*p.u*-.0006*(p.u*f>0?1:1)+ -sn*.0005;
  p.v*=.985;p.s=Math.max(-1,Math.min(1,p.s));
  const px=W/2+cs*l*p.s,py=cy+sn*l*p.s-p.r-5;
  x.fillStyle=p.u>0?'#f3e7cf':'#1b2140';
  if(p.u*f<0)x.fillStyle=p.u>0?'#1b2140':'#f3e7cf';
  x.strokeStyle='#0006';x.beginPath();x.arc(px,py,p.r,0,7);x.fill();x.stroke();
  return P.length<260||Math.random()<.97;
 });
 x.strokeStyle='#111';x.lineWidth=4;x.beginPath();
 x.moveTo(W/2-cs*l,cy-sn*l);x.lineTo(W/2+cs*l,cy+sn*l);x.stroke();
 x.fillStyle='#111';x.beginPath();x.moveTo(W/2,cy);x.lineTo(W/2-18,cy+60);x.lineTo(W/2+18,cy+60);x.fill();
 const eq=Math.abs(a)<.015;
 x.textAlign='center';x.fillStyle='#111';
 x.font='italic '+Math.max(18,W/28)+'px Georgia,serif';
 x.globalAlpha=.55+.3*Math.sin(t*2);
 x.fillText(eq?'here':'halfway',W/2,H*.2);
 x.globalAlpha=1;
 if(lvl>25&&eq){x.font='italic '+W/9+'px Georgia,serif';x.globalAlpha=Math.min(1,(lvl-25)/60);
  x.fillStyle='#f3e7cf';x.fillText('noon',W/2,H*.45);x.globalAlpha=1}
 requestAnimationFrame(draw)}
draw()})();
</script>
</section>
