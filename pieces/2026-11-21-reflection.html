<section data-date='2026-11-21' data-type='reflection'>
<style>
#nt{position:relative;height:100vh;min-height:360px;background:radial-gradient(ellipse at 50% 120%,#2a2347,#0b0d1c 60%,#04050c);overflow:hidden;cursor:crosshair;font:italic 300 1.1rem Georgia,serif;color:#cfd3ee}
#nt canvas{position:absolute;inset:0;width:100%;height:100%}
#nt p{position:absolute;left:0;right:0;bottom:12%;margin:0;text-align:center;letter-spacing:.3em;opacity:.5;animation:b 6s ease-in-out infinite;pointer-events:none}
#nt b{position:absolute;font-weight:300;pointer-events:none;transform:translate(-50%,-150%);animation:w 5s forwards;white-space:nowrap}
@keyframes b{50%{opacity:.15}}
@keyframes w{0%{opacity:0;filter:blur(6px)}25%{opacity:.9;filter:none}100%{opacity:0;transform:translate(-50%,-260%)}}
</style>
<div id="nt"><canvas></canvas><p>the day is complete</p></div>
<script>
(()=>{
const r=document.getElementById('nt'),c=r.querySelector('canvas'),x=c.getContext('2d'),
W=['rest','enough','held','done','soft','still','begin again','breathe','kept','dusk'],
S=[],m={x:-9,y:-9};
let w,h,n=0;
const f=()=>{w=c.width=r.clientWidth;h=c.height=r.clientHeight},
a=(X,Y,s)=>S.push({x:X,y:Y,s:s||Math.random()*1.2+.4,p:Math.random()*6});
f();addEventListener('resize',f);
for(let i=0;i<40;i++)a(Math.random()*w,Math.random()*h*.8);
r.onmousemove=e=>{const b=r.getBoundingClientRect();m.x=e.clientX-b.left;m.y=e.clientY-b.top};
r.onmouseleave=()=>m.x=-9;
r.onclick=e=>{const b=r.getBoundingClientRect(),X=e.clientX-b.left,Y=e.clientY-b.top,
t=document.createElement('b');a(X,Y,2.6);t.textContent=W[n++%W.length];
t.style.left=X+'px';t.style.top=Y+'px';r.appendChild(t);setTimeout(()=>t.remove(),5000)};
(function d(t){
x.clearRect(0,0,w,h);
S.forEach(s=>{
const k=.55+.45*Math.sin(t/900+s.p),g=Math.hypot(s.x-m.x,s.y-m.y)<120;
x.fillStyle=`rgba(220,225,255,${g?1:k})`;
x.shadowBlur=g?14:s.s*3;x.shadowColor='#aab';
x.beginPath();x.arc(s.x,s.y,s.s*(g?1.6:1),0,7);x.fill();
S.forEach(o=>{
const D=Math.hypot(s.x-o.x,s.y-o.y);
if(o!==s&&D<140&&g&&Math.hypot(o.x-m.x,o.y-m.y)<160){
x.strokeStyle=`rgba(180,190,255,${.5-D/300})`;x.lineWidth=.6;x.shadowBlur=0;
x.beginPath();x.moveTo(s.x,s.y);x.lineTo(o.x,o.y);x.stroke()}})});
requestAnimationFrame(d)})(0)
})()
</script>
</section>
