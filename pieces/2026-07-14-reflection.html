<section data-date='2026-07-14' data-type='reflection'>
<style>
#taper-2026-07-14{position:relative;width:100%;height:100vh;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#0c1220 0%,#05070d 55%,#000 100%);cursor:crosshair}
#taper-2026-07-14 canvas{position:absolute;inset:0;display:block}
#taper-2026-07-14 .cap{position:absolute;bottom:6vh;left:0;right:0;text-align:center;font:italic 15px/1.6 Georgia,'Times New Roman',serif;color:#5a6a86;letter-spacing:.03em;pointer-events:none;transition:opacity 2.5s ease}
#taper-2026-07-14 .lbl{position:absolute;top:5vh;left:0;right:0;text-align:center;font:11px/1.4 'Courier New',monospace;color:#39435a;letter-spacing:.35em;text-transform:uppercase;pointer-events:none}
</style>
<div id="taper-2026-07-14">
  <canvas id="tp0714c"></canvas>
  <div class="lbl">the day is complete</div>
  <div class="cap" id="tp0714cap">rest here. touch the dark to remember it.</div>
</div>
<script>
(function(){
  var host=document.getElementById('taper-2026-07-14');
  var cv=document.getElementById('tp0714c'), x=cv.getContext('2d');
  var cap=document.getElementById('tp0714cap');
  var W,H,dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){W=host.clientWidth;H=host.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}
  size();window.addEventListener('resize',size);

  var far=[];
  for(var i=0;i<140;i++){far.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.2,p:Math.random()*6.28,s:Math.random()*.02+.01})}

  var found=[];
  var words=['stillness','quiet','hush','rest','ember','wonder','after','soft','held','again'];
  var floaters=[];

  function nearest(pt){var b=null,bd=1e9;for(var i=0;i<found.length-1;i++){var s=found[i],d=(s.x-pt.x)*(s.x-pt.x)+(s.y-pt.y)*(s.y-pt.y);if(d<bd){bd=d;b=s}}return b}

  host.addEventListener('click',function(e){
    var r=host.getBoundingClientRect();
    var p={x:e.clientX-r.left,y:e.clientY-r.top,t:0};
    var link=nearest(p);
    found.push(p);
    if(link)p.link=link;
    if(Math.random()<.6||found.length<4){
      var w=words[found.length%words.length];
      floaters.push({x:p.x,y:p.y-14,t:0,w:w});
    }
    if(found.length===1)cap.style.opacity=0;
  });

  var t0=null;
  function frame(ts){
    if(!t0)t0=ts;
    var el=(ts-t0)/1000;
    x.clearRect(0,0,W,H);

    for(var i=0;i<far.length;i++){
      var s=far[i];
      var a=.25+.55*Math.sin(el*s.s*30+s.p)*.5+.275;
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);
      x.fillStyle='rgba(200,210,235,'+a.toFixed(3)+')';x.fill();
    }

    for(var i=0;i<found.length;i++){
      var s=found[i];
      s.t+=1/60;
      var grow=Math.min(s.t/1.2,1);
      if(s.link){
        x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.link.x,s.link.y);
        x.strokeStyle='rgba(140,165,220,'+(0.16*grow).toFixed(3)+')';
        x.lineWidth=1;x.stroke();
      }
      var glow=x.createRadialGradient(s.x,s.y,0,s.x,s.y,18*grow);
      glow.addColorStop(0,'rgba(255,250,235,'+(.9*grow).toFixed(3)+')');
      glow.addColorStop(1,'rgba(255,250,235,0)');
      x.fillStyle=glow;x.beginPath();x.arc(s.x,s.y,18*grow,0,6.283);x.fill();
      x.beginPath();x.arc(s.x,s.y,1.6*grow,0,6.283);
      x.fillStyle='#fffdf3';x.fill();
    }

    x.textAlign='center';x.font='italic 13px Georgia, serif';
    for(var i=floaters.length-1;i>=0;i--){
      var f=floaters[i];f.t+=1/60;f.y-=.12;
      var a=f.t<.6?f.t/.6:Math.max(0,1-(f.t-.6)/3.2);
      x.fillStyle='rgba(150,165,200,'+(a*.85).toFixed(3)+')';
      x.fillText(f.w,f.x,f.y);
      if(f.t>4)floaters.splice(i,1);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</section>
