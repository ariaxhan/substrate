<section data-date='2026-10-06' data-type='digest'>
<style>
.cx{position:relative;background:#f1ebdd;height:100vh;overflow:hidden;font-family:Georgia,serif;cursor:crosshair}
.cx canvas{display:block;width:100%;height:100%}
.cx p{position:absolute;left:5%;bottom:6%;margin:0;color:#3a3226;font-style:italic;font-size:15px;letter-spacing:.04em;pointer-events:none;transition:opacity 2s}
.cx b{font-weight:400;font-size:11px;font-style:normal;letter-spacing:.3em;display:block;opacity:.5;margin-top:6px}
</style>
<div class="cx"><canvas></canvas><p id="t">scattered facts, waiting<b id="n">0 / 0</b></p></div>
<script>
(function(){
var c=document.querySelector('.cx canvas'),x=c.getContext('2d'),W,H,P=[],G=46,
t=document.getElementById('t'),n=document.getElementById('n'),L=0;
function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
rs();onresize=rs;
function add(px,py){P.push({x:px,y:py,vx:Math.random()-.5,vy:Math.random()-.5,s:0,a:0})}
for(var i=0;i<30;i++)add(Math.random()*W,Math.random()*H);
c.onmousemove=function(e){
 if(Math.random()<.35){var r=c.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)}};
c.onclick=function(e){var r=c.getBoundingClientRect();for(var i=0;i<5;i++)add(e.clientX-r.left+i*9-18,e.clientY-r.top+i*7-14)};
function f(){
 x.fillStyle='rgba(241,235,221,.35)';x.fillRect(0,0,W,H);
 L=0;var S=0;
 P.forEach(function(p,i){
  var d=0;
  for(var j=i+1;j<P.length;j++){var q=P[j],dx=q.x-p.x,dy=q.y-p.y,D=Math.sqrt(dx*dx+dy*dy);
   if(D<90){d++;L++;q.a+=.002;x.strokeStyle='rgba(58,50,38,'+(1-D/90)*.5+')';
    x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
  p.a+=d*.002;if(p.a>1)p.a=1;
  if(p.a>.6){S++;
   var gx=Math.round(p.x/G)*G,gy=Math.round(p.y/G+(Math.round(p.x/G)%2)*.5)*G-(Math.round(p.x/G)%2)*G*.5;
   p.x+=(gx-p.x)*.05;p.y+=(gy-p.y)*.05;p.vx*=.9;p.vy*=.9}
  p.x+=p.vx*(1-p.a);p.y+=p.vy*(1-p.a);
  if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  x.fillStyle=p.a>.6?'#b3401f':'#3a3226';
  x.beginPath();x.arc(p.x,p.y,2+p.a*3,0,6.3);x.fill()});
 n.textContent=S+' crystallized / '+P.length;
 t.firstChild.nodeValue=S>P.length*.5?'structure was always the quiet part':S>3?'something is agreeing with itself':'scattered facts, waiting';
 requestAnimationFrame(f)}
f()})();
</script>
</section>
