<!doctype html>
<html>
<head><meta charset="utf-8"><title>hush</title></head>
<body>
<section data-date='2026-07-05' data-type='reflection'>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03040a}
#wrap{position:fixed;inset:0;cursor:none}
canvas{position:absolute;inset:0;display:block}
#hint{position:absolute;bottom:8%;width:100%;text-align:center;font:italic 12px Georgia,serif;letter-spacing:.14em;color:rgba(200,214,255,.35);pointer-events:none;transition:opacity 2s}
</style>
<div id="wrap">
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<p id="hint">move to find what's still here. click to keep it.</p>
</div>
<script>
(function(){
var wrap=document.getElementById('wrap'),bg=document.getElementById('bg'),fx=document.getElementById('fx'),hint=document.getElementById('hint'),
bc=bg.getContext('2d'),fc=fx.getContext('2d'),W,H,DPR=Math.min(devicePixelRatio||1,2);
function size(){
  W=innerWidth;H=innerHeight;
  [bg,fx].forEach(function(c){c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px'});
  bc.setTransform(DPR,0,0,DPR,0,0);fc.setTransform(DPR,0,0,DPR,0,0);
}
size();addEventListener('resize',size);

var stars=[];
for(var i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.4+Math.random()*.8});

var lines=["the day, finished","unclench","a window, dark now","not everything needs finishing","still","count what's done, gently","rest isn't the opposite of ready","tomorrow, unopened"];
var words=lines.map(function(t){return{t:t,x:60+Math.random()*(W-120),y:70+Math.random()*(H-140)}});

var t0=performance.now();
function drawBg(now){
  var t=(now-t0)/1000;
  bc.clearRect(0,0,W,H);
  var g=bc.createRadialGradient(W/2,H*.85,0,W/2,H*.85,Math.max(W,H)*.8);
  g.addColorStop(0,'#0a1024');g.addColorStop(1,'#03040a');
  bc.fillStyle=g;bc.fillRect(0,0,W,H);
  stars.forEach(function(s){
    var o=.35+.65*(.5+.5*Math.sin(t*s.s+s.p));
    bc.beginPath();bc.arc(s.x,s.y,s.r,0,6.283);
    bc.fillStyle='rgba(214,224,255,'+o.toFixed(2)+')';bc.fill();
  });
  bc.font='13px SFMono-Regular,Menlo,Consolas,monospace';
  bc.textAlign='center';
  words.forEach(function(w){
    bc.fillStyle='rgba(196,210,255,.85)';
    bc.fillText(w.t,w.x,w.y);
  });
  requestAnimationFrame(drawBg);
}
requestAnimationFrame(drawBg);

var mx=W/2,my=H*.4,active=false,idle=0,kept=[];
function punch(x,y,r){
  var g=fc.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(0,0,0,1)');
  g.addColorStop(.7,'rgba(0,0,0,.55)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  fc.fillStyle=g;
  fc.beginPath();fc.arc(x,y,r,0,6.283);fc.fill();
}
function drawFx(){
  fc.clearRect(0,0,W,H);
  fc.fillStyle='#03040a';
  fc.fillRect(0,0,W,H);
  fc.globalCompositeOperation='destination-out';
  kept.forEach(function(k){punch(k.x,k.y,80)});
  idle+=1;
  var px=mx,py=my;
  if(!active){
    var a=idle*.002;
    px=W/2+Math.cos(a)*W*.28;
    py=H*.42+Math.sin(a*1.3)*H*.18;
  }
  punch(px,py,active?170:100);
  fc.globalCompositeOperation='source-over';
  requestAnimationFrame(drawFx);
}
requestAnimationFrame(drawFx);

wrap.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;active=true;idle=0;hint.style.opacity=0});
wrap.addEventListener('pointerleave',function(){active=false});
wrap.addEventListener('click',function(e){kept.push({x:e.clientX,y:e.clientY});hint.style.opacity=0});
})();
</script>
</section>
</body>
</html>
