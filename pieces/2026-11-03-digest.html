<section data-date='2026-11-03' data-type='digest'>
<style>
#k{margin:0;background:#f1ebdd;position:relative;height:100vh;overflow:hidden;cursor:crosshair;font:italic 15px Georgia,serif;color:#2b2a26}
#k canvas{display:block;width:100%;height:100%}
#k p{position:absolute;left:24px;bottom:18px;margin:0;pointer-events:none;letter-spacing:.04em}
</style>
<div id="k"><canvas></canvas><p></p></div>
<script>
(function(){
var k=document.getElementById('k'),c=k.firstChild,x=c.getContext('2d'),p=k.lastChild,W,H,N=[],T=0,R=110,w=[
'scatter','a fact','two facts','a rumor','agreement','a habit','a pattern','a law'];
function sz(){W=c.width=k.clientWidth;H=c.height=k.clientHeight}
sz();addEventListener('resize',sz);
function add(a,b){N.push({x:a,y:b,vx:0,vy:0,t:N.length})}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
k.onclick=function(e){var r=k.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)};
for(var i=0;i<7;i++)add(Math.random()*W,Math.random()*H);
function f(){
T++;x.fillStyle='rgba(241,235,221,.35)';x.fillRect(0,0,W,H);
if(T%90==0&&N.length<60)add(Math.random()*W,Math.random()*H);
var tri=0,e=0,i,j,l,a,b,m;
for(i=0;i<N.length;i++){a=N[i];
for(j=i+1;j<N.length;j++){b=N[j];m=d(a,b);
if(m<R&&m>1){var g=(m-R*.6)*.0004;a.vx+=(b.x-a.x)*g;a.vy+=(b.y-a.y)*g;b.vx-=(b.x-a.x)*g;b.vy-=(b.y-a.y)*g;
x.strokeStyle='rgba(43,42,38,'+(1-m/R)*.7+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();e++;
for(l=j+1;l<N.length;l++){var q=N[l];if(d(a,q)<R&&d(b,q)<R){tri++;
x.fillStyle='hsla('+(20+(i*37+j*11+l*5)%30)+',70%,45%,.08)';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(q.x,q.y);x.fill()}}}}
a.vx*=.9;a.vy*=.9;a.x=Math.max(8,Math.min(W-8,a.x+a.vx));a.y=Math.max(8,Math.min(H-8,a.y+a.vy));
x.fillStyle='#2b2a26';x.beginPath();x.arc(a.x,a.y,2+Math.min(4,N.length&&0),0,7);x.fill()}
p.textContent=N.length+' facts · '+e+' ties · '+tri+' structures — '+w[Math.min(7,Math.floor(tri/3))]+(N.length<9?' (click to add)':'');
requestAnimationFrame(f)}
f()
})()
</script>
</section>
