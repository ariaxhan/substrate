<section data-date='2026-11-14' data-type='pulse'>
<style>
.fx{position:relative;height:100vh;min-height:360px;background:#efe6d4;overflow:hidden;font:italic 15px Georgia,serif;color:#2a2118;cursor:crosshair}
.fx canvas{display:block;width:100%;height:100%}
.fx p{position:absolute;left:0;right:0;bottom:7%;margin:0;text-align:center;letter-spacing:.3em;opacity:.55;transition:opacity 1.5s}
</style>
<div class="fx"><canvas></canvas><p>move toward the middle</p></div>
<script>
(()=>{
const s=document.currentScript.previousElementSibling,c=s.querySelector('canvas'),t=s.querySelector('p'),x=c.getContext('2d');
let W,H,a=.5,g=0,f=1,m=.5,r=0,q=0;
const N=60,P=[...Array(N)].map((_,i)=>({u:Math.random(),v:Math.random(),i}));
const R=()=>{W=c.width=c.clientWidth;H=c.height=c.clientHeight};R();addEventListener('resize',R);
s.onmousemove=e=>{m=(e.clientX-s.getBoundingClientRect().left)/W};
s.ontouchmove=e=>{m=(e.touches[0].clientX-s.getBoundingClientRect().left)/W};
s.onclick=()=>{f=-f;r=1;t.textContent=f>0?'morning · afternoon':'afternoon · morning'};
(function L(k){
 g=f*(m-.5)*.7;a+=(g-a)*.06;
 x.fillStyle='#efe6d4';x.fillRect(0,0,W,H);
 const cx=W/2,cy=H*.6,hw=Math.min(W*.4,330),lv=Math.abs(a)<.015;
 if(lv){q=Math.min(1,q+.02)}else q=Math.max(0,q-.05);
 if(q>.5){t.textContent='noon. nothing is heavier.';t.style.opacity=1}
 else if(!lv&&t.style.opacity==1){t.style.opacity=.55;t.textContent='move toward the middle'}
 // ripples
 for(let j=0;j<4;j++){const p=((k/2400+j/4)%1);x.strokeStyle=`rgba(42,33,24,${q*(1-p)*.35})`;x.beginPath();x.arc(cx,cy,p*W*.5,0,7);x.stroke()}
 if(r>0){x.strokeStyle=`rgba(160,60,30,${r})`;x.beginPath();x.arc(cx,cy,(1-r)*W*.6,0,7);x.stroke();r-=.02}
 x.save();x.translate(cx,cy);x.rotate(a);
 x.fillStyle='#2a2118';x.fillRect(-hw,-2,hw*2,4);
 // two halves: dawn-warm pile and dusk-cool pile
 P.forEach(p=>{
  const L=p.i%2,side=L?-1:1,
   w=1+(L?-1:1)*Math.sin(a*f)*0,
   px=side*(hw*.15+p.u*hw*.8),
   py=-6-((p.v*(1+q*.3))*(30+20*Math.sin(k/700+p.i)));
  x.fillStyle=L?`hsl(${25+q*10},80%,${48-p.v*10}%)`:`hsl(${215-q*10},45%,${40+p.v*10}%)`;
  x.beginPath();x.arc(px,py+Math.sin(k/500+p.i)*2*(1-q),2+p.v*3,0,7);x.fill()});
 x.restore();
 x.fillStyle='#2a2118';x.beginPath();x.moveTo(cx,cy+2);x.lineTo(cx-18,cy+46);x.lineTo(cx+18,cy+46);x.fill();
 x.beginPath();x.arc(cx,cy,q*5+4,0,7);x.fillStyle=q>.5?'#a03c1e':'#efe6d4';x.fill();x.stroke();
 requestAnimationFrame(L)})(0);
})();
</script>
</section>
