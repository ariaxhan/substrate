<section data-date='2026-09-17' data-type='reflection'>
<style>
#tp-2026-09-17{position:relative;margin:0;height:80vh;min-height:480px;background:radial-gradient(ellipse at 50% 100%,#0a1128 0%,#020208 70%);overflow:hidden;font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
#tp-2026-09-17 .tp-hz{position:absolute;left:0;right:0;bottom:22%;height:1px;background:linear-gradient(90deg,transparent,#1c2b4a,transparent)}
#tp-2026-09-17 .tp-word{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);color:#5a6b8c;font-size:clamp(1rem,3vw,1.6rem);letter-spacing:.5em;opacity:.55;text-align:center;width:100%;pointer-events:none;transition:opacity 4s ease,letter-spacing 4s ease}
#tp-2026-09-17.tp-done .tp-word{opacity:.15;letter-spacing:.8em}
#tp-2026-09-17 .tp-hint{position:absolute;top:14px;left:18px;color:#3a4664;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;font-family:sans-serif;opacity:.6}
#tp-2026-09-17 .tp-count{position:absolute;top:14px;right:18px;color:#3a4664;font-size:.65rem;font-family:sans-serif;opacity:.6}
</style>
<div id="tp-2026-09-17">
  <div class="tp-hz"></div>
  <div class="tp-hint">click the dark</div>
  <div class="tp-count" id="tp-c-2026-09-17">0</div>
  <div class="tp-word" id="tp-w-2026-09-17">the day is complete</div>
</div>
<script>
(function(){
  var root=document.getElementById('tp-2026-09-17');
  var count=document.getElementById('tp-c-2026-09-17');
  var word=document.getElementById('tp-w-2026-09-17');
  var phrases=['the day is complete','rest before the beginning','stillness now','what was, was enough','the light lets go','nothing left to hold','quiet, at last','tomorrow is not yet asked of you'];
  var n=0,MAX=90;
  function rnd(a,b){return a+Math.random()*(b-a)}
  root.addEventListener('click',function(e){
    if(n>=MAX)return;
    var r=root.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    var s=document.createElement('div');
    var size=rnd(1,3);
    var hue=rnd(200,230);
    s.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:hsl('+hue+',70%,88%);box-shadow:0 0 '+(size*4)+'px '+(size*1.5)+'px hsla('+hue+',80%,75%,0.7);opacity:0;transform:translate(-50%,-50%);transition:opacity 2.5s ease;pointer-events:none';
    root.appendChild(s);
    requestAnimationFrame(function(){s.style.opacity=String(rnd(.4,1));});
    var tw=rnd(6,26);
    s.animate([{transform:'translate(-50%,-50%)'},{transform:'translate(calc(-50% + '+rnd(-4,4)+'px), calc(-50% - '+tw+'px))'}],{duration:rnd(9000,16000),iterations:1,fill:'forwards',easing:'ease-out'});
    n++;
    count.textContent=n;
    if(n%11===0){
      word.textContent=phrases[Math.floor(n/11)%phrases.length];
    }
    if(n===MAX){
      root.classList.add('tp-done');
      word.textContent='rest before the next beginning';
    }
  });
})();
</script>
</section>
