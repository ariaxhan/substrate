<section data-date='2026-11-18' data-type='digest'>
<style>
.cx{position:relative;background:#f1ead9;height:100vh;overflow:hidden;cursor:crosshair;font:italic 15px Georgia,serif;color:#3b3226}
.cx canvas{display:block;width:100%;height:100%}
.cx p{position:absolute;left:24px;bottom:18px;margin:0;opacity:.7;letter-spacing:.04em;pointer-events:none}
</style>
<div class="cx"><canvas id="c"></canvas><p id="t">scattered. touch anywhere.</p></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t'),W,H,P=[],S=22,R=130,k=0,m=[-9e3,0],
words=['noise','a pattern','held','a lattice','knowing','structure'];
function rs(){W=c.width=c.clientWidth;H=c.height=c.clientHeight}
rs();onresize=rs;
for(var i=0;i<260;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,g:null,a:Math.random()*6.3});
function seed(sx,sy){
 var r3=Math.sqrt(3);
 P.forEach(function(p){
  var d=Math.hypot(p.x-sx,p.y-sy);
  if(d>R*(1+k*.15))return;
  var dx=p.x-sx,dy=p.y-sy,q=(r3/3*dx-dy/3)/S,r=(2/3*dy)/S,z=-q-r,
  rq=Math.round(q),rr=Math.round(r),rz=Math.round(z),
  a=Math.abs(rq-q),b=Math.abs(rr-r),e=Math.abs(rz-z);
  if(a>b&&a>e)rq=-rr-rz;else if(b>e)rr=-rq-rz;
  p.g=[sx+S*(r3*rq+r3/2*rr),sy+S*1.5*rr]
 });
 P.push({x:sx,y:sy,vx:0,vy:0,g:[sx,sy],a:0});
 k++;t.textContent=words[Math.min(k,5)]+' · '+k+' seed'+(k>1?'s':'')+' · '+P.filter(function(p){return p.g}).length+' held'
}
c.onclick=function(e){var b=c.getBoundingClientRect();seed(e.clientX-b.left,e.clientY-b.top)};
c.onmousemove=function(e){var b=c.getBoundingClientRect();m=[e.clientX-b.left,e.clientY-b.top]};
function f(){
 x.fillStyle='rgba(241,234,217,.35)';x.fillRect(0,0,W,H);
 P.forEach(function(p){
  if(p.g){p.x+=(p.g[0]-p.x)*.06;p.y+=(p.g[1]-p.y)*.06}
  else{p.a+=.01;p.x+=Math.cos(p.a)*.4;p.y+=Math.sin(p.a*1.3)*.4;
   p.x=(p.x+W)%W;p.y=(p.y+H)%H}
 });
 for(var i=0;i<P.length;i++){
  var p=P[i],h=Math.hypot(p.x-m[0],p.y-m[1])<70;
  for(var j=i+1;j<P.length;j++){
   var o=P[j],d=Math.hypot(p.x-o.x,p.y-o.y);
   if(d<S*1.2&&p.g&&o.g){x.strokeStyle='rgba(120,60,30,'+(h?.9:.4)+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(o.x,o.y);x.stroke()}
   else if(h&&d<60&&!p.g&&!o.g){x.strokeStyle='rgba(60,50,38,.15)';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(o.x,o.y);x.stroke()}
  }
  x.fillStyle=p.g?(h?'#b3401c':'#7a3a1e'):'rgba(59,50,38,.45)';
  x.beginPath();x.arc(p.x,p.y,p.g?2.6:1.5,0,6.3);x.fill();
 }
 requestAnimationFrame(f)
}
f()
})();
</script>
</section>
