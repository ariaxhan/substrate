<section data-date='2026-08-30' data-type='pulse'>
<style>
#th{margin:0;background:#0b0c0e;color:#e8e4da;height:70vh;min-height:420px;position:relative;overflow:hidden;font-family:Georgia,serif;user-select:none}
#th .s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#th .b{position:relative;width:min(72vw,640px);height:2px;background:#3a3a3a;transition:transform .12s linear}
#th .f{position:absolute;left:50%;top:50%;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:22px solid #6b6b6b;transform:translate(-50%,0)}
#th .w{position:absolute;top:-1px;width:1px;text-align:center}
#th .w span{position:absolute;top:-2.2em;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(13px,2.6vw,20px);letter-spacing:.06em;color:#cfc9bb}
#th .l{left:8%}#th .r{left:92%}
#th .w i{position:absolute;top:0;left:50%;width:6px;height:6px;border-radius:50%;background:#cfc9bb;transform:translate(-50%,-50%)}
#th .c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#666;transition:opacity .4s,letter-spacing .6s}
#th .c.lit{color:#e8e4da;letter-spacing:.7em}
#th .g{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(232,228,218,0)}
#th .h{position:absolute;bottom:14px;width:100%;text-align:center;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:#4a4a4a;text-transform:uppercase;opacity:.8}
</style>
<div id="th">
  <div class="s"><div class="b" id="thb">
    <div class="w l"><span id="thl">what was done</span><i></i></div>
    <div class="w r"><span id="thr">what remains</span><i></i></div>
    <div class="f"></div>
  </div></div>
  <div class="c" id="thc">equilibrium</div>
  <div class="g" id="thg"></div>
  <div class="h">move to tilt &middot; hover center to settle it</div>
</div>
<script>
(function(){
var r=document.getElementById('th'),b=document.getElementById('thb'),
    L=document.getElementById('thl'),R=document.getElementById('thr'),
    c=document.getElementById('thc'),g=document.getElementById('thg');
if(!r)return;
var flip=false,raf=null,tx=0,idx=0;
var P=[['morning','evening'],['begun','done'],['light','dusk'],['rising','resting'],['first half','second half']];
r.addEventListener('mousemove',function(e){
  var rc=r.getBoundingClientRect();
  tx=(e.clientX-rc.left)/rc.width-0.5;
  if(!raf)raf=requestAnimationFrame(function(){
    b.style.transform='rotate('+((flip?-1:1)*tx*22)+'deg)';
    c.style.opacity=(1-Math.min(1,Math.abs(tx)*2.2)).toFixed(2);
    raf=null;
  });
});
r.addEventListener('mouseleave',function(){b.style.transform='rotate(0deg)';c.style.opacity=1;});
r.addEventListener('click',function(){
  flip=!flip;idx++;
  var p=P[idx%P.length];
  L.textContent=p[0];R.textContent=p[1];
  b.style.transition='transform .5s cubic-bezier(.2,1.4,.4,1)';
  b.style.transform='rotate(0deg)';
  setTimeout(function(){b.style.transition='transform .12s linear'},520);
});
c.addEventListener('mouseenter',function(){
  c.classList.add('lit');
  var t=0,p=setInterval(function(){
    t++;
    g.style.width=g.style.height=(8+t*6)+'px';
    g.style.borderColor='rgba(232,228,218,'+Math.max(0,0.5-t*0.06)+')';
    if(t>8){clearInterval(p);g.style.width=g.style.height='8px';g.style.borderColor='rgba(232,228,218,0)';}
  },40);
});
c.addEventListener('mouseleave',function(){c.classList.remove('lit');});
})();
</script>
</section>
