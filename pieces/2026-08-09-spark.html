<section data-date='2026-08-09' data-type='spark'>
<style>
.tp-spark{margin:0;overflow:hidden;background:#0b0b0e;height:100vh;cursor:crosshair;position:relative}
.tp-spark canvas{display:block}
.tp-spark .tp-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#555;font:11px monospace;letter-spacing:.1em;pointer-events:none}
</style>
<div class="tp-spark" id="tpS">
<canvas id="tpC"></canvas>
<div class="tp-hint">move to draw them together &middot; click to force it</div>
</div>
<script>
(function(){
var el=document.getElementById('tpS'),c=document.getElementById('tpC'),x=c.getContext('2d'),
W,H,mx=0,my=0,has=false,
L=["salt","bone","rust","moth","ash","tide","wire","dust"],
R=["light","root","song","flame","stone","echo","glass","name"],
P=[],
r=Math.random;
function sz(){W=c.width=el.clientWidth;H=c.height=el.clientHeight}
sz();
window.addEventListener('resize',sz);
function mk(side){
  var fromL=side==='L';
  return{
    side:side,
    x:fromL?-20:W+20,
    y:r()*H,
    vx:(fromL?1:-1)*(.3+r()*.4),
    vy:(r()-.5)*.15,
    word:(fromL?L:R)[0|r()*8],
    born:performance.now()
  }
}
for(var i=0;i<16;i++)P.push(mk(i%2?'L':'R'));
var sparks=[];
function collide(a,b,mxp,myp){
  var w=(a.side==='L'?a.word:b.word)+(a.side==='R'?a.word:b.word);
  sparks.push({x:mxp,y:myp,w:w,t:performance.now(),vy:-.2-r()*.3});
  P.splice(P.indexOf(a),1);
  P.splice(P.indexOf(b),1);
  P.push(mk(r()<.5?'L':'R'));
  P.push(mk(r()<.5?'L':'R'));
}
el.addEventListener('mousemove',function(e){
  var rc=el.getBoundingClientRect();
  mx=e.clientX-rc.left; my=e.clientY-rc.top; has=true;
});
el.addEventListener('click',function(e){
  var rc=el.getBoundingClientRect(),cx=e.clientX-rc.left,cy=e.clientY-rc.top;
  for(var i=0;i<P.length-1;i++)
    for(var j=i+1;j<P.length;j++)
      if(P[i].side!==P[j].side){
        var dx=P[i].x-cx,dy=P[i].y-cy;
        if(dx*dx+dy*dy<6000){collide(P[i],P[j],cx,cy);return}
      }
});
function step(now){
  x.fillStyle='rgba(11,11,14,.16)';
  x.fillRect(0,0,W,H);
  for(var i=0;i<P.length;i++){
    var p=P[i];
    if(has){
      var dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      p.vx+=dx/d*.02; p.vy+=dy/d*.02;
    }
    p.vx*=.98; p.vy*=.98;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40){P[i]=mk(p.side)}
  }
  for(i=0;i<P.length-1;i++){
    for(var j=i+1;j<P.length;j++){
      var a=P[i],b=P[j];
      if(a.side===b.side)continue;
      var dx=a.x-b.x,dy=a.y-b.y;
      if(dx*dx+dy*dy<180){collide(a,b,(a.x+b.x)/2,(a.y+b.y)/2);break}
    }
  }
  x.font='12px monospace';
  for(i=0;i<P.length;i++){
    p=P[i];
    x.fillStyle=p.side==='L'?'rgba(255,140,90,.85)':'rgba(90,180,255,.85)';
    x.beginPath();x.arc(p.x,p.y,2.4,0,7);x.fill();
    x.fillText(p.word,p.x+6,p.y+3);
  }
  x.font='16px monospace';
  for(i=sparks.length-1;i>=0;i--){
    var s=sparks[i],age=now-s.t;
    if(age>2200){sparks.splice(i,1);continue}
    var op=1-age/2200;
    x.fillStyle='rgba(255,255,255,'+op+')';
    x.fillText(s.w,s.x-s.w.length*4,s.y+age*s.vy*.06);
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
})();
</script>
</section>
