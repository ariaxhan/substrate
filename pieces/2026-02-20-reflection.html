<section data-date='2026-02-20' data-type='reflection'>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  overflow: hidden;
  cursor: crosshair;
  font-family: Georgia, serif;
  color: #556;
}
#canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
}
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: radial-gradient(circle, #fff, #8ac 70%, transparent);
  border-radius: 50%;
  opacity: 0;
  animation: appear 1.2s ease-out forwards;
  pointer-events: none;
}
@keyframes appear {
  from { opacity: 0; transform: scale(0); }
  to { opacity: 1; transform: scale(1); }
}
.line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(136,170,204,0.15), transparent);
  transform-origin: left center;
  opacity: 0;
  animation: draw 2s ease-in-out forwards;
  pointer-events: none;
}
@keyframes draw {
  from { opacity: 0; width: 0; }
  to { opacity: 1; width: var(--len); }
}
#hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  letter-spacing: 1px;
  opacity: 0.4;
  transition: opacity 0.8s;
  text-align: center;
}
#count {
  position: absolute;
  top: 20px;
  right: 24px;
  font-size: 11px;
  opacity: 0.3;
  letter-spacing: 2px;
}
</style>

<div id="canvas"></div>
<div id="hint">click to place a star</div>
<div id="count">0</div>

<script>
const canvas = document.getElementById('canvas');
const hint = document.getElementById('hint');
const countEl = document.getElementById('count');
let stars = [];
let count = 0;

function dist(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

function drawLine(a, b) {
  const line = document.createElement('div');
  line.className = 'line';
  const length = dist(a, b);
  const angle = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;

  line.style.left = a.x + 'px';
  line.style.top = a.y + 'px';
  line.style.transform = `rotate(${angle}deg)`;
  line.style.setProperty('--len', length + 'px');

  canvas.appendChild(line);
}

function findNearby(newStar) {
  const threshold = 180;
  const nearby = stars.filter(s => dist(s, newStar) < threshold && dist(s, newStar) > 20);

  if (nearby.length > 0) {
    const closest = nearby.sort((a, b) => dist(a, newStar) - dist(b, newStar)).slice(0, 2);
    closest.forEach(s => drawLine(s, newStar));
  }
}

canvas.addEventListener('click', (e) => {
  const star = document.createElement('div');
  star.className = 'star';

  const x = e.clientX;
  const y = e.clientY;

  star.style.left = (x - 1.5) + 'px';
  star.style.top = (y - 1.5) + 'px';

  const size = 2 + Math.random() * 3;
  star.style.width = size + 'px';
  star.style.height = size + 'px';

  canvas.appendChild(star);

  const starData = { x, y, el: star };
  stars.push(starData);
  count++;
  countEl.textContent = count;

  if (count === 1) {
    setTimeout(() => { hint.style.opacity = '0'; }, 1200);
  }

  if (count > 2) {
    findNearby(starData);
  }
});
</script>
</section>
