<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>night inventory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03040d;overflow:hidden;cursor:crosshair}
canvas{display:block}
#hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font:11px/1 Georgia,serif;color:#ffffff14;letter-spacing:.18em;pointer-events:none;transition:opacity 3s}
</style>
</head>
<body>
<section data-date='2026-05-13' data-type='reflection'>
<canvas id=c></canvas>
<div id=hint>touch to name a star</div>
</section>
<script>
const cv=document.getElementById('c'),
      cx=cv.getContext('2d'),
      hint=document.getElementById('hint');

const resize=()=>{cv.width=innerWidth;cv.height=innerHeight};
resize();
addEventListener('resize',resize);

const words=['done','still','here','enough','close','rest','held','whole','again','warm','slow','breath','safe','spent','soft','yes','now','quiet','full','dark','ease','home','through','weight','true'];

let mx=innerWidth/2,my=innerHeight/2;
const stars=[];

const make=(x,y,word)=>({
  x,y,
  r:Math.random()*1.1+.3,
  a:Math.random()*.45+.05,
  word:word||null,
  glow:word?1:0,
  born:word?performance.now():0,
  tw:Math.random()*Math.PI*2,
  sp:Math.random()*.018+.004
});

for(let i=0;i<130;i++) stars.push(make(
  Math.random()*innerWidth,
  Math.random()*innerHeight
));

addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  hint.style.opacity='0';
});

addEventListener('click',e=>{
  const w=words[Math.floor(Math.random()*words.length)];
  stars.push(make(e.clientX,e.clientY,w));
  hint.style.opacity='0';
});

function frame(t){
  cx.clearRect(0,0,cv.width,cv.height);

  // constellation lines between stars near cursor
  const near=stars.filter(s=>Math.hypot(s.x-mx,s.y-my)<170);
  for(let i=0;i<near.length-1;i++){
    for(let j=i+1;j<near.length;j++){
      const d=Math.hypot(near[i].x-near[j].x,near[i].y-near[j].y);
      if(d<110){
        const prox=1-Math.hypot(near[i].x-mx,near[i].y-my)/170;
        cx.beginPath();
        cx.moveTo(near[i].x,near[i].y);
        cx.lineTo(near[j].x,near[j].y);
        cx.strokeStyle=`rgba(160,185,255,${.07*(1-d/110)*prox})`;
        cx.lineWidth=.4;
        cx.stroke();
      }
    }
  }

  stars.forEach(s=>{
    s.tw+=s.sp;
    const tw=Math.sin(s.tw)*.12;
    const prox=Math.max(0,1-Math.hypot(s.x-mx,s.y-my)/200);
    const a=Math.min(1,s.a+tw+prox*.35+(s.glow*.4));
    if(s.glow>0) s.glow=Math.max(0,s.glow-.006);

    // soft halo on named stars
    if(s.word&&s.glow>.01){
      const g=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,28);
      g.addColorStop(0,`rgba(180,210,255,${s.glow*.12})`);
      g.addColorStop(1,'transparent');
      cx.fillStyle=g;
      cx.beginPath();
      cx.arc(s.x,s.y,28,0,Math.PI*2);
      cx.fill();
    }

    cx.beginPath();
    cx.arc(s.x,s.y,s.r+prox*.9,0,Math.PI*2);
    cx.fillStyle=`rgba(215,228,255,${a})`;
    cx.fill();

    if(s.word){
      const age=s.born?Math.min(1,(performance.now()-s.born)/2200):1;
      cx.font=`11px Georgia,serif`;
      cx.fillStyle=`rgba(195,212,255,${a*age*.65})`;
      cx.fillText(s.word,s.x+7,s.y-5);
    }
  });

  requestAnimationFrame(frame);
}

setTimeout(()=>{hint.style.opacity='1'},1000);
requestAnimationFrame(frame);
</script>
</body>
</html>
