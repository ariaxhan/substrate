<section data-date='2026-11-13' data-type='reflection'>
<style>
#nt{position:relative;height:100vh;background:linear-gradient(#0a0e24,#030409);overflow:hidden;cursor:crosshair;font:italic 18px Georgia,serif;color:#cfd8ff}
#nt canvas{position:absolute;inset:0;width:100%;height:100%}
#nt p{position:absolute;bottom:8%;width:100%;text-align:center;margin:0;letter-spacing:.3em;opacity:.5;pointer-events:none;transition:opacity 3s}
</style>
<div id="nt"><canvas></canvas><p>the day is done. touch the dark.</p></div>
<script>
(()=>{const r=document.getElementById('nt'),c=r.querySelector('canvas'),x=c.getContext('2d'),p=r.querySelector('p');
const W=['rest','breathe','enough','held','soft','tomorrow','still','home','slow','kept'];
let S=[],n=0,w,h;
function rs(){w=c.width=r.clientWidth;h=c.height=r.clientHeight}rs();onresize=rs;
function add(a,b,t){S.push({x:a,y:b,t:performance.now(),p:Math.random()*6,w:t?W[n++%W.length]:0})}
for(let i=0;i<40;i++)add(Math.random()*w,Math.random()*h*.8);
r.onclick=e=>{const q=r.getBoundingClientRect();add(e.clientX-q.left,e.clientY-q.top,1);p.style.opacity=0};
(function f(t){x.clearRect(0,0,w,h);
S.forEach(s=>{const a=Math.min(1,(t-s.t)/1500),g=.6+.4*Math.sin(t/900+s.p);
x.fillStyle=`rgba(220,230,255,${a*g})`;x.shadowBlur=12;x.shadowColor='#9bb0ff';
x.beginPath();x.arc(s.x,s.y,1.5+a*(s.w?1.5:.5),0,7);x.fill();
if(s.w){x.shadowBlur=0;x.font='italic 15px Georgia';x.fillStyle=`rgba(200,215,255,${a*.8})`;x.fillText(s.w,s.x+8,s.y+4)}});
requestAnimationFrame(f)})(0)})();
</script>
</section>
