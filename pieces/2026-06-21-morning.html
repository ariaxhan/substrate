<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>threshold</title>
</head>
<body>
<section data-date='2026-06-21' data-type='morning'>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#07091a;cursor:crosshair;transition:background 2.5s ease}
.w{position:absolute;font-family:Georgia,serif;color:#9888d4;opacity:0;transition:opacity .5s ease;pointer-events:none;user-select:none;white-space:nowrap}
#v{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:Georgia,serif;font-size:clamp(1rem,2.8vw,1.9rem);line-height:2;letter-spacing:.06em;color:#5a3500;opacity:0;transition:opacity 1.8s ease;pointer-events:none}
</style>
<div id="v">the day<br>does not know yet<br>what it will become</div>
<script>
var fr=['before','not yet','still','unnamed','possible','held','open','waiting','tender','almost','first','the quiet','becoming','threshold','unwritten','potential','soon','the hour before','nascent','unheld'],
D=document,B=D.body,ws=[],lit=0;
fr.forEach(function(t){
  var e=D.createElement('div');
  e.className='w';
  e.textContent=t;
  e.style.fontSize=(Math.random()*.8+.65).toFixed(2)+'rem';
  e.style.left=(Math.random()*82+4).toFixed(1)+'%';
  e.style.top=(Math.random()*78+7).toFixed(1)+'%';
  B.appendChild(e);
  ws.push(e);
});
B.addEventListener('mousemove',function(ev){
  if(lit)return;
  var mx=ev.clientX,my=ev.clientY;
  ws.forEach(function(el){
    var r=el.getBoundingClientRect(),
    d=Math.hypot(mx-r.left-r.width/2,my-r.top-r.height/2);
    el.style.opacity=Math.max(0,1-d/170).toFixed(3);
  });
});
B.addEventListener('click',function(){
  if(lit)return;
  lit=1;
  B.style.background='#fdf4e0';
  ws.forEach(function(el){
    el.style.transition='opacity 1s ease,color 1s ease';
    el.style.color='#3d2800';
    el.style.opacity='.8';
  });
  var v=D.getElementById('v');
  v.style.opacity=1;
  setTimeout(function(){
    ws.forEach(function(el){el.style.transition='opacity 2.5s ease';el.style.opacity=0;});
    v.style.transition='opacity 2s ease';v.style.opacity=0;
    B.style.transition='background 3.5s 1s ease';B.style.background='#07091a';
    setTimeout(function(){
      ws.forEach(function(el){
        el.style.transition='opacity .5s ease,color .5s ease';
        el.style.color='#9888d4';
      });
      B.style.transition='background 2.5s ease';
      lit=0;
    },5500);
  },4000);
});
</script>
</section>
</body>
</html>
