<section data-date='2026-04-02' data-type='digest'>
<style>
#cv{position:fixed;inset:0;background:#020408;cursor:crosshair;z-index:0}
#ly{position:fixed;inset:0;pointer-events:none;z-index:1}
.w{position:absolute;font:700 1rem Georgia,serif;color:#e2c97e;letter-spacing:.2em;text-transform:uppercase;opacity:0;transform:translate(-50%,-50%) scale(.4);transition:all 1s cubic-bezier(.16,1,.3,1);text-shadow:0 0 30px #e2c97e44}
.w.v{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<canvas id=cv></canvas>
<div id=ly></div>
<script>
const cv=document.getElementById('cv'),
x=cv.getContext('2d'),
ws=['observe','pattern','signal','emerge','cluster','cohere','lattice','encode','resolve','recognize','structure','meaning','form','order','trace','hold','become','name','know','see','distill'],
g='·∴∵◦•○□△▽◇≈±',
p=[];
let mx=.5,my=.5;

function R(){
  cv.width=innerWidth;cv.height=innerHeight;p.length=0;
  for(let c=~~(innerWidth/15),r=~~(innerHeight/19),i=c*r;i--;)
    p.push({x:(i%c)*15+7,y:~~(i/c)*19+9,c:g[~~(Math.random()*g.length)],f:Math.random()*6.28,s:.015+Math.random()*.03})
}

function D(){
  x.clearRect(0,0,cv.width,cv.height);
  x.font='9px monospace';x.textAlign='center';
  for(const n of p){
    n.f+=n.s;
    x.fillStyle=`rgba(70,100,160,${.03+Math.sin(n.f)*.035})`;
    if(Math.random()<.002)n.c=g[~~(Math.random()*g.length)];
    x.fillText(n.c,n.x+(mx-.5)*10,n.y+(my-.5)*6)
  }
  requestAnimationFrame(D)
}

cv.onclick=e=>{
  const el=document.createElement('div');
  el.className='w';el.textContent=ws[~~(Math.random()*ws.length)];
  el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';
  ly.append(el);setTimeout(()=>el.classList.add('v'),10)
};

onmousemove=e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight};
onresize=R;R();D();
</script>
</section>
