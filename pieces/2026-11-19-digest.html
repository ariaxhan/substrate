<section data-date='2026-11-19' data-type='digest'>
<style>
#k{position:relative;background:#efe7d6;height:100vh;overflow:hidden;cursor:crosshair;font:italic 15px Georgia,serif;color:#3b2f22}
#k canvas{position:absolute;inset:0;width:100%;height:100%}
#k p{position:absolute;left:24px;bottom:18px;margin:0;letter-spacing:.04em;transition:opacity 2s}
</style>
<div id="k"><canvas></canvas><p id="t">a few scattered things. touch one.</p></div>
<script>
(()=>{
const k=document.getElementById('k'),c=k.querySelector('canvas'),x=c.getContext('2d'),t=document.getElementById('t');
let W,H,N=[],G=60,R=130,w=['they begin to lean.','neighbours agree.','order costs attention.','a lattice, uninvited.','you were the missing edge.'],wi=0;
const rs=()=>{W=c.width=k.clientWidth;H=c.height=k.clientHeight};
rs();addEventListener('resize',rs);
const add=(a,b,f)=>N.push({x:a,y:b,vx:0,vy:0,d:0,b:f?0:1});
for(let i=0;i<14;i++)add(Math.random()*W,Math.random()*H,1);
k.onclick=e=>{
const r=k.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top);
t.textContent=w[wi++%w.length];
};
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
(function f(){
x.fillStyle='rgba(239,231,214,.35)';x.fillRect(0,0,W,H);
N.forEach(a=>a.d=0);
for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
const a=N[i],b=N[j],d=D(a,b);
if(d<R){a.d++;b.d++;
x.strokeStyle='rgba(59,47,34,'+(1-d/R)*.6+')';x.lineWidth=1;
x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
for(let l=j+1;l<N.length;l++){const q=N[l];
if(D(a,q)<R&&D(b,q)<R){x.fillStyle='rgba(176,86,48,.09)';
x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(q.x,q.y);x.fill()}}}}
N.forEach(a=>{
const s=Math.min(a.d/4,1)*.05,gx=Math.round(a.x/G)*G,gy=Math.round(a.y/G)*G;
a.vx+=(gx-a.x)*s*.1+(Math.random()-.5)*(1-s*10)*.15;
a.vy+=(gy-a.y)*s*.1+(Math.random()-.5)*(1-s*10)*.15;
a.vx*=.9;a.vy*=.9;a.x+=a.vx;a.y+=a.vy;
x.fillStyle=a.d>3?'#b05630':'#3b2f22';
x.beginPath();x.arc(a.x,a.y,2+Math.min(a.d,6)*.7,0,7);x.fill()});
requestAnimationFrame(f)
})()
})()
</script>
</section>
