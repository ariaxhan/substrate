<section data-date='2026-01-28' data-type='spark'>
<style>*{margin:0;padding:0}canvas{display:block;background:#000}</style>
<canvas id=c></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
c.width=c.height=400;let t=0,m=0;
function d(){
x.fillStyle='rgba(0,0,0,.1)';x.fillRect(0,0,400,400);
let a=Math.sin(t*.01)*120+200,b=Math.cos(t*.015)*120+200;
let e=Math.cos(t*.01)*120+200,f=Math.sin(t*.015)*120+200;
x.strokeStyle='#0f0';x.lineWidth=2;
x.beginPath();x.arc(a,200,15,0,7);x.stroke();
x.strokeStyle='#00f';
x.beginPath();x.arc(200,b,15,0,7);x.stroke();
let dx=e-a,dy=f-b,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<50){
m=Math.min(m+.03,1);
x.globalAlpha=m*.5;x.strokeStyle='#fff';x.lineWidth=1;
for(let i=0;i<8;i++){
let ang=i*.785+t*.05;
x.beginPath();
x.moveTo(e,f);
x.lineTo(e+Math.cos(ang)*m*40,f+Math.sin(ang)*m*40);
x.stroke();
}
x.globalAlpha=1;
}else m=Math.max(m-.01,0);
t++;requestAnimationFrame(d)
}
d()
</script>
</section>
