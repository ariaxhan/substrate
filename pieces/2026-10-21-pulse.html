<section data-date='2026-10-21' data-type='pulse'>

(function(){
var p=document.getElementById('p'),c=document.getElementById('c'),x=c.getContext('2d'),w=document.getElementById('w'),

a+=(g-a)*.05;

 var n=Math.round(8+i*a*-14*f);
 for(var j=0;j<n;j++){
  var y=-8-j*7,o=Math.sin(t*2+j)*3;

 }

w.style.opacity=k?.9:0;
requestAnimationFrame(L)}
