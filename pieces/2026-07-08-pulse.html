<section data-date='2026-07-08' data-type='pulse'>
<style>
#p0708{margin:0;background:linear-gradient(180deg,#0e0f14 0%,#1a1a22 100%);height:70vh;min-height:420px;position:relative;overflow:hidden;font-family:Georgia,'Times New Roman',serif;cursor:ns-resize}
#p0708 .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#p0708 .beam{position:relative;width:78%;max-width:640px;height:1px;background:rgba(210,200,190,.35);transform-origin:50% 50%}
#p0708 .fulcrum{position:absolute;left:50%;top:0;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid rgba(210,200,190,.5);transform:translate(-50%,0)}
#p0708 .w{position:absolute;top:0;font-size:15px;letter-spacing:.02em;color:rgba(220,214,206,.55);white-space:nowrap;transform:translate(-50%,-50%);transition:font-size .25s,color .25s}
#p0708 .now{position:absolute;left:50%;top:-46px;transform:translateX(-50%);font-style:italic;font-size:13px;color:rgba(255,220,180,0);letter-spacing:.15em;transition:color .6s;pointer-events:none;white-space:nowrap}
#p0708 .now.on{color:rgba(255,220,180,.85)}
#p0708 .hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-family:monospace;font-size:11px;letter-spacing:.05em;color:rgba(160,155,150,.4)}
</style>
<div id="p0708">
<div class="stage">
<div class="beam" id="p0708b">
<div class="fulcrum"></div>
<div class="now" id="p0708n">the middle of it</div>
</div>
</div>
<div class="hint">move to weigh the day &middot; click to right it</div>
</div>
<script>
(function(){
var R=document.getElementById('p0708'),beam=document.getElementById('p0708b'),now=document.getElementById('p0708n');
var L=["waking","reaching","becoming","climbing","opening","asking"];
var Rt=["dimming","releasing","settling","closing","arriving","forgiving"];
var words=[];
function place(list,side){
list.forEach(function(t,i){
var el=document.createElement('div');
el.className='w';
el.textContent=t;
var frac=(i+1)/(list.length+1);
var pct=side<0?50-frac*46:50+frac*46;
el.style.left=pct+'%';
beam.appendChild(el);
words.push({el:el,side:side});
});
}
place(L,-1);place(Rt,1);
var ang=0,target=0;
function apply(){
beam.style.transform='rotate('+ang+'deg)';
var bal=Math.abs(ang)<0.7;
now.classList.toggle('on',bal);
words.forEach(function(p){
var lean=ang*p.side/14;
var sc=1+Math.max(0,lean)*.55;
var op=.55+Math.max(0,-lean)*.1-Math.max(0,lean)*.05;
p.el.style.fontSize=(15*sc).toFixed(1)+'px';
p.el.style.color='rgba(220,214,206,'+Math.min(.95,Math.max(.25,op))+')';
});
}
R.addEventListener('mousemove',function(e){
var r=R.getBoundingClientRect();
var x=e.clientX-r.left;
var rel=(x/r.width-0.5)*2;
target=Math.max(-1,Math.min(1,rel))*14;
});
R.addEventListener('mouseleave',function(){target=0});
R.addEventListener('click',function(){target=-target;ang=target});
(function tick(){
ang+=(target-ang)*0.12;
apply();
requestAnimationFrame(tick);
})();
})();
</script>
</section>
