<section data-date='2026-06-30' data-type='digest'>
<style>
#cvb{position:relative;width:100%;height:520px;overflow:hidden;cursor:crosshair;
background:repeating-radial-gradient(circle at 22% 30%,rgba(0,0,0,.05) 0 1px,transparent 1px 15px),linear-gradient(160deg,#c9a876,#a9824f 58%,#856239)}
#cvb svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cvb .card{position:absolute;width:120px;padding:11px 9px 9px;background:#faf3df;box-shadow:1px 2px 6px rgba(0,0,0,.4);font:11px/1.4 'Courier New',monospace;color:#2b2117;letter-spacing:.01em}
#cvb .card::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#b3261e;box-shadow:0 1px 2px rgba(0,0,0,.5)}
#cvb .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:italic 12px Georgia,serif;color:rgba(43,33,23,.6);pointer-events:none;transition:opacity 1s}
#cvb .ct{position:absolute;top:12px;right:16px;font:10px 'Courier New',monospace;letter-spacing:.12em;color:rgba(43,33,23,.55);text-transform:uppercase}
</style>
<div id="cvb">
<svg></svg>
<div class="hint">click the board to pin a thought</div>
<div class="ct"></div>
</div>
<script>
(function(){
var root=document.getElementById('cvb'),svg=root.querySelector('svg'),hint=root.querySelector('.hint'),ct=root.querySelector('.ct');
var NS='http://www.w3.org/2000/svg';
var words=['a name overheard','half a citation','the pattern repeats','three sources agree','page 12, footnote','not yet proven','circle back to this','the shape emerges','cross-reference','who said it first','it fits','building consensus','still unverified','triangulate','the thread holds','worth revisiting','converges here','same shape, new frame','margin note','a hunch, confirmed'];
var pins=[],wi=0;
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function thread(a,b){
var l=document.createElementNS(NS,'path'),mx=(a.x+b.x)/2,my=(a.y+b.y)/2+16+Math.random()*16;
l.setAttribute('d','M'+a.x+' '+a.y+' Q '+mx+' '+my+' '+b.x+' '+b.y);
l.setAttribute('stroke','#b3261e');l.setAttribute('stroke-width','1');l.setAttribute('fill','none');l.setAttribute('opacity','.5');
svg.appendChild(l);
}
function place(x,y){
var c=document.createElement('div');c.className='card';
var r=(Math.random()*8-4).toFixed(1);
c.style.left=(x-60)+'px';c.style.top=y+'px';c.style.transform='rotate('+r+'deg)';
c.textContent=words[wi%words.length];wi++;
root.appendChild(c);
var p={x:x,y:y};
var near=pins.slice().sort(function(a,b){return dist(a,p)-dist(b,p)}).slice(0,Math.min(2,pins.length));
near.forEach(function(o){thread(o,p)});
pins.push(p);
ct.textContent=pins.length+' pinned';
hint.style.opacity=0;
}
root.addEventListener('click',function(e){
if(e.target.closest('.card'))return;
var r=root.getBoundingClientRect();
place(e.clientX-r.left,e.clientY-r.top);
});
[[.26,.34],[.56,.2],[.7,.5]].forEach(function(p){place(p[0]*root.clientWidth,p[1]*520)});
})();
</script>
</section>
