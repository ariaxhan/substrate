<section data-date='2026-05-04' data-type='reflection'>
<style>
.sk{position:relative;background:#060816;width:100%;height:100vh;overflow:hidden;cursor:crosshair;font-family:Palatino,'Palatino Linotype',Georgia,serif}
.sk svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.st{position:absolute;border-radius:50%;background:#eef0ff;transform:translate(-50%,-50%);pointer-events:none}
.wrd{position:absolute;color:rgba(185,200,235,0.85);font-size:11px;letter-spacing:.25em;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;animation:rse 3.5s ease-out forwards}
.ht{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);color:rgba(110,130,170,0.45);font-size:11px;letter-spacing:.32em;transition:opacity 2.5s;pointer-events:none;text-align:center;animation:breathe 5s ease-in-out infinite}
.ph{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(200,210,240,0);font-size:12px;letter-spacing:.38em;text-align:center;line-height:2.4;pointer-events:none;transition:color 3s;font-weight:300}
@keyframes rse{0%{opacity:0;transform:translate(-50%,-50%)}18%{opacity:.85}100%{opacity:0;transform:translate(-50%,-300%)}}
@keyframes breathe{0%,100%{opacity:.28}50%{opacity:.55}}
</style>
<div class='sk' id='sk'>
  <svg id='sv'></svg>
  <div class='ht' id='ht'>touch the dark</div>
  <div class='ph' id='ph'>the day<br>is complete</div>
</div>
<script>
var sk=document.getElementById('sk'),
    sv=document.getElementById('sv'),
    ht=document.getElementById('ht'),
    ph=document.getElementById('ph'),
    ns='http://www.w3.org/2000/svg',
    ss=[],mx=0,my=0,
    ws=['enough','done','held','released','still','let go','breathe','rest','quiet','whole','home','peace','settled','soft','over','good'];

function star(x,y){
  var d=document.createElement('div'),
      r=Math.random()*1.3+.7;
  d.className='st';
  d.style.cssText='left:'+x+'px;top:'+y+'px;width:'+(r*2)+'px;height:'+(r*2)+'px;'
    +'box-shadow:0 0 '+(r*3)+'px '+r+'px rgba(215,228,255,.9),'
    +'0 0 '+(r*8)+'px '+(r*2.2)+'px rgba(180,205,255,.3)';
  sk.appendChild(d);
  ss.push({x:x,y:y});
  var w=document.createElement('div');
  w.className='wrd';
  w.textContent=ws[Math.floor(Math.random()*ws.length)];
  w.style.left=x+'px';
  w.style.top=y+'px';
  sk.appendChild(w);
  setTimeout(function(){w.remove()},3700);
  if(ss.length===7){
    ph.style.color='rgba(205,215,242,0.52)';
    setTimeout(function(){ph.style.color='rgba(205,215,242,0)'},5500);
  }
}

function lines(){
  while(sv.firstChild)sv.removeChild(sv.firstChild);
  var near=ss.filter(function(s){return Math.hypot(s.x-mx,s.y-my)<165});
  for(var i=0;i<near.length;i++)
    for(var j=i+1;j<near.length;j++){
      var d=Math.hypot(near[i].x-near[j].x,near[i].y-near[j].y);
      if(d<195){
        var ln=document.createElementNS(ns,'line');
        ln.setAttribute('x1',near[i].x);ln.setAttribute('y1',near[i].y);
        ln.setAttribute('x2',near[j].x);ln.setAttribute('y2',near[j].y);
        ln.setAttribute('stroke','rgba(155,178,218,'+Math.max(0,.35-d/540).toFixed(2)+')');
        ln.setAttribute('stroke-width','.55');
        sv.appendChild(ln);
      }
    }
}

sk.addEventListener('click',function(e){
  var r=sk.getBoundingClientRect();
  if(!ht.dataset.g){ht.style.opacity='0';ht.dataset.g=1}
  star(e.clientX-r.left,e.clientY-r.top);
});
sk.addEventListener('mousemove',function(e){
  var r=sk.getBoundingClientRect();
  mx=e.clientX-r.left;my=e.clientY-r.top;
  lines();
});
</script>
</section>
