<section data-date='2026-07-21' data-type='reflection'>
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>what the dark keeps</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050608;cursor:crosshair}
  canvas{position:absolute;inset:0}
  #cap{position:absolute;left:0;right:0;bottom:9%;text-align:center;
    font:italic 300 16px/1.7 Georgia,'Times New Roman',serif;
    color:rgba(230,228,220,.62);letter-spacing:.04em;
    opacity:0;transition:opacity 2.6s ease;pointer-events:none}
  #tally{position:absolute;top:16px;right:20px;
    font:11px/1 'Courier New',monospace;color:rgba(230,228,220,.25);
    letter-spacing:.12em;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">the day is complete</div>
<div id="tally">0 held</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),
    cap=document.getElementById('cap'),tally=document.getElementById('tally'),
    W,H,stars=[],t0=Date.now(),
    lines=['the day is complete','hold what the dark kept','still, before the next beginning','rest now. the rest can wait'];

function size(){W=c.width=innerWidth;H=c.height=innerHeight}
size();addEventListener('resize',size);

function bg(){
  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050608');
  g.addColorStop(1,'#0c1120');
  x.fillStyle=g;x.fillRect(0,0,W,H);
}

var mx=-999,my=-999;
addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY});
addEventListener('mouseleave',function(){mx=-999;my=-999});

addEventListener('click',function(e){
  stars.push({x:e.clientX,y:e.clientY,p:Math.random()*7,r:1.1+Math.random()*1.3});
  tally.textContent=stars.length+' held';
  var i=Math.min(stars.length-1,lines.length-1);
  if(stars.length===1||stars.length%6===0){
    cap.style.opacity='0';
    setTimeout(function(){cap.textContent=lines[i%lines.length];cap.style.opacity='1'},700);
  }
});

function draw(){
  var t=(Date.now()-t0)/1000;
  bg();
  for(var i=0;i<stars.length;i++){
    var s=stars[i],a=.35+.55*Math.abs(Math.sin(t*.6+s.p));
    var d=Math.hypot(mx-s.x,my-s.y);
    if(d<170){
      x.strokeStyle='rgba(220,225,240,'+((1-d/170)*.22)+')';
      x.lineWidth=1;
      x.beginPath();x.moveTo(mx,my);x.lineTo(s.x,s.y);x.stroke();
    }
    for(var j=i+1;j<stars.length;j++){
      var o=stars[j],dd=Math.hypot(o.x-s.x,o.y-s.y);
      if(dd<130){
        x.strokeStyle='rgba(180,190,215,'+((1-dd/130)*.14)+')';
        x.beginPath();x.moveTo(s.x,s.y);x.lineTo(o.x,o.y);x.stroke();
      }
    }
    var glow=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*9);
    glow.addColorStop(0,'rgba(255,250,235,'+(a*.9)+')');
    glow.addColorStop(1,'rgba(255,250,235,0)');
    x.fillStyle=glow;
    x.beginPath();x.arc(s.x,s.y,s.r*9,0,7);x.fill();
    x.fillStyle='rgba(255,252,242,'+a+')';
    x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();
  }
  requestAnimationFrame(draw);
}
draw();
setTimeout(function(){cap.style.opacity='1'},400);
</script>
</body>
</html>
</section>
