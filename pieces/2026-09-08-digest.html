<section data-date='2026-09-08' data-type='digest'>
<style>
#lattice-2026-09-08{position:relative;height:80vh;min-height:420px;background:#07080d;overflow:hidden;font-family:Georgia,'Iowan Old Style',serif;cursor:crosshair;border-radius:4px}
#lattice-2026-09-08 canvas{position:absolute;inset:0;width:100%;height:100%}
#lattice-2026-09-08 .lbl{position:absolute;top:16px;left:20px;color:#9aa;font:11px/1.5 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.55;pointer-events:none}
#lattice-2026-09-08 .cnt{position:absolute;bottom:16px;right:20px;color:#556;font:11px 'Courier New',monospace;pointer-events:none}
#lattice-2026-09-08 .wd{position:absolute;color:#e8e2d0;font-size:13px;font-style:italic;opacity:0;pointer-events:none;transition:opacity 1.8s ease}
</style>
<div id="lattice-2026-09-08">
<div class="lbl">a fact, placed, becomes a point</div>
<div class="cnt" id="ct-0908">0 nodes</div>
<canvas id="cv-0908"></canvas>
</div>
<script>
(function(){
var root=document.getElementById('lattice-2026-09-08'),cv=document.getElementById('cv-0908'),ct=document.getElementById('ct-0908');
var W=root.clientWidth,H=root.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;var g=cv.getContext('2d');g.scale(dpr,dpr);
var words=['pattern','signal','residue','trace','memory','thread','echo','shard','node','root','link','field','glyph','stratum','index'];
var pts=[],mx=-999,my=-999,t=0;
function seed(x,y){pts.push({x:x,y:y,r:0,w:words[pts.length%words.length],age:0});}
seed(W*.5,H*.5);
function nearest(x,y,exclude){var b=null,bd=1e9;for(var i=0;i<pts.length;i++){if(pts[i]===exclude)continue;var d=Math.hypot(pts[i].x-x,pts[i].y-y);if(d<bd){bd=d;b=pts[i];}}return b;}
root.addEventListener('click',function(e){
  var r=root.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  var p={x:x,y:y,r:0,w:words[pts.length%words.length],age:0};
  pts.push(p);
  ct.textContent=pts.length+' node'+(pts.length===1?'':'s');
  var lbl=document.createElement('div');
  lbl.className='wd';lbl.textContent=p.w;
  lbl.style.left=(x+10)+'px';lbl.style.top=(y-8)+'px';
  root.appendChild(lbl);
  requestAnimationFrame(function(){lbl.style.opacity=1;});
  setTimeout(function(){lbl.style.opacity=0;setTimeout(function(){lbl.remove();},1800);},2600);
});
root.addEventListener('mousemove',function(e){var r=root.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
root.addEventListener('mouseleave',function(){mx=my=-999;});
function draw(){
  t++;g.clearRect(0,0,W,H);
  g.fillStyle='#07080d';g.fillRect(0,0,W,H);
  for(var i=0;i<pts.length;i++){
    var p=pts[i];p.age++;p.r=Math.min(3.2,p.r+.06);
    var near=[];
    for(var j=0;j<pts.length;j++){
      if(i===j)continue;
      var d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
      if(d<180){near.push([j,d]);}
    }
    near.sort(function(a,b){return a[1]-b[1];});
    for(var k=0;k<Math.min(3,near.length);k++){
      var q=pts[near[k][0]],op=Math.max(0,1-near[k][1]/180)*.22;
      g.strokeStyle='rgba(180,190,210,'+op+')';g.lineWidth=1;
      g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke();
    }
    var dm=Math.hypot(p.x-mx,p.y-my);
    if(dm<140){g.strokeStyle='rgba(230,200,140,'+(1-dm/140)*.5+')';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(mx,my);g.stroke();}
    var glow=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
    glow.addColorStop(0,'rgba(230,220,190,.5)');glow.addColorStop(1,'rgba(230,220,190,0)');
    g.fillStyle=glow;g.beginPath();g.arc(p.x,p.y,p.r*6,0,7);g.fill();
    g.fillStyle='#e8e2d0';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();
  }
  requestAnimationFrame(draw);
}
draw();
window.addEventListener('resize',function(){W=root.clientWidth;H=root.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.scale(dpr,dpr);});
})();
</script>
</section>
