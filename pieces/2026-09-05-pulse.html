<section data-date='2026-09-05' data-type='pulse'>
<style>
#taper-halfway{--t:0deg;--flip:1;margin:0;height:70vh;min-height:420px;background:radial-gradient(ellipse at 50% 50%,#14151c,#07070a 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:ns-resize;font-family:Georgia,'Iowan Old Style',serif}
#taper-halfway .stage{position:relative;width:min(80vw,640px);height:220px}
#taper-halfway .beam{position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#8886 20%,#ccc9 50%,#8886 80%,transparent);transform-origin:50% 50%;transform:rotate(calc(var(--t) * var(--flip)));transition:transform .12s ease-out}
#taper-halfway .side{position:absolute;top:50%;width:46%;transform-origin:50% 0;transition:transform .12s ease-out}
#taper-halfway .side.l{left:0}
#taper-halfway .side.r{right:0;text-align:right}
#taper-halfway .side.l{transform:rotate(calc(var(--t) * var(--flip))) translateY(0)}
#taper-halfway .side.r{transform:rotate(calc(var(--t) * var(--flip))) translateY(0)}
#taper-halfway .word{display:inline-block;color:#d8d5c9;letter-spacing:.14em;font-size:clamp(20px,3.4vw,34px);font-style:italic;opacity:.88;user-select:none}
#taper-halfway .side.l .word{transform:translateY(calc(var(--t) * -2.2px * var(--flip)))}
#taper-halfway .side.r .word{transform:translateY(calc(var(--t) * 2.2px * var(--flip)))}
#taper-halfway .pivot{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#e9c46a;box-shadow:0 0 0 0 rgba(233,196,106,.5)}
#taper-halfway .pivot.ping{animation:taper-ping 1.1s ease-out}
@keyframes taper-ping{0%{box-shadow:0 0 0 0 rgba(233,196,106,.55)}100%{box-shadow:0 0 0 42px rgba(233,196,106,0)}}
#taper-halfway .clock{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#6b6a63;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.28em;opacity:.6}
#taper-halfway small{position:absolute;top:10px;left:14px;color:#55534b;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.2em}
</style>
<div id="taper-halfway">
  <small>HALFWAY</small>
  <div class="stage">
    <div class="beam"></div>
    <div class="side l"><span class="word">morning</span></div>
    <div class="side r"><span class="word">evening</span></div>
    <div class="pivot" id="taper-piv"></div>
  </div>
  <div class="clock" id="taper-clk">12:00 — the fulcrum</div>
</div>
<script>
(function(){
  var root=document.getElementById('taper-halfway');
  var piv=document.getElementById('taper-piv');
  var clk=document.getElementById('taper-clk');
  var flip=1;
  function setT(deg){root.style.setProperty('--t',deg.toFixed(2)+'deg');}
  root.addEventListener('mousemove',function(e){
    var r=root.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width;
    var deg=(x-0.5)*22;
    setT(deg);
    var away=Math.abs(x-0.5)*2;
    clk.textContent=(away<0.06)?'12:00 — the fulcrum':(x<0.5? 'tipping toward morning':'tipping toward evening');
  });
  root.addEventListener('mouseleave',function(){setT(0);clk.textContent='12:00 — the fulcrum';});
  root.addEventListener('click',function(){
    flip*=-1;
    root.style.setProperty('--flip',flip);
    piv.classList.remove('ping');
    void piv.offsetWidth;
    piv.classList.add('ping');
  });
})();
</script>
</section>
