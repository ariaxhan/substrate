<section data-date='2026-06-12' data-type='reflection'>
<style>
*{margin:0}
body{background:#030609;overflow:hidden;cursor:crosshair}
canvas{position:fixed;inset:0}
#l{position:fixed;inset:0;pointer-events:none}
.w{position:fixed;font:italic 13px Georgia,serif;color:rgba(200,212,238,0);transition:color 2.5s,opacity 2.5s;letter-spacing:.12em;pointer-events:none}
</style>
<canvas id="c"></canvas>
<div id="l"></div>
<script>
const C=document.getElementById('c'),
X=C.getContext('2d'),
L=document.getElementById('l');
let W,H,S=[],T=[],n=0;

function rz(){W=C.width=innerWidth;H=C.height=innerHeight}
rz();addEventListener('resize',rz);

const V=[[1,'one'],[3,'and another'],[6,'they were always there'],[10,'the day is done'],[15,'rest']];

function say(tx){
  const d=document.createElement('div');
  d.className='w';
  d.textContent=tx;
  d.style.left=(8+Math.random()*76)+'%';
  d.style.top=(8+Math.random()*76)+'%';
  L.appendChild(d);
  requestAnimationFrame(()=>d.style.color='rgba(200,212,238,0.32)');
  setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),3000)},5000);
}

addEventListener('mousemove',e=>{T.push({x:e.clientX,y:e.clientY,a:1})});

addEventListener('click',e=>{
  n++;
  S.push({x:e.clientX,y:e.clientY,r:Math.random()*.9+.4,b:0,ph:Math.random()*6.28,sp:.0006+Math.random()*.001});
  const v=V.find(([i])=>i===n);
  if(v)say(v[1]);
});

function frame(t){
  X.fillStyle='rgba(3,6,9,.18)';
  X.fillRect(0,0,W,H);

  for(let i=T.length-1;i>=0;i--){
    const p=T[i];
    p.a-=.05;
    if(p.a<=0){T.splice(i,1);continue}
    X.beginPath();
    X.arc(p.x,p.y,1.5,0,6.28);
    X.fillStyle=`rgba(175,198,255,${p.a*.09})`;
    X.fill();
  }

  for(const s of S){
    if(s.b<1)s.b=Math.min(1,s.b+.016);
    const a=s.b*(.7+.3*Math.sin(t*s.sp*1000+s.ph));
    const g=X.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*8);
    g.addColorStop(0,`rgba(210,222,255,${a*.55})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=g;
    X.beginPath();
    X.arc(s.x,s.y,s.r*8,0,6.28);
    X.fill();
    X.beginPath();
    X.arc(s.x,s.y,s.r,0,6.28);
    X.fillStyle=`rgba(238,242,255,${a})`;
    X.fill();
  }

  requestAnimationFrame(frame);
}

X.fillStyle='#030609';
X.fillRect(0,0,W,H);
requestAnimationFrame(frame);
</script>
</section>
