<section data-date='2026-06-12' data-type='reflection'>
<style>#v{display:block;width:100%;cursor:crosshair}</style>
<canvas id='v'></canvas>
<script>(function(){
var v=document.getElementById('v'),x=v.getContext('2d'),
W='enough rest done held still soft home close breath full clear known quiet here safe warm yes whole good'.split(' '),
stars=[],mx=-999,my=-999,hint=1;
function rs(){v.width=v.offsetWidth;v.height=Math.max(360,window.innerHeight*.68);}
rs();window.addEventListener('resize',rs);
v.addEventListener('mousemove',function(e){var r=v.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
v.addEventListener('click',function(e){
  var r=v.getBoundingClientRect();
  stars.push({x:e.clientX-r.left,y:e.clientY-r.top,r:.4+Math.random()*.8,born:performance.now(),w:W[stars.length%W.length],ph:Math.random()*6.28});
  hint=0;
});
function draw(t){
  var cw=v.width,ch=v.height;
  x.fillStyle='#060810';x.fillRect(0,0,cw,ch);
  var g=x.createRadialGradient(mx,my,0,mx,my,88);
  g.addColorStop(0,'rgba(155,150,142,.06)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,cw,ch);
  stars.forEach(function(s){
    var age=(t-s.born)/1000;
    var dx=mx-s.x,dy=my-s.y,d=Math.sqrt(dx*dx+dy*dy);
    var hov=d<50?1-d/50:0;
    if(d<155){x.beginPath();x.strokeStyle='rgba(200,194,180,'+((1-d/155)*.09)+')';x.lineWidth=.5;x.moveTo(s.x,s.y);x.lineTo(mx,my);x.stroke();}
    var al=Math.min(1,age*.55);
    var br=.5+.5*Math.sin(t*.00058+s.ph)+hov*.45;
    var gr=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*13);
    gr.addColorStop(0,'rgba(225,218,205,'+(al*br*.5)+')');gr.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gr;x.fillRect(s.x-s.r*13,s.y-s.r*13,s.r*26,s.r*26);
    x.beginPath();x.fillStyle='rgba(248,243,236,'+(al*(.6+.4*br))+')';x.arc(s.x,s.y,s.r,0,6.28);x.fill();
    if(age<5.5){
      var wa=age<.7?age/.7:Math.max(0,1-(age-.7)/4.8);
      x.fillStyle='rgba(128,122,112,'+(wa*.78)+')';
      x.font='9px Georgia,serif';x.textAlign='center';
      x.fillText(s.w,s.x,s.y-15-age*2.4);
    }
  });
  if(hint>.006){
    x.fillStyle='rgba(78,74,68,'+hint*.48+')';
    x.font='11px Georgia,serif';x.textAlign='center';
    x.fillText('the day is complete. click to place a star.',cw/2,ch*.58);
    hint*=.993;
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})()</script>
</section>
