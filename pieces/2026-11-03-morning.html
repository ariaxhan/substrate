<section data-date='2026-11-03' data-type='morning'>
<style>
#d{position:relative;height:100vh;overflow:hidden;cursor:crosshair;font:italic 300 clamp(18px,3.4vw,34px)/1.5 Georgia,serif;color:#fff;background:var(--g,#0b1020);transition:background .3s}
#d p{position:absolute;left:0;right:0;bottom:14%;margin:0;text-align:center;letter-spacing:.08em;pointer-events:none}
#d span{display:inline-block;transition:opacity .6s,transform .6s,color .6s;opacity:.12;white-space:pre}
#d span.on{opacity:1;transform:translateY(-.25em)}
#s{position:absolute;width:18vmin;height:18vmin;border-radius:50%;left:50%;top:70%;margin:-9vmin;background:radial-gradient(#fff6d8,#ffb36b 40%,#ff7a5c00 70%);filter:blur(2px);pointer-events:none}
#d i{position:absolute;left:0;right:0;top:70%;height:1px;background:#fff4;pointer-events:none}
</style>
<div id=d><div id=s></div><i></i><p id=t></p></div>
<script>
(function(){
var d=document.getElementById('d'),s=document.getElementById('s'),t=document.getElementById('t'),
w=['nothing is written yet','the light has not decided','you are the first mark','begin'],n=0,x=.5,y=.9,L;
function set(m){t.innerHTML='';L=[];for(var c of m){var e=document.createElement('span');e.textContent=c;t.appendChild(e);L.push(e)}}
function lerp(a,b,k){return Math.round(a+(b-a)*k)}
function paint(){
 var k=Math.max(0,Math.min(1,1-y)),
 top='rgb('+lerp(11,255,k*.55)+','+lerp(16,150,k*.55)+','+lerp(32,140,k*.7)+')',
 mid='rgb('+lerp(20,255,k)+','+lerp(24,170,k)+','+lerp(60,120,k)+')',
 bot='rgb('+lerp(10,255,k)+','+lerp(14,214,k)+','+lerp(30,150,k)+')';
 d.style.setProperty('--g','linear-gradient('+top+','+mid+' 70%,'+bot+')');
 s.style.top=(30+y*45)+'%';s.style.left=(x*100)+'%';
 d.querySelector('i').style.top=(30+y*45+9)+'%';
 L.forEach(function(e,i){var p=(i+.5)/L.length;e.className=Math.abs(p-x)<.12+k*.4?'on':'';e.style.color=k>.55?'#3b2a3a':'#fff'});
 t.style.color=k>.55?'#3b2a3a':'#fff';
}
d.onmousemove=function(e){x=e.clientX/innerWidth;y=e.clientY/innerHeight;paint()};
d.ontouchmove=function(e){var q=e.touches[0];x=q.clientX/innerWidth;y=q.clientY/innerHeight;paint()};
d.onclick=function(){n=(n+1)%w.length;set(w[n]);paint()};
set(w[0]);paint();
})();
</script>
</section>
