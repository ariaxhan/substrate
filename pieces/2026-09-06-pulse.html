<section data-date='2026-09-06' data-type='pulse'>
<style>
#fp{margin:0;height:70vh;min-height:420px;background:linear-gradient(#0b0c10,#1b1e26);position:relative;overflow:hidden;font-family:Georgia,'Times New Roman',serif;cursor:pointer;user-select:none}
#fp .axis{position:absolute;left:50%;top:50%;width:1px;height:120px;background:rgba(255,214,140,.35);transform:translate(-50%,-100%)}
#fp .beam{position:absolute;left:50%;top:50%;width:70%;height:2px;background:#e9c88a;transform-origin:center center;transition:transform .18s ease-out}
#fp .pan{position:absolute;top:0;width:120px;text-align:center;font-size:15px;letter-spacing:.14em;color:#eee;transform:translate(-50%,10px)}
#fp .pan span{display:block;font-size:11px;opacity:.55;letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
#fp .l{left:15%}
#fp .r{left:85%}
#fp .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:22px solid #e9c88a}
#fp .word{position:absolute;left:50%;top:52%;transform:translate(-50%,0);font-size:12px;color:#ffd68c;opacity:0;letter-spacing:.3em;text-transform:lowercase;transition:opacity .6s ease}
#fp .word.on{opacity:.85}
#fp .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#777;letter-spacing:.2em;font-family:monospace}
</style>
<div id="fp">
  <div class="axis"></div>
  <div class="mid"></div>
  <div class="beam"></div>
  <div class="pan l">MORNING<span>weight</span></div>
  <div class="pan r">EVENING<span>weight</span></div>
  <div class="word">still</div>
  <div class="hint">tilt · click to flip</div>
</div>
<script>
(function(){
  var el=document.getElementById('fp'),beam=el.querySelector('.beam'),
      L=el.querySelector('.l'),R=el.querySelector('.r'),word=el.querySelector('.word');
  var tilt=0, flipped=false, resting=true, raf;
  var words=['still','poised','held','level','breath','even'];
  function paint(){
    var deg=tilt*16 + (flipped?180:0);
    beam.style.transform='translate(-50%,-50%) rotate('+deg+'deg)';
    var rise=tilt*46;
    L.style.transform='translate(-50%,'+(10+rise)+'px)';
    R.style.transform='translate(-50%,'+(10-rise)+'px)';
    var near = Math.abs(tilt) < 0.06;
    word.classList.toggle('on', near && resting);
    if(near) word.textContent = words[(Date.now()/900|0) % words.length];
  }
  el.addEventListener('mousemove', function(e){
    resting=false;
    var r=el.getBoundingClientRect();
    tilt = ((e.clientX - r.left)/r.width - 0.5) * 2;
    clearTimeout(raf);
    raf=setTimeout(function(){resting=true;tilt=0;paint();},1400);
    paint();
  });
  el.addEventListener('mouseleave', function(){tilt=0;resting=true;paint();});
  el.addEventListener('click', function(){flipped=!flipped;paint();});
  setInterval(paint, 400);
  paint();
})();
</script>
</section>
