<section data-date='2026-09-21' data-type='reflection'>
<style>
#taper-0921{margin:0;overflow:hidden;height:100vh;background:radial-gradient(ellipse at 50% 100%,#0a1128 0%,#020208 70%);position:relative;font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
#taper-0921 .horizon{position:absolute;bottom:0;left:0;width:100%;height:22%;background:linear-gradient(to top,#000,rgba(0,0,0,0));z-index:2}
#taper-0921 .word{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);color:#5a6a8a;font-size:clamp(14px,2.4vw,26px);letter-spacing:.35em;text-transform:lowercase;opacity:0;transition:opacity 3s ease;z-index:3;pointer-events:none;text-align:center;width:90%}
#taper-0921 .word.on{opacity:.8}
#taper-0921 .hint{position:absolute;top:16px;left:16px;color:#3a4560;font-size:11px;letter-spacing:.2em;font-family:Arial,sans-serif;text-transform:uppercase;opacity:.6}
#taper-0921 .count{position:absolute;top:16px;right:18px;color:#2c3552;font-size:11px;font-family:Arial,sans-serif;letter-spacing:.15em}
</style>
<div id="taper-0921">
  <div class="hint">click the dark</div>
  <div class="count" id="tp-count">0 stars</div>
  <div class="word" id="tp-word"></div>
  <div class="horizon"></div>
</div>
<script>
(function(){
  var root=document.getElementById('taper-0921');
  var wordEl=document.getElementById('tp-word');
  var countEl=document.getElementById('tp-count');
  var words=['the day is complete','rest now','nothing left undone','stillness','tomorrow can wait','breathe','the dark holds you','enough','let it close','quiet now'];
  var used=[];
  var stars=[];
  var n=0;
  function nextWord(){
    if(used.length===words.length)used=[];
    var w;
    do{w=words[Math.floor(Math.random()*words.length)];}while(used.indexOf(w)>-1);
    used.push(w);
    return w;
  }
  function showWord(){
    wordEl.textContent=nextWord();
    wordEl.classList.add('on');
    setTimeout(function(){wordEl.classList.remove('on');},2800);
  }
  root.addEventListener('click',function(e){
    if(e.target.closest('.horizon'))return;
    var rect=root.getBoundingClientRect();
    var x=e.clientX-rect.left, y=e.clientY-rect.top;
    var s=document.createElement('div');
    var size=(Math.random()*2.2+1).toFixed(2);
    s.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:#fff;box-shadow:0 0 '+(size*4)+'px '+(size*1.5)+'px rgba(255,255,255,.55);transform:translate(-50%,-50%);opacity:0;transition:opacity 2.5s ease;z-index:1;pointer-events:none';
    root.appendChild(s);
    requestAnimationFrame(function(){s.style.opacity=(Math.random()*.5+.5).toFixed(2);});
    var drift=(Math.random()*40-20);
    setTimeout(function(){s.style.transform='translate(calc(-50% + '+drift+'px),-50%)';s.style.transition='transform 40s linear, opacity 2.5s ease';},50);
    stars.push(s);
    n++;
    countEl.textContent=n+(n===1?' star':' stars');
    if(n%4===0)showWord();
    if(stars.length>140){var old=stars.shift();old.style.opacity=0;setTimeout(function(){old.remove();},2500);}
  });
  setTimeout(function(){
    var rect=root.getBoundingClientRect();
    for(var i=0;i<3;i++){
      root.dispatchEvent(new MouseEvent('click',{clientX:rect.left+rect.width*Math.random(),clientY:rect.top+rect.height*Math.random()*0.7}));
    }
  },900);
})();
</script>
</section>
