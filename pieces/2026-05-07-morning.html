<section data-date='2026-05-07' data-type='morning'>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0d0c18;overflow:hidden;height:100vh;cursor:none;transition:background 2.8s ease}
body.dawn{background:#f4ead8}
.phrase{position:fixed;font-family:Georgia,'Times New Roman',serif;color:#f0e5c4;opacity:0;pointer-events:none;line-height:1.3;transition:opacity 1.5s ease,color 2.8s ease}
body.dawn .phrase{color:#251c0c;opacity:.88}
.phrase.lit{opacity:.88}
.glow{position:fixed;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,100,.52) 0%,rgba(255,160,50,.18) 45%,transparent 70%);transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen}
body.dawn .glow{opacity:0}
.hint{position:fixed;bottom:1.6rem;width:100%;text-align:center;font-family:Georgia,serif;font-size:.62rem;letter-spacing:.2em;color:rgba(200,175,120,.45);pointer-events:none;font-style:italic;transition:color 2.8s}
body.dawn .hint{color:rgba(100,75,30,.4)}
</style>
<div class="glow" id="g"></div>
<div class="hint" id="h">move to find the light &middot; click to break dawn</div>
<script>
const P=[
  {t:"before",       x:7,  y:10, s:3.8, ls:"-.02em"},
  {t:"the world\nhasn't decided yet", x:54,y:5, s:1.05,ls:".04em"},
  {t:"still",        x:16, y:43, s:3.1, ls:".1em"},
  {t:"an hour no one\ncan take back", x:37,y:54,s:.92,ls:".03em"},
  {t:"light\ngathering",x:66,y:25,s:1.55,ls:".06em"},
  {t:"not yet\nnot yet",x:9, y:70, s:.88,ls:".08em"},
  {t:"permission",   x:57, y:66, s:1.45,ls:".12em"},
  {t:"the gap\nbefore becoming",x:26,y:80,s:.94,ls:".04em"},
  {t:"open",         x:74, y:80, s:2.9, ls:".15em"},
  {t:"the day starts\ninnocent", x:41,y:38,s:.95,ls:".03em"},
];

const g=document.getElementById('g'),h=document.getElementById('h'),els=[];
let dawn=false;

P.forEach(p=>{
  const el=document.createElement('div');
  el.className='phrase';
  el.style.cssText=`left:${p.x}vw;top:${p.y}vh;font-size:${p.s}rem;letter-spacing:${p.ls}`;
  el.innerHTML=p.t.replace(/\n/g,'<br>');
  document.body.appendChild(el);
  els.push(el);
});

document.addEventListener('mousemove',e=>{
  g.style.left=e.clientX+'px';
  g.style.top=e.clientY+'px';
  if(dawn)return;
  els.forEach(el=>{
    if(el.classList.contains('lit'))return;
    const r=el.getBoundingClientRect();
    const d=Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2);
    if(d<148)el.classList.add('lit');
  });
});

document.addEventListener('click',()=>{
  dawn=!dawn;
  document.body.classList.toggle('dawn',dawn);
  h.textContent=dawn?'the day has begun \xb7 click to return to before':'move to find the light \xb7 click to break dawn';
  if(!dawn)els.forEach(el=>el.classList.remove('lit'));
});
</script>
</section>
