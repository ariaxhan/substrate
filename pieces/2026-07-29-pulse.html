<section data-date='2026-07-29' data-type='pulse'>
<style>
  #taper-halfway{position:relative;width:100%;height:100vh;background:#0b0b0d;overflow:hidden;font-family:Georgia,'Times New Roman',serif;transition:filter .6s ease}
  #taper-halfway.flip{filter:invert(1) hue-rotate(180deg)}
  #taper-halfway .rule{position:absolute;top:50%;left:50%;width:1px;height:100%;background:linear-gradient(#0b0b0d,#333,#0b0b0d);transform:translate(-50%,-50%);opacity:.4}
  #taper-halfway .fulcrum{position:absolute;left:50%;top:50%;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #55524a;transform:translate(-50%,0)}
  #taper-halfway .beam{position:absolute;left:50%;top:50%;width:64vw;max-width:820px;height:2px;background:linear-gradient(90deg,#d9a066,#8c8478 50%,#6a8caf);transform-origin:50% 50%;transform:translate(-50%,-50%) rotate(0deg);transition:transform .08s linear}
  #taper-halfway .beam span{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(1rem,2.4vw,1.8rem);letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
  #taper-halfway .l{left:0;color:#d9a066;font-style:italic}
  #taper-halfway .r{right:0;color:#6a8caf;font-family:'Courier New',monospace;font-style:normal}
  #taper-halfway .word{position:absolute;top:0;transform:translateY(-140%)}
  #taper-halfway .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-260%);color:#cfcabe;font-size:.72rem;letter-spacing:.5em;text-transform:uppercase;opacity:0;transition:opacity .5s ease}
  #taper-halfway .center.show{opacity:.85}
  #taper-halfway .hint{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);color:#55524a;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;font-family:'Courier New',monospace}
</style>
<div id="taper-halfway">
  <div class="rule"></div>
  <div class="fulcrum"></div>
  <div class="center" id="hwCenter">equilibrium</div>
  <div class="beam" id="hwBeam">
    <span class="l">dawn</span>
    <span class="r">dusk</span>
  </div>
  <div class="hint">tilt to weigh the day &middot; click to invert</div>
</div>
<script>
(function(){
  var stage=document.getElementById('taper-halfway'),
      beam=document.getElementById('hwBeam'),
      center=document.getElementById('hwCenter'),
      pairs=[['dawn','dusk'],['noon','midnight'],['begin','end'],['rise','rest']],
      pi=0;
  stage.addEventListener('mousemove',function(e){
    var r=stage.getBoundingClientRect(),
        x=(e.clientX-r.left)/r.width-.5,
        deg=Math.max(-18,Math.min(18,x*40));
    beam.style.transform='translate(-50%,-50%) rotate('+deg+'deg)';
    center.classList.toggle('show',Math.abs(deg)<1.2);
  });
  stage.addEventListener('touchmove',function(e){
    var t=e.touches[0],r=stage.getBoundingClientRect(),
        x=(t.clientX-r.left)/r.width-.5,
        deg=Math.max(-18,Math.min(18,x*40));
    beam.style.transform='translate(-50%,-50%) rotate('+deg+'deg)';
    center.classList.toggle('show',Math.abs(deg)<1.2);
  },{passive:true});
  stage.addEventListener('click',function(){
    stage.classList.toggle('flip');
    pi=(pi+1)%pairs.length;
    var l=beam.querySelector('.l'),r=beam.querySelector('.r');
    l.textContent=pairs[pi][0];
    r.textContent=pairs[pi][1];
  });
})();
</script>
</section>
