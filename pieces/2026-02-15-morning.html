<section data-date='2026-02-15' data-type='morning'>
<style>
body,html{margin:0;padding:0;width:100%;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
#c{position:relative;width:100%;height:100%;background:linear-gradient(to bottom,#0a0a12 0%,#1a1a2e 40%,#2e1a3e 60%,#4a2a5e 100%);transition:background 3s ease;cursor:pointer}
#c.dawn{background:linear-gradient(to bottom,#ffd89b 0%,#19547b 50%,#0f2027 100%)}
.word{position:absolute;color:rgba(255,255,255,0.08);font-size:14px;letter-spacing:2px;transition:all 2s ease;pointer-events:none;font-weight:300}
.word.lit{color:rgba(255,230,180,0.9);text-shadow:0 0 20px rgba(255,200,100,0.6);font-size:16px}
#hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:1px;opacity:1;transition:opacity 2s}
#hint.hide{opacity:0}
</style>
<div id="c">
<div id="hint">click to wake</div>
</div>
<script>
const words=[
'potential','unwritten','first','breath','threshold','nascent','emerge',
'possibility','blank','begin','open','wake','rise','new','genesis',
'origin','kindle','spark','initiate','dawn','light','start','fresh'
];
const c=document.getElementById('c');
const hint=document.getElementById('hint');
let awakened=false;
let wordEls=[];

function spawn(){
  const w=document.createElement('div');
  w.className='word';
  w.textContent=words[Math.floor(Math.random()*words.length)];
  w.style.left=Math.random()*90+'%';
  w.style.top=Math.random()*90+'%';
  c.appendChild(w);
  wordEls.push(w);
}

for(let i=0;i<45;i++){
  spawn();
}

c.addEventListener('click',()=>{
  if(awakened)return;
  awakened=true;
  c.classList.add('dawn');
  hint.classList.add('hide');

  wordEls.forEach((w,i)=>{
    setTimeout(()=>{
      w.classList.add('lit');
      setTimeout(()=>{
        w.style.top=(Math.random()*30+35)+'%';
        w.style.left=(Math.random()*60+20)+'%';
      },100);
    },i*80);
  });
});
</script>
</section>
