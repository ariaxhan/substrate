<section data-date='2026-07-28' data-type='reflection'>
<style>
#taper0728{position:relative;width:100%;height:100vh;margin:0;overflow:hidden;background:#05060f;background:radial-gradient(ellipse at 50% 115%,#141c3a 0%,#05060f 62%);cursor:crosshair;font-family:Georgia,serif}
#taper0728 .dust{position:absolute;width:2px;height:2px;background:#cfd6ff;border-radius:50%;opacity:.12;transition:opacity .5s ease;animation:t0728tw 5s ease-in-out infinite}
@keyframes t0728tw{0%,100%{filter:brightness(1)}50%{filter:brightness(1.9)}}
#taper0728 .star{position:absolute;transform:translate(-50%,-50%);background:#fdf3d0;border-radius:50%;box-shadow:0 0 8px 2px rgba(253,243,208,.7),0 0 20px 6px rgba(253,243,208,.2);animation:t0728pop .6s ease-out}
@keyframes t0728pop{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#taper0728 .word{position:absolute;font-style:italic;font-size:14px;color:#c9d2f0;opacity:.85;pointer-events:none;animation:t0728rise 4.2s ease-out forwards;white-space:nowrap}
@keyframes t0728rise{0%{opacity:0;transform:translateY(0)}10%{opacity:.85}100%{opacity:0;transform:translateY(-42px)}}
#taper0728 .hint{position:absolute;bottom:8vh;width:100%;text-align:center;font-weight:300;font-size:13px;line-height:1.6;color:#5a6490;letter-spacing:.14em;pointer-events:none;animation:t0728in 2.5s ease}
#taper0728 .title{position:absolute;top:6vh;width:100%;text-align:center;font-style:italic;font-weight:300;font-size:22px;color:#8891c0;letter-spacing:.05em}
@keyframes t0728in{from{opacity:0}to{opacity:1}}
</style>
<div id="taper0728">
  <div class="title">night, quietly</div>
  <div class="hint">the day is finished. touch the dark to leave a star.</div>
</div>
<script>
(function(){
  var sky=document.getElementById('taper0728');
  var dust=[];
  for(var i=0;i<50;i++){
    var d=document.createElement('div');
    d.className='dust';
    var x=Math.random()*100,y=Math.random()*100;
    d.style.left=x+'%';d.style.top=y+'%';
    d.style.animationDelay=(Math.random()*6)+'s';
    sky.appendChild(d);
    dust.push({el:d,x:x,y:y});
  }
  sky.addEventListener('mousemove',function(e){
    var r=sky.getBoundingClientRect();
    var mx=(e.clientX-r.left)/r.width*100, my=(e.clientY-r.top)/r.height*100;
    for(var i=0;i<dust.length;i++){
      var s=dust[i];
      var dx=s.x-mx, dy=s.y-my;
      var dist=Math.sqrt(dx*dx+dy*dy);
      s.el.style.opacity=Math.max(.08,1-dist/16);
    }
  });
  var words=['hush','rest','still','ember','dusk','enough','quiet','home','soon','dream','breathe','done'];
  sky.addEventListener('click',function(e){
    var hint=sky.querySelector('.hint');
    if(hint)hint.remove();
    var r=sky.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    var star=document.createElement('div');
    star.className='star';
    star.style.left=x+'px';
    star.style.top=y+'px';
    var sz=(Math.random()*3+2);
    star.style.width=star.style.height=sz+'px';
    sky.appendChild(star);
    var w=document.createElement('span');
    w.className='word';
    w.textContent=words[Math.floor(Math.random()*words.length)];
    w.style.left=(x+8)+'px';
    w.style.top=(y-8)+'px';
    sky.appendChild(w);
    setTimeout(function(){w.remove();},4200);
  });
})();
</script>
</section>
