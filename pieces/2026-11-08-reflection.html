<section data-date='2026-11-08' data-type='reflection'>
<style>
.nt{position:relative;height:100vh;min-height:360px;background:radial-gradient(ellipse at 50% 120%,#2a2350,#0b0d1e 60%,#04050c);overflow:hidden;cursor:crosshair;font-family:Georgia,'Times New Roman',serif}
.nt canvas{position:absolute;inset:0;width:100%;height:100%}
.nt p{position:absolute;left:0;right:0;bottom:9%;text-align:center;color:#b9b4e0;font-style:italic;letter-spacing:.4em;font-size:14px;margin:0;opacity:.6;animation:b 6s ease-in-out infinite;pointer-events:none}
@keyframes b{50%{opacity:.15}}
</style>
<div class="nt"><canvas></canvas><p>the day is done · touch the dark</p></div>
<script>
(()=>{
const s=document.currentScript.parentNode,c=s.querySelector('canvas'),x=c.getContext('2d'),h=s.querySelector('p');
const W=['rest','breathe','enough','held','soft','sleep','again','quiet','kept','tomorrow'];
let S=[],T=[],w,H,m=null,k=0;
function r(){w=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
r();addEventListener('resize',r);
for(let i=0;i<40;i++)S.push({x:Math.random()*w,y:Math.random()*H*.8,r:Math.random()+.3,p:Math.random()*6,l:0});
c.onclick=e=>{const b=c.getBoundingClientRect(),X=e.clientX-b.left,Y=e.clientY-b.top;
S.push({x:X,y:Y,r:2.2,p:0,l:1});T.push({x:X,y:Y-14,t:W[k++%W.length],a:1});h.style.display='none'};
c.onmousemove=e=>{const b=c.getBoundingClientRect();m={x:e.clientX-b.left,y:e.clientY-b.top}};
c.onmouseleave=()=>m=null;
(function f(t){
x.clearRect(0,0,w,H);
for(const a of S){
 let g=.5+.5*Math.sin(t/900+a.p);
 if(m){const d=Math.hypot(a.x-m.x,a.y-m.y);if(d<110){g=1;
  for(const b of S)if(b!==a&&Math.hypot(a.x-b.x,a.y-b.y)<110){x.strokeStyle='rgba(185,180,255,'+(.35*(1-d/110))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
 x.fillStyle='rgba(235,230,255,'+(.25+.75*g)+')';
 x.shadowColor='#b9b4ff';x.shadowBlur=a.l?14:g*8;
 x.beginPath();x.arc(a.x,a.y,a.r*(1+g*.4),0,7);x.fill()}
x.shadowBlur=0;x.font='italic 18px Georgia';x.textAlign='center';
for(const q of T){q.a=Math.max(.0,q.a-.0015);x.fillStyle='rgba(215,210,255,'+q.a+')';x.fillText(q.t,q.x,q.y-(1-q.a)*30)}
T=T.filter(q=>q.a>0);
requestAnimationFrame(f)})(0)
})()
</script>
</section>
