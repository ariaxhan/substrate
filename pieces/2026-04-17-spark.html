<section data-date='2026-04-17' data-type='spark'>
<style>
#cv{display:block;cursor:crosshair;background:#000}
</style>
<canvas id=cv></canvas>
<script>
const cv=document.getElementById('cv'),g=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;
const W=[['you','me','us'],['fire','water','steam'],['light','dark','dusk'],['signal','noise','music'],['before','after','now']];
let n=0,mx=.5,my=.5;
let A={x:.08,y:.5,vx:.0008,vy:0};
let B={x:.92,y:.5,vx:-.0008,vy:0};
let fl=0,done=0,t=0;
onmousemove=e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight};
onclick=()=>!fl&&(A.vx+=.005,B.vx-=.005);
function rst(){n=(n+1)%W.length;A={x:.08,y:.5,vx:.0008,vy:0};B={x:.92,y:.5,vx:-.0008,vy:0};fl=0;done=0}
function draw(){
  t+=.016;
  const w=cv.width,h=cv.height,f=~~(w*.042);
  g.fillStyle='rgba(0,0,0,.09)';g.fillRect(0,0,w,h);
  g.textAlign='center';g.textBaseline='middle';
  if(!fl){
    // cursor as meeting-point gravity — both drawn toward cursor, with repulsion from each other
    let dx=mx-.5,dy=my-.5;
    A.vx+=(mx-A.x)*.00025+(0.5-A.x)*.0001;
    A.vy+=(my-A.y)*.00025+(0.5-A.y)*.0001+Math.sin(t*.7)*.00008;
    B.vx+=(mx-B.x)*.00025+(0.5-B.x)*.0001;
    B.vy+=(my-B.y)*.00025+(0.5-B.y)*.0001+Math.sin(t*.7+Math.PI)*.00008;
    // mutual repulsion until very close
    let rx=B.x-A.x,ry=B.y-A.y,rd=Math.hypot(rx,ry)||.001;
    if(rd>.05){let r=.00003/rd;A.vx-=rx*r;A.vy-=ry*r;B.vx+=rx*r;B.vy+=ry*r}
    A.vx*=.97;A.vy*=.97;B.vx*=.97;B.vy*=.97;
    A.x+=A.vx;A.y+=A.vy;B.x+=B.vx;B.y+=B.vy;
    let d=Math.hypot(A.x-B.x,A.y-B.y);
    // thread between them
    if(d<.35){
      let p=1-d/.35,cx=(A.x+B.x)/2,cy=(A.y+B.y)/2;
      let gr=g.createLinearGradient(A.x*w,A.y*h,B.x*w,B.y*h);
      gr.addColorStop(0,'rgba(140,160,255,'+p*.7+')');
      gr.addColorStop(.5,'rgba(255,255,180,'+p*.9+')');
      gr.addColorStop(1,'rgba(255,140,140,'+p*.7+')');
      g.strokeStyle=gr;g.lineWidth=1+p*2;
      g.beginPath();g.moveTo(A.x*w,A.y*h);g.lineTo(B.x*w,B.y*h);g.stroke();
    }
    g.font=f+'px monospace';
    g.fillStyle='rgba(140,160,255,.95)';g.fillText(W[n][0],A.x*w,A.y*h);
    g.fillStyle='rgba(255,140,140,.95)';g.fillText(W[n][1],B.x*w,B.y*h);
    if(d<.038)fl=.001;
  } else if(fl<1){
    fl+=.016;
    let a=fl<.5?fl*2:(2-fl*2);
    let sf=f*(1+fl*.6);
    g.font=~~sf+'px monospace';
    g.fillStyle='rgba(255,255,200,'+Math.max(0,a)+')';
    g.fillText(W[n][2],w/2,h/2);
    if(fl>=1&&!done){done=1;setTimeout(rst,900)}
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</section>
