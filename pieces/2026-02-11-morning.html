<section data-date='2026-02-11' data-type='morning'>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(to bottom, #0a0a12 0%, #1a1428 40%, #2d1b3d 70%, #4a2850 85%, #6b3d5e 95%, #8d5268 100%);
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  cursor: crosshair;
}
.horizon {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #8d5268, transparent);
  opacity: 0.3;
}
.word {
  position: absolute;
  color: rgba(255, 255, 255, 0);
  font-size: 14px;
  letter-spacing: 2px;
  transition: color 1.2s ease, transform 0.8s ease;
  pointer-events: none;
  font-weight: 300;
}
.word.lit {
  color: rgba(255, 240, 220, 0.9);
  transform: translateY(-3px);
}
.spark {
  position: absolute;
  width: 1px;
  height: 1px;
  background: #ffd700;
  box-shadow: 0 0 4px #ffd700;
  border-radius: 50%;
  pointer-events: none;
  animation: rise 3s ease-out forwards;
}
@keyframes rise {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-200px) scale(0.3);
  }
}
.sun {
  position: absolute;
  bottom: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 200, 100, 0.1) 0%, transparent 70%);
  transition: bottom 4s ease-out, opacity 4s ease-out;
  opacity: 0;
  pointer-events: none;
}
.sun.rising {
  bottom: 20%;
  opacity: 0.4;
}
.instruction {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255, 255, 255, 0.15);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  transition: opacity 1s ease;
  pointer-events: none;
}
.instruction.fade {
  opacity: 0;
}
</style>

<div class="sun"></div>
<div class="horizon"></div>
<div class="instruction">click to break</div>

<script>
const words = [
  'before', 'light', 'potential', 'unwritten', 'threshold',
  'silence', 'emergence', 'first', 'breath', 'possibility',
  'genesis', 'horizon', 'awakening', 'nascent', 'dawn'
];

const positions = [];
const gap = 80;
const cols = Math.floor(window.innerWidth / gap);
const rows = Math.floor(window.innerHeight / gap);

for (let y = 0; y < rows; y++) {
  for (let x = 0; x < cols; x++) {
    positions.push({
      x: x * gap + gap / 2,
      y: y * gap + gap / 2,
      lit: false
    });
  }
}

const wordEls = positions.map((pos, i) => {
  const el = document.createElement('div');
  el.className = 'word';
  el.textContent = words[i % words.length];
  el.style.left = pos.x + 'px';
  el.style.top = pos.y + 'px';
  document.body.appendChild(el);
  return { el, pos };
});

let clicked = false;
const sun = document.querySelector('.sun');
const instruction = document.querySelector('.instruction');

function dist(x1, y1, x2, y2) {
  return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function createSpark(x, y) {
  const spark = document.createElement('div');
  spark.className = 'spark';
  spark.style.left = x + 'px';
  spark.style.top = y + 'px';
  document.body.appendChild(spark);
  setTimeout(() => spark.remove(), 3000);
}

document.body.addEventListener('click', (e) => {
  if (!clicked) {
    clicked = true;
    sun.classList.add('rising');
    instruction.classList.add('fade');
  }

  const cx = e.clientX;
  const cy = e.clientY;

  wordEls.forEach(({ el, pos }) => {
    const d = dist(cx, cy, pos.x, pos.y);
    if (d < 150 && !pos.lit) {
      pos.lit = true;
      setTimeout(() => {
        el.classList.add('lit');
      }, Math.random() * 200);
    }
  });

  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      createSpark(
        cx + (Math.random() - 0.5) * 30,
        cy + (Math.random() - 0.5) * 30
      );
    }, i * 100);
  }
});

document.body.addEventListener('mousemove', (e) => {
  if (!clicked) return;

  const cx = e.clientX;
  const cy = e.clientY;

  wordEls.forEach(({ el, pos }) => {
    const d = dist(cx, cy, pos.x, pos.y);
    if (d < 100 && !pos.lit) {
      pos.lit = true;
      el.classList.add('lit');
    }
  });
});
</script>
</section>
