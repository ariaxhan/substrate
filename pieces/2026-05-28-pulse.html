<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fulcrum — 2026-05-28</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<section data-date='2026-05-28' data-type='pulse'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;overflow:hidden;cursor:crosshair}
#sc{position:fixed;inset:0;transform-origin:50% 50%;will-change:transform}
#dn{position:absolute;top:0;left:0;right:0;height:50%;background:#faf7ee}
#dk{position:absolute;bottom:0;left:0;right:0;height:50%;background:#09071a}
#ln{position:absolute;top:calc(50% - .5px);left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#a897c4 30%,#a897c4 70%,transparent)}
.w{position:absolute;font:300 clamp(8px,1.3vw,15px)/1 'Helvetica Neue',Helvetica,Arial,sans-serif;
  letter-spacing:.28em;text-transform:lowercase;pointer-events:none}
.w.am{color:#b8a87e}
.w.pm{color:#2e2555}
#pv{position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;
  transform:translate(-50%,-50%);background:#a897c4;cursor:pointer;z-index:9;
  transition:transform .2s,background .2s}
#pv:hover{transform:translate(-50%,-50%) scale(2.8);background:#c4b0e0}
#nw{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;z-index:20;
  font:100 clamp(2.5rem,11vw,8rem)/1 Georgia,'Times New Roman',serif;
  letter-spacing:.55em;color:#a897c4;
  transition:opacity .7s ease}
</style>
<div id="sc">
  <div id="dn"></div>
  <div id="dk"></div>
  <div id="ln"></div>
  <div id="pv"></div>
</div>
<div id="nw">NOW</div>
<script>
const DAWN=['light','open','still','begin','rise','first','cool','breath','almost','dew','pale','soft','before','clear'],
      DUSK=['close','end','remain','fall','last','dark','release','after','almost','amber','warm','heavy','deep','low'];
let ps=[],fr=0;
const sc=document.getElementById('sc'),
      nw=document.getElementById('nw'),
      pv=document.getElementById('pv');

function mk(){
  if(fr)return;
  const top=Math.random()>.5,
        list=top?DAWN:DUSK,
        w=document.createElement('div');
  w.className='w '+(top?'am':'pm');
  w.textContent=list[0|Math.random()*list.length];
  const x=4+Math.random()*92,
        y=top?Math.random()*44:56+Math.random()*42;
  w.style.cssText='left:'+x+'vw;top:'+y+'vh;opacity:0';
  sc.appendChild(w);
  ps.push({el:w,top,y,vy:top?.016:-.016,age:0});
}

function tick(){
  if(!fr){
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];
      p.y+=p.vy; p.age++;
      p.el.style.top=p.y+'vh';
      const d=Math.abs(p.y-50),
            fade=Math.min(1,d/7)*(1-p.age/700);
      p.el.style.opacity=fade<0?0:fade;
      if(d<.4||p.age>700){p.el.remove();ps.splice(i,1);}
    }
  }
  requestAnimationFrame(tick);
}

document.addEventListener('mousemove',e=>{
  if(fr)return;
  sc.style.transform='rotate('+(((e.clientX/innerWidth)-.5)*13)+'deg)';
});

pv.addEventListener('click',e=>{
  e.stopPropagation();
  fr=1;
  sc.style.transition='transform .6s cubic-bezier(.22,.61,.36,1)';
  sc.style.transform='rotate(0deg)';
  nw.style.opacity='1';
  setTimeout(()=>{
    nw.style.opacity='0';
    setTimeout(()=>{fr=0;sc.style.transition='';},750);
  },1500);
});

document.addEventListener('click',()=>{
  if(fr)return;
  ps.forEach(p=>{p.vy*=-1.3;});
});

setInterval(mk,650);
tick();
</script>
</section>
</body>
</html>
