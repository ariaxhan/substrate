<section data-date='2026-08-04' data-type='morning'>
<style>
.tp0804{position:relative;width:100%;height:100vh;overflow:hidden;cursor:crosshair;
  background:radial-gradient(ellipse at 50% 120%,#241a38 0%,#0a0912 62%);
  font-family:Georgia,'Times New Roman',serif}
.tp0804::after{content:'';position:absolute;inset:auto 0 0 0;height:20vh;pointer-events:none;
  background:linear-gradient(to top,rgba(255,168,88,calc(var(--p,0)*.6)),transparent);
  transition:background 1.1s ease}
.tp0804 h2{position:absolute;top:6%;left:6%;margin:0;font-size:.7rem;letter-spacing:.35em;
  color:#4d4560;text-transform:uppercase;font-family:'Courier New',monospace}
.tp0804 .w{position:absolute;white-space:nowrap;color:transparent;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),#ffd88a 0,#ffd88a 26px,transparent 64px);
  -webkit-background-clip:text;background-clip:text;transition:color .8s ease,text-shadow .8s ease}
.tp0804 .w.lit{color:#ffe4ac;background:none;text-shadow:0 0 22px rgba(255,196,120,.4)}
.tp0804 .mono{font-family:'Courier New',monospace;letter-spacing:.08em}
</style>
<div class="tp0804" id="tp0804">
  <h2>before it has a name</h2>
  <span class="w" style="top:16%;left:10%;font-size:1.1rem">not yet</span>
  <span class="w" style="top:24%;left:58%;font-size:2rem">unwritten</span>
  <span class="w mono" style="top:34%;left:20%;font-size:.95rem">still.quiet</span>
  <span class="w" style="top:42%;left:66%;font-size:1.4rem">first light</span>
  <span class="w" style="top:50%;left:38%;font-size:2.6rem">possible</span>
  <span class="w mono" style="top:60%;left:12%;font-size:.9rem">waking&#8212;</span>
  <span class="w" style="top:66%;left:70%;font-size:1.2rem">blank page</span>
  <span class="w" style="top:74%;left:46%;font-size:1rem">before names</span>
  <span class="w" style="top:20%;left:82%;font-size:1rem">soft edges</span>
  <span class="w mono" style="top:56%;left:80%;font-size:.85rem">no failures yet</span>
  <span class="w" style="top:82%;left:20%;font-size:1.6rem">begin</span>
  <span class="w" style="top:10%;left:40%;font-size:.9rem">clean</span>
  <span class="w" style="top:88%;left:62%;font-size:1rem">open</span>
</div>
<script>
(function(){
  var el=document.getElementById('tp0804'),
      words=el.querySelectorAll('.w'),
      lit=0;
  function move(e){
    var mx=e.clientX,my=e.clientY;
    for(var i=0;i<words.length;i++){
      var r=words[i].getBoundingClientRect();
      words[i].style.setProperty('--x',(mx-r.left)+'px');
      words[i].style.setProperty('--y',(my-r.top)+'px');
    }
  }
  function touch(e){
    var mx=e.clientX,my=e.clientY;
    for(var i=0;i<words.length;i++){
      if(words[i].classList.contains('lit'))continue;
      var r=words[i].getBoundingClientRect(),
          cx=r.left+r.width/2, cy=r.top+r.height/2,
          d=Math.hypot(mx-cx,my-cy);
      if(d<70){
        words[i].classList.add('lit');
        lit++;
        el.style.setProperty('--p',(lit/words.length).toFixed(2));
      }
    }
  }
  el.addEventListener('mousemove',move);
  el.addEventListener('click',touch);
  el.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    move(t);touch(t);
  });
})();
</script>
</section>
