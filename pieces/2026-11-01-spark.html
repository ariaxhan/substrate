<section data-date='2026-11-01' data-type='spark'>
<style>
#m{background:#0b0a10;position:relative;height:320px;overflow:hidden;cursor:crosshair;font:12px Georgia,serif;color:#e8d9b8}
#m canvas{width:100%;height:100%;display:block}
#m p{position:absolute;left:12px;bottom:6px;margin:0;opacity:.6;font-style:italic;pointer-events:none}
</style>
<div id="m"><canvas id="c"></canvas><p id="t">two things, drifting. move between them.</p></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t'),
W=c.width=600,H=c.height=320,mx=-9,my=-9,
A={x:80,y:160,vx:.7,vy:.3,h:20,r:14},B={x:520,y:160,vx:-.7,vy:-.2,h:200,r:14},
P=[],hit=0,words=['ember','tide','salt','glass','ash','moss','ion','seam'];
c.onmousemove=function(e){var r=c.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height};
c.onclick=function(){A.x=60;A.y=my>0?my:160;B.x=540;B.y=H-A.y;A.vx=.9;B.vx=-.9;hit=0;t.textContent='again.'};
function mv(o){
var dx=o.x-mx,dy=o.y-my,d=Math.hypot(dx,dy);
if(d<90){o.vx+=dx/d*.06;o.vy+=dy/d*.06}
o.x+=o.vx;o.y+=o.vy;
if(o.x<0||o.x>W)o.vx*=-1;if(o.y<0||o.y>H)o.vy*=-1}
function dot(o){x.fillStyle='hsl('+o.h+',80%,60%)';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()}
function f(){
x.fillStyle='rgba(11,10,16,.18)';x.fillRect(0,0,W,H);
if(!hit){mv(A);mv(B);
var d=Math.hypot(A.x-B.x,A.y-B.y);
x.strokeStyle='hsla(60,50%,70%,'+Math.max(0,1-d/300)*.5+')';
x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();
dot(A);dot(B);
if(d<A.r+B.r){hit=1;
for(var i=0;i<90;i++){var a=Math.random()*6.3,s=Math.random()*3+.5;
P.push({x:(A.x+B.x)/2,y:(A.y+B.y)/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,h:i%2?20:200,l:1,w:i%15?0:words[i%8]})}
t.textContent='what neither was, now both.'}}
for(var i=P.length;i--;){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;p.h+=(110-p.h)*.015;p.l-=.003;
if(p.l<=0){P.splice(i,1);continue}
x.fillStyle='hsla('+p.h+',80%,60%,'+p.l+')';
if(p.w){x.fillText(p.w,p.x,p.y)}else{x.fillRect(p.x,p.y,2,2)}}
requestAnimationFrame(f)}
f()})();
</script>
</section>
