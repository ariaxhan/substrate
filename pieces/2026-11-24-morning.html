<section data-date='2026-11-24' data-type='morning'>
<style>
#d{--p:.1;--x:50%;position:relative;height:100vh;overflow:hidden;cursor:crosshair;font:italic 5vmin/1.5 Georgia,serif;color:#1a1420;
background:radial-gradient(circle at var(--x) calc(112% - var(--p)*50%),#fff6d8 0,#ffb86b calc(8% + var(--p)*14%),#d4607a calc(25% + var(--p)*25%),#3a2a5c calc(60% + var(--p)*30%),#0b0916 120%);transition:background .2s}
#d i{position:absolute;left:0;right:0;bottom:calc(var(--p)*30% - 6%);height:2px;background:#fff6d8;opacity:calc(.2 + var(--p)*.6);box-shadow:0 0 30px 6px #ffb86b}
#t{position:absolute;inset:18% 12% auto;mix-blend-mode:difference;color:#fff}

</style>
<div id=d><i></i><div id=t></div><div id=h>06:41 — touch the dark</div></div>
<script>
var d=document.getElementById('d'),t=document.getElementById('t'),h=document.getElementById('h'),
w=['not yet a word','but the window knows','a kettle, a bird, a first small yes','nothing has gone wrong today','everything is still possible','begin'],n=0;
d.onmousemove=function(e){d.style.setProperty('--p',1-e.clientY/innerHeight);d.style.setProperty('--x',e.clientX/innerWidth*100+'%')};
d.onclick=function(){
if(n>=w.length){t.innerHTML='';n=0}

l.innerHTML=[].map.call(w[n++],function(c){return'<span>'+c+'</span>'}).join('');

[].forEach.call(l.children,function(s,i){setTimeout(function(){s.className='o'},i*70)})
}
</script>
</section>
