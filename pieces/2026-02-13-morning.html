<section data-date='2026-02-13' data-type='morning'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(180deg,#0a0a12 0%,#1a1428 40%,#2d1f3f 70%,#4a3556 100%);
  height:100vh;
  overflow:hidden;
  font-family:Georgia,serif;
  cursor:crosshair;
  transition:background 2s ease
}
body.dawn{
  background:linear-gradient(180deg,#ff6b4a 0%,#ffa06b 30%,#ffd89e 60%,#ffe8d1 100%)
}
#sky{
  position:fixed;
  inset:0;
  pointer-events:none
}
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:#fff;
  border-radius:50%;
  opacity:0.8;
  transition:all 1.2s ease
}
body.dawn .star{
  opacity:0;
  transform:scale(0)
}
#horizon{
  position:absolute;
  bottom:0;
  width:100%;
  height:1px;
  background:rgba(255,255,255,0.1);
  transition:all 2s ease
}
body.dawn #horizon{
  background:rgba(255,107,74,0.6);
  height:2px;
  box-shadow:0 0 40px rgba(255,107,74,0.8)
}
#sun{
  position:absolute;
  bottom:-100px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  background:radial-gradient(circle,#fff 0%,#ffe8d1 50%,transparent 70%);
  border-radius:50%;
  opacity:0;
  transition:all 2.5s ease;
  filter:blur(8px)
}
body.dawn #sun{
  bottom:120px;
  opacity:1;
  width:120px;
  height:120px;
  background:radial-gradient(circle,#fff 0%,#ffeb99 40%,#ff9966 70%,transparent 100%);
  filter:blur(12px)
}
#text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:rgba(255,255,255,0.9);
  transition:all 2s ease;
  font-size:clamp(16px,3vw,24px);
  letter-spacing:0.15em;
  line-height:2;
  max-width:80vw
}
body.dawn #text{
  color:rgba(255,107,74,0.95);
  letter-spacing:0.25em
}
.word{
  display:inline-block;
  opacity:0;
  transform:translateY(20px);
  animation:fadeIn 0.8s ease forwards
}
@keyframes fadeIn{
  to{opacity:1;transform:translateY(0)}
}
body.dawn .word{
  animation:breathe 4s ease-in-out infinite
}
@keyframes breathe{
  0%,100%{opacity:0.85;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-3px)}
}
#hint{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,0.4);
  font-size:14px;
  letter-spacing:0.2em;
  font-style:italic;
  transition:all 1s ease
}
body.dawn #hint{
  opacity:0
}
</style>

<div id="sky"></div>
<div id="horizon"></div>
<div id="sun"></div>
<div id="text"></div>
<div id="hint">click to begin</div>

<script>
const words=["before","the","first","light","all","is","possible","nothing","has","been","written","yet"];
const text=document.getElementById('text');
const sky=document.getElementById('sky');
let clicked=false;

// Generate stars
for(let i=0;i<80;i++){
  const star=document.createElement('div');
  star.className='star';
  star.style.left=Math.random()*100+'%';
  star.style.top=Math.random()*70+'%';
  star.style.animationDelay=Math.random()*2+'s';
  sky.appendChild(star);
}

// Render text with staggered animation
words.forEach((word,i)=>{
  const span=document.createElement('span');
  span.className='word';
  span.textContent=word;
  span.style.animationDelay=(i*0.15)+'s';
  text.appendChild(span);
  if(i<words.length-1)text.appendChild(document.createTextNode(' '));
});

// Click to transform night to dawn
document.body.addEventListener('click',()=>{
  if(!clicked){
    clicked=true;
    document.body.classList.add('dawn');
  }
});
</script>
</section>
