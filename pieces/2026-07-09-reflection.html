<section data-date='2026-07-09' data-type='reflection'>
<style>
#taper-0709{position:relative;width:100%;height:100vh;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#0d1420 0%,#03040a 70%);cursor:crosshair}
#taper-0709 .hint{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);color:#4a5568;font:300 15px/1.6 Georgia,serif;letter-spacing:.08em;text-align:center;pointer-events:none;transition:opacity 2.5s ease;user-select:none}
#taper-0709 .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 4px 1px rgba(255,255,255,.5);transform:translate(-50%,-50%);animation:tw-b var(--d) ease-in-out infinite;opacity:0}
#taper-0709 .star.on{animation:tw-in .9s ease forwards,tw-b var(--d) ease-in-out infinite .9s}
#taper-0709 .w{position:absolute;transform:translate(-50%,-100%);color:#8896ab;font:italic 300 13px/1 Georgia,serif;white-space:nowrap;opacity:0;letter-spacing:.03em;pointer-events:none;animation:w-in 2.2s ease forwards}
#taper-0709 .count{position:absolute;bottom:18px;right:22px;color:#2c3548;font:11px/1 Georgia,serif;letter-spacing:.1em;user-select:none}
@keyframes tw-in{to{opacity:.85}}
@keyframes tw-b{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes w-in{0%{opacity:0;transform:translate(-50%,-90%)}20%{opacity:.9}80%{opacity:.7}100%{opacity:0;transform:translate(-50%,-140%)}}
</style>
<div id="taper-0709">
  <div class="hint">the day is complete.<br>click, where you'd put a star.</div>
  <div class="count" id="t0709-count"></div>
</div>
<script>
(function(){
  var root=document.getElementById('taper-0709');
  var hint=root.querySelector('.hint');
  var counter=document.getElementById('t0709-count');
  var words=['hush','rest','unclench','enough','still','settle','tomorrow','quiet','breathe','arrived','done','soft','later','held','dim','slow','close your eyes','almost','nearly there','okay now'];
  var used=[];
  var n=0;
  function nextWord(){
    if(!used.length){used=words.slice()}
    var i=Math.floor(Math.random()*used.length);
    return used.splice(i,1)[0];
  }
  function place(x,y){
    n++;
    if(hint){hint.style.opacity=0}
    var s=document.createElement('div');
    s.className='star';
    s.style.left=x+'px';
    s.style.top=y+'px';
    s.style.setProperty('--d',(2.5+Math.random()*3).toFixed(2)+'s');
    root.appendChild(s);
    requestAnimationFrame(function(){s.classList.add('on')});
    var w=document.createElement('div');
    w.className='w';
    w.style.left=x+'px';
    w.style.top=(y-6)+'px';
    w.textContent=nextWord();
    root.appendChild(w);
    setTimeout(function(){w.remove()},2300);
    counter.textContent=n+(n===1?' star':' stars');
  }
  root.addEventListener('click',function(e){
    var r=root.getBoundingClientRect();
    place(e.clientX-r.left,e.clientY-r.top);
  });
  root.addEventListener('touchstart',function(e){
    var t=e.touches[0],r=root.getBoundingClientRect();
    place(t.clientX-r.left,t.clientY-r.top);
  },{passive:true});
  (function seed(){
    var r=root.getBoundingClientRect();
    for(var i=0;i<3;i++){
      var s=document.createElement('div');
      s.className='star on';
      s.style.left=(Math.random()*r.width)+'px';
      s.style.top=(Math.random()*r.height*0.6)+'px';
      s.style.setProperty('--d',(3+Math.random()*3).toFixed(2)+'s');
      root.appendChild(s);
    }
  })();
})();
</script>
</section>
