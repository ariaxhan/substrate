<section data-date='2026-09-19' data-type='reflection'>
<style>
.tp{position:relative;height:100vh;background:radial-gradient(ellipse at 50% 120%,#2a1f4a,#0b0d1f 60%,#04050d);overflow:hidden;font-family:Georgia,serif;color:#e9e2c8;cursor:crosshair}
.tp i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px #cfd8ff;transform:translate(-50%,-50%);animation:b 4s ease-in-out infinite}
.tp b{position:absolute;font-weight:400;font-style:italic;font-size:15px;letter-spacing:.2em;transform:translate(-50%,10px);opacity:0;animation:w 6s forwards;pointer-events:none}
.tp p{position:absolute;bottom:6%;width:100%;text-align:center;margin:0;font-size:12px;letter-spacing:.4em;opacity:.4}
@keyframes b{50%{opacity:.3}}
@keyframes w{15%,60%{opacity:.9}100%{opacity:0;transform:translate(-50%,-10px)}}
</style>
<div class="tp" id="tp"><p>the day is done. touch the dark.</p></div>
<script>
(()=>{const t=document.getElementById('tp'),W=['rest','enough','held','soft','tomorrow','breathe','still','kept','home','slow','quiet','it was good'];let n=0,l;
const s=(x,y,w)=>{const e=document.createElement('i');e.style.left=x+'px';e.style.top=y+'px';e.style.animationDelay=-Math.random()*4+'s';t.append(e);
if(l){const a=document.createElementNS('http://www.w3.org/2000/svg','svg');a.style.cssText='position:absolute;inset:0;pointer-events:none;opacity:.3;transition:opacity 4s';a.innerHTML=`<line x1=${l[0]} y1=${l[1]} x2=${x} y2=${y} stroke="#cfd8ff" stroke-width=".6"/>`;t.append(a);setTimeout(()=>a.style.opacity=0,300)}
l=[x,y];if(w){const b=document.createElement('b');b.textContent=W[n++%W.length];b.style.left=x+'px';b.style.top=y+14+'px';t.append(b);setTimeout(()=>b.remove(),6e3)}};
for(let i=0;i<40;i++)setTimeout(()=>s(Math.random()*innerWidth,Math.random()*innerHeight*.8),i*120);
t.onclick=e=>s(e.clientX,e.clientY,1);
t.onmousemove=e=>{if(Math.random()<.08)s(e.clientX+Math.random()*30,e.clientY+Math.random()*30)}})()
</script>
</section>
