<section data-date='2026-04-29' data-type='spark'>
<style>
#stage{position:relative;width:100%;height:340px;background:#080808;overflow:hidden;cursor:crosshair;user-select:none}
.w{position:absolute;font:1.1rem 'Courier New',monospace;letter-spacing:.12em;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#wa{color:#4ae}
#wb{color:#e74}
#wc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:1.6rem 'Courier New',monospace;letter-spacing:.35em;color:#eee;opacity:0;pointer-events:none;transition:opacity .8s;text-align:center}
#tip{position:absolute;bottom:9px;width:100%;text-align:center;font:8px monospace;color:#252525;letter-spacing:.2em}
</style>
<div id=stage>
  <div class=w id=wa></div>
  <div class=w id=wb></div>
  <div id=wc></div>
  <div id=tip>place cursor between them</div>
</div>
<script>
const P=[
  ['stranger','stranger','recognized'],
  ['signal','noise','voice'],
  ['before','after','now'],
  ['I','you','us'],
  ['silence','sound','music'],
  ['nothing','everything','something'],
  ['falling','falling','flight'],
  ['wound','wound','scar']
];
let pi=0,mx=0,my=170,fused=false,tid,raf;
const st=document.getElementById('stage'),wa=document.getElementById('wa'),wb=document.getElementById('wb'),wc=document.getElementById('wc');
let ax,ay,bx,by;
function init(i){
  pi=i%P.length;fused=false;
  clearTimeout(tid);if(raf)cancelAnimationFrame(raf);
  const w=st.offsetWidth,h=st.offsetHeight;
  wa.textContent=P[pi][0];wb.textContent=P[pi][1];wc.textContent=P[pi][2];
  wc.style.opacity=0;wa.style.opacity=1;wb.style.opacity=1;
  ax=12;ay=h/2;bx=w-140;by=h/2;my=h/2;
  tick();
}
function tick(){
  if(fused)return;
  const h=st.offsetHeight,w=st.offsetWidth;
  ay+=(my-ay)*.012;by+=(my-by)*.012;
  ay=Math.max(8,Math.min(h-30,ay));
  by=Math.max(8,Math.min(h-30,by));
  const mid=(ax+bx)/2;
  const pull=Math.max(0,1-Math.abs(mx-mid)/(w*.4));
  ax+=.4+pull*.7;
  bx-=.4+pull*.7;
  wa.style.left=ax+'px';wa.style.top=ay+'px';
  wb.style.left=bx+'px';wb.style.top=by+'px';
  if(Math.hypot(bx-ax,by-ay)<78){
    fused=true;
    wa.style.opacity=0;wb.style.opacity=0;
    wc.style.opacity=1;
    tid=setTimeout(()=>init(pi+1),3200);
    return;
  }
  raf=requestAnimationFrame(tick);
}
st.addEventListener('mousemove',e=>{
  const r=st.getBoundingClientRect();
  mx=e.clientX-r.left;my=e.clientY-r.top;
});
st.addEventListener('click',()=>init(pi+1));
init(0);
</script>
</section>
