<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vigil (2026-02-18)</title>
</head>
<body>
<section data-date='2026-02-18' data-type='reflection'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;overflow:hidden;background:#04040a}
canvas{display:block;position:fixed;top:0;left:0;cursor:crosshair}
#v{position:fixed;bottom:2em;width:100%;text-align:center;
  font:italic 13px Georgia,serif;color:rgba(180,170,220,.28);
  letter-spacing:.18em;pointer-events:none;user-select:none}
</style>
<canvas id="c"></canvas>
<div id="v">click to release a star</div>
<script>
const cv=document.getElementById('c'),
      cx=cv.getContext('2d');

let W,H,stars=[],born=[],tick=0;

// words that rise from the dark when a star is born
const words=['still','done','enough','rest','release','soften',
             'held','dark','complete','breathe','let','whole'];

function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// ambient field stars — tiny, already there, barely visible
function initField(){
  stars=[];
  const n=Math.floor(W*H/3200);
  for(let i=0;i<n;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*.9+.1,
      b:Math.random()*.18+.04, // base brightness
      flick:Math.random()*Math.PI*2,
      speed:Math.random()*.007+.002
    });
  }
}
initField();

// born[] = stars that the user called into being
// they rise slightly, pulse bright, then settle
function spawnStar(x,y){
  const word=words[Math.floor(Math.random()*words.length)];
  born.push({
    x,y,
    ox:x,oy:y,
    r:1.2,
    alpha:0,
    age:0,
    maxAge:340,
    word,
    wordAlpha:0,
    vy:-(.18+Math.random()*.09)
  });
}

document.addEventListener('click',e=>{
  spawnStar(e.clientX,e.clientY);
});

// subtle mouse-reveal: nearby field stars glow softly
let mx=-999,my=-999;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});

function draw(){
  tick++;
  // deep-night sky — very slow, almost no fade so old marks persist as memory
  cx.fillStyle='rgba(4,4,10,.07)';
  cx.fillRect(0,0,W,H);

  // field stars
  for(const s of stars){
    const dx=s.x-mx,dy=s.y-my,
          dist=Math.sqrt(dx*dx+dy*dy),
          nearGlow=dist<90?(.9-dist/90)*.55:0;
    const b=s.b+nearGlow+Math.sin(tick*s.speed+s.flick)*.04;
    cx.beginPath();
    cx.arc(s.x,s.y,s.r,0,Math.PI*2);
    cx.fillStyle=`rgba(210,205,255,${Math.min(b,.9)})`;
    cx.fill();
  }

  // born stars: appear, drift upward, word emerges, all gently fade
  for(let i=born.length-1;i>=0;i--){
    const b=born[i];
    b.age++;
    b.y+=b.vy;
    // ease-in glow then slow fade
    const p=b.age/b.maxAge;
    if(p<.12) b.alpha=p/.12;
    else b.alpha=1-((p-.12)/.88);
    b.alpha=Math.max(0,Math.min(b.alpha,1));

    // star dot
    const grd=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,6);
    grd.addColorStop(0,`rgba(255,252,240,${b.alpha})`);
    grd.addColorStop(.4,`rgba(200,190,255,${b.alpha*.7})`);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    cx.beginPath();
    cx.arc(b.x,b.y,6,0,Math.PI*2);
    cx.fillStyle=grd;
    cx.fill();

    // word drifts up, appears after star settles a moment
    if(p>.08&&p<.82){
      const wa=p<.2?(p-.08)/.12:1-((p-.2)/.62);
      cx.font=`italic ${11+Math.floor(b.alpha*2)}px Georgia,serif`;
      cx.fillStyle=`rgba(188,182,230,${Math.max(0,Math.min(wa*.7,1))})`;
      cx.textAlign='center';
      cx.fillText(b.word,b.ox,b.y-14);
    }

    if(b.age>=b.maxAge) born.splice(i,1);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</section>
</body>
</html>
