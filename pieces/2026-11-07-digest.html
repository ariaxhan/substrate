<section data-date='2026-11-07' data-type='digest'>
<style>
#k{margin:0;background:#f3ecdc;overflow:hidden;position:relative;height:100vh;font:italic 15px Georgia,serif;color:#2a2418}
#k canvas{display:block;width:100%;height:100%}
#k p{position:absolute;left:24px;bottom:18px;margin:0;opacity:.6;pointer-events:none}
</style>
<div id="k"><canvas id="c"></canvas><p id="t">scattered. touch to gather.</p></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t'),W,H,P=[],L=[],N=0;
function R(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
R();onresize=R;
var words=['scattered. touch to gather.','a neighbor appears.','two facts lean together.','an edge.','a shape not yet named.','structure was always here.','it knows itself now.'];
for(var i=0;i<70;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,h:0,r:1.5+Math.random()*2});
c.onclick=function(e){
var b=c.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;
N++;t.textContent=words[Math.min(N,words.length-1)];
P.forEach(function(p){var d=Math.hypot(p.x-mx,p.y-my);if(d<220){p.h=Math.min(1,p.h+.5);p.vx+=(mx-p.x)*.012;p.vy+=(my-p.y)*.012}});
P.push({x:mx,y:my,vx:0,vy:0,h:1,r:4});
};
function f(){
x.fillStyle='rgba(243,236,220,.25)';x.fillRect(0,0,W,H);
P.forEach(function(p){p.x+=p.vx+(Math.random()-.5)*(1-p.h)*.8;p.y+=p.vy+(Math.random()-.5)*(1-p.h)*.8;p.vx*=.92;p.vy*=.92;
if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
for(var i=0;i<P.length;i++)for(var j=i+1;j<P.length;j++){
var a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y),k=(a.h+b.h)/2;
if(d<30+k*110&&k>.1){x.strokeStyle='rgba(120,40,20,'+(k*(1-d/140)*.7)+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
if(d<45&&a.h>.6&&b.h>.6){a.vx+=(b.x-a.x)*.002;a.vy+=(b.y-a.y)*.002}}}
P.forEach(function(p){p.h*=.9995;x.fillStyle=p.h>.3?'#8a2a14':'#2a2418';x.globalAlpha=.4+p.h*.6;x.beginPath();x.arc(p.x,p.y,p.r+p.h*2,0,7);x.fill()});
x.globalAlpha=1;requestAnimationFrame(f)}
f();
})();
</script>
</section>
