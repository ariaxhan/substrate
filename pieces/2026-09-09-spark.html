<section data-date='2026-09-09' data-type='spark'>
<style>
.spk{position:relative;height:70vh;min-height:420px;background:#0a0a0c;overflow:hidden;font-family:Georgia,serif;cursor:crosshair}
.spk canvas{position:absolute;inset:0;width:100%;height:100%}
.spk .hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#555;font:11px monospace;letter-spacing:.1em;pointer-events:none}
</style>
<div class="spk" id="spk">
<canvas id="spkc"></canvas>
<div class="hint">move to collide</div>
</div>
<script>
(function(){
var L=["salt","glass","river","iron","ash","moth","wire","bone","tide","coal","frost","husk"];
var R=["light","song","dust","edge","weld","spine","echo","rust","bloom","weep","seam","spark"];
var wrap=document.getElementById('spk'),cv=document.getElementById('spkc'),cx=cv.getContext('2d');
function sz(){cv.width=wrap.clientWidth;cv.height=wrap.clientHeight}
sz();window.addEventListener('resize',sz);
var W=()=>cv.width,H=()=>cv.height;
var left=[],right=[],fused=[],mx=-999,my=-999;
for(var i=0;i<14;i++){
  left.push({x:0,y:Math.random()*1,w:L[i%L.length],vx:.3+Math.random()*.4,s:12+Math.random()*10});
  right.push({x:1,y:Math.random()*1,w:R[i%R.length],vx:.3+Math.random()*.4,s:12+Math.random()*10});
}
wrap.addEventListener('mousemove',function(e){
  var r=wrap.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top
});
wrap.addEventListener('mouseleave',function(){mx=-999;my=-999});
wrap.addEventListener('touchmove',function(e){
  var r=wrap.getBoundingClientRect(),t=e.touches[0];
  mx=t.clientX-r.left;my=t.clientY-r.top;e.preventDefault()
},{passive:false});
function collide(a,b){
  var ax=a.x*W(),ay=a.y*H(),bx=b.x*W(),by=b.y*H();
  var d=Math.hypot(ax-bx,ay-by);
  var near=Math.hypot(mx-(ax+bx)/2,my-(ay+by)/2)<70;
  return d<40&&near;
}
function tick(){
  cx.fillStyle='rgba(10,10,12,0.16)';
  cx.fillRect(0,0,W(),H());
  left.forEach(function(p){
    p.x+=p.vx/W();
    if(p.x>1.1)p.x=-0.1;
  });
  right.forEach(function(p){
    p.x-=p.vx/W();
    if(p.x<-0.1)p.x=1.1;
  });
  cx.textBaseline='middle';
  cx.textAlign='center';
  left.forEach(function(p){
    cx.font=p.s+'px Georgia';
    cx.fillStyle='rgba(120,170,220,0.85)';
    cx.fillText(p.w,p.x*W(),p.y*H());
  });
  right.forEach(function(p){
    cx.font=p.s+'px Georgia';
    cx.fillStyle='rgba(230,140,100,0.85)';
    cx.fillText(p.w,p.x*W(),p.y*H());
  });
  for(var i=0;i<left.length;i++){
    for(var j=0;j<right.length;j++){
      var a=left[i],b=right[j];
      if(Math.abs(a.y-b.y)<0.04 && collide(a,b)){
        var mxp=(a.x+b.x)/2,myp=(a.y+b.y)/2;
        fused.push({x:mxp,y:myp,w:a.w+b.w,life:1});
        a.x=-0.1-Math.random()*0.1;
        b.x=1.1+Math.random()*0.1;
        a.y=Math.random();b.y=Math.random();
      }
    }
  }
  fused=fused.filter(function(f){return f.life>0});
  fused.forEach(function(f){
    f.life-=0.006;
    f.y-=0.0015;
    cx.font=(16+18*(1-f.life))+'px Georgia';
    cx.fillStyle='rgba(255,235,180,'+f.life+')';
    cx.fillText(f.w,f.x*W(),f.y*H());
  });
  requestAnimationFrame(tick);
}
tick();
})();
</script>
</section>
