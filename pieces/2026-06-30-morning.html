<section data-date='2026-06-30' data-type='morning'>
<style>
section[data-date='2026-06-30']{display:block;position:relative;width:100%;height:480px;overflow:hidden;cursor:crosshair}
section[data-date='2026-06-30'] canvas{display:block;width:100%;height:100%}
</style>
<canvas id=_m0630></canvas>
<script>
!function(){
const S=document.querySelector("section[data-date='2026-06-30']"),
  cv=document.getElementById('_m0630'),
  cx=cv.getContext('2d');
cv.width=S.clientWidth||720;
cv.height=480;
const W=cv.width,H=480,HY=H*.72;
const words=[
  {t:'begin',  x:.14,y:.24,v:0},
  {t:'open',   x:.29,y:.14,v:0},
  {t:'possible',x:.47,y:.31,v:0},
  {t:'unnamed', x:.63,y:.18,v:0},
  {t:'still',  x:.80,y:.27,v:0},
  {t:'soft',   x:.21,y:.44,v:0},
  {t:'whole',  x:.38,y:.57,v:0},
  {t:'before', x:.56,y:.46,v:0},
  {t:'clear',  x:.73,y:.52,v:0},
  {t:'first',  x:.88,y:.38,v:0},
];
let mx=.5,began=0,dawn=0;
S.addEventListener('mousemove',e=>{
  const r=S.getBoundingClientRect();
  mx=(e.clientX-r.left)/r.width;
});
S.addEventListener('click',()=>{began=1});
function frame(){
  const sk=cx.createLinearGradient(0,0,0,H);
  if(!began){
    sk.addColorStop(0,'#03050c');
    sk.addColorStop(1,'#0c1428');
  } else {
    dawn=Math.min(1,dawn+.005);
    const d=dawn;
    sk.addColorStop(0,`rgb(${4+d*100|0},${5+d*40|0},${12+d*20|0})`);
    sk.addColorStop(.55,`rgb(${20+d*190|0},${15+d*75|0},${30+d*10|0})`);
    sk.addColorStop(1,`rgb(${155+d*100|0},${55+d*145|0},${12+d*58|0})`);
  }
  cx.fillStyle=sk; cx.fillRect(0,0,W,H);
  const gx=W*mx;
  const gr=cx.createRadialGradient(gx,HY,0,gx,HY,H*.9);
  const gi=began?.1+dawn*.5:.12;
  gr.addColorStop(0,`rgba(248,140,55,${gi})`);
  gr.addColorStop(.2,`rgba(210,90,30,${gi*.4})`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gr; cx.fillRect(0,0,W,H);
  const hl=cx.createLinearGradient(0,0,W,0);
  hl.addColorStop(Math.max(0,mx-.18),'rgba(210,130,50,0)');
  hl.addColorStop(mx,`rgba(255,190,80,${began?.9:.55})`);
  hl.addColorStop(Math.min(1,mx+.18),'rgba(210,130,50,0)');
  cx.beginPath(); cx.moveTo(0,HY); cx.lineTo(W,HY);
  cx.strokeStyle=hl; cx.lineWidth=1; cx.stroke();
  if(began&&dawn>.1){
    const sg=cx.createRadialGradient(gx,HY,0,gx,HY,16+dawn*20);
    sg.addColorStop(0,`rgba(255,248,190,${dawn*.95})`);
    sg.addColorStop(1,'rgba(255,140,40,0)');
    cx.beginPath(); cx.arc(gx,HY,16+dawn*20,0,Math.PI*2);
    cx.fillStyle=sg; cx.fill();
  }
  cx.textBaseline='middle';
  words.forEach(w=>{
    const tgt=began?1:Math.max(0,1-Math.abs(w.x-mx)*4.5);
    w.v+=(tgt-w.v)*.08;
    if(w.v<.01)return;
    cx.font=`italic ${16+w.v*6|0}px Georgia,serif`;
    const tw=cx.measureText(w.t).width;
    cx.fillStyle=`rgba(255,${185+w.v*45|0},${80+w.v*80|0},${w.v})`;
    cx.fillText(w.t,W*w.x-tw/2,H*w.y);
  });
  requestAnimationFrame(frame);
}
frame();
}();
</script>
</section>
