<section data-date='2026-08-08' data-type='pulse'>
<style>
#tp-pulse{margin:0;overflow:hidden;background:#0c0c0e;height:70vh;min-height:420px;position:relative;font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
#tp-pulse .fx{position:absolute;top:50%;left:50%;width:2px;height:2px;background:#3a3a3f}
#tp-pulse .pivot{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#e8b923;box-shadow:0 0 12px 2px rgba(232,185,35,.5);z-index:5}
#tp-pulse .beam{position:absolute;top:50%;left:50%;width:74vw;max-width:820px;height:1px;background:#66666c;transform-origin:center center;transform:translate(-50%,-50%) rotate(var(--r,0deg));transition:transform .12s ease-out}
#tp-pulse .half{position:absolute;top:50%;font-size:clamp(1.4rem,4vw,3rem);letter-spacing:.04em;white-space:nowrap;transform:translateY(-50%);transition:color .3s ease,opacity .3s ease}
#tp-pulse .am{left:6%;color:#9fb6c9}
#tp-pulse .pm{right:6%;color:#c98a5a;text-align:right}
#tp-pulse .lbl{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);font:italic 12px/1.4 Georgia,serif;color:#55555c;letter-spacing:.08em;user-select:none}
#tp-pulse .lbl b{color:#e8b923;font-style:normal}
#tp-pulse.flip .beam{transition:transform .55s cubic-bezier(.22,1.4,.36,1)}
#tp-pulse .ripple{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;border:1px solid rgba(232,185,35,.6);transform:translate(-50%,-50%);animation:tprip 1.1s ease-out forwards;pointer-events:none}
@keyframes tprip{to{width:340px;height:340px;margin:-170px 0 0 -170px;opacity:0;border-color:rgba(232,185,35,0)}}
</style>
<div id="tp-pulse">
  <div class="beam" id="tpBeam">
    <div class="half am" id="tpAm">morning</div>
    <div class="half pm" id="tpPm">evening</div>
  </div>
  <div class="pivot" id="tpPivot"></div>
  <div class="lbl">tilt the day &mdash; click the fulcrum to <b>flip it</b></div>
</div>
<script>
(function(){
  var root=document.getElementById('tp-pulse');
  var beam=document.getElementById('tpBeam');
  var am=document.getElementById('tpAm'), pm=document.getElementById('tpPm');
  var pivot=document.getElementById('tpPivot');
  var flipped=false, deg=0;
  function paint(v){
    deg=v;
    root.style.setProperty('--r', v+'deg');
    beam.style.setProperty('--r', v+'deg');
    var t=Math.max(-1,Math.min(1,v/16));
    am.style.opacity=(1-Math.max(0,t)*.7).toFixed(2);
    pm.style.opacity=(1-Math.max(0,-t)*.7).toFixed(2);
  }
  root.addEventListener('mousemove',function(e){
    var r=root.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width;
    var v=(x-0.5)*32*(flipped?-1:1);
    paint(v);
  });
  root.addEventListener('mouseleave',function(){paint(0)});
  pivot.addEventListener('click',function(e){
    e.stopPropagation();
    flipped=!flipped;
    root.classList.add('flip');
    var tmp=am.textContent; am.textContent=pm.textContent; pm.textContent=tmp;
    paint(-deg);
    var rip=document.createElement('div');
    rip.className='ripple';
    root.appendChild(rip);
    setTimeout(function(){rip.remove()},1150);
    setTimeout(function(){root.classList.remove('flip')},600);
  });
  paint(0);
})();
</script>
</section>
