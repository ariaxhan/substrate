<section data-date='2026-05-12' data-type='spark'>
<style>#c{display:block;background:#080810;cursor:crosshair}</style>
<canvas id=c></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
c.width=640;c.height=400;
const P=[
['fire','water','steam'],['you','I','us'],['dark','light','dusk'],
['silence','sound','song'],['body','mind','soul'],
['question','answer','knowing'],['alone','together','whole'],
['past','future','now'],['word','breath','voice'],['east','west','horizon']
];
let mx=320,my=200,a,b,s,fl=0,t=0,phase=0;

function rn(n){return Math.random()*n}
function dz(p,q){return Math.hypot(p.x-q.x,p.y-q.y)}

function init(){
const p=P[Math.floor(rn(P.length))],W=c.width,H=c.height;
a={x:rn(W*.2)+20,y:H*.3+rn(H*.4),vx:.5+rn(.3),vy:(rn(1)-.5)*.25,w:p[0]};
b={x:W*.75+rn(W*.2),y:H*.3+rn(H*.4),vx:-(.5+rn(.3)),vy:(rn(1)-.5)*.25,w:p[1]};
s={word:p[2],x:0,y:0,age:0};
phase=0;fl=0;
}

function draw(){
const W=c.width,H=c.height;
x.fillStyle='rgba(8,8,16,.12)';x.fillRect(0,0,W,H);

if(phase===0){
const d=dz(a,b);
[a,b].forEach(n=>{
const dm=dz(n,{x:mx,y:my});
if(dm<100){n.vx+=(mx-n.x)*.003;n.vy+=(my-n.y)*.003;}
n.x+=n.vx;n.y+=n.vy;
if(n.x<25)n.vx=Math.abs(n.vx);
if(n.x>W-25)n.vx=-Math.abs(n.vx);
if(n.y<25)n.vy=Math.abs(n.vy);
if(n.y>H-25)n.vy=-Math.abs(n.vy);
});

if(d<180){
const gw=1-d/180;
for(let i=0;i<=14;i++){
const lx=a.x+(b.x-a.x)*i/14,ly=a.y+(b.y-a.y)*i/14;
const j=(Math.sin(t*.12+i)*.4+Math.cos(t*.09+i*1.4)*.4)*(1-gw)*6;
x.fillStyle=`rgba(200,220,255,${gw*(i%2?.25:.55)})`;
x.fillRect(lx+j-1,ly-1,2,2);
}
}

const gw=Math.max(0,1-d/200);
x.save();
x.globalAlpha=gw*.2;
x.fillStyle='#6db4ff';x.beginPath();x.arc(a.x,a.y,40,0,7);x.fill();
x.fillStyle='#ff8c42';x.beginPath();x.arc(b.x,b.y,40,0,7);x.fill();
x.restore();

x.font=`${13+gw*6}px monospace`;x.textAlign='center';x.textBaseline='middle';
x.fillStyle='#6db4ff';x.globalAlpha=.65+gw*.35;x.fillText(a.w,a.x,a.y);
x.fillStyle='#ff8c42';x.fillText(b.w,b.x,b.y);x.globalAlpha=1;

if(d<45){s.x=(a.x+b.x)/2;s.y=(a.y+b.y)/2;s.age=0;phase=1;fl=1;}
}else{
if(fl>0){x.save();x.globalAlpha=fl*.55;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.restore();fl=Math.max(0,fl-.05);}
s.age++;
const fd=Math.min(1,s.age/20),dr=Math.max(0,1-(s.age-100)/70);
if(dr<=0){init();t++;requestAnimationFrame(draw);return;}

x.font='10px monospace';x.textAlign='center';x.textBaseline='middle';
x.globalAlpha=fd*dr*.22;
x.fillStyle='#6db4ff';x.fillText(a.w,s.x-60,s.y-20);
x.fillStyle='#ff8c42';x.fillText(b.w,s.x+60,s.y-20);

const pu=1+Math.sin(s.age*.1)*.06;
x.font=`${Math.round(24*pu)}px monospace`;
x.globalAlpha=fd*dr;x.fillStyle='#f5d76e';
x.fillText(s.word,s.x,s.y);x.globalAlpha=1;
}
t++;requestAnimationFrame(draw);
}

c.addEventListener('click',()=>{
if(phase===0){const F=.05;a.vx+=(b.x-a.x)*F;a.vy+=(b.y-a.y)*F;b.vx+=(a.x-b.x)*F;b.vy+=(a.y-b.y)*F;}
});
c.addEventListener('mousemove',e=>{
const r=c.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;
});
init();draw();
</script>
</section>
