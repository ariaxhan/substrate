<section data-date='2026-08-27' data-type='digest'>
<style>
#taper-2026-08-27{margin:0;overflow:hidden;background:#08090c;color:#cfd8dc;height:520px;position:relative;font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
#taper-2026-08-27 h1{position:absolute;top:10px;left:16px;margin:0;font:italic 12px/1.4 Georgia,serif;color:#5c6773;letter-spacing:.04em;z-index:5;pointer-events:none}
#taper-2026-08-27 svg{position:absolute;inset:0;width:100%;height:100%}
#taper-2026-08-27 .n{fill:#e8c37a}
#taper-2026-08-27 .l{stroke:#3a4a55;stroke-width:1}
#taper-2026-08-27 .g{stroke:#e8c37a;stroke-width:1;opacity:.5}
#taper-2026-08-27 .w{position:absolute;font:italic 13px Georgia,serif;color:#8fa3ad;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity 1.4s ease,transform 1.4s ease;pointer-events:none;white-space:nowrap}
#taper-2026-08-27 .w.on{opacity:.85;transform:translate(-50%,-50%) scale(1)}
#taper-2026-08-27 footer{position:absolute;bottom:8px;left:16px;font:11px/1.4 monospace;color:#3a4550;z-index:5}
</style>
<div id="taper-2026-08-27">
<h1>crystallize &mdash; click to know a thing</h1>
<svg id="tp-svg"></svg>
<footer id="tp-count">0 fragments held</footer>
</div>
<script>
(function(){
var root=document.getElementById('taper-2026-08-27');
var svg=document.getElementById('tp-svg');
var ns='http://www.w3.org/2000/svg';
var pts=[];
var words=['pattern','residue','recall','thread','signal','trace','shape','memory','order','weight','echo','form'];
var used=0;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function addWord(x,y){
  var el=document.createElement('div');
  el.className='w';
  el.textContent=words[used%words.length];
  used++;
  el.style.left=x+'px';
  el.style.top=(y-22)+'px';
  root.appendChild(el);
  requestAnimationFrame(function(){el.classList.add('on')});
  setTimeout(function(){el.style.opacity=0},4200);
  setTimeout(function(){el.remove()},6000);
}
root.addEventListener('click',function(e){
  var r=root.getBoundingClientRect();
  var x=e.clientX-r.left,y=e.clientY-r.top;
  var p={x:x,y:y};
  var near=pts.slice().sort(function(a,b){return dist(a,p)-dist(b,p)}).slice(0,3);
  near.forEach(function(o){
    var line=document.createElementNS(ns,'line');
    line.setAttribute('x1',p.x);line.setAttribute('y1',p.y);
    line.setAttribute('x2',o.x);line.setAttribute('y2',o.y);
    var isCluster=dist(o,p)<90;
    line.setAttribute('class',isCluster?'g':'l');
    svg.appendChild(line);
  });
  var dot=document.createElementNS(ns,'circle');
  dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r',3);
  dot.setAttribute('class','n');
  svg.appendChild(dot);
  pts.push(p);
  document.getElementById('tp-count').textContent=pts.length+' fragments held';
  var tight=near.filter(function(o){return dist(o,p)<70}).length;
  if(pts.length>2 && tight>=2){addWord(x,y)}
});
root.addEventListener('mousemove',function(e){
  if(!pts.length)return;
  var r=root.getBoundingClientRect();
  var p={x:e.clientX-r.left,y:e.clientY-r.top};
  var near=pts.slice().sort(function(a,b){return dist(a,p)-dist(b,p)})[0];
  if(near && dist(near,p)<50){
    root.style.cursor='pointer';
  } else {
    root.style.cursor='crosshair';
  }
});
})();
</script>
</section>
