<section data-date='2026-08-16' data-type='morning'>
<style>
#tp-dawn{position:relative;height:70vh;min-height:420px;overflow:hidden;background:#0b0e1a;font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
#tp-dawn .tp-sky{position:absolute;inset:0;transition:background 120ms linear}
#tp-dawn .tp-sun{position:absolute;left:50%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6e0,#ffcf7a 55%,#ff9a4d 100%);box-shadow:0 0 60px 10px rgba(255,180,90,.35);transform:translate(-50%,50%);transition:bottom 120ms linear,opacity 300ms}
#tp-dawn .tp-line{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.12)}
#tp-dawn .tp-word{position:absolute;letter-spacing:.12em;text-transform:lowercase;font-size:13px;color:rgba(255,255,255,.55);opacity:0;transition:opacity 900ms ease,transform 900ms ease;transform:translateY(6px);pointer-events:none;user-select:none}
#tp-dawn .tp-word.on{opacity:1;transform:translateY(0)}
#tp-dawn .tp-hint{position:absolute;bottom:14px;left:16px;font-family:-apple-system,sans-serif;font-size:11px;color:rgba(255,255,255,.28);letter-spacing:.06em}
#tp-dawn .tp-title{position:absolute;top:16px;left:16px;font-family:-apple-system,sans-serif;font-size:11px;color:rgba(255,255,255,.32);letter-spacing:.14em;text-transform:uppercase}
</style>
<div id="tp-dawn">
  <div class="tp-sky"></div>
  <div class="tp-line" style="top:60%"></div>
  <div class="tp-sun"></div>
  <div class="tp-title">first light</div>
  <div class="tp-hint">move to raise it. click to write on it.</div>
</div>
<script>
(function(){
  var el=document.getElementById('tp-dawn');
  var sky=el.querySelector('.tp-sky');
  var sun=el.querySelector('.tp-sun');
  var words=['unwritten','possible','quiet','open','uncounted','waiting','clean','wide','yours'];
  var placed=0;
  function paint(t){
    var top=lerp3([10,8,26],[255,140,60],[255,220,150],t);
    var mid=lerp3([20,18,46],[255,190,120],[255,240,205],t);
    var bot=lerp3([5,6,14],[80,40,30],[255,250,235],t);
    sky.style.background='linear-gradient(to bottom, rgb('+top+') 0%, rgb('+mid+') 55%, rgb('+bot+') 100%)';
    sun.style.bottom=(t*66)+'%';
    sun.style.opacity=.35+t*.65;
  }
  function lerp3(a,b,c,t){
    var s=t<.5?[a,b,t*2]:[b,c,(t-.5)*2];
    var x=s[0],y=s[1],u=s[2];
    return Math.round(x[0]+(y[0]-x[0])*u)+','+Math.round(x[1]+(y[1]-x[1])*u)+','+Math.round(x[2]+(y[2]-x[2])*u);
  }
  paint(.15);
  el.addEventListener('mousemove',function(e){
    var r=el.getBoundingClientRect();
    var t=1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
    paint(t);
  });
  el.addEventListener('click',function(e){
    if(placed>=words.length)return;
    var r=el.getBoundingClientRect();
    var w=document.createElement('div');
    w.className='tp-word';
    w.textContent=words[placed++];
    w.style.left=Math.max(6,Math.min(88,((e.clientX-r.left)/r.width*100)))+'%';
    w.style.top=Math.max(6,Math.min(88,((e.clientY-r.top)/r.height*100)))+'%';
    el.appendChild(w);
    requestAnimationFrame(function(){w.classList.add('on')});
  });
})();
</script>
</section>
