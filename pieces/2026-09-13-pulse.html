<section data-date='2026-09-13' data-type='pulse'>
<style>
#tp-halfway{margin:0;overflow:hidden;height:70vh;min-height:420px;position:relative;
background:linear-gradient(180deg,#1a1330 0%,#3a2340 45%,#c96a3e 50%,#3a2340 55%,#1a1330 100%);
font-family:Georgia,'Times New Roman',serif;cursor:ns-resize}
#tp-halfway .beam{position:absolute;top:50%;left:10%;right:10%;height:2px;
background:rgba(255,225,190,.55);transform-origin:center;transition:transform .12s linear}
#tp-halfway .fulcrum{position:absolute;top:50%;left:50%;width:0;height:0;
border-left:14px solid transparent;border-right:14px solid transparent;
border-bottom:26px solid rgba(255,225,190,.8);transform:translate(-50%,-100%)}
#tp-halfway .side{position:absolute;top:50%;font-size:clamp(1.1rem,2.6vw,2.2rem);
letter-spacing:.06em;color:#f4e3d3;text-transform:lowercase;transition:transform .12s linear,opacity .3s ease}
#tp-halfway .side.l{left:10%;transform-origin:left center}
#tp-halfway .side.r{right:10%;text-align:right;transform-origin:right center}
#tp-halfway .noon{position:absolute;top:calc(50% - 46px);left:50%;transform:translateX(-50%);
font-size:.7rem;letter-spacing:.35em;color:rgba(255,225,190,.5);text-transform:uppercase}
#tp-halfway .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;
font-size:.65rem;letter-spacing:.2em;color:rgba(255,225,190,.35);text-transform:uppercase;
font-family:Arial,sans-serif}
</style>
<div id="tp-halfway">
  <div class="noon">the fulcrum</div>
  <div class="beam" id="tp-beam"></div>
  <div class="fulcrum"></div>
  <div class="side l" id="tp-l">what the morning owed</div>
  <div class="side r" id="tp-r">what the evening keeps</div>
  <div class="hint">tilt · click to hold still</div>
</div>
<script>
(function(){
  var el=document.getElementById('tp-halfway'),
      beam=document.getElementById('tp-beam'),
      L=document.getElementById('tp-l'),
      R=document.getElementById('tp-r'),
      frozen=false,tilt=0;
  function apply(t){
    tilt=Math.max(-22,Math.min(22,t));
    beam.style.transform='rotate('+tilt+'deg)';
    var s=tilt/22;
    L.style.transform='translateY(-50%) translateY('+(s*30)+'px) rotate('+(tilt*.3)+'deg)';
    R.style.transform='translateY(-50%) translateY('+(-s*30)+'px) rotate('+(tilt*.3)+'deg)';
    L.style.opacity=0.55+0.45*Math.max(0,-s);
    R.style.opacity=0.55+0.45*Math.max(0,s);
  }
  el.addEventListener('mousemove',function(e){
    if(frozen)return;
    var r=el.getBoundingClientRect();
    var mid=(e.clientX-r.left)/r.width-0.5;
    apply(mid*44);
  });
  el.addEventListener('mouseleave',function(){if(!frozen)apply(0);});
  el.addEventListener('click',function(){
    frozen=!frozen;
    el.style.filter=frozen?'saturate(1.3) brightness(1.08)':'';
  });
  apply(0);
})();
</script>
</section>
