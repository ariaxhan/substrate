<section data-date='2026-07-28' data-type='pulse'>
<style>
[data-date="2026-07-28"]{
  --ink:#e9e4d6;
  position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;height:100vh;background:#0b0b0d;overflow:hidden;
  font-family:Georgia,'Iowan Old Style',serif;cursor:crosshair;
}
[data-date="2026-07-28"] .horizon{
  position:absolute;top:50%;left:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,#3a3a3f,transparent);
}
[data-date="2026-07-28"] .beam{
  position:absolute;top:50%;left:50%;width:min(70vw,640px);
  display:flex;justify-content:space-between;align-items:center;
  transform:translate(-50%,-50%) rotate(0deg);
  transition:transform .15s ease-out;
  transform-origin:center center;
}
[data-date="2026-07-28"] .beam::before{
  content:"";position:absolute;top:50%;left:0;width:100%;height:1px;background:var(--ink);opacity:.35;
}
[data-date="2026-07-28"] .beam span{
  position:relative;z-index:2;background:#0b0b0d;padding:0 14px;
  font-size:clamp(13px,2.2vw,26px);letter-spacing:.18em;color:var(--ink);
  text-transform:uppercase;
}
[data-date="2026-07-28"] .pivot{
  position:absolute;top:50%;left:50%;width:0;height:0;
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:15px solid var(--ink);transform:translate(-50%,7px);
  transition:filter .3s ease;
}
[data-date="2026-07-28"] .pivot.flash{filter:drop-shadow(0 0 14px #fff8);}
[data-date="2026-07-28"] .ratio{
  position:absolute;bottom:9vh;left:50%;transform:translateX(-50%);
  color:#6b6b70;font-family:'Courier New',monospace;font-size:11px;
  letter-spacing:.3em;
}
[data-date="2026-07-28"] .hint{
  position:absolute;top:9vh;left:50%;transform:translateX(-50%);
  color:#4a4a4f;font-family:'Courier New',monospace;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;
}
</style>
<div class="horizon"></div>
<div class="hint">tilt the day / click to still it</div>
<div class="beam" id="tp-beam">
  <span>morning</span>
  <span>evening</span>
</div>
<div class="pivot" id="tp-pivot"></div>
<div class="ratio" id="tp-ratio">50 / 50</div>
<script>
(function(){
  var root=document.querySelector('[data-date="2026-07-28"]');
  var beam=document.getElementById('tp-beam'),
      ratio=document.getElementById('tp-ratio'),
      pivot=document.getElementById('tp-pivot'),
      locked=false;
  root.addEventListener('mousemove', function(e){
    if(locked) return;
    var rect=root.getBoundingClientRect();
    var p=(e.clientX-rect.left)/rect.width;
    p=Math.min(1,Math.max(0,p));
    var deg=(p-0.5)*30;
    beam.style.transform='translate(-50%,-50%) rotate('+deg+'deg)';
    var l=Math.round(50+(p-0.5)*94);
    l=Math.min(99,Math.max(1,l));
    ratio.textContent=l+' / '+(100-l);
  });
  root.addEventListener('click', function(){
    if(locked) return;
    locked=true;
    beam.style.transition='transform .7s cubic-bezier(.2,.8,.2,1)';
    beam.style.transform='translate(-50%,-50%) rotate(0deg)';
    ratio.textContent='50 / 50';
    pivot.classList.add('flash');
    setTimeout(function(){
      pivot.classList.remove('flash');
      beam.style.transition='transform .15s ease-out';
      locked=false;
    },950);
  });
})();
</script>
</section>
