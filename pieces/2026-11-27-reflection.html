<section data-date='2026-11-27' data-type='reflection'>
<style>
.tp{position:relative;height:100vh;overflow:hidden;cursor:crosshair;background:linear-gradient(#05060f,#141535 70%,#2a2148);font:italic 1.1rem Georgia,serif;color:#e9e2c8}
.tp canvas{position:absolute;inset:0;width:100%;height:100%}
.tp p{position:absolute;bottom:7%;width:100%;text-align:center;margin:0;letter-spacing:.3em;opacity:.45;transition:opacity 4s}
</style>
<div class="tp"><canvas id="c"></canvas><p id="p">the day is done. touch the dark.</p></div>
<script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d'),p=document.getElementById('p');
let W,H,S=[],M=null,W8=['rest','enough','held','soft','again','almost','here','kept'];
const R=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight};R();onresize=R;
const add=(a,b,w)=>S.push({a,b,t:0,r:1+Math.random()*2,w});
for(let i=0;i<14;i++)add(Math.random()*W,Math.random()*H*.7);
c.onclick=e=>{const r=c.getBoundingClientRect();
add(e.clientX-r.left,e.clientY-r.top,W8[S.length%8]);p.style.opacity=0;p.textContent=''};
c.onmousemove=e=>{const r=c.getBoundingClientRect();M=[e.clientX-r.left,e.clientY-r.top]};
c.onmouseleave=()=>M=null;
(function f(){
x.clearRect(0,0,W,H);
S.forEach((s,i)=>{
s.t=Math.min(1,s.t+.01);
const tw=.6+.4*Math.sin(Date.now()/700+i*2);
const d=M?Math.hypot(M[0]-s.a,M[1]-s.b):999;
const g=d<150?1-d/150:0;
s.g=(s.g||0)*.96+g*.04;
if(g>0)s.g=Math.max(s.g,g*.5);
x.globalAlpha=s.t*tw;
x.fillStyle='#fff6d6';x.shadowColor='#ffd98a';x.shadowBlur=6+s.g*30;
x.beginPath();x.arc(s.a,s.b,s.r*(1+s.g),0,7);x.fill();
x.shadowBlur=0;
if(s.w){x.globalAlpha=s.t*.8;x.fillText(s.w,s.a+10,s.b+4)}
S.forEach((o,j)=>{if(j>i){const k=Math.hypot(o.a-s.a,o.b-s.b),v=Math.min(s.g,o.g);
if(k<220&&v>.05){x.globalAlpha=v*(1-k/220)*s.t*o.t;x.strokeStyle='#ffd98a';x.beginPath();x.moveTo(s.a,s.b);x.lineTo(o.a,o.b);x.stroke()}}});
});
x.font='italic 15px Georgia';
requestAnimationFrame(f)})();
</script>
</section>
