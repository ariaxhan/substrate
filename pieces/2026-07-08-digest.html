<section data-date='2026-07-08' data-type='digest'>
<style>
#lat{margin:0;background:radial-gradient(ellipse at 50% 40%,#12131c,#05050a 70%);overflow:hidden;position:relative;height:70vh;min-height:420px;cursor:crosshair;font-family:Georgia,'Times New Roman',serif}
#lat canvas{display:block;width:100%;height:100%}
#lat p{position:absolute;top:14px;left:18px;margin:0;color:#5a5a72;font:italic 13px/1.4 Georgia,serif;letter-spacing:.02em;pointer-events:none;transition:opacity 1.2s ease}
#lat span{position:absolute;bottom:12px;right:16px;color:#3a3a4a;font:11px/1 'Courier New',monospace;letter-spacing:.08em;pointer-events:none}
</style>
<div id="lat">
<p id="hint">tap to know something</p>
<span id="ct">0 known</span>
</div>
<script>
(function(){
var host=document.currentScript.closest('section').querySelector('#lat');
var cv=document.createElement('canvas');
host.insertBefore(cv,host.firstChild);
var ctx=cv.getContext('2d');
var hint=host.querySelector('#hint'),ct=host.querySelector('#ct');
var W,H;
function sz(){W=cv.width=host.clientWidth;H=cv.height=host.clientHeight}
sz();addEventListener('resize',sz);
var words=['signal','trace','residue','pattern','echo','lattice','memory','thread','witness','fold','structure','recall','shard','grain','return','kernel','marrow','vein','root','archive','cipher','bloom','anchor','drift'];
var pts=[],t0=performance.now();
function add(x,y){
  var w=words[(Math.random()*words.length)|0];
  var p={x:x,y:y,w:w,born:performance.now(),links:[]};
  for(var i=0;i<pts.length;i++){
    var q=pts[i],dx=q.x-x,dy=q.y-y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<Math.min(W,H)*0.32){p.links.push(i);}
  }
  pts.push(p);
  ct.textContent=pts.length+' known';
  if(pts.length===1){hint.style.opacity=0}
}
host.addEventListener('click',function(e){
  var r=host.getBoundingClientRect();
  add(e.clientX-r.left,e.clientY-r.top);
});
host.addEventListener('touchstart',function(e){
  var r=host.getBoundingClientRect(),t=e.touches[0];
  add(t.clientX-r.left,t.clientY-r.top);
},{passive:true});
function frame(now){
  ctx.clearRect(0,0,W,H);
  var age=now-t0;
  for(var i=0;i<pts.length;i++){
    var p=pts[i];
    for(var j=0;j<p.links.length;j++){
      var q=pts[p.links[j]];
      var pulse=0.15+0.1*Math.sin((now-p.born)/900+i);
      ctx.strokeStyle='rgba(200,170,110,'+pulse+')';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
    }
  }
  for(var i=0;i<pts.length;i++){
    var p=pts[i],a=Math.min(1,(now-p.born)/600);
    var glow=6+2*Math.sin(now/700+i*1.3);
    var grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,glow*4);
    grad.addColorStop(0,'rgba(240,205,130,'+(0.9*a)+')');
    grad.addColorStop(1,'rgba(240,205,130,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(p.x,p.y,glow*4,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,235,200,'+a+')';
    ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,6.28);ctx.fill();
    if(p.links.length>1||pts.length<9){
      ctx.font='italic 12px Georgia,serif';
      ctx.fillStyle='rgba(200,190,170,'+(0.55*a)+')';
      ctx.fillText(p.w,p.x+8,p.y-8);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</section>
