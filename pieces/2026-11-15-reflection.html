<section data-date='2026-11-15' data-type='reflection'>
<style>
.nt{position:relative;height:100vh;min-height:360px;background:radial-gradient(ellipse at 50% 120%,#2a2146,#0b0c1e 55%,#03030a);overflow:hidden;cursor:crosshair;font-family:Georgia,'Times New Roman',serif}
.nt canvas{position:absolute;inset:0;width:100%;height:100%}
.nt p{position:absolute;left:0;right:0;bottom:7%;margin:0;text-align:center;color:#9a95c4;font-style:italic;letter-spacing:.3em;font-size:14px;opacity:.7;transition:opacity 3s;pointer-events:none}
</style>
<div class="nt"><canvas id="ntc"></canvas><p id="ntp">the day is complete</p></div>
<script>
(function(){
var c=document.getElementById('ntc'),x=c.getContext('2d'),p=document.getElementById('ntp'),
W,H,S=[],M={x:-9,y:-9},t=0,
words=['rest','still','enough','dark is kind','begin again','breathe','later','held'],wi=0,W2=[];
function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
rs();addEventListener('resize',rs);
for(var i=0;i<90;i++)S.push({x:Math.random(),y:Math.random()*.85,r:Math.random()*1.2+.3,h:Math.random()<.2,u:Math.random()*6.3,m:0});
function add(px,py){S.push({x:px/W,y:py/H,r:2.2,h:0,u:0,m:1,b:1});
 W2.push({w:words[wi++%words.length],x:px,y:py-14,a:1});p.style.opacity=0}
c.parentNode.addEventListener('click',function(e){var r=c.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)});
c.parentNode.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();M.x=e.clientX-r.left;M.y=e.clientY-r.top});
function f(){t+=.02;x.clearRect(0,0,W,H);
 var v=S.map(function(s){var px=s.x*W,py=s.y*H,d=Math.hypot(px-M.x,py-M.y),
  l=s.h?(d<130?1-d/130:0):.35+.35*Math.sin(t+s.u);
  if(s.m)l=1;
  x.globalAlpha=Math.min(1,l);x.fillStyle=s.m?'#ffe9a8':'#cfd6ff';
  x.shadowBlur=s.m?14:s.h?8:0;x.shadowColor='#ffe9a8';
  x.beginPath();x.arc(px,py,s.r*(s.h&&l>0?1.6:1),0,6.3);x.fill();
  return{x:px,y:py,l:l,s:s}});
 x.shadowBlur=0;x.lineWidth=.6;
 for(var i=0;i<v.length;i++)for(var j=i+1;j<v.length;j++){var a=v[i],b=v[j];
  if(a.l<.5||b.l<.5)continue;
  var d=Math.hypot(a.x-b.x,a.y-b.y);
  if(d<120&&(a.s.h||b.s.h||a.s.m||b.s.m)){x.globalAlpha=(1-d/120)*.5*Math.min(a.l,b.l);x.strokeStyle='#ffe9a8';
   x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
 x.font='italic 16px Georgia';x.textAlign='center';x.fillStyle='#ffe9a8';
 W2.forEach(function(w){w.a=Math.max(.25,w.a-.002);x.globalAlpha=w.a;x.fillText(w.w,w.x,w.y)});
 requestAnimationFrame(f)}
f();
})();
</script>
</section>
