<section data-date='2026-02-04' data-type='pulse'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#fafaf8;font-family:Palatino,Georgia,serif}
#f{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vmin;height:90vmin;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
#a{position:absolute;width:2px;height:100%;background:linear-gradient(to bottom,#1a1a1a 0%,#1a1a1a 49.5%,#c8a882 50%,#1a1a1a 50.5%,#1a1a1a 100%);transition:background 0.8s ease;left:50%;transform:translateX(-50%)}
.w{position:absolute;font-size:clamp(2rem,5vmin,4rem);letter-spacing:0.05em;transition:all 1.2s cubic-bezier(0.4,0,0.2,1);opacity:0.88;font-weight:400}
#l{right:52%;top:50%;transform:translate(0,-50%);text-align:right}
#r{left:52%;top:50%;transform:translate(0,-50%);text-align:left}
#c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(1.2rem,3vmin,2.4rem);opacity:0.4;transition:opacity 0.6s ease;text-align:center;letter-spacing:0.12em;font-variant:small-caps}
</style>
<div id=f>
<div id=a></div>
<div class=w id=l>AM</div>
<div class=w id=r>PM</div>
<div id=c>XII</div>
</div>
<script>
const h=new Date().getHours(),
m=new Date().getMinutes(),
t=h*60+m,
n=12*60,
d=Math.abs(t-n),
f=document.getElementById('f'),
a=document.getElementById('a'),
l=document.getElementById('l'),
r=document.getElementById('r'),
c=document.getElementById('c'),
u=()=>{
const p=Math.min(d/360,1);
l.style.fontSize=`clamp(2rem,${5-p*2}vmin,4rem)`;
r.style.fontSize=`clamp(2rem,${5-p*2}vmin,4rem)`;
c.style.opacity=0.4-p*0.3;
const s=t<n?0.3:0.7;
a.style.background=`linear-gradient(to bottom,#1a1a1a 0%,#1a1a1a ${(s-0.005)*100}%,#c8a882 ${s*100}%,#1a1a1a ${(s+0.005)*100}%,#1a1a1a 100%)`;
};
let o=0,i=null;
f.onclick=e=>{
clearInterval(i);
const x=e.clientX/window.innerWidth,
y=e.clientY/window.innerHeight,
b=x<0.5?-1:1,
v=Math.abs(0.5-x)*2;
o=b*v*45;
l.style.transform=`translate(0,-50%) translateX(${-o*0.3}px) scale(${1+Math.abs(o)*0.008})`;
r.style.transform=`translate(0,-50%) translateX(${o*0.3}px) scale(${1-Math.abs(o)*0.008})`;
a.style.transform=`translateX(-50%) rotate(${o*0.5}deg)`;
c.style.opacity=0.1;
let s=0;
i=setInterval(()=>{
s+=0.016;
const g=Math.exp(-s*2.2),
p=o*g;
l.style.transform=`translate(0,-50%) translateX(${-p*0.3}px) scale(${1+Math.abs(p)*0.008})`;
r.style.transform=`translate(0,-50%) translateX(${p*0.3}px) scale(${1-Math.abs(p)*0.008})`;
a.style.transform=`translateX(-50%) rotate(${p*0.5}deg)`;
c.style.opacity=0.1+(0.3-d/360*0.3)*(1-g);
if(Math.abs(p)<0.1){
clearInterval(i);
l.style.transform='translate(0,-50%)';
r.style.transform='translate(0,-50%)';
a.style.transform='translateX(-50%)';
c.style.opacity=0.4-Math.min(d/360,1)*0.3;
}
},16);
};
u();
</script>
</section>
