<section data-date='2026-05-19' data-type='digest'>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;background:#050810;overflow:hidden;cursor:crosshair}
canvas{position:fixed;inset:0}
#h{position:fixed;bottom:1.6em;width:100%;text-align:center;font:10px/1 'Courier New',monospace;color:#1a3050;letter-spacing:.3em;transition:opacity 3s}
</style>
<canvas id=c></canvas>
<div id=h>click to deposit</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),hint=document.getElementById('h');
const W=()=>innerWidth,H=()=>innerHeight;
const V=[
  'observe','record','pattern','signal',
  'noise','threshold','cluster','emerge',
  'structure','memory','weight','connect',
  'trace','corpus','drift','layer',
  'model','align','distill','converge',
  'index','form','sense','sediment',
  'density','phase','link','precipitate'
];
let ns=[],clicked=0;

function resize(){cv.width=W();cv.height=H()}
resize();
addEventListener('resize',resize);

function draw(){
  cx.clearRect(0,0,W(),H());

  // connections
  for(let i=0;i<ns.length;i++){
    for(let j=i+1;j<ns.length;j++){
      const a=ns[i],b=ns[j];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<170){
        const s=1-d/170;
        cx.strokeStyle=`rgba(55,185,200,${s*.5})`;
        cx.lineWidth=s*1.3;
        cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();
      }
    }
  }

  // triangle crystallization — only when 3 nodes are close
  if(ns.length>=3){
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++)for(let k=j+1;k<ns.length;k++){
      const a=ns[i],b=ns[j],c=ns[k];
      if(Math.hypot(a.x-b.x,a.y-b.y)<120&&
         Math.hypot(b.x-c.x,b.y-c.y)<120&&
         Math.hypot(a.x-c.x,a.y-c.y)<120){
        cx.fillStyle='rgba(240,150,30,.04)';
        cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.lineTo(c.x,c.y);cx.closePath();cx.fill();
      }
    }
  }

  // nodes
  const now=Date.now();
  for(const n of ns){
    const age=Math.min((now-n.b)/600,1);
    n.x+=n.vx; n.vx*=.96;
    n.y+=n.vy; n.vy*=.96;
    cx.globalAlpha=age;
    cx.font=`${n.s}px Georgia,serif`;
    cx.textAlign='center';
    cx.textBaseline='middle';
    cx.fillStyle=`hsl(38,88%,${58+age*12}%)`;
    cx.fillText(n.w,n.x,n.y);
    cx.globalAlpha=1;
  }

  requestAnimationFrame(draw);
}

addEventListener('click',e=>{
  if(!clicked++) hint.style.opacity=0;
  const a=Math.random()*Math.PI*2, sp=Math.random()*1.2+.3;
  const word=V[Math.random()*V.length|0];
  // shorter words get larger size (more weight to dense concepts)
  const s=Math.max(10,18-word.length*.6+Math.random()*4);
  ns.push({x:e.clientX,y:e.clientY,w:word,s,b:Date.now(),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp});
  // cap to prevent n³ triangle cost from lagging
  if(ns.length>40) ns.shift();
});

draw();
</script>
</section>
