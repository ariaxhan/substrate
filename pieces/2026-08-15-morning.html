<section data-date='2026-08-15' data-type='morning'>
<style>
#tp-dawn{position:relative;height:70vh;min-height:420px;background:#0b1020;overflow:hidden;font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
#tp-dawn .tp-sky{position:absolute;inset:0;transition:background 0.15s linear}
#tp-dawn .tp-sun{position:absolute;width:14vw;height:14vw;max-width:160px;max-height:160px;border-radius:50%;background:radial-gradient(circle,#fff8e0,#ffdca8 55%,transparent 72%);left:50%;bottom:-8%;transform:translateX(-50%);filter:blur(1px);transition:bottom 0.2s ease}
#tp-dawn .tp-line{position:absolute;left:0;right:0;height:1px;background:rgba(255,230,190,0.12)}
#tp-dawn .tp-words{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0.4em 0.6em;padding:8vw;box-sizing:border-box;text-align:center}
#tp-dawn .tp-words span{opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.1s ease;color:#fff2dc;font-size:clamp(1.1rem,2.6vw,2.1rem);letter-spacing:0.02em;text-shadow:0 0 18px rgba(255,200,140,0.25)}
#tp-dawn .tp-words span.tp-on{opacity:1;transform:translateY(0)}
#tp-dawn .tp-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:monospace;font-size:11px;letter-spacing:0.15em;color:rgba(255,240,220,0.35);text-transform:uppercase;pointer-events:none;transition:opacity 0.6s}
</style>
<div id="tp-dawn">
  <div class="tp-sky" id="tp-sky"></div>
  <div class="tp-sun" id="tp-sun"></div>
  <div class="tp-words" id="tp-words"></div>
  <div class="tp-hint" id="tp-hint">move to raise the light &middot; click to begin the day</div>
</div>
<script>
(function(){
  var root=document.getElementById('tp-dawn');
  var sky=document.getElementById('tp-sky');
  var sun=document.getElementById('tp-sun');
  var words=document.getElementById('tp-words');
  var hint=document.getElementById('tp-hint');
  var w=["nothing","yet.","a page,","unmarked.","the hour","before","the hour","chooses","its shape.","light","first,","then","everything","else."];
  var lit=0,started=false;
  function paint(p){
    var top=lerp('#0b1020','#3a4a7a',p);
    var mid=lerp('#4a3a6a','#e8875a',p);
    var bot=lerp('#1a1830','#ffd9a0',p);
    sky.style.background='linear-gradient(to bottom,'+top+' 0%,'+mid+' 55%,'+bot+' 100%)';
    sun.style.bottom=(-8+p*46)+'%';
  }
  function hex(c){return c.length==1?'0'+c:c}
  function lerp(a,b,t){
    a=parse(a);b=parse(b);
    var r=Math.round(a[0]+(b[0]-a[0])*t);
    var g=Math.round(a[1]+(b[1]-a[1])*t);
    var bl=Math.round(a[2]+(b[2]-a[2])*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function parse(h){
    h=h.replace('#','');
    return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
  }
  root.addEventListener('mousemove',function(e){
    var p=Math.max(0,Math.min(1,e.clientY/root.offsetHeight));
    paint(1-p);
  });
  root.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    if(!t)return;
    var p=Math.max(0,Math.min(1,t.clientY/root.offsetHeight));
    paint(1-p);
  });
  paint(0.15);
  function reveal(){
    if(lit>=w.length){return}
    var s=document.createElement('span');
    s.textContent=w[lit];
    words.appendChild(s);
    requestAnimationFrame(function(){s.classList.add('tp-on')});
    lit++;
    setTimeout(reveal,420+Math.random()*260);
  }
  root.addEventListener('click',function(){
    if(started)return;
    started=true;
    hint.style.opacity='0';
    paint(0.9);
    reveal();
  });
})();
</script>
</section>
