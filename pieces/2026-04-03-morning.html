<!doctype html>
<html><head>
<meta charset="utf-8">
<title>threshold</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#070a17;cursor:crosshair}
#s{position:relative;width:100%;height:100%}
.w{
  position:absolute;font-family:Georgia,serif;color:#ede0c8;
  opacity:0;pointer-events:none;user-select:none;
  letter-spacing:.06em;line-height:1;will-change:opacity;
}
#g{
  position:fixed;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,160,45,.42) 0%,rgba(255,90,15,.06) 55%,transparent 72%);
  transform:translate(-50%,-50%);pointer-events:none;
  mix-blend-mode:screen;left:-999px;top:-999px;
}
#d{
  position:fixed;inset:0;
  background:linear-gradient(to top,#d96b08 0%,#f0a830 28%,#fad97a 58%,#fff6ec 100%);
  opacity:0;pointer-events:none;mix-blend-mode:screen;
}
#hint{
  position:fixed;bottom:22px;width:100%;text-align:center;
  font-family:Georgia,serif;font-size:10px;color:rgba(255,255,255,.18);
  letter-spacing:.25em;pointer-events:none;transition:opacity 2.5s ease;
}
</style>
</head>
<body>
<section data-date='2026-04-03' data-type='morning'>
<div id="s"></div>
<div id="g"></div>
<div id="d"></div>
<div id="hint">move &nbsp;·&nbsp; click</div>
<script>
const P=[
  "not yet","almost","the hour before","unnamed",
  "still","threshold","becoming","the body wakes",
  "open","first breath","something begins","the edge of",
  "wait","today could be","tender","unwritten",
  "the sky holds","before language","almost light","ready",
  "the world readies","possible","a door ajar","morning knows"
],
S=document.getElementById("s"),
G=document.getElementById("g"),
D=document.getElementById("d"),
H=document.getElementById("hint"),
W=[];
let dawned=false,moved=false;

P.forEach(p=>{
  const e=document.createElement("div");
  e.className="w";e.textContent=p;
  e.style.left=(5+Math.random()*84)+"%";
  e.style.top=(7+Math.random()*82)+"%";
  e.style.fontSize=(12+Math.random()*17)+"px";
  S.appendChild(e);W.push(e);
});

document.addEventListener("mousemove",e=>{
  G.style.left=e.clientX+"px";
  G.style.top=e.clientY+"px";
  if(!moved){moved=true;H.style.opacity="0"}
  if(dawned)return;
  W.forEach(w=>{
    const r=w.getBoundingClientRect(),
      cx=r.left+r.width/2,cy=r.top+r.height/2,
      dist=Math.hypot(cx-e.clientX,cy-e.clientY);
    w.style.opacity=Math.max(0,1-dist/115).toFixed(2);
  });
});

document.addEventListener("click",()=>{
  if(dawned)return;
  dawned=true;
  D.style.transition="opacity 1.1s ease";
  D.style.opacity=".88";
  W.forEach(w=>{
    w.style.transition="opacity .6s ease";
    w.style.opacity="1";
  });
  G.style.transition="opacity .8s ease";
  G.style.opacity="0";
  setTimeout(()=>{
    D.style.transition="opacity 3.5s ease";
    D.style.opacity=".07";
    W.forEach(w=>{
      w.style.transition="opacity 3s ease";
      w.style.opacity=".16";
    });
    document.body.style.transition="background 3s ease";
    document.body.style.background="#0c0f1f";
  },2000);
});
</script>
</section>
</body>
</html>
