<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>begin</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#030710;overflow:hidden;font-family:Georgia,serif;transition:background 1.1s}
#s{width:100vw;height:100vh;position:relative}
#b{position:absolute;top:50%;left:50%;font-size:clamp(2.2rem,5vw,4rem);font-style:italic;color:#e8c87a;opacity:0;transition:opacity 5s ease;letter-spacing:.09em;pointer-events:none;white-space:nowrap}
.w{position:absolute;transition:color .85s ease;pointer-events:none;transform:translate(-50%,-50%);font-style:italic;color:rgba(220,200,152,0)}
</style>
</head>
<body>
<section data-date='2026-06-15' data-type='morning'>
<div id=s><div id=b>begin</div></div>
</section>
<script>
const W=window,s=document.getElementById('s'),b=document.getElementById('b');
const ws=['possible','yours','still','now','open','waiting','held','here'];
let mx=W.innerWidth/2,my=W.innerHeight/2,lx=mx,ly=my,idle=0,sc=0,sp=[];

setTimeout(()=>b.style.opacity=1,100);

function reset(){
  sp.forEach(e=>{e.style.color='rgba(220,200,152,0)';setTimeout(()=>e.remove(),900)});
  sp=[];sc=0;idle=0;
}
function mv(x,y){
  if(Math.hypot(x-lx,y-ly)>4)reset();
  mx=x;my=y;lx=x;ly=y;
}
W.addEventListener('mousemove',e=>mv(e.clientX,e.clientY));
W.addEventListener('touchmove',e=>{e.preventDefault();mv(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
W.addEventListener('touchstart',e=>{const t=e.touches[0];mx=t.clientX;my=t.clientY});
W.addEventListener('click',()=>{
  document.body.style.background='#170e03';
  setTimeout(()=>document.body.style.background='#030710',1100);
  reset();
});

function tick(){
  idle++;
  if(sc<ws.length&&(idle===62||(idle>62&&(idle-62)%52===0))){
    const e=document.createElement('div');
    e.className='w';e.textContent=ws[sc++];
    const a=Math.random()*Math.PI*2,r=88+Math.random()*108;
    e.style.left=(mx+Math.cos(a)*r)+'px';
    e.style.top=(my+Math.sin(a)*r)+'px';
    e.style.fontSize=(.82+Math.random()*.52).toFixed(2)+'rem';
    s.appendChild(e);sp.push(e);
    setTimeout(()=>e.style.color='rgba(220,200,152,.66)',30);
  }
  const tx=(mx/W.innerWidth-.5)*15,ty=(my/W.innerHeight-.5)*9;
  b.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px))`;
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
