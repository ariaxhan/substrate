<section data-date='2026-05-02' data-type='reflection'>
<style>
.inv-field{position:relative;background:#06050e;min-height:72vh;overflow:hidden;cursor:crosshair}
.inv-field canvas{position:absolute;inset:0}
.inv-field .inv-close{position:absolute;bottom:2.2em;left:0;right:0;text-align:center;font:italic 13px/1 Georgia,serif;color:rgba(195,185,220,0);letter-spacing:.2em;transition:color 6s ease;pointer-events:none}
.inv-field .inv-close.lit{color:rgba(195,185,220,.42)}
.inv-field .inv-hint{position:absolute;top:50%;left:0;right:0;margin-top:-6px;text-align:center;font:10px/1 monospace;color:rgba(110,100,145,.38);letter-spacing:.14em;pointer-events:none;transition:opacity 3s ease}
</style>
<div class='inv-field' id='if0502'>
  <canvas id='ic0502'></canvas>
  <p class='inv-close' id='iv0502'>the day completes itself in small lights</p>
  <p class='inv-hint'  id='ih0502'>click to place a star</p>
</div>
<script>
(function(){
var el=document.getElementById('if0502'),
cv=document.getElementById('ic0502'),
ctx=cv.getContext('2d'),
verse=document.getElementById('iv0502'),
hint=document.getElementById('ih0502'),
W=['breath','door','water','light','hand','almost','enough','still','rest','hold','soft','here','last','dark','keep','open','name','wait','close','quiet'],
stars=[],trails=[],seeded=false,frame=0,mx=0,my=0;

function resize(){cv.width=el.offsetWidth;cv.height=el.offsetHeight||Math.round(window.innerHeight*.72)}
resize();
window.addEventListener('resize',resize);

function mkStar(x,y){
  if(stars.length>50)return;
  stars.push({x:x,y:y,r:.45+Math.random()*.9,w:W[Math.floor(Math.random()*W.length)],born:frame,p:Math.random()*Math.PI*2});
  if(stars.length===8){verse.classList.add('lit');hint.style.opacity='0'}
}

function evPos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
el.addEventListener('mousemove',function(e){var p=evPos(e);mx=p.x;my=p.y;if(frame%7===0)trails.push({x:mx,y:my,a:.22})});
el.addEventListener('click',function(e){var p=evPos(e);mkStar(p.x,p.y)});

function draw(){
  frame++;

  if(!seeded&&cv.width>10&&cv.height>10){
    seeded=true;
    [[.27,.32],[.54,.44],[.71,.27],[.38,.62],[.63,.58]].forEach(function(n){
      mkStar(cv.width*n[0],cv.height*n[1]);
    });
  }

  ctx.clearRect(0,0,cv.width,cv.height);

  // faint background gradient — deepest indigo at top, near-black at bottom
  var bg=ctx.createLinearGradient(0,0,0,cv.height);
  bg.addColorStop(0,'rgba(12,10,28,1)');
  bg.addColorStop(1,'rgba(4,3,10,1)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);

  // cursor trails
  for(var i=trails.length-1;i>=0;i--){
    var t=trails[i];t.a-=.0038;
    if(t.a<=0){trails.splice(i,1);continue}
    ctx.beginPath();ctx.arc(t.x,t.y,1,0,Math.PI*2);
    ctx.fillStyle='rgba(135,115,180,'+t.a+')';ctx.fill();
  }

  // stars
  for(var j=0;j<stars.length;j++){
    var s=stars[j];
    var age=frame-s.born;
    var fade=Math.min(1,age/80);
    var pulse=.52+.38*Math.sin(frame*.018+s.p);

    // glow halo
    var rg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*24);
    rg.addColorStop(0,'rgba(190,178,255,'+((.14*fade*pulse).toFixed(3))+')');
    rg.addColorStop(1,'rgba(190,178,255,0)');
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*24,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();

    // point
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(248,243,255,'+((.92*fade*pulse).toFixed(3))+')';ctx.fill();

    // word — emerges as star matures
    if(fade>.38){
      ctx.font='10px Georgia,serif';
      ctx.fillStyle='rgba(172,162,200,'+((fade-.38)*.78*pulse).toFixed(3)+')';
      ctx.fillText(s.w,s.x+s.r*3+5,s.y+3.5);
    }
  }

  // cursor ambient glow — moving light source
  var cg=ctx.createRadialGradient(mx,my,0,mx,my,72);
  cg.addColorStop(0,'rgba(88,68,148,.048)');
  cg.addColorStop(1,'rgba(88,68,148,0)');
  ctx.beginPath();ctx.arc(mx,my,72,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();

  requestAnimationFrame(draw);
}
draw();
})();
</script>
</section>
