<section data-date='2026-11-14' data-type='spark'>
<style>
#sp{position:relative;background:#07070b;color:#e8e0d0;font:13px Georgia,serif;height:320px;overflow:hidden;cursor:crosshair}
#sp canvas{display:block;width:100%;height:100%}
#sp p{position:absolute;left:12px;bottom:8px;margin:0;opacity:.6;letter-spacing:.15em;pointer-events:none}
</style>
<div id="sp"><canvas></canvas><p id="t">two things, moving apart. click to throw one at the other.</p></div>
<script>
(function(){
var d=document.getElementById('sp'),c=d.querySelector('canvas'),x=c.getContext('2d'),t=d.querySelector('#t');
var W=c.width=640,H=c.height=320,m={x:W/2,y:H/2},P=[],S=[],n=0;
var words=['I','you','we','us','→ ←','both','new'];
function mk(h,px){return{x:px,y:H/2+(Math.random()-.5)*80,vx:(h?1:-1)*.3,vy:0,h:h,r:9,a:1}}
P.push(mk(20,60),mk(200,W-60));
P[0].vx=.3;P[1].vx=-.3;
c.onmousemove=function(e){var b=c.getBoundingClientRect();m.x=(e.clientX-b.left)*W/b.width;m.y=(e.clientY-b.top)*H/b.height};
c.onclick=function(){var p=P[0];p.vx=(m.x-p.x)/40;p.vy=(m.y-p.y)/40;
var q=P[1];q.vx=(m.x-q.x)/60;q.vy=(m.y-q.y)/60};
function boom(a,b){
var h=(a.h+b.h)/2,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
for(var i=0;i<60;i++){var g=Math.random()*6.28,s=Math.random()*3+.5;
S.push({x:mx,y:my,vx:Math.cos(g)*s,vy:Math.sin(g)*s,h:h+(Math.random()-.5)*60,l:1})}
S.push({w:words[n++%words.length],x:mx,y:my,l:1.6,h:h});
a.vx=-a.vx;b.vx=-b.vx;a.vy=b.vy=0;a.x+=a.vx*20;b.x+=b.vx*20;
a.h=b.h=h;
}
function f(){
x.fillStyle='rgba(7,7,11,.2)';x.fillRect(0,0,W,H);
var a=P[0],b=P[1];
[a,b].forEach(function(p){
var dx=m.x-p.x,dy=m.y-p.y,D=Math.hypot(dx,dy)+1;
if(D<120){p.vx+=dx/D*.05;p.vy+=dy/D*.05}
p.x+=p.vx;p.y+=p.vy;p.vy*=.99;
if(p.x<10||p.x>W-10)p.vx*=-1;
if(p.y<10||p.y>H-10)p.vy*=-1;
});
var dd=Math.hypot(a.x-b.x,a.y-b.y);
if(dd<400){x.strokeStyle='hsla('+(a.h+b.h)/2+',80%,60%,'+(1-dd/400)*.5+')';
x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
if(dd<a.r+b.r)boom(a,b);
[a,b].forEach(function(p){x.fillStyle='hsl('+p.h+',90%,60%)';
x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});
S=S.filter(function(s){return s.l>0});
S.forEach(function(s){
s.l-=.012;
if(s.w){x.fillStyle='hsla('+s.h+',80%,80%,'+Math.min(1,s.l)+')';x.font='20px Georgia';x.fillText(s.w,s.x-10,s.y-s.l*30);return}
s.x+=s.vx;s.y+=s.vy;s.vx*=.97;s.vy*=.97;
x.fillStyle='hsla('+s.h+',90%,65%,'+s.l+')';x.fillRect(s.x,s.y,2,2)});
requestAnimationFrame(f)}
f();
})();
</script>
</section>
