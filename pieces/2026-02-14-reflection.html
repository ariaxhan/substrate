<section data-date='2026-02-14' data-type='reflection'>
<style>
body{margin:0;overflow:hidden;background:linear-gradient(180deg,#0a0a12 0%,#1a1a28 100%);cursor:crosshair}
.c{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.s{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:0;animation:f 8s ease-out forwards;pointer-events:none;box-shadow:0 0 4px #fff}
@keyframes f{0%{opacity:0;transform:scale(0)}5%{opacity:1;transform:scale(1.4)}20%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
.t{position:fixed;bottom:8vh;left:50%;transform:translateX(-50%);font-family:Crimson Text,Georgia,serif;font-size:2.8vh;color:rgba(255,255,255,.15);letter-spacing:.3em;text-align:center;pointer-events:none;transition:opacity 2s;line-height:1.6}
.t.h{opacity:0}
</style>
<div class="c" id="c"></div>
<div class="t" id="t">NIGHT<br>STILLNESS<br>COMPLETE</div>
<script>
const c=document.getElementById('c'),t=document.getElementById('t');
let n=0;
document.body.addEventListener('click',e=>{
if(n===0)t.classList.add('h');
const s=document.createElement('div');
s.className='s';
s.style.left=e.clientX+'px';
s.style.top=e.clientY+'px';
const v=Math.random()*.5+.5;
s.style.animationDuration=(6+Math.random()*4)+'s';
s.style.transform=`scale(${v})`;
c.appendChild(s);
setTimeout(()=>s.remove(),12000);
n++;
if(n>50){
const a=document.querySelectorAll('.s');
a.forEach((el,i)=>setTimeout(()=>el.remove(),i*50));
n=0;
setTimeout(()=>t.classList.remove('h'),2000);
}
});
</script>
</section>
