<section data-date='2026-08-28' data-type='spark'>
<style>
#spk-2026-08-28{position:relative;height:70vh;min-height:420px;background:#0a0a0f;overflow:hidden;font-family:Georgia,serif;cursor:crosshair}
#spk-2026-08-28 .w{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:1.4em;letter-spacing:.08em;opacity:0;pointer-events:none;text-shadow:0 0 12px currentColor;transition:opacity .5s}
#spk-2026-08-28 .w.on{opacity:.95}
#spk-2026-08-28 canvas{position:absolute;inset:0;width:100%;height:100%}
#spk-2026-08-28 .h{position:absolute;bottom:8px;right:12px;color:#556;font:11px monospace;opacity:.6}
</style>
<div id="spk-2026-08-28">
<canvas></canvas>
<div class="w"></div>
<div class="h">move — two bodies seek their meeting point</div>
</div>
<script>
(function(){
var root=document.getElementById('spk-2026-08-28');
var cv=root.querySelector('canvas'), wd=root.querySelector('.w');
var ctx=cv.getContext('2d');
var W,H;
function sz(){W=cv.width=root.clientWidth;H=cv.height=root.clientHeight}
sz(); addEventListener('resize',sz);
var words=['spark','fuse','graft','weld','echo','root','seam','bloom','arc','join'];
var tx=W/2,ty=H/2;
var a={x:60,y:H/2,c:'#3ad1ff'}, b={x:W-60,y:H/2,c:'#ff6b6b'};
var hit=0;
root.addEventListener('mousemove',function(e){
  var r=root.getBoundingClientRect();
  tx=e.clientX-r.left; ty=e.clientY-r.top;
});
root.addEventListener('click',function(){
  hit=30;
  wd.textContent=words[Math.floor(Math.random()*words.length)];
  wd.style.color=Math.random()<.5?a.c:b.c;
  wd.classList.add('on');
  setTimeout(function(){wd.classList.remove('on')},700);
});
function step(){
  a.x += ((tx*0.5+60*0.5) - a.x)*0.04;
  a.y += (ty - a.y)*0.04;
  b.x += ((tx*0.5+(W-60)*0.5) - b.x)*0.04;
  b.y += (ty - b.y)*0.04;
  var dx=a.x-b.x, dy=a.y-b.y, dist=Math.sqrt(dx*dx+dy*dy);
  ctx.fillStyle='rgba(10,10,15,0.18)';
  ctx.fillRect(0,0,W,H);
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  ctx.strokeStyle='rgba(255,255,255,'+Math.max(0,0.5-dist/600)+')';
  ctx.lineWidth=1;
  ctx.stroke();
  [a,b].forEach(function(p){
    var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,22);
    g.addColorStop(0,p.c); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,22,0,7); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill();
  });
  if(dist<40 || hit>0){
    if(hit<=0){hit=30; wd.textContent=words[Math.floor(Math.random()*words.length)]; wd.classList.add('on'); setTimeout(function(){wd.classList.remove('on')},700)}
    hit--;
    for(var i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc((a.x+b.x)/2+(Math.random()-.5)*40,(a.y+b.y)/2+(Math.random()-.5)*40,Math.random()*2,0,7);
      ctx.fillStyle='rgba(255,255,255,'+Math.random()+')';
      ctx.fill();
    }
  }
  requestAnimationFrame(step);
}
step();
})();
</script>
</section>
