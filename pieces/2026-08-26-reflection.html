<section data-date='2026-08-26' data-type='reflection'>
<style>
#taper-0826{position:relative;height:70vh;min-height:420px;background:radial-gradient(ellipse at 50% 100%,#0a0f1e,#02030a 70%);overflow:hidden;cursor:crosshair;font-family:Georgia,'Iowan Old Style',serif;border-radius:4px}
#taper-0826 .line{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);color:#5a6a8a;font-size:clamp(15px,2.4vw,22px);letter-spacing:.04em;text-align:center;pointer-events:none;opacity:.85;transition:opacity 1.8s ease}
#taper-0826 .line.gone{opacity:0}
#taper-0826 .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#3a4560;font-size:11px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
#taper-0826 .star{position:absolute;border-radius:50%;background:#fff;pointer-events:none;animation:taper0826-in 1.4s ease-out forwards}
#taper-0826 .horizon{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,#050810,transparent);pointer-events:none}
@keyframes taper0826-in{0%{transform:scale(0);opacity:0}50%{opacity:1}100%{transform:scale(1);opacity:var(--o)}}
@keyframes taper0826-tw{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o)*0.35)}}
</style>
<div id="taper-0826">
  <div class="line" id="taper-0826-line">the day is finished. rest what's left of it.</div>
  <div class="horizon"></div>
  <div class="hint">touch the dark</div>
</div>
<script>
(function(){
  var root = document.getElementById('taper-0826');
  var line = document.getElementById('taper-0826-line');
  var words = ['still','done','enough','quiet','soon','home','dim','slow','soft','close','deep','far','held','waiting','breathe'];
  var count = 0;
  function place(x, y){
    var s = document.createElement('div');
    var size = 1 + Math.random()*2.2;
    var o = 0.4 + Math.random()*0.6;
    s.className = 'star';
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = x+'px';
    s.style.top = y+'px';
    s.style.setProperty('--o', o);
    var dur = (2 + Math.random()*3).toFixed(2);
    s.style.animation = 'taper0826-in 1.4s ease-out forwards, taper0826-tw '+dur+'s ease-in-out '+(1.4)+'s infinite';
    root.appendChild(s);
    count++;
    if(count % 5 === 0){
      line.classList.add('gone');
      setTimeout(function(){
        line.textContent = words[Math.floor(Math.random()*words.length)];
        line.classList.remove('gone');
      }, 1800);
    }
  }
  function fromEvent(e){
    var r = root.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    place(cx, cy);
  }
  root.addEventListener('click', fromEvent);
  root.addEventListener('touchstart', function(e){ fromEvent(e); }, {passive:true});
  var seedTimes = [[0.2,0.15],[0.75,0.25],[0.15,0.6],[0.85,0.55],[0.5,0.1],[0.35,0.7],[0.65,0.75]];
  seedTimes.forEach(function(p, i){
    setTimeout(function(){
      var r = root.getBoundingClientRect();
      place(p[0]*r.width, p[1]*r.height);
    }, 300 + i*260);
  });
})();
</script>
</section>
