<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>threshold — 2026-05-03</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080e;overflow:hidden;width:100vw;height:100vh;cursor:none}
.w{position:fixed;font-family:Georgia,serif;color:#dba96a;opacity:0;pointer-events:none;user-select:none;white-space:nowrap;will-change:opacity}
#cur{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Courier New',monospace;color:#dba96a;font-size:1.6rem;opacity:.6;animation:bl 1.1s step-end infinite;pointer-events:none;z-index:10}
@keyframes bl{0%,100%{opacity:.6}50%{opacity:0}}
</style>
</head>
<body>
<section data-date='2026-05-03' data-type='morning'>
<div id="cur">▌</div>
<script>
const W=['open','not yet','soon','possible','new','hold','threshold','breathe','before','empty','waiting','today','become','unnamed','first light','begin','soft','ready','yes','still','now','quiet','potential','unwritten','waking'],
S=[.8,1,1.1,.9,1.2,.85,.95,1.05,.9,1.15,1,1.1,.8,1,.95,1.1,.85,1.2,.9,1,.95,1.05,.85,1,1.1];

let mx=innerWidth/2,my=innerHeight/2,flash=0,els=[];

W.forEach((w,i)=>{
  let e=document.createElement('div'),px,py;
  e.className='w';e.textContent=w;
  do{px=7+Math.random()*86;py=8+Math.random()*84;}
  while(Math.abs(px-50)<14&&Math.abs(py-50)<14);
  e.style.cssText=`left:${px}%;top:${py}%;font-size:${S[i]*1.05}rem;letter-spacing:.05em`;
  document.querySelector('section').appendChild(e);
  els.push({e,px,py});
});

const cur=document.getElementById('cur');

function reveal(){
  if(flash)return;
  els.forEach(({e,px,py})=>{
    let dx=px/100*innerWidth-mx,dy=py/100*innerHeight-my,
        d=Math.sqrt(dx*dx+dy*dy),r=170;
    e.style.opacity=d<r?Math.pow(1-d/r,1.6)*.88:0;
  });
}

addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;reveal();});

addEventListener('click',()=>{
  if(flash)return;flash=1;
  els.forEach(({e})=>{e.style.transition='opacity .12s';e.style.opacity=1;});
  cur.style.opacity=1;cur.style.color='#fff';
  setTimeout(()=>{
    els.forEach(({e})=>{e.style.transition='opacity 1.4s';e.style.opacity=0;});
    cur.style.color='#dba96a';cur.style.opacity=.6;
    setTimeout(()=>{els.forEach(({e})=>{e.style.transition='';});flash=0;reveal();},1500);
  },180);
});
</script>
</section>
</body>
</html>
