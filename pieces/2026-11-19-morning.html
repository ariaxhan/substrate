<section data-date='2026-11-19' data-type='morning'>
<style>
.dw{position:relative;height:100vh;min-height:360px;overflow:hidden;background:#0b0a1a;cursor:crosshair;font:italic 22px Georgia,serif}
.dw canvas{position:absolute;inset:0;width:100%;height:100%}
.dw p{position:absolute;left:0;right:0;bottom:6vh;margin:0;text-align:center;color:#fff;opacity:.35;letter-spacing:.3em;font-size:13px;transition:opacity 2s;pointer-events:none}
.dw:hover p{opacity:.8}
</style>
<div class="dw"><canvas></canvas><p>nothing is written yet</p>
<script>
(function(){
var s=document.currentScript.parentNode,c=s.querySelector('canvas'),x=c.getContext('2d'),
W,H,tx=.5,ty=.9,px=.5,py=1,t=0,w=[],L=['yet','begin','open','a day','unwritten','light','you'];
function R(){W=c.width=s.offsetWidth;H=c.height=s.offsetHeight}
R();addEventListener('resize',R);
s.onmousemove=function(e){var r=s.getBoundingClientRect();tx=(e.clientX-r.left)/W;ty=(e.clientY-r.top)/H};
s.onclick=function(e){var r=s.getBoundingClientRect();w.push({x:e.clientX-r.left,y:e.clientY-r.top,t:L[w.length%7],a:0})};
function f(){
t+=.01;
if(!s.matches(':hover'))ty=.85-.12*Math.sin(t*.5)-Math.min(t*.01,.2);
px+=(tx-px)*.05;py+=(ty-py)*.05;
var sx=px*W,sy=H*(.25+.75*py),u=1-py,
g=x.createRadialGradient(sx,sy,0,sx,sy,H*(.6+u));
g.addColorStop(0,'#fff3c4');g.addColorStop(.12,'#ffb36b');
g.addColorStop(.4,'#b4557a');g.addColorStop(.75,'#2a2347');g.addColorStop(1,'#0b0a1a');
x.fillStyle=g;x.fillRect(0,0,W,H);
for(var i=14;i<W;i+=28)for(var j=14;j<H;j+=28){
var d=Math.hypot(i-sx,j-sy),b=1/(1+d*d/(9e3+u*9e4)),
r=1+b*3+Math.sin(t*2+i*.05+j*.03)*.4;
x.fillStyle='rgba(255,248,225,'+(.12+b*.8)+')';
x.beginPath();x.arc(i,j,Math.max(r,.5),0,7);x.fill()}
x.textAlign='center';
w.forEach(function(k){
k.a=Math.min(k.a+.01,1);
x.font='italic '+(18+k.a*14)+'px Georgia,serif';
x.fillStyle='rgba(30,16,40,'+k.a+')';
x.fillText(k.t,k.x,k.y-k.a*20)});
requestAnimationFrame(f)}
f()
})()
</script>
</div>
</section>
