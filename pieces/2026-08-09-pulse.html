<section data-date='2026-08-09' data-type='pulse'>
<style>
#taper-noon{position:relative;width:100%;height:100vh;overflow:hidden;background:#f4f1ea;cursor:ns-resize;font-family:Georgia,'Iowan Old Style',serif;color:#1a1a1a}
#taper-noon .axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(180deg,#c9c2b0 0 6px,transparent 6px 12px);transform:translateX(-.5px)}
#taper-noon .stand{position:absolute;left:50%;bottom:0;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:120px solid #1a1a1a;transform:translateX(-50%)}
#taper-noon .tip{position:absolute;left:50%;bottom:120px;width:6px;height:6px;border-radius:50%;background:#1a1a1a;transform:translateX(-50%)}
#taper-noon .beam{position:absolute;left:50%;bottom:120px;width:min(78vw,720px);height:1px;background:#1a1a1a;transform-origin:50% 50%;transition:transform .12s ease-out}
#taper-noon .side{position:absolute;top:50%;font-size:clamp(20px,4.4vw,44px);letter-spacing:.02em;white-space:nowrap;transform:translateY(-50%);transition:opacity .5s ease,font-weight .3s}
#taper-noon .l{left:0}
#taper-noon .r{right:0;text-align:right}
#taper-noon .now{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#8a8272;font-family:Helvetica,Arial,sans-serif}
#taper-noon .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a39a86;font-family:Helvetica,Arial,sans-serif;opacity:.7;transition:opacity 1s}
</style>
<div id="taper-noon">
  <div class="axis"></div>
  <div class="stand"></div>
  <div class="beam" id="tnBeam">
    <span class="side l" id="tnLeft">morning</span>
    <span class="side r" id="tnRight">evening</span>
  </div>
  <div class="tip"></div>
  <div class="now">now</div>
  <div class="hint" id="tnHint">tilt the day &middot; click to invert it</div>
</div>
<script>
(function(){
  var el=document.getElementById('taper-noon'),
      beam=document.getElementById('tnBeam'),
      left=document.getElementById('tnLeft'),
      right=document.getElementById('tnRight'),
      hint=document.getElementById('tnHint'),
      flipped=false,
      max=16;
  function weight(deg){
    var a=Math.min(1,Math.abs(deg)/max);
    left.style.fontWeight=deg<0?700-a*300:400;
    right.style.fontWeight=deg>0?700-a*300:400;
    left.style.opacity=1-(deg>0?a*.5:0);
    right.style.opacity=1-(deg<0?a*.5:0);
  }
  el.addEventListener('mousemove',function(e){
    var r=el.getBoundingClientRect();
    var mid=r.left+r.width/2;
    var deg=((e.clientX-mid)/(r.width/2))*max;
    beam.style.transform='rotate('+deg+'deg)';
    weight(deg);
    if(hint){hint.style.opacity=0;}
  });
  el.addEventListener('mouseleave',function(){
    beam.style.transform='rotate(0deg)';
    weight(0);
  });
  el.addEventListener('click',function(){
    flipped=!flipped;
    left.textContent=flipped?'evening':'morning';
    right.textContent=flipped?'morning':'evening';
    if(hint){
      hint.textContent=flipped?'the fulcrum does not move':'tilt the day · click to invert it';
      hint.style.opacity=.7;
    }
  });
})();
</script>
</section>
