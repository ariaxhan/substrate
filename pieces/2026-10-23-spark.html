<section data-date='2026-10-23' data-type='spark'>
<style>
.sp{background:#0b0a10;margin:0;position:relative;overflow:hidden;height:420px;cursor:crosshair;font:13px Georgia,serif;color:#e8dcc8}
.sp canvas{display:block;width:100%;height:100%}
.sp p{position:absolute;left:0;right:0;bottom:12px;text-align:center;margin:0;letter-spacing:.3em;font-style:italic;opacity:.7;pointer-events:none;transition:opacity .4s}
</style>
<div class="sp"><canvas id="spc"></canvas><p id="spt">two things, apart. move.</p></div>
<script>
(function(){
var c=document.getElementById('spc'),x=c.getContext('2d'),t=document.getElementById('spt'),
W=c.width=c.offsetWidth||600,H=c.height=420,m={x:W/2,y:H/2},
A={x:60,y:H/2,vx:0,vy:0,h:200},B={x:W-60,y:H/2,vx:0,vy:0,h:30},
P=[],words=['I','you','we','fire','salt','glass','→','←','both','new'],n=0;
c.onmousemove=function(e){var r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top};
c.onclick=function(){A.x=60;B.x=W-60;A.vx=B.vx=0;n=0;t.textContent='again.'};
function pull(o,s){var d=Math.hypot(m.x-o.x,m.y-o.y)||1;o.vx+=(m.x-o.x)/d*s;o.vy+=(m.y-o.y)/d*s;o.vx*=.96;o.vy*=.96;o.x+=o.vx;o.y+=o.vy}
function boom(px,py){for(var i=0;i<90;i++){var a=Math.random()*6.28,s=Math.random()*5+1;
P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:Math.random()<.5?A.h:B.h+Math.random()*40,w:Math.random()<.08?words[i%10]:0})}}
function f(){
x.fillStyle='rgba(11,10,16,.18)';x.fillRect(0,0,W,H);
if(n<1){pull(A,.25);pull(B,.2);
 if(Math.hypot(A.x-B.x,A.y-B.y)<34){boom((A.x+B.x)/2,(A.y+B.y)/2);n=1;t.textContent='neither. both. click.';A.vx=-3;B.vx=3}}
else{A.vx*=.97;B.vx*=.97;A.x+=A.vx;B.x+=B.vx;A.vx+=(W/2-A.x)*.0004;B.vx+=(W/2-B.x)*.0004}
[A,B].forEach(function(o){x.fillStyle='hsl('+o.h+',80%,60%)';x.beginPath();x.arc(o.x,o.y,10,0,6.28);x.fill()});
if(n<1){x.strokeStyle='hsla(300,60%,70%,'+Math.max(0,.6-Math.hypot(A.x-B.x,A.y-B.y)/W)+')';x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke()}
P=P.filter(function(p){return p.l>0});
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.l-=.008;
 x.fillStyle='hsla('+(p.h+(1-p.l)*100)+',90%,65%,'+p.l+')';
 if(p.w){x.fillText(p.w,p.x,p.y)}else x.fillRect(p.x,p.y,2,2)});
requestAnimationFrame(f)}
f();
})();
</script>
</section>
