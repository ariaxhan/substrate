<section data-date='2026-09-09' data-type='pulse'>
<style>
.tp-fulcrum{margin:0;overflow:hidden;background:#0b0b0c;height:100vh;position:relative;font-family:Georgia,'Times New Roman',serif;cursor:pointer}
.tp-fulcrum .tp-stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;user-select:none}
.tp-fulcrum .tp-beam{position:relative;width:min(70vw,560px);height:2px;background:#666;transform:rotate(var(--tilt,0deg));transition:transform .05s linear}
.tp-fulcrum .tp-tri{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid #888}
.tp-fulcrum .tp-side{position:absolute;top:-1.6em;font-size:clamp(1.1rem,2.4vw,1.9rem);letter-spacing:.06em;color:#cfcfcf;white-space:nowrap;transition:opacity .2s}
.tp-fulcrum .tp-left{left:6%}
.tp-fulcrum .tp-right{right:6%}
.tp-fulcrum .tp-hint{position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);color:#555;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-family:Menlo,monospace}
.tp-fulcrum .tp-word{position:absolute;top:1.4em;left:50%;transform:translateX(-50%);color:#3a3a3a;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-family:Menlo,monospace;transition:color .3s}
</style>
<div class="tp-fulcrum" id="tp-fx">
  <div class="tp-stage">
    <div class="tp-beam" id="tp-beam">
      <span class="tp-side tp-left" id="tp-l">morning</span>
      <span class="tp-side tp-right" id="tp-r">evening</span>
      <div class="tp-tri"></div>
      <span class="tp-word" id="tp-w">halfway</span>
    </div>
  </div>
  <div class="tp-hint">tilt the day — click to hold it level</div>
</div>
<script>
(function(){
  var fx=document.getElementById('tp-fx'),
      beam=document.getElementById('tp-beam'),
      l=document.getElementById('tp-l'),
      r=document.getElementById('tp-r'),
      w=document.getElementById('tp-w'),
      held=false, tilt=0;
  function apply(t){
    tilt=Math.max(-16,Math.min(16,t));
    beam.style.setProperty('--tilt',tilt+'deg');
    var a=Math.abs(tilt)/16;
    l.style.opacity=1-Math.max(0,tilt)/16*0.7;
    r.style.opacity=1-Math.max(0,-tilt)/16*0.7;
    w.style.color=a<0.06? '#e8c46b':'#3a3a3a';
    w.textContent=a<0.06?'equilibrium':'halfway';
  }
  fx.addEventListener('mousemove',function(e){
    if(held)return;
    var rect=fx.getBoundingClientRect();
    var rel=(e.clientX-rect.left)/rect.width-0.5;
    apply(rel*32);
  });
  fx.addEventListener('click',function(){
    held=!held;
    if(held){apply(0);}
  });
  apply(0);
})();
</script>
</section>
