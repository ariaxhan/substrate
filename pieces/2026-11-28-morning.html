<style>

#d i{position:absolute;left:50%;bottom:calc(var(--h)*60% - 14vmin);width:20vmin;height:20vmin;margin-left:-10vmin;border-radius:50%;

<i></i>

</div>
<script>
(function(){
var d=document.getElementById('d'),w='now,yes,again,open,breathe,you,almost,here,begin,soft,slow,water,home'.split(','),n=0;
d.onmousemove=function(e){var r=d.getBoundingClientRect();
d.style.setProperty('--x',e.clientX-r.left+'px');d.style.setProperty('--y',e.clientY-r.top+'px');
