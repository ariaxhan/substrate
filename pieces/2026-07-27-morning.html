<section data-date='2026-07-27' data-type='morning'>
<style>
[data-date='2026-07-27'] { display:block; position:relative; height:70vh; min-height:420px;
  overflow:hidden; font-family:Georgia,serif; cursor:crosshair;
  background:linear-gradient(to top,#ffd9a0 0%,#ff9d6c 18%,#4a3a63 55%,#0a0b16 100%) }
[data-date='2026-07-27'] .sun { position:absolute; left:50%; width:100px; height:100px;
  border-radius:50%; background:radial-gradient(circle,#fff6da,#ffc873 55%,transparent 72%);
  transform:translate(-50%,50%); bottom:6%; opacity:.35; transition:bottom 1.2s ease,opacity 1.2s ease }
[data-date='2026-07-27'] .horizon { position:absolute; left:0; right:0; top:82%; height:1px;
  background:rgba(255,255,255,.18) }
[data-date='2026-07-27'] .hint { position:absolute; top:10px; left:14px; color:rgba(255,255,255,.35);
  font-size:.72em; font-family:monospace; letter-spacing:.04em }
[data-date='2026-07-27'] h1 { position:absolute; top:38%; left:50%; margin:0;
  transform:translate(-50%,-50%); font:italic 300 clamp(18px,3.4vw,34px)/1.5 Georgia,serif;
  color:#fbeeff; text-align:center; letter-spacing:.02em; text-shadow:0 0 18px rgba(255,220,180,.35);
  pointer-events:none; max-width:78%; transition:opacity .6s ease }
[data-date='2026-07-27'] .seed { position:absolute; pointer-events:none; font-style:italic;
  font-weight:300; color:#ffe9c7; opacity:0; transform:translateY(0) scale(.7);
  animation:rise 3.2s ease-out forwards; text-shadow:0 0 10px rgba(255,220,180,.5) }
@keyframes rise { 12%{ opacity:1 } 100%{ opacity:0; transform:translateY(-90px) scale(1.2) } }
</style>
<div class="hint">move to summon light &middot; click to name the day</div>
<div class="sun" id="sn2707"></div>
<div class="horizon"></div>
<h1 id="ln2707">the day is unwritten</h1>
<script>
(function(){
  var root=document.currentScript.parentElement;
  var sun=root.querySelector('#sn2707'), line=root.querySelector('#ln2707');
  var words=['light','begin','open','possible','quiet','rise','breathe','new','soon','clear','becoming','still','awake','edge','threshold','yours','now','unmade','first','soft'];
  var said=[];
  root.addEventListener('mousemove',function(e){
    var b=root.getBoundingClientRect();
    var h=1-((e.clientY-b.top)/b.height);
    sun.style.bottom=(6+h*70)+'%';
    sun.style.opacity=(.3+h*.7).toFixed(2);
  });
  root.addEventListener('click',function(e){
    var b=root.getBoundingClientRect();
    var w=words[Math.floor(Math.random()*words.length)];
    var s=document.createElement('span');
    s.className='seed'; s.textContent=w;
    s.style.left=(e.clientX-b.left-10)+'px';
    s.style.top=(e.clientY-b.top-10)+'px';
    root.appendChild(s);
    setTimeout(function(){ s.remove(); },3300);
    said.push(w);
    if(said.length>5) said.shift();
    line.textContent='the day is '+said.join(', ');
    line.style.opacity=.4;
    requestAnimationFrame(function(){ line.style.opacity=1; });
  });
})();
</script>
</section>
