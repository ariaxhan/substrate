<section data-date='2026-09-04' data-type='reflection'>
<style>
#tp0904{position:relative;height:70vh;min-height:420px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#0d1225 0%,#05060f 55%,#000 100%);font-family:Georgia,'Times New Roman',serif;cursor:crosshair}
#tp0904 .horizon{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#00000000,#000)}
#tp0904 .msg{position:absolute;top:42%;left:0;right:0;text-align:center;color:#5a5f7a;font-style:italic;font-size:clamp(.9rem,2vw,1.3rem);letter-spacing:.04em;transition:opacity 2s ease;pointer-events:none;user-select:none}
#tp0904 .star{position:absolute;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;animation:tp0904bloom 1.8s ease-out forwards}
#tp0904 .word{position:absolute;transform:translate(-50%,-50%);color:#dfe3f5;font-size:.7rem;letter-spacing:.08em;opacity:0;pointer-events:none;white-space:nowrap;animation:tp0904word 4s ease-out forwards}
@keyframes tp0904bloom{0%{opacity:0;box-shadow:0 0 0 0 #fff}12%{opacity:1;box-shadow:0 0 12px 4px #cfd8ffaa}100%{opacity:.85;box-shadow:0 0 4px 1px #cfd8ff55}}
@keyframes tp0904word{0%{opacity:0;transform:translate(-50%,-40%)}15%{opacity:.9;transform:translate(-50%,-50%)}75%{opacity:.9}100%{opacity:0;transform:translate(-50%,-65%)}}
#tp0904 .count{position:absolute;bottom:10px;right:14px;color:#3a3f5c;font-family:monospace;font-size:.7rem}
</style>
<div id="tp0904">
  <p class="msg" id="tp0904msg">the day is finished. touch the dark to rest a light in it.</p>
  <div class="horizon"></div>
  <span class="count" id="tp0904count">0 held</span>
</div>
<script>
(function(){
  var host=document.getElementById('tp0904');
  var msg=document.getElementById('tp0904msg');
  var count=document.getElementById('tp0904count');
  var words=['still','enough','done','quiet','soft','held','over','ease','dim','far','near','slow','breathe','close','again'];
  var n=0, faded=false;
  host.addEventListener('click',function(e){
    var r=host.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    if(y>r.height*0.8) return;
    if(!faded){faded=true;msg.style.opacity='0';}
    var s=document.createElement('div');
    var size=(Math.random()*2.4+1.2).toFixed(2);
    s.className='star';
    s.style.width=size+'px';s.style.height=size+'px';
    s.style.left=x+'px';s.style.top=y+'px';
    host.appendChild(s);
    var w=document.createElement('div');
    w.className='word';
    w.textContent=words[Math.floor(Math.random()*words.length)];
    w.style.left=x+'px';
    w.style.top=(y-14)+'px';
    host.appendChild(w);
    setTimeout(function(){w.remove();},4000);
    n++;
    count.textContent=n+' held';
  });
})();
</script>
</section>
