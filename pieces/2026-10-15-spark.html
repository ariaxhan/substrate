<section data-date='2026-10-15' data-type='spark'>
<style>
.fs{margin:0;background:#0b0a10;position:relative;overflow:hidden;font:14px/1 Georgia,serif;height:320px}
.fs canvas{display:block;width:100%;height:100%;cursor:crosshair}
.fs i{position:absolute;left:10px;bottom:8px;color:#665;font-size:11px;letter-spacing:.2em;font-style:normal}
</style>
<div class="fs"><canvas id="fc"></canvas><i>move: flint · click: strike</i></div>
<script>
(function(){
var c=document.getElementById('fc'),x=c.getContext('2d'),W,H,m={x:80,y:160},
a={x:60,y:160,w:'flint',h:30},b={x:300,y:160,vx:0,vy:0,w:'steel',h:200},
P=[],glow=0,fused=0;
function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight;b.x=W*.75;b.y=H/2}
rs();addEventListener('resize',rs);
c.onmousemove=function(e){var r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top};
c.onclick=function(){b.vx=(m.x-b.x)*.02;b.vy=(m.y-b.y)*.02};
function burst(px,py){
for(var i=0;i<90;i++){var t=Math.random()*6.28,s=Math.random()*5;
P.push({x:px,y:py,vx:Math.cos(t)*s,vy:Math.sin(t)*s,l:1,h:20+Math.random()*30})}
glow=1;fused=1}
function f(){
x.fillStyle='rgba(11,10,16,.2)';x.fillRect(0,0,W,H);
a.x+=(m.x-a.x)*.08;a.y+=(m.y-a.y)*.08;
b.vx+=(W*.75-b.x)*.0006;b.vy+=(H/2-b.y)*.0006+Math.sin(Date.now()/700)*.01;
b.x+=b.vx;b.y+=b.vy;b.vx*=.99;b.vy*=.99;
var d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<70&&d>1){
if(!fused||Math.random()<.1)burst((a.x+b.x)/2,(a.y+b.y)/2);
var n=(b.x-a.x)/d;b.vx+=n*1.5;b.vy+=(b.y-a.y)/d*1.5}
else if(d>200)fused=0;
x.lineWidth=1;x.strokeStyle='rgba(255,180,80,'+Math.max(0,1-d/300)+')';
x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
x.textAlign='center';
x.fillStyle='hsl(30,20%,70%)';x.font='italic 18px Georgia';x.fillText(a.w,a.x,a.y);
x.fillStyle='hsl(210,30%,65%)';x.fillText(b.w,b.x,b.y);
for(var i=P.length-1;i>=0;i--){var p=P[i];
p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=.015;
if(p.l<=0){P.splice(i,1);continue}
x.fillStyle='hsla('+p.h+',100%,60%,'+p.l+')';x.fillRect(p.x,p.y,2,2)}
if(glow>0){x.fillStyle='rgba(255,170,60,'+glow+')';x.font='bold '+(30+glow*30)+'px Georgia';
x.fillText('fire',W/2,H/2);glow-=.006}
requestAnimationFrame(f)}
f()})();
</script>
</section>
