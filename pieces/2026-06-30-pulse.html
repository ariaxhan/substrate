<!doctype html>
<html>
<head><meta charset='utf-8'><title>halfway</title></head>
<body>
<section data-date='2026-06-30' data-type='pulse'>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b14}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,'Iowan Old Style',serif;color:#e8e2d8}
#beam{position:relative;width:min(76vw,720px);height:1px;background:rgba(232,226,216,.35)}
#beam:before,#beam:after{content:'';position:absolute;top:-4px;width:1px;height:9px;background:rgba(232,226,216,.35)}
#beam:before{left:0}
#beam:after{right:0}
#mark{position:absolute;top:-6px;width:1px;height:13px;background:#e8934a;box-shadow:0 0 8px #e8934a}
#left,#right{position:absolute;top:50%;font-size:clamp(1.1rem,2.4vw,2rem);letter-spacing:.14em}
#left{left:0;transform:translate(-2%,-50%)}
#right{right:0;transform:translate(2%,-50%)}
#word{position:absolute;top:2.6em;left:50%;transform:translateX(-50%);font-style:italic;font-size:.85rem;letter-spacing:.4em;opacity:0;color:#e8934a}
#word.on{opacity:1;transition:opacity 1.6s ease-out}
.ripple{position:absolute;top:50%;left:var(--x);width:0;height:0;border:1px solid #e8934a;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:rip 1.4s ease-out forwards}
@keyframes rip{to{width:340px;height:340px;opacity:0;border-width:0}}
</style>
<div id="stage">
<div id="beam">
<span id="mark"></span>
<div id="left">MORNING</div>
<div id="right">EVENING</div>
<div id="word">equilibrium</div>
</div>
</div>
<script>
const stage=document.getElementById('stage'),beam=document.getElementById('beam'),mark=document.getElementById('mark'),word=document.getElementById('word');
const now=new Date(),hrs=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
const markPct=hrs/24*100;
mark.style.left=markPct+'%';
const warm=[232,147,74],cool=[47,58,110];
let armed=true;
function paint(pct){
  const t=pct/100;
  const c=warm.map((w,i)=>Math.round(w+(cool[i]-w)*t));
  stage.style.background=`radial-gradient(circle at ${pct}% 50%, rgba(${c.join(',')},.28), #0b0b14 62%)`;
  const deg=(pct-50)/50*13;
  beam.style.transform=`rotate(${deg}deg)`;
  const dist=Math.abs(pct-markPct);
  if(dist<2.2){
    if(armed){
      armed=false;
      word.classList.add('on');
      const r=document.createElement('div');
      r.className='ripple';
      r.style.setProperty('--x',markPct+'%');
      beam.appendChild(r);
      setTimeout(()=>r.remove(),1450);
      setTimeout(()=>word.classList.remove('on'),2600);
    }
  } else if(dist>6){
    armed=true;
  }
}
function handle(x){
  const r=beam.getBoundingClientRect();
  const pct=Math.max(0,Math.min(100,(x-r.left)/r.width*100));
  paint(pct);
}
paint(50);
window.addEventListener('mousemove',e=>handle(e.clientX));
window.addEventListener('touchmove',e=>{if(e.touches[0])handle(e.touches[0].clientX)},{passive:true});
</script>
</section>
</body>
</html>
