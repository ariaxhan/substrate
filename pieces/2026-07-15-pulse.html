<section data-date='2026-07-15' data-type='pulse'>
<style>
#tp-half{position:relative;height:78vh;min-height:420px;margin:0;overflow:hidden;
  background:linear-gradient(90deg,#efd9b4 0%,#c9b79a 46%,#2a2a3d 54%,#14141f 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,'Times New Roman',serif;cursor:crosshair;}
#tp-half .stage{position:relative;width:64vmin;max-width:640px;height:2px;}
#tp-half .pivot{position:absolute;top:1px;left:50%;width:0;height:0;
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:16px solid rgba(20,20,20,.55);transform:translateX(-50%);}
#tp-half .beam{position:absolute;top:0;left:0;width:100%;height:1px;
  background:rgba(20,20,20,.55);transform-origin:50% 50%;
  display:flex;align-items:center;justify-content:space-between;}
#tp-half .word{position:relative;top:-1.1rem;font-size:2.1rem;letter-spacing:.06em;
  user-select:none;transition:font-size .25s ease;}
#tp-half .was{color:#2a2416;}
#tp-half .will{color:#eef0ff;}
#tp-half .now{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);
  font:italic 13px/1 Georgia,serif;letter-spacing:.18em;color:rgba(20,20,20,.5);
  text-transform:uppercase;user-select:none;}
</style>
<div id="tp-half">
  <div class="stage">
    <div class="pivot"></div>
    <div class="beam" id="tp-beam">
      <span class="word was" id="tp-was">was</span>
      <span class="word will" id="tp-will">will</span>
    </div>
  </div>
  <div class="now">halfway &middot; 12:00</div>
</div>
<script>
(function(){
  var el=document.getElementById('tp-half'),
      beam=document.getElementById('tp-beam'),
      was=document.getElementById('tp-was'),
      will=document.getElementById('tp-will'),
      flipped=false, target=0, tilt=0, active=false;
  el.addEventListener('mousemove',function(e){
    var r=el.getBoundingClientRect();
    target=((e.clientX-r.left)/r.width-0.5)*30;
    active=true;
  });
  el.addEventListener('mouseleave',function(){active=false;});
  el.addEventListener('click',function(){
    flipped=!flipped;
    was.textContent=flipped?'will':'was';
    will.textContent=flipped?'was':'will';
  });
  function frame(){
    var goal=active?target:0;
    tilt+=(goal-tilt)*0.07;
    beam.style.transform='rotate('+tilt+'deg)';
    var lean=Math.max(-1,Math.min(1,tilt/15));
    was.style.fontSize=(2.1-0.7*Math.max(0,lean))+'rem';
    will.style.fontSize=(2.1+0.7*Math.max(0,-lean))+'rem';
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</section>
