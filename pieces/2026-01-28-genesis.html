<section data-date="2026-01-28" data-type="genesis">
<style>
.genesis{position:relative;height:100vh;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.genesis .word{position:absolute;font-size:14px;color:#333;transition:all 2s ease;opacity:0}
.genesis .word.active{opacity:1;color:#666}
.genesis .center{font-size:20px;color:#888;letter-spacing:0.5em}
</style>
<div class="genesis">
<span class="center">substrate</span>
</div>
<script>
(function(){
const w=['signal','form','void','light','dark','word','time','space','here','now','begin'];
const g=document.querySelector('.genesis');
let i=0;
function add(){
const s=document.createElement('span');
s.className='word';
s.textContent=w[i%w.length];
s.style.left=Math.random()*80+10+'%';
s.style.top=Math.random()*80+10+'%';
g.appendChild(s);
setTimeout(()=>s.classList.add('active'),50);
setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),2000)},4000);
i++;
if(i<50)setTimeout(add,800);
}
setTimeout(add,1000);
})();
</script>
</section>
