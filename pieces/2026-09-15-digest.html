<section data-date='2026-09-15' data-type='digest'>
<style>
#tpr-2026-09-15{background:#0a0a0c;color:#8a8a92;font:14px/1.4 ui-monospace,Menlo,monospace;height:520px;position:relative;overflow:hidden;cursor:crosshair}
#tpr-2026-09-15 canvas{position:absolute;inset:0}
#tpr-2026-09-15 .lbl{position:absolute;font-size:10px;letter-spacing:.04em;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;opacity:0;transition:opacity .6s ease}
#tpr-2026-09-15 .hint{position:absolute;bottom:10px;left:12px;font-size:10px;color:#4a4a52;letter-spacing:.08em}
#tpr-2026-09-15 .ct{position:absolute;top:10px;left:12px;font-size:10px;color:#5a5a62;letter-spacing:.1em}
</style>
<div id="tpr-2026-09-15">
<canvas></canvas>
<div class="hint">move near a point &middot; click to crystallize</div>
<div class="ct">0 links</div>
</div>
<script>
(function(){
var root=document.currentScript.previousElementSibling;
var cv=root.querySelector('canvas'),ctx=cv.getContext('2d');
var ct=root.querySelector('.ct');
var words=["signal","noise","pattern","drift","shard","echo","weight","trace","bias","kernel","seed","fold","null","prior","edge","node","gap","loop","stack","flux","axis","core","rift","span","mesh","tone","field","key","proof","form"];
var W,H,DPR=Math.min(devicePixelRatio||1,2);
function size(){W=root.clientWidth;H=root.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
size();window.addEventListener('resize',size);
var N=30,pts=[];
for(var i=0;i<N;i++){pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,w:words[i%words.length],lit:0,label:document.createElement('div')})}
pts.forEach(function(p){p.label.className='lbl';p.label.textContent=p.w;root.appendChild(p.label)});
var links=[];
var mx=-999,my=-999;
root.addEventListener('mousemove',function(e){var r=root.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
root.addEventListener('mouseleave',function(){mx=-999;my=-999});
root.addEventListener('click',function(e){
var r=root.getBoundingClientRect();var cx=e.clientX-r.left,cy=e.clientY-r.top;
var near=pts.map(function(p){return {p:p,d:Math.hypot(p.x-cx,p.y-cy)}}).sort(function(a,b){return a.d-b.d}).slice(0,2);
if(near.length===2 && near[0].d<220){
links.push({a:near[0].p,b:near[1].p,life:1});
ct.textContent=links.length+' link'+(links.length===1?'':'s');
}
});
function step(){
ctx.clearRect(0,0,W,H);
pts.forEach(function(p){
p.x+=p.vx;p.y+=p.vy;
if(p.x<0||p.x>W)p.vx*=-1;
if(p.y<0||p.y>H)p.vy*=-1;
var d=Math.hypot(p.x-mx,p.y-my);
var near=d<90;
p.lit+=((near?1:0)-p.lit)*0.08;
p.label.style.left=p.x+'px';p.label.style.top=(p.y-12)+'px';
p.label.style.opacity=Math.max(0.12,p.lit).toFixed(2);
p.label.style.color=near?'#e8e8ea':'#6a6a72';
ctx.beginPath();
ctx.arc(p.x,p.y,near?2.6:1.3,0,7);
ctx.fillStyle=near?'#f0f0f2':'rgba(140,140,150,'+(0.35+p.lit*0.5)+')';
ctx.fill();
});
links.forEach(function(l,idx){
ctx.beginPath();
ctx.moveTo(l.a.x,l.a.y);
ctx.lineTo(l.b.x,l.b.y);
ctx.strokeStyle='rgba(120,200,180,'+Math.min(0.85,0.3+idx*0.01)+')';
ctx.lineWidth=1;
ctx.stroke();
});
requestAnimationFrame(step);
}
step();
})();
</script>
</section>
