<section data-date='2026-10-18' data-type='spark'>
<style>
section[data-date]{margin:0;background:#0a0710;position:relative;overflow:hidden;font:12px/1 Georgia,serif;color:#e8d9c4;cursor:crosshair}
section[data-date] canvas{display:block;width:100%;height:320px}
section[data-date] p{position:absolute;left:0;right:0;bottom:12px;margin:0;text-align:center;letter-spacing:.4em;text-transform:lowercase;opacity:.6;transition:opacity .6s}
</style>
<canvas id="c"></canvas>
<p id="t">move to bring them together</p>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t');
var W,H,m={x:0,y:0,in:0},P=[],S=[],T=0,hit=0,cnt=0;
function R(){W=c.width=c.clientWidth;H=c.height=320}
R();addEventListener('resize',R);
function A(){return{x:W*.15,y:H/2+Math.sin(T)*60,vx:0,vy:0,r:16,h:30}}
var a=A(),b={x:W*.85,y:H/2,vx:0,vy:0,r:16,h:200};
c.onmousemove=function(e){var q=c.getBoundingClientRect();m.x=e.clientX-q.left;m.y=e.clientY-q.top;m.in=1};
c.onmouseleave=function(){m.in=0};
c.onclick=function(){hit=0;a=A();a.x=Math.random()*W;b.x=Math.random()*W;b.y=Math.random()*H;t.textContent='again'};
function burst(px,py){
for(var i=0;i<90;i++){var g=Math.random()*6.283,s=Math.random()*5+.5;
S.push({x:px,y:py,vx:Math.cos(g)*s,vy:Math.sin(g)*s,l:1,h:30+Math.random()*170})}}
function step(){
T+=.02;
x.fillStyle='rgba(10,7,16,.18)';x.fillRect(0,0,W,H);
if(!hit){
var tx=m.in?m.x:W/2+Math.cos(T)*W*.3,ty=m.in?m.y:H/2+Math.sin(T*1.3)*80;
b.vx+=(tx-b.x)*.004;b.vy+=(ty-b.y)*.004;
a.vx+=(b.x-a.x)*.0015+Math.sin(T*2)*.05;a.vy+=(b.y-a.y)*.0015+Math.cos(T*2)*.05;
[a,b].forEach(function(o){o.vx*=.95;o.vy*=.95;o.x+=o.vx;o.y+=o.vy});
var d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<a.r+b.r){hit=1;cnt++;burst((a.x+b.x)/2,(a.y+b.y)/2);t.textContent='synthesis no. '+cnt+' — click to repeat'}
else{
x.strokeStyle='hsla(115,60%,70%,'+Math.max(0,1-d/400)*.5+')';
x.beginPath();x.moveTo(a.x,a.y);
x.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2+Math.sin(T*8)*d*.1,b.x,b.y);x.stroke();
[a,b].forEach(function(o){
x.fillStyle='hsl('+o.h+',90%,60%)';x.shadowBlur=20;x.shadowColor=x.fillStyle;
x.beginPath();x.arc(o.x,o.y,o.r,0,6.283);x.fill()});
x.shadowBlur=0}
}
for(var i=S.length;i--;){var s=S[i];
s.x+=s.vx;s.y+=s.vy;s.vx*=.97;s.vy*=.97;s.vy+=.01;s.l-=.006;
if(s.l<=0){S.splice(i,1);continue}
x.fillStyle='hsla('+s.h+',90%,'+(50+s.l*30)+'%,'+s.l+')';
x.fillRect(s.x,s.y,2.5,2.5)}
if(hit&&!S.length){hit=0;a=A();b.x=W*.85;b.vx=b.vy=0}
requestAnimationFrame(step)}
step();
})();
</script>
</section>
