<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>before first light</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;cursor:pointer}
body{
  background:#07060f;
  display:flex;align-items:center;justify-content:center;
  transition:background 2.2s ease
}
#w{
  font-family:Georgia,'Times New Roman',serif;
  font-size:clamp(1.8rem,5vw,3.5rem);
  letter-spacing:.32em;
  text-indent:.32em;
  text-transform:lowercase;
  color:hsl(240,28%,52%);
  transition:opacity .85s ease,transform .85s ease,color 2.2s ease,text-shadow 2s ease;
  text-align:center;
  user-select:none;
  line-height:1
}
.out{opacity:0!important;transform:translateY(-10px)!important}
#hint{
  position:fixed;bottom:2.5rem;width:100%;
  text-align:center;
  font-family:Georgia,serif;font-size:.58rem;
  letter-spacing:.38em;text-indent:.38em;
  color:rgba(160,150,200,0.18);
  text-transform:lowercase;
  transition:opacity 1.8s
}
</style>
</head>
<body>
<section data-date='2026-04-04' data-type='morning'>
<div id="w">before</div>
<div id="hint">click</div>
</section>
<script>
const p=["before","almost","not yet","held","the edge","barely","quiet","becoming","first","\u2014","light","begin"],
sky=["#07060f","#100c1e","#1c1030","#2a1240","#3a1842","#5c2440","#7a2e34","#9e4028","#c06030","#d88840","#ecba70","#f5e0b0"],
w=document.getElementById('w'),
h=document.getElementById('hint');
let i=0,go=true;

function lerp(a,b,t){return a+(b-a)*t}

function skyAt(t){
  const n=sky.length-1,
    lo=Math.min(Math.floor(t*n),n-1),
    hi=lo+1,
    f=t*n-lo,
    parse=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)],
    a=parse(sky[lo]),b=parse(sky[hi]);
  return`rgb(${Math.round(lerp(a[0],b[0],f))},${Math.round(lerp(a[1],b[1],f))},${Math.round(lerp(a[2],b[2],f))})`;
}

document.addEventListener('click',()=>{
  if(!go)return;go=false;
  w.classList.add('out');
  setTimeout(()=>{
    i=(i+1)%p.length;
    w.textContent=p[i];
    const t=i/(p.length-1);
    document.body.style.background=skyAt(t);
    const H=Math.round(240+t*-205),S=Math.round(28+t*52),L=Math.round(52+t*38);
    w.style.color=`hsl(${H},${S}%,${L}%)`;
    w.style.textShadow=`0 0 ${18+t*55}px hsla(${H},${S}%,${L}%,${.08+t*.22})`;
    if(i===1)h.style.opacity='0';
    w.classList.remove('out');
    setTimeout(()=>go=true,930);
  },820);
});

document.addEventListener('mousemove',e=>{
  const dx=(e.clientX/innerWidth-.5)*6,
    dy=(e.clientY/innerHeight-.5)*3;
  w.style.transform=`translate(${dx}px,${dy}px)`;
});
</script>
</body>
</html>
