<section data-date='2026-09-06' data-type='spark'>
<style>
.spk-wrap{margin:0;overflow:hidden;background:#0b0c10;height:70vh;min-height:420px;position:relative;font-family:Georgia,serif;cursor:crosshair}
.spk-wrap .hint{position:absolute;top:10px;left:14px;color:#556;font:11px/1.4 monospace;letter-spacing:.06em;z-index:5}
.spk-wrap span.p{position:absolute;padding:3px 8px;border-radius:3px;white-space:nowrap;transition:opacity .6s,transform .6s;user-select:none}
.spk-wrap span.a{color:#ffd6a5;background:rgba(255,140,60,.08);border:1px solid rgba(255,140,60,.25)}
.spk-wrap span.b{color:#a5d8ff;background:rgba(60,140,255,.08);border:1px solid rgba(60,140,255,.25)}
.spk-wrap span.c{color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);font-style:italic}
</style>
<div class="spk-wrap" id="spkw">
<div class="hint">move · click where they meet</div>
</div>
<script>
(function(){
var w=document.getElementById('spkw');
var A=['ember','tide','root','signal','static','ash','current','wire'];
var B=['glass','salt','frost','echo','bone','rain','copper','dust'];
var syn=function(x,y){var t=A[Math.random()*A.length|0]+B[Math.random()*B.length|0];var s=document.createElement('span');s.className='p c';s.textContent=t;s.style.left=x+'px';s.style.top=y+'px';s.style.opacity='1';s.style.transform='scale(1.4)';w.appendChild(s);setTimeout(function(){s.style.opacity='0';s.style.transform='scale(.6) translateY(-20px)'},900);setTimeout(function(){s.remove()},1600)};
function mk(cls,word){var e=document.createElement('span');e.className='p '+cls;e.textContent=word;w.appendChild(e);return e}
var pairs=[];
for(var i=0;i<7;i++){
  var ea=mk('a',A[i%A.length]),eb=mk('b',B[i%B.length]);
  var y=40+i*(560/7);
  pairs.push({ea:ea,eb:eb,y:y,xa:20,xb:0,vx:0.6+Math.random()*0.6,merged:false});
}
var mx=-1000,my=-1000;
w.addEventListener('mousemove',function(e){var r=w.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
w.addEventListener('mouseleave',function(){mx=-1000;my=-1000});
w.addEventListener('click',function(e){var r=w.getBoundingClientRect();syn(e.clientX-r.left,e.clientY-r.top)});
function tick(){
  var ww=w.clientWidth||600;
  pairs.forEach(function(p){
    if(p.merged){
      if(performance_now_ok(p)) return;
    }
    var pull=1;
    var da=Math.hypot(mx-p.xa,my-p.y),db=Math.hypot(mx-(ww-p.xb-100),my-p.y);
    if(da<80) pull=1.8;
    if(db<80) pull=1.8;
    p.xa+=p.vx*pull;
    p.xb+=p.vx*pull;
    var gap=ww-p.xb-100-p.xa;
    if(gap<70&&!p.merged){
      p.merged=true;
      syn((p.xa+ww-p.xb-100)/2,p.y);
      p.ea.style.opacity='0';p.eb.style.opacity='0';
      setTimeout(function(){p.xa=10+Math.random()*20;p.xb=Math.random()*20;p.merged=false;p.ea.style.opacity='1';p.eb.style.opacity='1'},1200);
    }
    p.ea.style.left=p.xa+'px';p.ea.style.top=p.y+'px';
    p.eb.style.right=p.xb+'px';p.eb.style.left='auto';p.eb.style.top=p.y+'px';
  });
  requestAnimationFrame(tick);
}
function performance_now_ok(){return true}
tick();
})();
</script>
</div>
</section>
