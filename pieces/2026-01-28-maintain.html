<section data-date='2026-01-28' data-type='maintain'>
<style>*{margin:0}body{background:#000;overflow:hidden}</style>
<canvas id=c></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let t=0,sparks=[],cx=c.width/2,cy=c.height/2;
const A=[
{c:'#0f4',s:.007,r:.35,n:'S'},
{c:'#48f',s:.011,r:.28,n:'W'},
{c:'#f80',s:.005,r:.22,n:'C'},
{c:'#c4f',s:.009,r:.18,n:'R'}
];
function pos(a){
let R=Math.min(cx,cy)*a.r+60;
return[cx+Math.cos(t*a.s)*R,cy+Math.sin(t*a.s*1.3)*R]
}
c.onclick=e=>{
for(let i=0;i<12;i++){
let a=Math.random()*6.28,v=1+Math.random()*3;
sparks.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:A[i%4].c})
}};
function d(){
x.fillStyle='rgba(0,0,0,.06)';x.fillRect(0,0,c.width,c.height);
A.forEach(a=>{
let[px,py]=pos(a);
x.beginPath();x.arc(px,py,3,0,7);
x.fillStyle=a.c;x.fill();
x.font='9px monospace';x.fillText(a.n,px+6,py+3);
});
for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
let[ax,ay]=pos(A[i]),[bx,by]=pos(A[j]);
let d=Math.hypot(bx-ax,by-ay);
if(d<80){x.strokeStyle=`rgba(255,255,255,${(80-d)/200})`;
x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()}
}
sparks=sparks.filter(s=>{
s.x+=s.vx;s.y+=s.vy;s.l-=.015;s.vy+=.02;
if(s.l<=0)return false;
x.globalAlpha=s.l;x.fillStyle=s.c;
x.fillRect(s.x,s.y,2,2);x.globalAlpha=1;return true
});
t++;requestAnimationFrame(d)}d()
</script>
</section>
