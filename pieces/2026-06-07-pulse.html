<!doctype html><html><head><meta charset=utf-8><title>Halfway</title></head><body>
<section data-date='2026-06-07' data-type='pulse'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#888}
section{display:block;width:100%;height:100%}
#g{position:fixed;inset:0;transform-origin:50% 50%;transition:transform .3s ease}
#a{position:absolute;top:0;left:0;right:0;bottom:50%;background-color:#f5f0e8;font-family:Georgia,serif;overflow:hidden;transition:background-color .9s,opacity .2s}
#b{position:absolute;top:50%;left:0;right:0;bottom:0;background-color:#111827;font-family:'Courier New',monospace;overflow:hidden;transition:background-color .9s,opacity .2s}
.w{position:absolute;pointer-events:none;transition:opacity .7s ease,color .8s ease}
#c{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);z-index:9;pointer-events:none}
#ln{height:1px;background:linear-gradient(90deg,transparent,#888 12%,#888 88%,transparent)}
#pt{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:5px;height:5px;background:#888;border-radius:50%}
#lbl{position:absolute;left:50%;top:0;transform:translate(-50%,6px);font:italic .52rem/.8 Georgia,serif;letter-spacing:.42em;color:#888;text-transform:uppercase;white-space:nowrap}
</style>
<div id=g><div id=a></div><div id=b></div></div>
<div id=c><div id=ln></div><div id=pt></div><div id=lbl>noon</div></div>
<script>
const $=id=>document.getElementById(id),G=$('g'),A=$('a'),B=$('b'),LBL=$('lbl');
const am=['rise','pale','not yet','open','before','almost','tender','clear'],
  pm=['spent','amber','after','known','shadow','weight','done','still'];
let f=0,ai=0,bi=0;

function mk(t,p,up){
  const d=document.createElement('div'),op=.18+Math.random()*.5;
  d.className='w';d.textContent=t;
  d.style.cssText='left:'+(15+Math.random()*65)+'%;'
    +(up?'bottom:':'top:')+(8+Math.random()*74)+'%;font-size:'
    +(.7+Math.random()*1.35)+'rem;opacity:0;color:'+(up?'#9a7b50':'#4e6fa5');
  p.appendChild(d);
  if(p.children.length>9)p.firstChild.remove();
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.opacity=op));
}

setInterval(()=>mk(am[ai++%8],A,1),1900);
setInterval(()=>mk(pm[bi++%8],B,0),2200);
mk(am[0],A,1);mk(pm[0],B,0);mk(am[2],A,1);mk(pm[2],B,0);

document.addEventListener('mousemove',e=>{
  const nx=(e.clientX/innerWidth-.5)*14;
  G.style.transform='rotate('+nx+'deg)';
  A.style.opacity=.65-(e.clientX/innerWidth-.5)*.4;
  B.style.opacity=.65+(e.clientX/innerWidth-.5)*.4;
});

document.addEventListener('click',()=>{
  f^=1;
  A.style.backgroundColor=f?'#111827':'#f5f0e8';
  B.style.backgroundColor=f?'#f5f0e8':'#111827';
  A.style.fontFamily=f?"'Courier New',monospace":'Georgia,serif';
  B.style.fontFamily=f?'Georgia,serif':"'Courier New',monospace";
  LBL.textContent=f?'midnight':'noon';
  A.querySelectorAll('.w').forEach(n=>n.style.color=f?'#4e6fa5':'#9a7b50');
  B.querySelectorAll('.w').forEach(n=>n.style.color=f?'#9a7b50':'#4e6fa5');
});
</script>
</section></body></html>
