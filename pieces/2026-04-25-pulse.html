<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Halfway · 2026-04-25</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;cursor:none;user-select:none}
#am,#pm{position:fixed;inset:0}
#am{background:#f7f1e6}
#pm{background:#10101e}
.w{position:fixed;font-family:Georgia,'Times New Roman',serif;pointer-events:none;letter-spacing:.07em;line-height:1;transition:opacity .6s}
.aw{color:#3b2f1e;font-size:clamp(11px,1.4vw,16px)}
.pw{color:#6e8fa6;font-size:clamp(11px,1.4vw,16px)}
#beam{
  position:fixed;left:-8%;right:-8%;height:1px;
  background:#c8963a;
  transform-origin:50% 0;
  z-index:10;
  box-shadow:0 0 5px #c8963a44;
  transition:box-shadow .4s
}
#mark{
  position:fixed;left:50%;
  font-family:'Courier New',Courier,monospace;
  font-size:clamp(9px,.9vw,11px);
  letter-spacing:.4em;
  color:#c8963a;
  z-index:11;
  opacity:0;
  transition:opacity .5s;
  white-space:nowrap;
  pointer-events:none;
  transform:translateX(-50%)
}
#dot{
  position:fixed;width:4px;height:4px;
  background:#c8963a;border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;
  transition:transform .1s
}
</style>
</head>
<body>
<section data-date="2026-04-25" data-type="pulse">

<div id="am">
  <span class="w aw" style="left:13%;top:9%">the first hour</span>
  <span class="w aw" style="left:57%;top:7%">east light</span>
  <span class="w aw" style="left:29%;top:21%">still quiet</span>
  <span class="w aw" style="left:73%;top:18%">6:00</span>
  <span class="w aw" style="left:44%;top:33%">before</span>
  <span class="w aw" style="left:17%;top:39%">half awake</span>
  <span class="w aw" style="left:66%;top:41%">rising</span>
  <span class="w aw" style="left:38%;top:46%">the long morning</span>
</div>

<div id="pm">
  <span class="w pw" style="left:20%;top:54%">the long afternoon</span>
  <span class="w pw" style="left:63%;top:56%">18:00</span>
  <span class="w pw" style="left:34%;top:64%">west light</span>
  <span class="w pw" style="left:75%;top:68%">after</span>
  <span class="w pw" style="left:14%;top:73%">going soft</span>
  <span class="w pw" style="left:51%;top:79%">the last hour</span>
  <span class="w pw" style="left:26%;top:86%">almost dark</span>
  <span class="w pw" style="left:70%;top:83%">falling</span>
</div>

<div id="beam"></div>
<div id="mark">12:00</div>
<div id="dot"></div>

</section>
<script>
const beam=document.getElementById('beam'),
      mark=document.getElementById('mark'),
      am=document.getElementById('am'),
      pm=document.getElementById('pm'),
      dot=document.getElementById('dot');

let my=.5,mx=.5,frozen=false,ft=null;
const W=()=>window.innerWidth,H=()=>window.innerHeight;

function clip(ly,tilt){
  const r=tilt*Math.PI/180,
        hw=W()*.58,
        dx=hw*Math.tan(r),
        lY=ly+dx, rY=ly-dx;
  am.style.clipPath=`polygon(0 0,100% 0,100% ${rY}px,0 ${lY}px)`;
  pm.style.clipPath=`polygon(0 ${lY}px,100% ${rY}px,100% 100%,0 100%)`;
}

function render(){
  const lineY=my*H(), tilt=(mx-.5)*10;
  clip(lineY,tilt);
  beam.style.top=lineY+'px';
  beam.style.transform=`rotate(${tilt}deg)`;
  mark.style.top=(lineY-20)+'px';
  const d=Math.abs(my-.5);
  const eq=d<.035;
  mark.style.opacity=eq?String(Math.max(0,1-d*22)):'0';
  beam.style.boxShadow=eq
    ?`0 0 ${10+Math.round((1-d*28)*8)}px #c8963a88`
    :'0 0 5px #c8963a33';
}

document.addEventListener('mousemove',e=>{
  dot.style.left=e.clientX+'px';
  dot.style.top=e.clientY+'px';
  if(frozen)return;
  mx=e.clientX/W();
  my=e.clientY/H();
  render();
});

document.addEventListener('click',()=>{
  if(ft)clearTimeout(ft);
  frozen=true;
  mx=.5;my=.5;
  render();
  mark.style.opacity='1';
  beam.style.boxShadow='0 0 18px #c8963acc';
  ft=setTimeout(()=>{frozen=false;render()},2200);
});

window.addEventListener('resize',render);
render();
</script>
</body>
</html>
