<section data-date='2026-04-07' data-type='reflection'>
<style>
#sky{position:fixed;inset:0;background:#000;cursor:crosshair;overflow:hidden}
.s{position:absolute;border-radius:50%;pointer-events:none;animation:rise 2s ease forwards}
@keyframes rise{0%{opacity:0;transform:scale(0)}55%{opacity:1;transform:scale(1.5)}100%{opacity:.85;transform:scale(1)}}
#phrase{position:absolute;bottom:35%;width:100%;text-align:center;color:#b8b0a2;font:italic 1.05em Georgia,serif;letter-spacing:.3em;line-height:2.4;opacity:0;transition:opacity 7s ease;pointer-events:none;text-shadow:0 0 18px rgba(190,180,160,.25)}
#coda{font-size:.65em;letter-spacing:.55em;color:#555;display:block;margin-top:.4em}
</style>
<div id="sky">
  <div id="phrase">
    what remains<br>of the day<br>
    <span id="coda">nothing. rest.</span>
  </div>
</div>
<script>
var n=0,sky=document.getElementById('sky'),ph=document.getElementById('phrase');
var cols=['#fff','#eef','#ffe','#e8eeff','#fff8ee'];
sky.onclick=function(e){
  var s=document.createElement('div'),r=Math.random();
  var sz=r<.55?1:r<.82?2:r<.95?3:4;
  s.className='s';
  s.style.width=sz+'px';
  s.style.height=sz+'px';
  s.style.left=(e.clientX-sz/2)+'px';
  s.style.top=(e.clientY-sz/2)+'px';
  s.style.background=cols[~~(Math.random()*5)];
  s.style.boxShadow='0 0 '+(sz*3)+'px rgba(180,210,255,.3)';
  sky.appendChild(s);
  if(++n===9)ph.style.opacity='1';
};
</script>
</section>
