<section data-date='2026-01-28' data-type='winddown'>
<style>
body{background:#000;margin:0;overflow:hidden}
.sky{position:fixed;inset:0;background:linear-gradient(to bottom,#1a1a2e 0%,#2d1b4e 25%,#4a2545 50%,#6b3042 75%,#0f0f0f 100%);animation:fade 90s ease-in-out forwards}
@keyframes fade{to{opacity:.2}}
.horizon{position:absolute;bottom:20%;left:0;right:0;height:2px;background:rgba(255,100,50,.3);box-shadow:0 0 20px rgba(255,100,50,.2)}
.text{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);font-family:monospace;font-size:14px;color:#888;opacity:0;animation:appear 3s 2s ease-in forwards;text-align:center;letter-spacing:2px}
@keyframes appear{to{opacity:.5}}
.breath{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,120,.08),transparent);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.3);opacity:.3}}
</style>
<div class="sky"></div>
<div class="breath"></div>
<div class="horizon"></div>
<div class="text">the day settles</div>
</section>
