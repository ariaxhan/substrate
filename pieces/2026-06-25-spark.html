<section data-date='2026-06-25' data-type='spark'>
<style>
#_p{position:fixed;inset:0;background:#040410;overflow:hidden;cursor:crosshair}
#_c{position:fixed;inset:0}
#_h{position:fixed;bottom:1.6rem;width:100%;text-align:center;font-size:.65rem;letter-spacing:.28em;color:rgba(255,255,255,.15);font-family:Georgia,serif;font-style:italic;pointer-events:none;transition:opacity 1.4s}
</style>
<div id="_p">
<canvas id="_c"></canvas>
<div id="_h">draw the cursor between them</div>
</div>
<script>
var cv=document.getElementById('_c'),
    x=cv.getContext('2d'),
    el=document.getElementById('_p'),
    hi=document.getElementById('_h'),
    W,H,mx,my,fl=0,flx=0,fly=0,flw='';

var A=['carbon','hydrogen','oxygen','nitrogen','calcium','iron','water','phosphorus'],
    B=['grief','love','fury','longing','joy','fear','wonder','shame'],
    S=['mother','enemy','stranger','beloved','child','witness','ghost','kin'];
var ai=0,bi=0,si=0;
var ax,ay,bx,by,avx=.9,avy=-.6,bvx=-.9,bvy=.6;

function sz(){
  W=cv.width=el.offsetWidth;H=cv.height=el.offsetHeight;
  mx=W/2;my=H/2;ax=W*.28;ay=H*.5;bx=W*.72;by=H*.5;
}

function grd(px,py,r,r0,g0,b0){
  var g=x.createRadialGradient(px,py,0,px,py,r);
  g.addColorStop(0,'rgba('+r0+','+g0+','+b0+',.48)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  return g;
}

function draw(){
  requestAnimationFrame(draw);
  x.fillStyle='rgba(4,4,16,.19)';x.fillRect(0,0,W,H);

  avx+=(mx-ax)*.009;avy+=(my-ay)*.009;
  bvx+=(mx-bx)*.009;bvy+=(my-by)*.009;
  avx*=.91;avy*=.91;bvx*=.91;bvy*=.91;
  ax+=avx;ay+=avy;bx+=bvx;by+=bvy;
  if(ax<38||ax>W-38)avx*=-1;if(ay<38||ay>H-38)avy*=-1;
  if(bx<38||bx>W-38)bvx*=-1;if(by<38||by>H-38)bvy*=-1;

  var dx=bx-ax,dy=by-ay,ds=Math.sqrt(dx*dx+dy*dy)||1;

  if(ds<190){
    var la=(1-ds/190)*.12;
    x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);
    x.strokeStyle='rgba(165,140,255,'+la+')';
    x.lineWidth=(1-ds/190)*2;x.stroke();
  }

  x.fillStyle=grd(ax,ay,56,74,158,202);
  x.beginPath();x.arc(ax,ay,56,0,6.28);x.fill();
  x.fillStyle='#5ab0d8';x.beginPath();x.arc(ax,ay,4,0,6.28);x.fill();
  x.font='11px monospace';x.textAlign='center';
  x.fillStyle='rgba(120,194,232,.9)';x.fillText(A[ai],ax,ay-18);

  x.fillStyle=grd(bx,by,56,232,147,74);
  x.beginPath();x.arc(bx,by,56,0,6.28);x.fill();
  x.fillStyle='#e8934a';x.beginPath();x.arc(bx,by,4,0,6.28);x.fill();
  x.fillStyle='rgba(232,178,94,.9)';x.fillText(B[bi],bx,by-18);

  if(ds<50&&fl===0){
    flx=(ax+bx)/2;fly=(ay+by)/2;flw=S[si%S.length];fl=40;
    ai=(ai+1)%A.length;bi=(bi+1)%B.length;si++;
    hi.style.opacity='0';
    avx-=dx*.07;avy-=dy*.07;bvx+=dx*.07;bvy+=dy*.07;
  }

  if(fl>0){
    var fa=fl/40,ri=(1-fa)*88;
    x.globalAlpha=fa;
    x.beginPath();x.arc(flx,fly,ri+6,0,6.28);
    x.strokeStyle='rgba(240,228,255,'+fa+')';x.lineWidth=fa*2.5;x.stroke();
    x.font=(10+fa*16)+'px Georgia';x.fillStyle='#f8f3ec';
    x.textAlign='center';x.fillText(flw,flx,fly+6);
    x.globalAlpha=1;fl--;
  }
}

el.addEventListener('mousemove',function(e){
  var r=el.getBoundingClientRect();
  mx=e.clientX-r.left;my=e.clientY-r.top;
});

el.addEventListener('click',function(){
  if(fl>0)return;
  var cx=(ax+bx)/2,cy=(ay+by)/2;
  avx+=(cx-ax)*.28;avy+=(cy-ay)*.28;
  bvx+=(cx-bx)*.28;bvy+=(cy-by)*.28;
});

sz();window.addEventListener('resize',sz);draw();
</script>
</section>
