<section data-date='2026-02-04' data-type='encouragement'>
<style>
body{margin:0;overflow:hidden;background:#0a0a0f;font-family:Georgia,serif;cursor:crosshair}
#c{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
#t{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#2a2a3a;font-size:15vmin;text-align:center;line-height:1.3;z-index:2;pointer-events:none;transition:color 2.5s ease,text-shadow 2.5s ease;user-select:none;font-weight:300;letter-spacing:0.03em}
.lit{color:#e8d5b7!important;text-shadow:0 0 40px rgba(255,220,150,0.6),0 0 80px rgba(255,200,100,0.3)!important}
.w{position:fixed;color:rgba(120,100,80,0.4);font-size:12px;pointer-events:none;z-index:0;animation:f 4s ease-in-out infinite;font-style:italic}
@keyframes f{0%,100%{opacity:0.3}50%{opacity:0.7}}
</style>
<canvas id="c"></canvas>
<div id="t">i see you<br>trying</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),txt=document.getElementById('t');
let w=cv.width=innerWidth,h=cv.height=innerHeight,mx=w/2,my=h/2,pts=[],lit=0;
const ws=['witnessed','here','present','noticed','seen','acknowledged','held','recognized'];
ws.forEach((wd,i)=>{
  let d=document.createElement('div');
  d.className='w';
  d.textContent=wd;
  d.style.top=`${15+Math.random()*70}%`;
  d.style.left=`${10+Math.random()*80}%`;
  d.style.animationDelay=`${i*0.5}s`;
  document.body.appendChild(d);
});
addEventListener('resize',()=>{w=cv.width=innerWidth;h=cv.height=innerHeight});
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
addEventListener('click',()=>{
  lit=1;
  txt.classList.add('lit');
  setTimeout(()=>{txt.classList.remove('lit');lit=0},3000);
});
for(let i=0;i<80;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:1+Math.random()*2});
function draw(){
  ctx.fillStyle='rgba(10,10,15,0.15)';
  ctx.fillRect(0,0,w,h);
  pts.forEach(p=>{
    let dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<150){
      p.vx+=dx*0.0001;
      p.vy+=dy*0.0001;
      let a=Math.max(0,1-d/150);
      ctx.fillStyle=lit?`rgba(255,220,150,${a*0.8})`:`rgba(100,80,60,${a*0.5})`;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*(1+a),0,Math.PI*2);
      ctx.fill();
    }
    p.x+=p.vx;
    p.y+=p.vy;
    p.vx*=0.98;
    p.vy*=0.98;
    if(p.x<0||p.x>w)p.vx*=-1;
    if(p.y<0||p.y>h)p.vy*=-1;
    p.x=Math.max(0,Math.min(w,p.x));
    p.y=Math.max(0,Math.min(h,p.y));
    ctx.fillStyle='rgba(80,70,60,0.4)';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</section>
