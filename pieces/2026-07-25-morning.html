<section data-date='2026-07-25' data-type='morning'>
<style>
#taper-dawn{position:relative;width:100%;height:100vh;overflow:hidden;margin:0;
background:linear-gradient(to bottom,#0a0a28,#1a1a3d 60%,#20203f);cursor:crosshair;
font-family:Georgia,'Times New Roman',serif}
#td-sun{position:absolute;left:50%;top:88%;width:110px;height:110px;margin:-55px;
border-radius:50%;pointer-events:none;filter:blur(1px);
background:radial-gradient(circle,#fff8e3,#ffd873 42%,rgba(255,216,115,0) 72%);
transition:left .18s linear,top .18s linear,filter .4s linear}
#td-poem span{position:absolute;opacity:0;font-style:italic;color:#fff3de;
letter-spacing:.02em;text-shadow:0 0 14px rgba(255,190,110,.55);
animation:td-rise 1.6s ease forwards;white-space:nowrap}
@keyframes td-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#td-hint{position:absolute;bottom:22px;width:100%;text-align:center;
font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.3em;
text-transform:uppercase;color:rgba(255,255,255,.32);pointer-events:none}
</style>
<div id="taper-dawn">
  <div id="td-sun"></div>
  <div id="td-poem"></div>
  <div id="td-hint">move to lift the light &nbsp;&middot;&nbsp; click to write</div>
</div>
<script>
(function(){
  var sky=document.getElementById('taper-dawn'),
      sun=document.getElementById('td-sun'),
      poem=document.getElementById('td-poem'),
      words=['not yet','unwritten','a seam of light','along the edge',
             'of everything','that could still happen','begin'],
      i=0;

  sky.addEventListener('mousemove', function(e){
    var r=sky.getBoundingClientRect(),
        fy=(e.clientY-r.top)/r.height,
        t=1-fy;
    sun.style.left=(e.clientX-r.left)+'px';
    sun.style.top=(e.clientY-r.top)+'px';
    sun.style.filter='blur('+(2-1.6*t)+'px)';
    sky.style.background='linear-gradient(to bottom, hsl('+
      Math.round(232-140*t)+','+Math.round(55+20*t)+'%,'+Math.round(9+50*t)+'%), hsl('+
      Math.round(28+14*t)+',85%,'+Math.round(18+42*t)+'%))';
  });

  sky.addEventListener('click', function(e){
    if(i>=words.length) return;
    var r=sky.getBoundingClientRect(),
        frac=i/(words.length-1),
        span=document.createElement('span');
    span.textContent=words[i];
    span.style.left=(8+frac*68)+'%';
    span.style.top=(78-frac*58)+'%';
    span.style.fontSize=(15+frac*11)+'px';
    if(i===words.length-1) span.style.fontWeight='bold';
    poem.appendChild(span);
    i++;
  });
})();
</script>
</section>
