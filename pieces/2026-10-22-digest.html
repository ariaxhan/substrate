<section data-date='2026-10-22' data-type='digest'>
<style>
#k{background:#f1ebdc;position:relative;height:100vh;overflow:hidden;font:italic 15px Georgia,serif;color:#2b2a26;cursor:crosshair}
#k canvas{position:absolute;inset:0;width:100%;height:100%}
#k p{position:absolute;left:5vw;bottom:4vh;margin:0;letter-spacing:.08em;transition:opacity 2s}
</style>
<div id="k"><canvas></canvas><p id="t">scatter. then press.</p></div>
<script>
(function(){
var k=document.getElementById('k'),c=k.querySelector('canvas'),x=c.getContext('2d'),t=document.getElementById('t');
var W,H,P=[],E=[],n=0,words=['noted','linked','held','kept','folded','known','again','shape'];
function R(){W=c.width=k.clientWidth;H=c.height=k.clientHeight}
R();addEventListener('resize',R);
function add(px,py){
 var p={x:px,y:py,vx:0,vy:0,age:0,w:words[n++%words.length]};
 P.forEach(function(q){var d=Math.hypot(q.x-px,q.y-py);if(d<190)E.push([q,p,d])});
 P.push(p);
 t.textContent=P.length+' points, '+E.length+' threads'+(E.length>P.length*2?' — it is a lattice now':'');
}
for(var i=0;i<14;i++)add(Math.random()*W,Math.random()*H);
k.addEventListener('click',function(e){var r=k.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)});
function f(){
 x.fillStyle='rgba(241,235,220,.25)';x.fillRect(0,0,W,H);
 E.forEach(function(e){
  var a=e[0],b=e[1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,s=(d-e[2]*.8)*.0009;
  a.vx+=dx/d*s;a.vy+=dy/d*s;b.vx-=dx/d*s;b.vy-=dy/d*s;
  x.strokeStyle='rgba(43,42,38,'+Math.min(.5,.08+Math.min(a.age,b.age)/900)+')';
  x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
 });
 P.forEach(function(p){
  p.age++;p.vx*=.96;p.vy*=.96;p.x+=p.vx;p.y+=p.vy;
  var deg=E.filter(function(e){return e[0]==p||e[1]==p}).length;
  x.fillStyle=deg>3?'#a8321c':'#2b2a26';
  x.beginPath();x.arc(p.x,p.y,2+deg*.9,0,6.3);x.fill();
  if(deg>3){x.fillStyle='rgba(168,50,28,.7)';x.fillText(p.w,p.x+8,p.y-6)}
 });
 requestAnimationFrame(f);
}
f();
})();
</script>
</section>
