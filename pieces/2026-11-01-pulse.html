<section data-date='2026-11-01' data-type='pulse'>
<style>
#h{margin:0;background:#f1ebdd;height:100vh;overflow:hidden;position:relative;font:italic 15px Georgia,serif;color:#3a342b}
#h canvas{display:block;width:100%;height:100%}
#t{position:absolute;left:0;right:0;bottom:7vh;text-align:center;letter-spacing:.3em;transition:opacity 1.5s;opacity:0}
</style>
<div id=h><canvas id=c></canvas><div id=t>halfway</div></div>
<script>
(function(){
var h=document.getElementById('h'),c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('t'),
W,H,a=0,v=0,aim=0,f=.5,g=[],q=0;
function R(){W=c.width=h.clientWidth;H=c.height=h.clientHeight}
R();onresize=R;
h.onmousemove=function(e){aim=(e.clientX/W-.5)*.5};
h.onclick=function(e){f=e.clientX/W;g=[]};
function L(p,m){return 'hsl('+(p<.5?30:215)+','+(55-m*20)+'%,'+(58-m*18)+'%)'}
function loop(){
q++;
var px=f*W,py=H*.62,len=W*.42;
// torque: mass on each side of the fulcrum
var m=0;g.forEach(function(p){m+=p.s*(p.u-.5)});
v+=(-a*.02+aim*.0015-m*.00004);v*=.96;a+=v;
if(q%6==0&&g.length<260){var s=Math.random()<.5?-1:1;g.push({u:f+s*Math.random()*.4+(Math.random()-.5)*.02,s:s,r:2+Math.random()*3,d:0})}
x.fillStyle='rgba(241,235,221,.22)';x.fillRect(0,0,W,H);
x.save();x.translate(px,py);
x.strokeStyle='#3a342b';x.lineWidth=2;x.beginPath();x.moveTo(-len*f*2,0);
x.save();x.rotate(a);
x.beginPath();x.moveTo(-px,0);x.lineTo(W-px,0);x.stroke();
g.forEach(function(p,i){
 var gx=(p.u*W-px),side=gx<0?0:1;
 p.d+=.002;
 var y=-p.r-Math.sin(q*.03+i)*1.5;
 x.fillStyle=L(p.u,Math.abs(gx)/W);
 x.beginPath();x.arc(gx,y,p.r,0,7);x.fill();
 // grains slide toward low side
 p.u+=Math.sin(a)*.002*(1+p.r*.1);
 if(p.u<0||p.u>1||Math.abs(p.u-f)<.002)p.u=Math.min(1,Math.max(0,p.u));
 p.s=gx<0?-1:1;
});
x.restore();
x.fillStyle='#3a342b';x.beginPath();x.moveTo(0,0);x.lineTo(-14,34);x.lineTo(14,34);x.fill();
x.restore();
t.style.opacity=Math.abs(a)<.012&&Math.abs(f-.5)<.06?1:0;
t.style.transform='translateX('+(f-.5)*W*.6+'px)';
requestAnimationFrame(loop)}
loop();
})();
</script>
</section>
