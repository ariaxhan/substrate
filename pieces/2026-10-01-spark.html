<section data-date='2026-10-01' data-type='spark'>
<style>
#c{background:#0b0a10;display:block;width:100%;height:100%;cursor:crosshair}
</style>
<canvas id=c width=640 height=360></canvas>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W=640,H=360,
A='MEETING',B='COLLIDE',F='WEAVEUS',m=.5,t=0,S=[],
L=[];
for(var i=0;i<7;i++)L.push({a:A[i],b:B[i],f:F[i],ax:0,bx:W,y:70+i*38,h:0});
function burst(px,py,n){for(var k=0;k<n;k++){var q=Math.random()*6.28,v=1+Math.random()*3;
S.push({x:px,y:py,vx:Math.cos(q)*v,vy:Math.sin(q)*v,l:1,c:Math.random()<.5?'#ff5a36':'#38d9ff'})}}
c.onmousemove=function(e){var r=c.getBoundingClientRect();m=(e.clientX-r.left)/r.width};
c.onclick=function(e){var r=c.getBoundingClientRect();burst((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H,60)};
x.font='bold 30px monospace';x.textAlign='center';x.textBaseline='middle';
function draw(){t+=.03;
x.fillStyle='rgba(11,10,16,.25)';x.fillRect(0,0,W,H);
L.forEach(function(l,i){
var w=Math.sin(t+i)*14,ta=m*W+w,tb=W-m*W-w;
l.ax+=(ta-l.ax)*.06;l.bx+=(tb-l.bx)*.06;
var d=Math.abs(l.ax-l.bx);
if(d<26){
if(!l.h){burst((l.ax+l.bx)/2,l.y,14);l.h=1}
x.fillStyle='#fff';x.fillText(l.f,(l.ax+l.bx)/2,l.y);
x.strokeStyle='rgba(255,255,255,.3)';x.strokeRect((l.ax+l.bx)/2-16,l.y-18,32,36)
}else{
l.h=0;
x.fillStyle='#ff5a36';x.fillText(l.a,l.ax,l.y);
x.fillStyle='#38d9ff';x.fillText(l.b,l.bx,l.y);
x.strokeStyle='rgba(180,140,255,'+Math.max(0,.35-d/W)+')';
x.beginPath();x.moveTo(l.ax,l.y);x.lineTo(l.bx,l.y);x.stroke()}
});
S=S.filter(function(p){return p.l>0});
S.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.l-=.02;
x.globalAlpha=p.l;x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)});
x.globalAlpha=1;
requestAnimationFrame(draw)}
draw();
})();
</script>
</section>
