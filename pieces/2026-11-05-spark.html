<section data-date='2026-11-05' data-type='spark'>
<style>
.cx{position:relative;background:#0b0710;height:360px;overflow:hidden;cursor:crosshair;font:12px Georgia,serif;color:#e8d9c4}
.cx canvas{position:absolute;inset:0;width:100%;height:100%}
.cx p{position:absolute;left:14px;bottom:8px;margin:0;font-style:italic;opacity:.7;pointer-events:none}
</style>
<div class="cx"><canvas></canvas><p id="cxt">two things, drifting. move to steer one toward the other.</p></div>
<script>
(function(){
var d=document.currentScript.parentNode,c=d.querySelector('canvas'),x=c.getContext('2d'),t=d.querySelector('#cxt');
var W,H,m={x:0,y:0},P=[],S=[],n=0,mer=0;
function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}rs();
var A={x:W*.2,y:H*.5,vx:.6,vy:.2,h:20,r:16,n:'ember'},B={x:W*.8,y:H*.5,vx:-.6,vy:-.2,h:200,r:16,n:'tide'};
m.x=W/2;m.y=H/2;
d.querySelector('.cx').onmousemove=function(e){var r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top};
function burst(px,py){
for(var i=0;i<90;i++){var a=Math.random()*6.28,s=Math.random()*4+.5;
P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:i%2?20:200+Math.random()*60})}
S.push({x:px,y:py,r:0})}
function step(o,f){
o.vx+=(m.x-o.x)*f*.0004;o.vy+=(m.y-o.y)*f*.0004;
o.x+=o.vx;o.y+=o.vy;
if(o.x<0||o.x>W)o.vx*=-1;if(o.y<0||o.y>H)o.vy*=-1;
o.vx*=.995;o.vy*=.995}
function dot(o){x.fillStyle='hsl('+o.h+',90%,60%)';x.shadowBlur=20;x.shadowColor=x.fillStyle;
x.beginPath();x.arc(o.x,o.y,o.r,0,6.28);x.fill();x.shadowBlur=0}
function f(){
x.fillStyle='rgba(11,7,16,.18)';x.fillRect(0,0,W,H);
if(!mer){
step(A,1);step(B,-.3);
var dx=B.x-A.x,dy=B.y-A.y,q=Math.hypot(dx,dy);
x.strokeStyle='rgba(232,217,196,'+Math.max(0,.5-q/600)+')';
x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();
A.vx+=dx/q*.01;A.vy+=dy/q*.01;B.vx-=dx/q*.01;B.vy-=dy/q*.01;
dot(A);dot(B);
if(q<A.r+B.r){mer=1;n++;burst((A.x+B.x)/2,(A.y+B.y)/2);
t.textContent='collision '+n+'. something new, neither ember nor tide.'}
}else{
var live=0;
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.l-=.008;
if(p.l>0){live++;x.fillStyle='hsla('+p.h+',90%,60%,'+p.l+')';x.fillRect(p.x,p.y,2,2)}});
S.forEach(function(s){s.r+=4;x.strokeStyle='rgba(255,230,180,'+Math.max(0,1-s.r/200)+')';
x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.stroke()});
if(!live){P=[];S=[];mer=0;
A.x=Math.random()*W*.3;A.y=Math.random()*H;A.vx=.6;A.vy=Math.random()-.5;
B.x=W-Math.random()*W*.3;B.y=Math.random()*H;B.vx=-.6;B.vy=Math.random()-.5;
t.textContent='two things, drifting. move to steer one toward the other.'}
}
requestAnimationFrame(f)}
f();
})();
</script>
</section>
