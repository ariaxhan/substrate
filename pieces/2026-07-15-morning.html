<section data-date="2026-07-15" data-type="morning" id="t0715">
<style>
#t0715{position:relative;width:100%;height:100vh;overflow:hidden;font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;cursor:crosshair;background:linear-gradient(to bottom,rgb(10,10,35),rgb(40,30,60))}
#t0715 .sun{position:absolute;left:50%;bottom:6%;width:10vmin;height:10vmin;border-radius:50%;background:radial-gradient(circle,#fff6dd,#ffcf8f 55%,transparent 72%);transform:translate(-50%,0);opacity:.15;transition:opacity .4s linear;filter:blur(.5px)}
#t0715 .horizon{position:absolute;left:0;bottom:6%;width:100%;height:1px;background:rgba(255,255,255,.18)}
#t0715 .words{position:absolute;left:0;bottom:10%;width:100%;text-align:center;letter-spacing:.02em;font-size:clamp(1.1rem,3vw,2.2rem);font-style:italic;color:#f4ead9;text-shadow:0 0 12px rgba(0,0,0,.4)}
#t0715 .words span{opacity:0;display:inline-block;filter:blur(4px);transition:opacity 1.1s ease,filter 1.1s ease,transform 1.1s ease;transform:translateY(6px)}
#t0715 .words span.on{opacity:.92;filter:blur(0);transform:translateY(0)}
#t0715 .hint{position:absolute;top:6%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-family:Georgia,serif;pointer-events:none;transition:opacity .6s}
#t0715 .stars{position:absolute;inset:0;pointer-events:none;opacity:.6;transition:opacity .5s linear}
</style>
<div class="stars" id="t0715s"></div>
<div class="horizon"></div>
<div class="sun" id="t0715u"></div>
<div class="hint" id="t0715h">move · click</div>
<div class="words" id="t0715w"></div>
<script>
(function(){
var root=document.getElementById('t0715'),sun=document.getElementById('t0715u'),wrap=document.getElementById('t0715w'),hint=document.getElementById('t0715h'),stars=document.getElementById('t0715s');
var line=['not','yet','written,','only','light','arriving.','before','the','first','word','there','is','only','this',':','a','day','that','has','not','chosen','what','it','will','become.'];
var i=0;
function lerp(a,b,t){return Math.round(a+(b-a)*t)}
function mix(c1,c2,t){return 'rgb('+lerp(c1[0],c2[0],t)+','+lerp(c1[1],c2[1],t)+','+lerp(c1[2],c2[2],t)+')'}
var tN=[10,10,35],tD=[110,90,150],bN=[40,30,60],bD=[255,205,145];
function paint(t){
root.style.background='linear-gradient(to bottom,'+mix(tN,tD,t)+','+mix(bN,bD,t)+')';
sun.style.opacity=(0.1+t*0.9).toFixed(2);
sun.style.bottom=(6+t*20)+'%';
stars.style.opacity=(1-t).toFixed(2);
}
root.addEventListener('mousemove',function(e){
var r=root.getBoundingClientRect();
var t=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
paint(t);
});
root.addEventListener('click',function(){
if(hint.style.opacity!=='0'){hint.style.opacity='0'}
if(i>=line.length)return;
var s=document.createElement('span');
s.textContent=line[i]+' ';
wrap.appendChild(s);
requestAnimationFrame(function(){s.classList.add('on')});
i++;
});
paint(.08);
for(var n=0;n<40;n++){
var d=document.createElement('div');
var x=Math.random()*100,y=Math.random()*60,sz=Math.random()*1.6+.4;
d.style.cssText='position:absolute;left:'+x+'%;top:'+y+'%;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:#fff;opacity:'+(Math.random()*.6+.2);
stars.appendChild(d);
}
})();
</script>
</section>
