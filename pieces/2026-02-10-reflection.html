<section data-date='2026-02-10' data-type='reflection'>
<style>
body{margin:0;overflow:hidden;background:#0a0a12;cursor:crosshair}
#sky{position:fixed;inset:0;font-family:'Courier New',monospace;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:8px;font-weight:300}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle 3s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
.constellation{position:absolute;opacity:0;transition:opacity 1.2s ease}
.constellation.visible{opacity:0.4}
.line{position:absolute;background:rgba(255,255,255,0.15);transform-origin:0 0}
#center{font-size:11px;letter-spacing:3px;opacity:0;transition:opacity 2s ease;text-align:center;line-height:1.8}
#center.show{opacity:0.6}
</style>

<div id="sky">
  <div id="center">
    THE DAY COMPLETE<br>
    STARS APPEAR<br>
    REST BEFORE THE NEXT BEGINNING
  </div>
</div>

<script>
const stars=[];
const constellations=[];
let centerShown=false;

function createStar(x,y){
  const s=document.createElement('div');
  s.className='star';
  s.style.left=x+'px';
  s.style.top=y+'px';
  s.style.animationDelay=Math.random()*2+'s';
  s.style.width=s.style.height=(Math.random()*3+1)+'px';
  document.body.appendChild(s);
  stars.push({x,y,el:s});

  if(stars.length>30&&!centerShown){
    document.getElementById('center').classList.add('show');
    centerShown=true;
  }

  if(stars.length>=3){
    const recent=stars.slice(-3);
    if(Math.random()<0.3){
      drawConstellation(recent);
    }
  }
}

function drawConstellation(pts){
  const c=document.createElement('div');
  c.className='constellation';

  for(let i=0;i<pts.length-1;i++){
    const p1=pts[i];
    const p2=pts[i+1];
    const dx=p2.x-p1.x;
    const dy=p2.y-p1.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const angle=Math.atan2(dy,dx)*180/Math.PI;

    const line=document.createElement('div');
    line.className='line';
    line.style.left=p1.x+'px';
    line.style.top=p1.y+'px';
    line.style.width=dist+'px';
    line.style.height='1px';
    line.style.transform=`rotate(${angle}deg)`;
    c.appendChild(line);
  }

  document.body.appendChild(c);
  setTimeout(()=>c.classList.add('visible'),50);
  constellations.push(c);

  if(constellations.length>8){
    const old=constellations.shift();
    old.style.opacity='0';
    setTimeout(()=>old.remove(),1200);
  }
}

document.addEventListener('click',(e)=>{
  createStar(e.clientX,e.clientY);
});

for(let i=0;i<5;i++){
  setTimeout(()=>{
    createStar(
      Math.random()*window.innerWidth,
      Math.random()*window.innerHeight
    );
  },i*400);
}
</script>
</section>
