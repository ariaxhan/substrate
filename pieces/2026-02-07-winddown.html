<section data-date='2026-02-07' data-type='winddown'>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(to bottom, #1a1410 0%, #0a0604 100%);
  height: 100vh;
  overflow: hidden;
  font-family: Georgia, serif;
  cursor: crosshair;
}
.glow {
  position: fixed;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,180,80,0.4) 0%, transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.8s ease-out;
  mix-blend-mode: screen;
}
.light {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff9944;
  box-shadow: 0 0 20px 4px rgba(255,153,68,0.6);
  transition: all 1.2s ease-out;
  cursor: pointer;
}
.light.dim {
  background: #221100;
  box-shadow: 0 0 2px 1px rgba(34,17,0,0.2);
  transform: scale(0.6);
}
.breath {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,200,150,0.3);
  font-size: 13px;
  letter-spacing: 2px;
  text-align: center;
  line-height: 1.6;
}
</style>

<div class="glow" id="g"></div>
<div class="breath">
  let the day go<br>
  one breath at a time
</div>

<script>
const L = 40, W = window.innerWidth, H = window.innerHeight, g = document.getElementById('g');
let mx = W/2, my = H/2, lx = mx, ly = my, v = 0, t = Date.now();

for (let i = 0; i < L; i++) {
  const l = document.createElement('div');
  l.className = 'light';
  l.style.left = (Math.random() * (W - 100) + 50) + 'px';
  l.style.top = (Math.random() * (H - 100) + 50) + 'px';
  l.onclick = () => {
    if (!l.classList.contains('dim')) {
      l.classList.add('dim');
    }
  };
  document.body.appendChild(l);
}

document.addEventListener('mousemove', e => {
  mx = e.clientX;
  my = e.clientY;
  const now = Date.now(), dt = now - t;
  t = now;
  const dx = mx - lx, dy = my - ly;
  v = Math.sqrt(dx*dx + dy*dy) / (dt || 1);
  lx = mx;
  ly = my;
});

function draw() {
  const intensity = Math.min(v * 80, 1);
  g.style.left = (mx - 90) + 'px';
  g.style.top = (my - 90) + 'px';
  g.style.opacity = intensity;
  v *= 0.92;
  requestAnimationFrame(draw);
}
draw();
</script>
</section>
