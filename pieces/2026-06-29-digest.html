<section data-date='2026-06-29' data-type='digest'>
<style>
*{margin:0}
body{background:#0b0806;overflow:hidden;cursor:crosshair}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;color:rgba(200,148,60,.25);letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
</style>
<canvas id=cv></canvas>
<div id=hint>move to find · click to keep</div>
<script>
const cv=document.getElementById('cv'),
c=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;
const W=cv.width,H=cv.height;

const vocab='signal·pattern·structure·order·data·form·emergence·network·meaning·knowledge·trace·field·threshold·entropy·lattice·node·depth·accumulate·crystallize'.split('·');
const nc='·.,-.:·,.';

// Sparse field of dots — grid with organic jitter
const dots=[];
for(let y=20;y<H;y+=22)for(let x=16;x<W;x+=20)
  dots.push({
    x:x+(Math.random()-.5)*12,
    y:y+(Math.random()-.5)*12,
    c:nc[Math.random()*nc.length|0],
    age:Math.random()*120|0
  });

const frozen=[];
let mx=W/2,my=H/2,t=0,vi=0;

document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
document.addEventListener('click',()=>{
  if(vi>=vocab.length)return;
  frozen.push({x:mx,y:my,word:vocab[vi],born:t,i:frozen.length});
  vi++;
  if(vi>=vocab.length)document.getElementById('hint').style.opacity='0';
});

function frame(){
  t++;

  // Slight trail for depth
  c.fillStyle='rgba(11,8,6,.88)';
  c.fillRect(0,0,W,H);

  // Field — dim amber noise, glowing near cursor
  c.font='11px Courier New,monospace';
  dots.forEach(d=>{
    d.age++;
    if(!(d.age%100))d.c=nc[Math.random()*nc.length|0];
    const dist=Math.hypot(d.x-mx,d.y-my);
    const near=dist<170;
    c.fillStyle=`rgba(210,155,65,${near?(1-dist/170)*.32:.055})`;
    c.fillText(d.c,d.x,d.y);
  });

  // Radial glow at cursor
  const g=c.createRadialGradient(mx,my,0,mx,my,115);
  g.addColorStop(0,'rgba(235,178,72,.09)');
  g.addColorStop(1,'transparent');
  c.fillStyle=g;c.fillRect(0,0,W,H);

  // Frozen words — amber, gently breathing
  c.font='13px Georgia,serif';
  frozen.forEach((f,i)=>{
    const age=t-f.born;
    const alpha=Math.min(1,age/45)*.82;
    const drift=Math.sin(t*.018+i*1.3)*.9;
    c.fillStyle=`rgba(220,146,45,${alpha})`;
    const tw=c.measureText(f.word).width;
    c.fillText(f.word,f.x-tw/2,f.y+drift);
  });

  // Current hover word — cream serif, floats at cursor
  if(vi<vocab.length){
    const w=vocab[vi];
    c.font='16px Georgia,serif';
    const tw=c.measureText(w).width;
    // Very subtle tracking underline
    c.fillStyle='rgba(200,170,100,.18)';
    c.fillRect(mx-tw/2,my+7,tw,1);
    c.fillStyle='rgba(240,222,195,.93)';
    c.fillText(w,mx-tw/2,my+5);
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</section>
