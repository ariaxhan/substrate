<section data-date='2026-11-09' data-type='reflection'>
<style>
#n{position:relative;height:100vh;margin:0;background:radial-gradient(ellipse at 50% 110%,#2a2150,#0b0b1c 55%,#04040a);overflow:hidden;cursor:crosshair;font:italic 18px Georgia,serif;color:#cfd3ff}
#n canvas{position:absolute;inset:0;width:100%;height:100%}
#n p{position:absolute;bottom:6%;width:100%;text-align:center;margin:0;opacity:.35;letter-spacing:.3em;font-size:13px;transition:opacity 4s}
</style>
<div id="n"><canvas id="c"></canvas><p id="t">the day is finished. look closer.</p></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,S=[],M={x:-9,y:-9},
words=['rest','enough','held','soft','done','still','yes','sleep','kept','begin again'];
function sz(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
sz();onresize=sz;
for(var i=0;i<70;i++)S.push({x:Math.random(),y:Math.random()*.9,g:0,r:Math.random()*1.2+.4,p:Math.random()*6});
var n=document.getElementById('n');
n.onmousemove=function(e){M.x=e.offsetX;M.y=e.offsetY;t.style.opacity=0};
n.onclick=function(e){S.push({x:e.offsetX/W,y:e.offsetY/H,g:1,r:2.4,p:0,w:words[S.length%words.length]})};
function f(k){
x.clearRect(0,0,W,H);
S.forEach(function(s){
var px=s.x*W,py=s.y*H,d=Math.hypot(px-M.x,py-M.y);
if(d<110)s.g=Math.min(1,s.g+.08);else s.g*=.985;
var a=.25+.15*Math.sin(k/900+s.p)+s.g*.7;
x.fillStyle='rgba(220,224,255,'+a+')';
x.beginPath();x.arc(px,py,s.r+s.g*2,0,7);x.fill();
if(s.w){x.globalAlpha=.7;x.fillText(s.w,px+9,py+4);x.globalAlpha=1}
if(s.g>.2)S.forEach(function(o){
var qx=o.x*W,qy=o.y*H;
if(o!==s&&o.g>.2&&Math.hypot(px-qx,py-qy)<170){
x.strokeStyle='rgba(180,170,255,'+Math.min(s.g,o.g)*.5+')';
x.beginPath();x.moveTo(px,py);x.lineTo(qx,qy);x.stroke()}})
});
requestAnimationFrame(f)}
x.font='italic 15px Georgia';
f(0)})();
</script>
</section>
