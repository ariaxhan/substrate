<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>substrate</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000;
        color: #888;
        font: 12px/1.4 monospace;
        min-height: 100vh;
        overflow: hidden;
    }
    nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 8px 16px;
        background: rgba(0,0,0,0.9);
        border-bottom: 1px solid #222;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .nav-left { display: flex; gap: 16px; align-items: center; }
    .nav-controls { color: #444; font-size: 10px; }
    #viewer {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .piece {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    .meta {
        position: fixed;
        bottom: 8px;
        right: 16px;
        font-size: 10px;
        color: #333;
    }
    .counter {
        position: fixed;
        bottom: 8px;
        left: 16px;
        font-size: 10px;
        color: #333;
    }
    #empty {
        color: #333;
        text-align: center;
    }
    #empty span {
        display: block;
        animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
    }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <span>substrate</span>
            <span class="nav-controls">← → or A D to navigate</span>
        </div>
        <span id="count">0 pieces</span>
    </nav>
    <div id="viewer">
        <div class="piece" id="empty">
            <span>awaiting signal</span>
        </div>
    </div>
    <div class="counter" id="counter"></div>
    <div class="meta" id="meta"></div>
    <script>
    let pieces = [];
    let currentIndex = 0;

    async function loadPieces() {
        try {
            const response = await fetch('pieces/manifest.json');
            const manifest = await response.json();

            if (manifest.pieces && manifest.pieces.length > 0) {
                // Sort by timestamp (newest first) - right arrow goes back in time
                pieces = manifest.pieces.sort((a, b) =>
                    (b.timestamp || 0) - (a.timestamp || 0)
                );
                document.getElementById('count').textContent = pieces.length + ' pieces';
                showPiece(0);
            }
        } catch (e) {
            console.log('No pieces yet');
        }
    }

    async function showPiece(index) {
        if (pieces.length === 0) return;

        // Wrap around
        if (index < 0) index = pieces.length - 1;
        if (index >= pieces.length) index = 0;
        currentIndex = index;

        const piece = pieces[index];
        const viewer = document.getElementById('viewer');
        const meta = document.getElementById('meta');
        const counter = document.getElementById('counter');

        try {
            const res = await fetch('pieces/' + piece.file);
            const html = await res.text();

            viewer.innerHTML = '<div class="piece">' + html + '</div>';
            meta.textContent = piece.date + ' / ' + piece.type;
            counter.textContent = (index + 1) + ' / ' + pieces.length;
        } catch (e) {
            viewer.innerHTML = '<div class="piece">failed to load</div>';
        }
    }

    function navigate(direction) {
        showPiece(currentIndex + direction);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowLeft':
            case 'a':
            case 'A':
                navigate(-1);
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                navigate(1);
                break;
            case 'ArrowUp':
            case 'w':
            case 'W':
                navigate(-1);
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                navigate(1);
                break;
        }
    });

    loadPieces();
    </script>
</body>
</html>
